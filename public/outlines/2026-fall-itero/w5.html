<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一","items":[{"lv":1,"label":"壹、","text":"以撒是享受神恩典，使神喜悅的模型、榜樣—創二四36，二五5，二六3～4、12～33，羅五1～2，徒四33，十一23：","refs":[{"label":"創24:36","keys":["創24:36"]},{"label":"創25:5","keys":["創25:5"]},{"label":"創26:3-4","keys":["創26:3","創26:4"]},{"label":"創26:12-33","keys":["創26:12","創26:13","創26:14","創26:15","創26:16","創26:17","創26:18","創26:19","創26:20","創26:21","創26:22","創26:23","創26:24","創26:25","創26:26","創26:27","創26:28","創26:29","創26:30","創26:31","創26:32","創26:33"]},{"label":"羅5:1-2","keys":["羅5:1","羅5:2"]},{"label":"徒4:33","keys":["徒4:33"]},{"label":"徒11:23","keys":["徒11:23"]}]},{"lv":2,"label":"一、","text":"恩典是神在基督裏作爲那靈，作到我們這人裏面給我們享受，對我們成爲一切，並在我們裏面、藉着我們且爲我們作一切事，好使祂能成爲我們這人的構成成分，爲着建造基督的身體，終極完成新耶路撒冷—約一16～17，來十29下，林前十五10。","refs":[{"label":"約1:16-17","keys":["約1:16","約1:17"]},{"label":"來10:29","keys":["來10:29"]},{"label":"林前15:10","keys":["林前15:10"]}]},{"lv":2,"label":"二、","text":"享受神的恩典乃是我們的定命，這定命是在創立世界以前所豫先定下的—弗一3～6，二7。","refs":[{"label":"弗1:3-6","keys":["弗1:3","弗1:4","弗1:5","弗1:6"]},{"label":"弗2:7","keys":["弗2:7"]}]}]},{"day":"週二","items":[{"lv":2,"label":"三、","text":"『伊勒沙代』，全足的神，乃是全足的恩典，用祂神聖所是的豐富供應祂所呼召的人，好成就祂的定旨—創十七1，二八3。","refs":[{"label":"創17:1","keys":["創17:1"]},{"label":"創28:3","keys":["創28:3"]}]},{"lv":1,"label":"貳、","text":"亞伯拉罕天然的力量和自我的努力受神對付之後，以撒出生了（創十七15～19，十八10～14，二一1～7）；這含示以撒是從撒拉所代表的恩典而生（加四23～28、31，彼前三7）：","refs":[{"label":"創17:15-19","keys":["創17:15","創17:16","創17:17","創17:18","創17:19"]},{"label":"創18:10-14","keys":["創18:10","創18:11","創18:12","創18:13","創18:14"]},{"label":"創21:1-7","keys":["創21:1","創21:2","創21:3","創21:4","創21:5","創21:6","創21:7"]},{"label":"加4:23-28","keys":["加4:23","加4:24","加4:25","加4:26","加4:27","加4:28"]},{"label":"加4:31","keys":["加4:31"]},{"label":"彼前3:7","keys":["彼前3:7"]}]},{"lv":2,"label":"一、","text":"『耶和華豈有難成的事麼？到了約定的日期，明年這時候〔直譯，照着生命的時候〕，我必回到你這裏，撒拉必生一個兒子』：","refs":[]},{"lv":3,"label":"1.","text":"生命的時候（10），就是約定生以撒的日期（十七21），乃是神眷顧的時候（二一1）。","refs":[{"label":"創18:10","keys":["創18:10"]},{"label":"創17:21","keys":["創17:21"]},{"label":"創21:1","keys":["創21:1"]}]},{"lv":3,"label":"2.","text":"以撒的出生乃是耶和華的來臨，也就是恩典的來臨—參約一17。","refs":[{"label":"約1:17","keys":["約1:17"]}]},{"lv":3,"label":"3.","text":"以撒不是憑人天然生命的力量，乃是憑神恩典的力量生的；這發生在亞伯拉罕受割禮之後，他和他的妻子撒拉，如同完全死了（創十八11，羅四18～19）；這表徵生命的時候，就是基督成爲我們生命的時候，要在我們天然的力量被了結之後纔來到。","refs":[{"label":"創18:11","keys":["創18:11"]},{"label":"羅4:18-19","keys":["羅4:18","羅4:19"]}]},{"lv":2,"label":"二、","text":"亞伯拉罕的生活啓示，我們若要享受神的恩典，對神的豐富有完滿的享受，就必須忍受損失，天然的生命也必須受割禮，被割除；認識並經歷恩典最大的阻撓乃是己—創十七11、19，參腓三3。","refs":[{"label":"創17:11","keys":["創17:11"]},{"label":"創17:19","keys":["創17:19"]},{"label":"腓3:3","keys":["腓3:3"]}]},{"lv":2,"label":"三、","text":"以撒的生活啓示，我們受苦以了結天然的生命，乃是爲着享受神的恩典—參林後一8～9、12，十二7～10，羅五1～5。","refs":[{"label":"林後1:8-9","keys":["林後1:8","林後1:9"]},{"label":"林後1:12","keys":["林後1:12"]},{"label":"林後12:7-10","keys":["林後12:7","林後12:8","林後12:9","林後12:10"]},{"label":"羅5:1-5","keys":["羅5:1","羅5:2","羅5:3","羅5:4","羅5:5"]}]}]},{"day":"週三","items":[{"lv":1,"label":"叁、","text":"以撒在恩典中長大；在恩典中長大就是享受基督之於我們的一切，作我們的靈食與活水而長大—創二一8，彼後三18，彼前二2：","refs":[{"label":"創21:8","keys":["創21:8"]},{"label":"彼後3:18","keys":["彼後3:18"]},{"label":"彼前2:2","keys":["彼前2:2"]}]},{"lv":2,"label":"一、","text":"以撒的長大，表徵基督生在新約信徒裏面之後的長大；基督在我們裏面需要長大，好使基督能成形在我們裏面—林前三6。","refs":[{"label":"林前3:6","keys":["林前3:6"]}]},{"lv":2,"label":"二、","text":"恩典的靈（來十29）就是生命的恩典（彼前三7），神諸般的恩典（四10），那全般恩典的神（五10），全然彀用的恩典（林後十二9）；這恩典如今與我們的靈同在（加六18）。","refs":[{"label":"來10:29","keys":["來10:29"]},{"label":"彼前3:7","keys":["彼前3:7"]},{"label":"彼前4:10","keys":["彼前4:10"]},{"label":"彼前5:10","keys":["彼前5:10"]},{"label":"林後12:9","keys":["林後12:9"]},{"label":"加6:18","keys":["加6:18"]}]},{"lv":2,"label":"三、","text":"天天接受並享受恩典的路，乃是藉着血、話、那靈和召會：","refs":[]},{"lv":3,"label":"1.","text":"救贖的血，立約的血，神自己的血，將有罪、敗壞的人帶進對神永遠的享受中—徒二十28，太二六28，利十六11～16，來十19。","refs":[{"label":"徒20:28","keys":["徒20:28"]},{"label":"太26:28","keys":["太26:28"]},{"label":"利16:11-16","keys":["利16:11","利16:12","利16:13","利16:14","利16:15","利16:16"]},{"label":"來10:19","keys":["來10:19"]}]},{"lv":3,"label":"2.","text":"恩典的話能給我們喫，而成爲我們心中的歡喜快樂—徒二十32，耶十五16，約六63。","refs":[{"label":"徒20:32","keys":["徒20:32"]},{"label":"耶15:16","keys":["耶15:16"]},{"label":"約6:63","keys":["約6:63"]}]},{"lv":3,"label":"3.","text":"恩典的靈作爲經過過程並終極完成之神全備的供應，乃是歡樂的油；我們被這油所膏，成爲基督的同夥—來一9，十29下。","refs":[{"label":"來1:9","keys":["來1:9"]},{"label":"來10:29","keys":["來10:29"]}]},{"lv":3,"label":"4.","text":"神的召會經歷神新鮮、復甦的恩典作降下的甘露，藉着神的憐恤從諸天臨到我們，以澆灌並變化我們—詩一三三3，哀三22～23。","refs":[{"label":"詩133:3","keys":["詩133:3"]},{"label":"哀3:22-23","keys":["哀3:22","哀3:23"]}]}]},{"day":"週四","items":[{"lv":2,"label":"四、","text":"天天接受並享受恩典的路，乃是轉向靈，運用靈，並讓主登寶座—來四16，羅五17、21，參啓四2：","refs":[{"label":"來4:16","keys":["來4:16"]},{"label":"羅5:17","keys":["羅5:17"]},{"label":"羅5:21","keys":["羅5:21"]},{"label":"啟4:2","keys":["啟4:2"]}]},{"lv":3,"label":"1.","text":"神的寶座是湧流之恩典的源頭；只要我們不讓主登寶座，叫主下了寶座，恩典的流就停止—二二1，西一18下，啓二4，彼前五5。","refs":[{"label":"啟22:1","keys":["啟22:1"]},{"label":"西1:18","keys":["西1:18"]},{"label":"啟2:4","keys":["啟2:4"]},{"label":"彼前5:5","keys":["彼前5:5"]}]},{"lv":3,"label":"2.","text":"我們若讓主耶穌在我們裏面登寶座，那靈作爲生命水的河就會從施恩的寶座流出來供應我們；這樣，我們就會接受恩典並享受恩典—啓二二1，詩歌五五七首。","refs":[{"label":"啟22:1","keys":["啟22:1"]}]},{"lv":2,"label":"五、","text":"天天接受並享受恩典的路，乃是愛主，將自己獻給主，並藉着各樣的禱告在主的話中接觸主—林後五14，弗六24，利六12～13。","refs":[{"label":"林後5:14","keys":["林後5:14"]},{"label":"弗6:24","keys":["弗6:24"]},{"label":"利6:12-13","keys":["利6:12","利6:13"]}]}]},{"day":"週五","items":[{"lv":1,"label":"肆、","text":"以撒也在恩典中成爲後嗣；我們也是神的後嗣，享受祂作我們得基業的憑質，使我們承受祂，並讓祂承受我們—創二一9～12，二四36，二五5，羅八17，徒二六18，弗一11、14、18：","refs":[{"label":"創21:9-12","keys":["創21:9","創21:10","創21:11","創21:12"]},{"label":"創24:36","keys":["創24:36"]},{"label":"創25:5","keys":["創25:5"]},{"label":"羅8:17","keys":["羅8:17"]},{"label":"徒26:18","keys":["徒26:18"]},{"label":"弗1:11","keys":["弗1:11"]},{"label":"弗1:14","keys":["弗1:14"]},{"label":"弗1:18","keys":["弗1:18"]}]},{"lv":2,"label":"一、","text":"以撒從他父親承受了一切；在新約中，所有蒙召的信徒都是神絕對而無條件之恩典的承受者，承受神聖豐滿的一切豐富，作我們的享受（弗一3、6，三8、19）。","refs":[{"label":"弗1:3","keys":["弗1:3"]},{"label":"弗1:6","keys":["弗1:6"]},{"label":"弗3:8","keys":["弗3:8"]},{"label":"弗3:19","keys":["弗3:19"]}]},{"lv":2,"label":"二、","text":"以撒表徵我們不是自己要去作，不是自己要去得；以撒乃是享受亞伯拉罕的一切，表徵父神的一切—創二四36，二五5。","refs":[{"label":"創24:36","keys":["創24:36"]},{"label":"創25:5","keys":["創25:5"]}]},{"lv":2,"label":"三、","text":"認識以撒的神只有一個意思，就是認識神是供給者，一切都是從神來的；這也就是說，我們甚麼都是接受的，得勝的祕訣是在乎接受—弗一3，腓一19，約一16，羅五17，八2。","refs":[{"label":"弗1:3","keys":["弗1:3"]},{"label":"腓1:19","keys":["腓1:19"]},{"label":"約1:16","keys":["約1:16"]},{"label":"羅5:17","keys":["羅5:17"]},{"label":"羅8:2","keys":["羅8:2"]}]},{"lv":1,"label":"伍、","text":"以撒在恩典中順從；甚麼時候我們在恩典中順從，我們就要看見神的供備—創二二5～10，約一17：","refs":[{"label":"創22:5-10","keys":["創22:5","創22:6","創22:7","創22:8","創22:9","創22:10"]},{"label":"約1:17","keys":["約1:17"]}]},{"lv":2,"label":"一、","text":"神的恩典是有能力的，使我們能忍受一切事—提後二1。","refs":[{"label":"提後2:1","keys":["提後2:1"]}]},{"lv":2,"label":"二、","text":"恩典能作王管理一切—羅五21，來四16。","refs":[{"label":"羅5:21","keys":["羅5:21"]},{"label":"來4:16","keys":["來4:16"]}]},{"lv":2,"label":"三、","text":"回到律法就是拒絕這恩典，廢棄這恩典，從恩典中墜落—加二21，五4，參創十六16，十七1：","refs":[{"label":"加2:21","keys":["加2:21"]},{"label":"加5:4","keys":["加5:4"]},{"label":"創16:16","keys":["創16:16"]},{"label":"創17:1","keys":["創17:1"]}]},{"lv":3,"label":"1.","text":"從恩典中墜落乃是與基督隔絕，從基督貶爲無有，與基督分開，喪失了在基督裏的一切益處—參約十五4～5。","refs":[{"label":"約15:4-5","keys":["約15:4","約15:5"]}]},{"lv":3,"label":"2.","text":"若是我們轉到諸如律法或品格改良這些基督以外的事，而不聯於基督，不時時享受基督，我們就會喪失對基督的享受—參西二18。","refs":[{"label":"西2:18","keys":["西2:18"]}]},{"lv":2,"label":"四、","text":"我們需要靠恩典得堅固，就是留在新約裏，以享受基督作恩典—來十三9，參加五4。","refs":[{"label":"來13:9","keys":["來13:9"]},{"label":"加5:4","keys":["加5:4"]}]},{"lv":1,"label":"陸、","text":"以撒有百倍的收成，『他就昌大，越發昌盛，成了巨富』 —創二六12～14：","refs":[{"label":"創26:12-14","keys":["創26:12","創26:13","創26:14"]}]},{"lv":2,"label":"一、","text":"我們的心必須是好土，好使神恩典的話在我們裏面自由的長大，並結實百倍—路八8、11、15，徒二十32。","refs":[{"label":"路8:8","keys":["路8:8"]},{"label":"路8:11","keys":["路8:11"]},{"label":"路8:15","keys":["路8:15"]},{"label":"徒20:32","keys":["徒20:32"]}]},{"lv":2,"label":"二、","text":"我們需要繼續不斷的享受神恩典超越的豐富，就是神自己的豐富，作我們的享受—羅五17，約一16，弗一7，二7。","refs":[{"label":"羅5:17","keys":["羅5:17"]},{"label":"約1:16","keys":["約1:16"]},{"label":"弗1:7","keys":["弗1:7"]},{"label":"弗2:7","keys":["弗2:7"]}]}]},{"day":"週六","items":[{"lv":1,"label":"柒、","text":"雖然以撒享受神無條件的恩典，在他所到之處都得着享受和滿足（由井所表徵）（創二五11，二六15～25、33），別是巴卻是他經歷神的顯現、接受神的應許、築壇、呼求耶和華的名並且支搭帳棚作見證的惟一地方：","refs":[{"label":"創25:11","keys":["創25:11"]},{"label":"創26:15-25","keys":["創26:15","創26:16","創26:17","創26:18","創26:19","創26:20","創26:21","創26:22","創26:23","創26:24","創26:25"]},{"label":"創26:33","keys":["創26:33"]}]},{"lv":2,"label":"一、","text":"神所呼召的人，不論他們的立場如何，都被命定要享受神的恩典，然而這享受並不稱義他們的立場。","refs":[]},{"lv":2,"label":"二、","text":"我們若渴望得着神的顯現，承受祂的應許，並過一種完成祂永遠定旨的生活，就必須來到神所選擇獨一的地方，並且留在那裏。","refs":[]},{"lv":2,"label":"三、","text":"這獨一的地方由別是巴所表徵，有井作生命的供應，並有垂絲柳樹作生命豐富之湧流的彰顯—23～24節，二一25、33。","refs":[{"label":"創26:23-24","keys":["創26:23","創26:24"]},{"label":"創21:25","keys":["創21:25"]},{"label":"創21:33","keys":["創21:33"]}]},{"lv":1,"label":"捌、","text":"以撒承受神給他父親關於美地和獨一後裔的應許；這後裔就是基督，地上萬國都要因祂得福—二六3～5，加三14、16：","refs":[{"label":"創26:3-5","keys":["創26:3","創26:4","創26:5"]},{"label":"加3:14","keys":["加3:14"]},{"label":"加3:16","keys":["加3:16"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕獨一的後裔作爲末後的亞當成了賜生命的靈，乃是亞伯拉罕的福（美地的實際），爲要將祂自己分賜到基督的信徒裏面，使他們成爲亞伯拉罕團體的後裔—14、16、29節，林前十五45下，約十二24，賽五三10。","refs":[{"label":"加3:14","keys":["加3:14"]},{"label":"加3:16","keys":["加3:16"]},{"label":"加3:29","keys":["加3:29"]},{"label":"林前15:45","keys":["林前15:45"]},{"label":"約12:24","keys":["約12:24"]},{"label":"賽53:10","keys":["賽53:10"]}]},{"lv":2,"label":"二、","text":"這應許是爲着完成神的定旨，使神在地上能得着一個國，在其中藉着一班團體的人彰顯祂自己—創一26，可四26，但二34～35。","refs":[{"label":"創1:26","keys":["創1:26"]},{"label":"可4:26","keys":["可4:26"]},{"label":"但2:34-35","keys":["但2:34","但2:35"]}]},{"lv":2,"label":"三、","text":"藉着我們享受恩典，神的國要得着實現，神在基督裏要得着完全的彰顯，直到永遠—啓二二21，弗二10。","refs":[{"label":"啟22:21","keys":["啟22:21"]},{"label":"弗2:10","keys":["弗2:10"]}]}]}],"days":[{"day":"週一","feed":{"verses":[["創二五5","『亞伯拉罕將一切所有的都給了以撒。』"],["創二六12","『以撒…撒種，那一年有百倍的收成。耶和華賜福給他。』"],["林前十五10","『然而因着神的恩，我成了我今天這個人，並且神的恩臨到我，不是徒然的；反而我比眾使徒格外勞苦，但這不是我，乃是神的恩與我同在。』"]],"paras":["整本聖經裏幾乎沒有另一個人像以撒那樣享受恩典。他終其一生不作別的，只享受神的恩典。他的一生就是享受恩典的一生。然而在以撒身上，我們看到與亞伯拉罕完全一樣的天然弱點。不僅如此，在以撒身上我們也看到雅各的天然生命。","以撒是一個享受恩典的人。照我們天然的觀念，一個有天然弱點，且活在天然生命裏的人，絕不能享受神的恩典。這是我們的觀念，這不是神的話。在聖經裏，我們看不到以撒很屬靈。他是一個仍有天然弱點，仍活在天然生命裏的人。那麼爲甚麼他這樣享受神的恩典？只因神已這樣命定。對我們基督徒來說，有神命定的一面。（創世記生命讀經，一○二三至一○二四頁。）"]},"read":{"paras":["享受神的恩典乃是我們的定命，這定命是在創立世界以前所豫先定下的。不要以爲你若屬靈，就有特權享受神的恩典；你若不屬靈，就不能享受祂的恩典。這是宗教觀念，聖經並沒有這樣教訓。有人聽說享受恩典不根據屬靈，也許會說，『我們享受神的恩典若不需要屬靈，那麼就讓我們不屬靈罷！』不要這樣說。屬靈不屬靈都不會幫助我們享受神的恩典，這完全是神的命定，並不在於我們的所是和所能。…我們已經被神命定來享受恩典。…不要浪費時間想要屬靈或不屬靈，只要說，『主阿，因着你的命定我敬拜你。你已經命定我來享受恩典。』至少我們都是以撒的一部分，在我們裏面有一面已經被神命定來享受祂的恩典。","恩典的事歷年來被隱藏、封閉、遮蔽着。…恩典是神的一些東西作到我們裏面，在我們裏面工作，也爲我們工作。這不是外面的事。恩典是神在基督裏作到我們裏面，爲我們生活、工作並行事。保羅在林前十五章十節…〔的〕話相當深奧。保羅不是說，『因着神的恩，我有了我所有的。因着神的恩，我有了好車子、好職業、好妻子。』他甚至也不是說，『因着神的恩，我作了我所作的。』這不在於作甚麼、得甚麼或行甚麼；這完全在於是甚麼。因此保羅說，『因着神的恩，我成了我今天這個人。』這意思就是，神的恩作到他裏面，使他成了那樣的人。在加拉太二章二十節保羅說，『不再是我，乃是基督在我裏面活着。』我們若把這一節和林前十五章十節放在一起，就看見恩典就是活在我們裏面的基督。『這不是我，乃是神的恩。』『不再是我，乃是基督。』恩典不在我們外面，也不在我們旁邊。恩典乃是一位神聖的人物，就是神自己在基督裏，作到我們裏面，成爲我們的構成成分。因着缺少啓示，基督徒誤會並誤解了恩典，以爲恩典是外面的東西。但恩典乃是那位三一神作到我們裏面，使我們成爲所該是的，並且爲我們生活、工作、行事，使我們能說，『因着神的恩，我成了我今天這個人。這不是我，乃是神的恩典。』（創世記生命讀經，一○二四至一○二五、九九八至九九九頁。）"],"ref":"創世記生命讀經，第六十五篇。"}},{"day":"週二","feed":{"verses":[["創十七1","『亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說，我是全足的神；你要行在我面前，並且要完全。』"],["創十八14","『耶和華豈有難成的事麼？到了約定的日期，明年這時候，我必回到你這裏，撒拉必生一個兒子。』"]],"paras":["我們需要…知道創世記十七章一節之全足的神這稱呼的意義。在希伯來文裏，這稱呼是『伊勒沙代』（El Shaddai）。『伊勒』，El，意思是強者，大能者；『沙代』，Shadda，含示胸部，乳房，意思是全豐全足的。『伊勒沙代』是有乳房的大能者，有全豐全足供應的大能者。乳房分泌乳汁，而乳汁是全豐全足的供應，其中有水、礦物質和多種養分，含有我們日常生活所需要的一切。","當亞伯拉罕憑他天然的己行事的時候，他忘了他供應的源頭。換句話說，他忘了神是他全豐全足供應的源頭。所以，神臨到亞伯拉罕，似乎這樣說，『我是有乳房的大能者。你缺少甚麼？爲甚麼不到我這裏來？你飢渴麼？到我這裏來。你供應的源頭不是你天然的己，乃是我這有乳房的大能者。我是全豐全足者，能供應你生活所需要的一切，以及你成就我永遠定旨所需要的一切。我是源頭。…你不該靠自己或憑自己而活。你必須憑我作你供應的源頭而活。』（創世記生命讀經，七六四至七六五頁。）"]},"read":{"paras":["亞伯拉罕天然的力量和自我的努力受神對付之後，以撒就出生了。（創十七15～19，十八10～14，二一1～7。）這含示以撒是從撒拉所代表的恩典而生。（加四23～28，31。）創世記的記載說，這事發生在『生命的時候』。（十八10，14，直譯。）當天然生命的努力停止的時候，那就是生命的時候。在生命的時候，有個東西在恩典裏出生了。恩典聯於生命，生命隨着恩典。因此，恩典稱爲生命的恩典。（彼前三7。）","神要把我們帶進恩典的享受中，但這恩典有一個阻撓，就是己。我們自己就是阻撓。…因此，在我們能有以撒的經歷之前，需要代表生命經歷第一面的亞伯拉罕。亞伯拉罕的生活啓示，我們若要享受神的恩典，對神的豐富有完滿的享受，我們必須受對付，受割禮，被割除。亞伯拉罕若不受割禮，以撒絕不會生出來。亞伯拉罕受割禮之後，以撒來了。在創世記十七章亞伯拉罕受割禮之後，神就告訴他，以撒將要出生。（19。）至終，在二十一章，以撒出生了。以撒隨着神的眷臨而來，他是憑着神的眷臨出生的。神的眷臨等於以撒的出生。神眷臨撒拉，那個眷臨就成了以撒的出生。這就是恩典。","神已經來給祂所呼召的人享受。然而我們若要有這享受，己必須除去。己一除去，以撒就來了；這就是說，恩典來了。喪失己並不容易；要除去己，我們必須受損失。…我們必須先失去自己，恩典纔能臨到。失去己就是失去面子。…弟兄們，當你在日常生活中對待妻子的時候，你必須準備失去己，你若這樣作，恩典就要來臨。亞伯拉罕受割禮之後，以撒就來了。這是原則。對我們來說，己必須除去，然後恩典纔臨到。","神要眷臨我們，進到我們裏面，爲我們活着，甚至爲我們愛別人。…你的愛是以實瑪利；但憑神的眷臨而有的愛是以撒。…凡在祂的眷臨之外，出於你的東西，神絕不認可。…我們都必須說，『主阿，沒有你的眷臨，我就不作甚麼。主，你若不臨到我，藉着我作些事，並從我作出來，我就不作甚麼。我旣不恨也不愛，旣不驕傲也不謙卑。我要作一張白紙。主，沒有你的眷臨，我就一無所有。』神的眷臨是實際的恩典。當我憑神的眷臨，而不憑自我的努力愛人並謙卑，那就是享受恩典。（創世記生命讀經，一○○四、九九四至九九五、一○○○頁。）"],"ref":"創世記生命讀經，第四十七、六十三篇。"}},{"day":"週三","feed":{"verses":[["加六18","『弟兄們，願我們主耶穌基督的恩與你們的靈同在。阿們。』"],["彼後三18","『你們卻要在我們的主和救主耶穌基督的恩典和知識上長大。…』"],["彼前五10","『但那全般恩典的神，就是那曾在基督耶穌裏召你們進入祂永遠榮耀的，等你們暫受苦難之後，必要親自成全你們，堅固你們，加強你們，給你們立定根基。』"]],"paras":["以撒在恩典裏被養大。（創二一8。）藉他的歷史我們看見，他沒有作甚麼。他生出來，他被養大。…就像農夫在果園中栽種蘋果，神也在祂的果園中栽種以撒。以撒是在恩典裏被神養大的。","彼後三章十八節告訴我們：『要在…恩典…上長大。』這指明長大乃是…〔藉着〕餧養和澆灌。〔參彼前二2，林前三2，6。〕在恩典上長大，就是享受基督之於我們的一切，作我們的靈食和活水而長大。基督之於我們的一切豐富，乃是叫我們在生命裏長大。我們越享受基督的豐富，（弗三8，）我們就越在生命裏長大。（四15。）（創世記生命讀經，一○○四至一○○五頁。）"]},"read":{"paras":["神乃是要把祂自己作到我們裏面，成爲我們的謙卑和一切。祂要我們說，『主，我一無所有，我也不作甚麼，我只向你敞開，讓你進來，安家在我裏面，活在我裏面，爲我作一切。主，你活，我要享受你的活。甚麼時候你在我裏面作事，我就要說，「主，讚美你，這真好！我不是作工的人，我是享受的人，我珍賞你爲我所作的一切。」』","恩典就是神把祂自己作到我們裏面，作我們的享受。這位神今天不僅僅是父神，也是子神和靈神。不僅如此，靈神也是恩典的靈，（來十29，）這恩典乃是生命的恩典，（彼前三7，）也是『諸般的恩典』，（四10，）『全般的恩典』，（五10，）『彀用的恩典』。（林後十二9。）三一神是這樣的恩典，這恩典如今與我們的靈同在。（加六18。）恩典乃是三一神的神聖人位作爲那靈，住在我們的靈裏。這恩典的靈住在我們靈裏，作我們的享受，使我們享受神作我們的生命和一切，甚至作我們的生活。這就是爲甚麼保羅的每一封書信都結束於：『願恩典與你們同在。』…恩典不是在我們外面，乃是在我們裏面。不論我們稱之爲恩典的靈或生命的恩典，恩典在我們靈裏總是活的，神聖的。我們的確有這樣神聖的實際，就是三一神自己，在我們靈裏作我們的恩典和享受。當祂藉着我們愛別人的時候，這愛就是我們的享受，當祂藉着我們活出祂自己的時候，這個活也是我們的享受。","我們爲甚麼受苦？因爲我們的己、自我、天然的人仍在這裏，需要受對付。…每個從神來的對付，都是破碎我們天然的人，使我們更多享受祂作我們的恩典。爲此，我們有亞伯拉罕和以撒；有損失的痛苦，也有得着的享受。這不是得着外面的東西；乃是得着內住的那位，就是恩典的靈和生命的恩典。…祝福必須成爲恩典。在舊約裏，神賜給祂子民許多東西當作祝福，但那些東西僅僅是外面的祝福。在基督來臨之前，這些祝福都沒有作到神子民裏面。基督來不僅爲我們死在十字架上，更在死後成了賜生命的靈進到我們裏面。所以在新約裏有『在基督裏』和『基督在你們裏面』的辭。現今祂在我們裏面，我們也在祂裏面。神在基督裏所賜給我們的，已經作到我們裏面，成爲恩典，就是我們的享受。現今我們不僅在祂的祝福之下，我們更在祂的恩典裏面，祂的恩典也在我們裏面。…新約從未說，『願祝福與你們同在，』卻一再說，『願恩典與你們同在。』（創世記生命讀經，一○○一至一○○四頁。）"],"ref":"亞伯拉罕以撒雅各的神，第七章。"}},{"day":"週四","feed":{"verses":[["來四16","『所以我們只管坦然無懼的來到施恩的寶座前，爲要受憐憫，得恩典，作應時的幫助。』"],["啓二二1","『天使又指給我看在城內街道當中一道生命水的河，明亮如水晶，從神和羔羊的寶座流出來。』"]],"paras":["我們若要接受並享受恩典，就需要領悟我們的靈是我們能經歷恩典惟一的地方。正如我們使用電只需要打開開關，我們要接觸運行並塗抹的那靈，也惟有在我們的靈裏。你若想接受恩典並享受恩典，不要運用你的心思、情感或意志。反之，要轉向你的靈並運用你的靈。","〔希伯來四章十六節的〕施恩的寶座不只在天上，也在我們靈裏。…我們可以來到施恩的寶座前這個事實，指明在經歷中這寶座乃是在我們的靈裏。我從經歷裏得知，我一轉向我的靈，呼喊『主耶穌』，我就立刻感覺到施恩的寶座乃是在我的靈裏。（加拉太書生命讀經，四○二至四○三頁。）"]},"read":{"paras":["每當我們轉到靈裏，呼求主名，來到施恩的寶座前，我們就應當讓主登寶座。我們必須讓祂在我們裏面有元首的權柄、君王的權柄和主權。這會有很大的不同！有時我們在禱告中，覺得主在我們裏面，但我們不願意將寶座讓給祂。我們不承認祂的君王權柄，我們高舉自己在祂以上，自己登了寶座。實際說來，我們是叫主下了寶座。我們只要不讓主登寶座，恩典的流就立刻停止。就在我們禱告的時候，我們需要讓主在我們裏面登寶座，尊崇祂爲元首、爲主、爲王。這樣，恩典在我們裏面纔會湧流如同江河。…生命水的河從神和羔羊的寶座流出來。因此，神的寶座是湧流恩典的源頭。叫主下寶座，把寶座從祂挪去，就是忽視恩典的源頭。這就使恩典的流停止。這不僅是個教訓，更是在經歷上非常真實的事。","我們若要接受恩典並享受恩典，我們所必須作的第一件事，就是轉到我們的靈裏，忘掉我們的心思、情感與意志。然而，撒但興起一樣又一樣的事端，要叫我們離開靈。他可能在夫妻之間挑起爭執。他們吵嘴的時候，就不容易轉到靈裏，因爲他們的爭論與情緒都被挑動起來了。我們的爭論與情緒一激烈，就不容易轉回靈裏了。…操練轉到靈裏並留在靈裏最好的路，乃是有定時的禱告。…在這段時間，你惟一當作的事，就是操練轉向靈，並且留在靈裏。不要擔心你那一天必須作甚麼。要拒絕你天然的心思、情感與意志，並且要運用你的靈來接觸主。","當我們轉回靈裏並且留在靈裏時，我們需要承認主是元首、是王，並要讓祂登寶座。我們需要尊崇祂的地位，尊重祂的權柄，並且承認我們沒有權利憑自己說甚麼或作甚麼。我們裏面所有的地位都必須交給這位王。我們若讓主在我們裏面登寶座，生命水的河就會從寶座上流出來供應我們。這樣，我們就會接受…並享受恩典。…我們今天的需要乃是轉回到這靈裏，並且留在靈裏，讓主登寶座。這樣，我們的靈就實際的連於三層天。我們就會在經歷裏明白，至聖所一面是在天上，另一面也在我們靈裏。這指明當我們留在靈裏，我們實際上就摸着了天。我們若讓主耶穌在我們裏面登寶座，作爲生命水的那靈就會從寶座上流出來供應我們。這就是恩典，也是接受恩典並享受恩典的路。（加拉太書生命讀經，四○三至四○五頁。）"],"ref":"加拉太書生命讀經，第三十七篇；亞伯拉罕以撒雅各的神，第八章。"}},{"day":"週五","feed":{"verses":[["創二六13","『他〔以撒〕就昌大，越發昌盛，成了巨富。』"],["約一16～17","『從祂的豐滿裏我們都領受了，而且恩上加恩；因爲律法是藉着摩西賜的，恩典和實際都是藉着耶穌基督來的。』"]],"paras":["以撒從他父親承受了一切。（創二四36，二五5。）以撒成爲他父親之豐富的繼承者，不是憑着他的努力，乃是憑着恩典。人沒有要求他作甚麼來承受父親的豐富，他也沒有作甚麼來得着產業。這是絕對而無條件的恩典。","在新約中，所有蒙召的信徒都是神絕對而無條件之恩典的承受者。神已呼召了我們，在基督裏用各樣屬靈的福分，祝福了我們。（弗一3。）祂在基督裏已把我們放在恩典裏，使我們成爲恩典的承受者，承受神聖豐滿的一切豐富，作我們的享受。…在恩典的承受中，我們必須停下天然生命的努力，使自己敞開，並豫備好享受恩典。（創世記生命讀經，一○○六頁。）"]},"read":{"paras":["以撒…在恩典裏成爲承受者。（創二一9～12。）他父親一切所有的都是他的，因爲亞伯拉罕把一切的豐富都給了這獨一的承受者。同樣，我們不該在我們自己裏面有享受。一切對產業的享受必須是在恩典裏。","以撒也在恩典裏順從。（二二5～10。）已往我讀創世記二十二章，不懂以撒這個青年人怎能這樣順從。至終我看見，他所以順從，是因他被恩典浸透了。…這個順從帶來神的供備。今天我們也是這樣。甚麼時候我們在恩典裏順從，我們就要看見神的供備。","神的恩典是有能力的，使我們能忍受一切事。保羅告訴提摩太，要在基督的『恩典上得着加力』。（提後二1。）恩典甚至能作主管理一切，（羅五21，）我們不該從恩典中墜落，（加五4，）反要靠恩典得堅固。（來十三9。）我們越在恩典裏忍受，就越看見並有分於恩典的供備。","以撒耕種有百倍的收成，成了巨富。（創二六12～14。）以撒『昌大，越發昌盛，成了巨富』。他憑着盡責的撒種，並藉着神的賜福，成了巨富。這也是一件享受的事，但這享受不是在正確的立場上。以撒也許會對自己說，『我的立場定規是對的，如果不對，神怎麼會用這些財富祝福我？』但神也許說，『以撒，你定居在這裏，得了許多財富，但我不贊同你的立場。我要興起環境來，逼你離開這裏。』願聖靈在這裏給我們看見這樣一幅生動的圖畫。一面有正當的享受；另一面有不正確的立場。卽使我們沒有正確的立場，我們仍能繼續有享受。但不要認爲這種享受稱義你的立場。只要有享受，我們的需要就得着了滿足。但爲着完成神永遠的定旨，我們需要站在正確的立場上。然而，卽使我們不在正確的立場上，神仍將祂豐富的供備賜給我們。這是奇妙的事。多麼奇妙的神！多麼奇妙的供備！我們是命定要享受的。卽使我們的立場錯了，仍然有豐富的享受。然而神不會讓我們過去，祂會利用環境把我們帶回到正確的立場上，使祂的定旨得以完成。","以撒在回到別是巴之前，他享受再享受，恩典加恩典。他得着了百倍收成之後，又找到了『活水井』，並且來到『寬闊之地』，『寬闊之路』。（利河伯—15～22。）他雖有這樣豐富的享受，但他的立場不正確，所以他被迫離開寬闊之路，回到別是巴。（創世記生命讀經，一○○五、一○二○至一○二一頁。）"],"ref":"創世記生命讀經，第六十三篇。"}},{"day":"週六","feed":{"verses":[["創二六24～25","『當夜耶和華向他顯現，說，我是你父親亞伯拉罕的神，不要懼怕，因爲我與你同在，必賜福給你，並要爲我僕人亞伯拉罕的緣故，使你的後裔繁增。以撒就在那裏築了一座壇，呼求耶和華的名，並且支搭帳棚；他的僕人便在那裏挖了一口井。』"]],"paras":["卽使面臨和非利士人爭井的難處，〔以撒〕也總是安息的。…有人聽到以撒無論去那裏都有一口井，就以爲這種享受旣是他們的定命，他們要去那裏，就可以去那裏。請不要有這樣的想法。你也許有一口井作你的享受，但你會失去主的顯現，無法完成神永遠的定旨。…神的定旨只能在別是巴完成，我們必須留在那裏。我們若留在那裏，就要經歷主的顯現，並且有立場承受應許，以完成神永遠的定旨。在別的地方，我們雖然也有井，甚至有『一口活水井』，（創二六19，）但這些井不能使我們完成神永遠的定旨。神的定旨只能在靠近別是巴垂絲柳樹的井旁完成。以撒雖然在每一個地方都有一口井，都有一些享受，但神不滿意，神用環境逼使以撒回到別是巴。（創世記生命讀經，一○一一、一○一六頁。）"]},"read":{"paras":["當以撒回到別是巴，（創二六23～33，）神立卽向他顯現，向他說話，堅定祂的應許，說，『我是你父親亞伯拉罕的神，不要懼怕，因爲我與你同在，必賜福給你，並要爲我僕人亞伯拉罕的緣故，使你的後裔繁增。』（24。）於是在別是巴這裏，以撒開始有正確的見證。他築了一座壇，呼求耶和華的名，並且支搭帳棚。（25。）在別是巴這裏，他有了一種爲着完成神永遠定旨的生活。至終，在別是巴這裏，反對者被征服了。（26～31。）別是巴是正確的地方，在這裏我們能有正確的立場。正確的立場，無論對神或對我們，都有重大的意義。","以撒並沒有在別的地方築壇。神的顯現同祂的應許及見證都在別是巴。…雖然以撒在各地都有享受，但他只在別是巴有耶和華的顯現。（這種顯現與神僅僅來臨一下不同。）只有在別是巴這惟一的地方，他纔能承受應許，有見證的生活，來完成神的定旨。只有在別是巴，那盟誓的井，我們纔能有耶和華的顯現，承受應許，築壇，呼求主名，支搭帳棚作見證。在這裏，也只有在這裏，我們纔能完成神永遠的定旨。","我們的立場正確與否，只能憑主的顯現來斷定，不能單憑享受。在許多地方我們有過享受，但在那裏我們深覺沒有主的顯現。並且，在那些地方我們沒有祭壇或帳棚，也沒有從靈的深處呼求主名。…只有在別是巴纔能完成神的定旨。","以撒不但承受他父親一切所有的，也承受神給他父親關於美地和獨一後裔的應許；這後裔就是基督，地上萬國都要因祂得福。（3～5。）這應許實際上是爲着完成神的定旨，使神在地上能得着一個國度，在其中藉着一班團體的人彰顯祂自己。美地和後裔都是爲着神在地上形成一個國度。在這國度裏神能在後裔中得着完全的彰顯。神要把祂自己作到這班後裔裏面，他們要變化成爲祂的形像。這就是亞伯拉罕所得着，以撒所承受的應許。今天在我們身上，這應許要得着成就。今天我們在享受三一神作我們的恩典，藉着我們享受恩典，神的國要得着實現，神在基督裏要得着完全的彰顯，直到永遠。（創世記生命讀經，一○二一至一○二二、一○一七至一○一八、一○○六至一○○七頁。）"],"ref":"創世記生命讀經，第六十四篇。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第五週、過享受恩典的生活，使神喜悅","reading":"創二六3～4、12～33，加六18，林前十五10，林後十二7～10，啓二二21","readingRefs":[{"label":"創26:3-4","keys":["創26:3","創26:4"]},{"label":"創26:12-33","keys":["創26:12","創26:13","創26:14","創26:15","創26:16","創26:17","創26:18","創26:19","創26:20","創26:21","創26:22","創26:23","創26:24","創26:25","創26:26","創26:27","創26:28","創26:29","創26:30","創26:31","創26:32","創26:33"]},{"label":"加6:18","keys":["加6:18"]},{"label":"林前15:10","keys":["林前15:10"]},{"label":"林後12:7-10","keys":["林後12:7","林後12:8","林後12:9","林後12:10"]},{"label":"啟22:21","keys":["啟22:21"]}]},"verses":{"創26:3":{"t":"你寄居在這地，我必與你同在，¹賜福給你，因為我要將這些地都賜給你和你的後裔；我必堅定我向你父亞伯拉罕所起的誓。","n":[["1",["以撒不但承受他父親一切所有的，也承受神給他父親關於美地和獨一後裔的應許；這後裔就是基督，地上萬國都要因祂得福。（加三14，16。）這應許實際上是為著完成神的定旨，使神在地上能得著一個國度，在其中藉著一個團體人彰顯祂自己。見十二2註2與十五3註1。"]]]},"創26:4":{"t":"我要使你的後裔繁增，如同天上的星那樣多，又要將這些地都賜給你的後裔；並且地上萬國必因你的後裔得福；","n":[]},"創26:12":{"t":"以撒在那地撒種，那一年有百倍的收成。耶和華賜福給他，","n":[]},"創26:13":{"t":"他就昌大，越發昌盛，成了巨富。","n":[]},"創26:14":{"t":"他有羊群、牛群，又有許多¹僕婢，非利士人就嫉妒他。","n":[["1",["或，家眷。"]]]},"創26:15":{"t":"當他父親亞伯拉罕在世的日子，他父親的僕人所挖的井，非利士人全都塞住，填滿了土。","n":[]},"創26:16":{"t":"亞比米勒對以撒說，你離開我們去罷，因為你比我們強盛得多。","n":[]},"創26:17":{"t":"以撒就離開那裏，在基拉耳谷支搭帳棚，住在那裏。","n":[]},"創26:18":{"t":"當他父親亞伯拉罕在世之日所挖的水井，因非利士人在亞伯拉罕死後塞住了，以撒就重新挖出來，仍照他父親所起的，叫那些井的名字。","n":[]},"創26:19":{"t":"以撒的僕人在谷中挖掘，得了一口¹活水井。","n":[["1",["見民二一16註1。"]]]},"創26:20":{"t":"基拉耳的牧人與以撒的牧人爭鬧，說，這水是我們的。以撒就給那井起名叫¹埃色，因為他們和他相爭。","n":[["1",["意，相爭。"]]]},"創26:21":{"t":"以撒的僕人又挖了一口井，他們又為這井爭鬧，因此以撒給這井起名叫¹西提拿。","n":[["1",["意，為敵。"]]]},"創26:22":{"t":"以撒離開那裏，又挖了一口井，他們不為這井爭鬧了，他就給那井起名叫¹利河伯。他說，耶和華現在給我們寬闊之地，我們必在這地繁衍。","n":[["1",["意，寬闊之地，寬闊之路。"]]]},"創26:23":{"t":"以撒從那裏上別是巴去。","n":[]},"創26:24":{"t":"當夜耶和華向他¹顯現，說，我是你父親亞伯拉罕的神，不要懼怕，因為我與你同在，必賜福給你，並要為我僕人亞伯拉罕的緣故，使你的後裔繁增。","n":[["1",["雖然以撒享受神無條件的恩典，在他所到之處都得著享受和滿足（由井所表徵—二五11，二六15～22，）別是巴卻是他經歷神的顯現、接受神的應許、築壇、呼求耶和華的名、並且支搭帳棚作見證的惟一地方。神所呼召的人不論他們的立場如何，都被命定要享受神的恩典，然而這享受不能稱義他們的立場。我們若渴望得著神的顯現、承受祂的應許、並過一種完成神永遠定旨的生活，就必須來到神所揀選獨一的地方，並且留在那裏。這獨一的地方由別是巴所表徵，有井作生命的供應，並有垂絲柳樹作生命豐富之湧流的彰顯。（二一25，33。）見申十二5註1與17註1。"]]]},"創26:25":{"t":"以撒就在那裏築了一座壇，呼求耶和華的名，並且支搭帳棚；他的僕人便在那裏挖了一口井。","n":[]},"創26:26":{"t":"亞比米勒同他的¹謀士亞戶撒、和他的軍長非各，從基拉耳來見以撒。","n":[["1",["或，朋友。"]]]},"創26:27":{"t":"以撒對他們說，你們既然恨我，打發我走了，為甚麼到我這裏來？","n":[]},"創26:28":{"t":"他們說，我們明明看見耶和華與你同在；所以我們說，我們不如兩下彼此起誓，讓我們與你立約，","n":[]},"創26:29":{"t":"使你不侵害我們，正如我們未曾觸犯你，一味的善待你，並且打發你平平安安的走了。你是蒙耶和華賜福的了。","n":[]},"創26:30":{"t":"以撒就為他們設擺筵席，他們便喫了喝了。","n":[]},"創26:31":{"t":"他們清早起來彼此起誓。以撒打發他們走，他們就平平安安的離開他走了。","n":[]},"創26:32":{"t":"那一天，以撒的僕人來，將挖井的事告訴他說，我們找到水了。","n":[]},"創26:33":{"t":"他就給那井起名叫¹示巴；因此那城名叫²別是巴，直到今日。","n":[["1",["意，盟誓。"]],["2",["意，盟誓的井。"]]]},"加6:18":{"t":"¹弟兄們，願我們主耶穌基督的²恩與你們的³靈同在。阿們。","n":[["1",["“弟兄們”這親密的稱呼，（一11，三15，四12，28，31，五11，13，六1，）已經多次用在受責備“無知的加拉太人”（三1）身上。在這嚴厲、責備、警戒的書信末了，使徒再次用這關切的稱呼，並且特別放在結尾，以表示對他們不變的愛，保證他們在信仰之家，（10，）仍是他的弟兄。"]],["2",["耶穌基督的恩，乃是三一神，具體化身在子裏，又實化為賜生命之靈的全備供應，藉著我們靈的運用，給我們享受。"]],["3",["指我們重生、有那靈內住的靈。那靈是本書所一再強調，神應許之福的中心。我們在我們重生的靈裏，經歷享受這靈作新約中心的福。因此，我們需要主的恩典，就是那包羅萬有之靈全備的供應，（腓一19，）與我們的靈同在。","基督、那靈、新造、以及我們的靈，乃是本書所啟示基要的四項，這些都是神經綸中基礎的思想。基督是神經綸的中心，那靈是基督的實際。當基督藉著那靈，實化在我們靈裏，我們就成為新造。因此，為著過新造的生活，以成就神的定旨，我們的靈是極其重要的。","本書極為強調十字架和釘十字架的經歷，為要對付消極的項目，如律法、肉體、“我、”宗教世界、奴役和咒詛，藉此帶進積極的項目，就是本書所啟示的基督、那靈、神的兒子、應許的後嗣、信仰之家、新造、以及神的以色列。本書的總結乃是：藉著基督的十字架，律法、肉體和宗教都了結了，好叫我們得著那靈、新造和我們的靈，使我們在靈裏藉著那靈，就是基督的實化，能作新造，帶著耶穌的烙印，並在我們靈裏得享主耶穌基督的恩。"]]]},"林前15:10":{"t":"然而因著神的¹恩，我成了我今天這個人，並且神的恩臨到我，不是徒然的；反而我比眾使徒格外勞苦，但這²不是我，乃是神的恩與我同在。","n":[["1",["本節三次所題到的恩，乃是復活的基督成了賜生命的靈，（45，）在復活裏將經過過程的三一神帶到我們裏面，作我們的生命和生命的供應，使我們能在復活裏活著。因此，恩乃是三一神成了我們的生命和一切。（見約一17註1，加二21註1。）大數的掃羅原是罪人中的罪魁，（提前一15～16，）但因著這恩竟成了最前面的使徒，比眾使徒格外勞苦。他靠這恩而有的職事和生活，對基督的復活乃是人無法否認的見證。"]],["2",["“不是我，乃是神的恩，”等於加二20所說的“不再是我，乃是基督。”那推動使徒並在他裏面運行的恩，不是任何事物，乃是一位活的人位，復活的基督，父神的具體化身，成了包羅萬有賜生命的靈，住在使徒裏面，作他的一切。"]]]},"林後12:7":{"t":"又恐怕我因所得啟示的¹超越，就過於高抬自己，所以有一根²刺，就是撒但的使者，加在我的肉體上，為要³攻擊我，免得我過於高抬自己。","n":[["1",["或，極其豐富，極大，極多。"]],["2",["“在古典希臘文中，常作木樁之意，”（Vincent，文生，）或作“尖銳的杖。”（Alford，阿福德。）在這裏可能指一種肉身的受苦，如保羅的眼疾。（見加四15註2。）"]],["3",["意握拳擊打，與林前九27的痛擊不同，那裏的意思是擊打眼睛以下的部分。"]]]},"林後12:8":{"t":"為這事，我三次求過主，叫這刺離開我。","n":[]},"林後12:9":{"t":"祂對我說，我的¹恩典彀你用的，因為我的²能力，是在人的軟弱上顯得完全。所以我極其喜歡誇我的軟弱，好叫基督的能力³覆庇我。","n":[["1",["見林前十五10註1。苦難和試煉常是主為我們命定的，叫我們經歷基督作恩典和能力。因此，主不願照使徒所求的，叫這刺離開他。"]],["2",["要顯大主恩典的充足，我們的苦難是不能免的；要顯明主能力的完全，我們的軟弱是需要的。因此，使徒極其喜歡誇自己的軟弱，好叫基督的能力覆庇他。恩典是供應，能力是恩典的力量、才能。這二者都是復活的基督，祂現今是賜生命的靈，住在我們裏面，（林前十五45，加二20，）給我們享受。"]],["3",["覆庇，原文是由二字所組成的複合動詞，第一字意在上面，第二字意住在帳棚裏，如約一14和啟二一3所用者。這複合動詞意即把帳棚或居所固定在某物之上。這描繪基督的能力，就是基督自己，如同帳棚覆罩在我們身上，蔭庇我們的軟弱。"]]]},"林後12:10":{"t":"因此，我為基督的緣故，就以軟弱、¹凌辱、²貧困、逼迫、³困苦為⁴可喜悅的，因我甚麼時候⁵軟弱，甚麼時候就有⁵能力了。","n":[["1",["或，虐待。"]],["2",["或，窘逼。即逼得甚緊的急需。見林前七26註2。"]],["3",["直譯，場所狹窄。因此指困境、難處、困苦。"]],["4",["或，可滿意的。與太三17者同。"]],["5",["在我的舊人裏是軟弱的；在覆庇的基督裏是有能力的。"]]]},"啟22:21":{"t":"願主耶穌¹的²恩與³眾聖徒同在。⁴阿們。","n":[["1",["有些權威古卷上加，基督。"]],["2",["我們看見了本書中一切的異象，也聽見了其中一切的豫言之後，所需要的仍是主的恩典。惟有主耶穌的恩典能使我們照著這些異象和豫言生活行事。不僅本書，連全本聖經也都結束於這恩典，就是經歷包羅萬有的基督，並有分於三一神，使我們成為祂永遠的團體彰顯，以成就祂永遠的定旨，使祂與我們彼此享受絕對的滿足和完全的安息，直到永遠。"]],["3",["有些權威古卷作，眾人。"]],["4",["有些古卷無，阿們。","本書中最後所啟示的一項重點，新耶路撒冷，不僅是全聖經的結束，也是聖經中所啟示一切重要項目的終極完成。三一神、三一神的經綸、基督的救贖、神的救恩、信徒、召會以及國度，都終結於新耶路撒冷這總結的一項裏。如此，說這新耶路撒冷乃是一座物質的城，是不合邏輯的，也是與本書是以表號啟示奧祕之事的原則不合。照全部聖經整體的啟示看，這作全部聖經結論的新耶路撒冷，乃是經過過程的三一神，與蒙救贖、得變化的三部分人，一個神性調人性的神聖調和，成為一個宇宙團體的奧祕人位。這人位乃是：","(一)羔羊的妻子。（二一9。）","(二)神的帳幕和聖殿的終極完成，作神與人永遠的互居之所。（二一3，22。）","(三)神歷代在舊造中之新造的終極完成。（徒四11，約二19，太十六18，林前三9～12，彼前二4～5。）","(四)神永遠的經綸和祂神聖的成就終極的完結。"]]]},"創24:36":{"t":"我主人的妻子撒拉年老的時候，給我主人生了一個兒子；我主人也將一切所有的都給了這個兒子。","n":[]},"創25:5":{"t":"亞伯拉罕將¹一切所有的都給了²以撒。","n":[["1",["神認為以撒是亞伯拉罕惟一的兒子，是承受神賜給亞伯拉罕之應許，以完成神定旨的獨一後裔。（二二2，12，16，18，十七19，二六3～4。）因此，以撒豫表基督是父的獨生子，（約一14，三16，）父將祂一切所有的都給了子。（約三35，十六15上。）以撒成為他父親之豐富的繼承者，不是憑著他的努力，乃是憑著恩典。"]],["2",["在創世記裏，亞伯拉罕（十二1～二五18）和以撒（二一1～8，二二1～24，二四1～67）的記載彼此重疊。亞伯拉罕的生活啟示，我們若要享受神的恩典，對神的豐富有完滿的享受，就必須忍受損失，天然的生命也必須受割禮，被割除。以撒的生活啟示，我們了結天然的生命而受苦，是為著享受神的恩典。以撒一生沒有作甚麼，只是享受神豐富的祝福，（11，二六24下，）這祝福乃是指向新約的恩典。（見11註1。）以撒在恩典裏出生，（二一1～3，加四23，）在恩典裏長大，（二一8，）也成為恩典的後嗣。（5。）在新約中，所有蒙召的信徒都是恩典的後嗣，命定要享受神絕對且無條件的恩典。（弗一3，6～8，二7。）"]]]},"羅5:1":{"t":"所以，我們既本於信得稱義，就藉著我們的主耶穌基督，¹對神有了和平。","n":[["1",["我們本於信得稱義，而進入神裏面的過程還沒有完成，所以保羅在此說“對神，”而不說“與神。”恩典是為著我們站立；（2；）和平，也就是平安，是為著我們行走。"]]]},"羅5:2":{"t":"我們又藉著祂，因¹信得進入現在所²站的這³恩典中，並且因⁴盼望神的榮耀而⁵誇耀。","n":[["1",["信使我們得稱義，並割除我們的肉體，及其天然的能力與努力。這信也使我們進入神的恩典。我們若留在肉體及其天然的努力裏，就不會認識，也不能享受神這恩典；但我們若因信而活，就要進入對神恩典完滿的享受。"]],["2",["信首先帶我們進入恩典，接著使我們堅定的站在恩典中。"]],["3",["恩典乃是三一神自己，經過種種過程，給我們進入並享受。這裏的恩典，深入的說，就是這位三一神作我們的享受，不僅是不當得的好處，也不僅是外面的祝福，更是神自己在我們裏面作我們所享受的恩典。我們不僅是在神的祝福之下，更是在祂的恩典之中。（見註2。）"]],["4",["我們的盼望，乃是被帶進神的榮耀，就是祂的彰顯裏。這要完全實現在要來的千年國裏，在那裏基督要顯為我們的榮耀。今天我們是在這要來之榮耀的盼望中。（見來十一1註2。）4節者同。"]],["5",["含歡樂意。這表示我們對神的享受。下節者同。"]]]},"徒4:33":{"t":"使徒大有能力，¹見證主耶穌的復活，眾人也都蒙大²恩。","n":[["1",["見二32註2。"]],["2",["見約一17註1，林前十五10註1。"]]]},"徒11:23":{"t":"他到了，看見神的¹恩典，就歡樂，勸勉眾人，要立定心志，²一直與主同在；","n":[["1",["見約一14註4，林前十五10註1。巴拿巴所看見的恩典，必定是信徒所得著並享受的三一神，彰顯於他們的得救、生命的改變、聖別的生活、以及在聚會中所運用的恩賜，這些都是人所能見的。"]],["2",["意即堅定不移的忠於主，依附主，活在與主緊密的交通中。"]]]},"約1:16":{"t":"¹從祂的豐滿裏我們都領受了，而且恩上加恩；","n":[["1",["從，直譯，出於。"]]]},"約1:17":{"t":"因為¹律法是藉著摩西賜的，¹恩典和¹實際都是藉著耶穌基督²來的。","n":[["1",["律法是照著神的所是要求人，恩典卻是以神的所是供應人，以應付神的要求。律法最多不過是神所是的見證，（出二五21，）實際卻是神所是的實化。沒有人能藉著律法有分於神，恩典卻叫人得以享受神。實際是神給人實化，恩典是神給人享受。"]],["2",["直譯，成的。"]]]},"來10:29":{"t":"何況那¹踐踏神的兒子，將他藉以成聖的立約之血²當作俗物，又³褻慢恩典之靈的，你們想，他該受怎樣⁴更重的刑罰？","n":[["1",["在新約裏，神的兒子頂替了舊約一切的祭物。希伯來的信徒若要回到猶太教獻任何一種舊祭，實際上就是踐踏神的兒子。"]],["2",["希伯來的信徒若要回到猶太教獻舊祭，倚賴被宰殺之祭牲的血，實際上就是把基督的寶血當作俗物。這是極度輕看基督惟一救贖的工作。"]],["3",["希伯來的信徒在新約之下，藉著基督救贖的血，已經有分於聖靈，（六4，）就是恩典的靈。他們若要回到猶太教，就是故意犯罪，褻慢在他們裏面內住並工作之恩典的靈。"]],["4",["這不同於遭受第二次的死，那是在火湖裏永遠的滅亡。（啟二十6，14，二一8。）信徒雖不會滅亡，卻可能因失敗遭受時代的刑罰。這刑罰要比那干犯字句律法的人所受的更重。"]]]},"弗1:3":{"t":"¹我們主耶穌基督的²神與父，是當受³頌讚的，祂⁴在基督裏，曾⁵用⁶諸天界裏各樣⁷屬靈的⁸福分，⁹祝福了我們；","n":[["1",["主耶穌基督既是我們的，凡神之於祂的，也就都是我們的。“主”指祂為主的身分；（徒二36；）“耶穌”指祂是人；（提前二5；）“基督”指祂是神的受膏者。（約二十31。）"]],["2",["我們的主耶穌基督，就祂是人子說，神是祂的神；就祂是神子說，神是祂的父。按祂的人性，神是祂的神；按祂的神性，神是祂的父。"]],["3",["直譯，讚美。意帶著敬拜而稱讚。在本段，父為著神永遠的定旨而有了揀選和豫定，（3～6，）子為著完成神永遠的定旨而成就了救贖，（7～12，）靈為著應用神所完成的定旨而作印記與憑質；（13～14；）在此，三一神受到讚美，受到帶著敬拜的稱讚。藉著神聖三一一切的美德，我們墮落的罪人成了召會，就是基督的身體，那在萬有中充滿萬有者的豐滿─彰顯。"]],["4",["基督是神祝福我們的效能、憑藉和範圍。在基督之外、離了基督，神就與我們無分無關。但在基督裏，神曾用諸天界裏各樣屬靈的福分，祝福了我們。"]],["5",["用諸天…福分，直譯，在諸天…福分裏。"]],["6",["這裏的諸天界，不僅指明天的所在，也指明神所用以祝福我們，屬靈福分的屬天性質、情形、特徵和氣氛。這些福分是從諸天來的，有屬天的性質、情形、特徵和氣氛。在基督裏的信徒，在地上享受這些屬天的福分，這些福分是屬靈的，也是屬天的，與神所用以祝福以色列人的福分不同，那些福分是屬物質、屬地的。所賜給我們的福分，是屬乎父神，在子神裏，藉著靈神，且在諸天界裏。這些乃是三一神，在諸天界裏，所賜我們在基督裏的信徒，屬靈的福分，有屬天的性質、情形、特徵和氣氛。"]],["7",["神所用以祝福我們的一切福分，既是屬靈的，就與聖靈有關。神的靈不僅是神福分的管道，也是神福分的實際。在本節，父神、子神和靈神，都與所賜給我們的福分有關。事實上，這就是神將祂自己分賜到我們裏面。"]],["8",["直譯，嘉言，發言，美言，美辭。含示好處和益處。神用祂嘉美的言辭祝福了我們，這樣的話對我們句句都是福分。4～14節就是記載這樣的美言、福分。這一切的福分都是屬靈的，在諸天界裏的，也是在基督裏的。"]],["9",["直譯，稱讚，或，說…好話。神祝福我們時，就稱讚我們，說我們好話。"]]]},"弗1:4":{"t":"就如祂在¹創立世界以前，在基督裏²揀選了我們，使我們³在⁴愛裏，⁵在祂面前，成為⁶聖別、⁷沒有瑕疵；","n":[["1",["這是在已過的永遠裏。神按著祂無限的先見，在創造我們之前揀選了我們。這含示世界（即宇宙）的創立乃是為著人的生存，以成就神永遠的定旨。","羅馬書開始於地上墮落的人，本書開始於諸天界裏神所揀選的人。"]],["2",["接著前節，4～14節列舉神用以祝福我們的一切屬靈福分，從祂在永遠裏的揀選開始，直到產生基督的身體，永遠彰顯祂自己。因此，神的揀選是祂賜給我們的頭一項福分。神的揀選就是祂的選擇。祂從無數人中選上了我們，這是祂在基督裏所作的。基督是我們蒙神揀選的範圍；在基督之外，我們就不是神所揀選的。"]],["3",["“在愛裏”可移至5節“豫定了我們”之前。"]],["4",["這裏的愛是指神愛祂所揀選之人的愛，以及神所揀選之人愛祂的愛。神所揀選的人乃是在這愛裏，在這樣的愛裏，在祂面前成為聖別、沒有瑕疵。神先愛我們，然後這神聖的愛激起我們用愛回報祂。在這樣愛的情形與氣氛中，我們被神浸透，成為聖別、沒有瑕疵，像祂一樣。"]],["5",["在祂面前，意即按著神聖的標準，在祂眼中成為聖別、沒有瑕疵。這使我們有資格留在祂面前，享受祂的同在。"]],["6",["聖別的意思不僅是成聖，分別歸神，也是與一切凡俗的不同、有別。只有神與一切不同，與一切有別。因此，祂是聖別的，聖別是祂的性情。祂揀選我們，使我們也成為聖別。神使我們成為聖別的方法，乃是將祂自己這聖別者分賜到我們裏面，使我們全人被祂聖別的性情充滿並浸透。對我們這些神所揀選的人，成為聖別就是有分於神的性情，（彼後一4，）並使我們全人被神自己所充滿。這與僅僅無罪的完全，或無罪的純潔不同。這使我們全人在神的性情和特性上聖別，像神自己一樣。"]],["7",["瑕疵就像寶石內的異物。神所揀選的人只該被神自己所浸透，沒有外來的東西，就如墮落的天然屬人成分、肉體、己或世界的事。這就是“沒有瑕疵，”在神的聖別性情之外沒有任何別的成分攙雜。召會被話中的水徹底洗滌之後，就要這樣成為聖別。（五26～27。）"]]]},"弗1:5":{"t":"按著祂¹意願所喜悅的，²豫定了我們，³藉著耶穌基督得⁴兒子的名分，歸於祂自己，","n":[["1",["這啟示我們，神有一個意願，在其中有祂的喜悅。神按著這喜悅，照著祂心所喜愛的，豫定我們作祂的兒子。以弗所書不像羅馬書以人有罪的光景為立足點，乃是以神心中的喜悅為立足點；因此，以弗所書更深且更高。"]],["2",["或，豫先標出了我們。豫先標出是過程，豫定是豫先決定定命的目的。神在創立世界以前，揀選了我們，豫先標出了我們歸於某種定命。"]],["3",["藉著耶穌基督，意即藉著神的兒子，就是救贖者。藉著祂，我們得蒙救贖，成為神的眾子，有神兒子的生命和地位。"]],["4",["神豫先標出我們，乃是命定我們得兒子的名分。我們甚至在被造以前，就被豫定為神的兒子。因此，我們這些神的造物，需要由祂重生，好有分於祂的生命，成為祂的兒子。兒子的名分，不僅含示兒子的生命，也含示兒子的地位。神所標出的人，有生命成為祂的兒子，也有地位承受祂。成為聖別，是神將祂自己放進我們裏面，使我們與祂的性情相調，藉此聖別我們。這是過程，程序；成為神的兒子，纔是目的，目標。這是聯於神的兒子，而模成一特定的樣式或形狀，就是神長子的形像，（羅八29，西一15，）使我們全人，包括身體，（羅八23，）得以被神“子化。”"]]]},"弗1:6":{"t":"使¹祂恩典的²榮耀得著稱讚，這恩典是祂在³那蒙愛者裏面所⁴恩賜我們的；","n":[["1",["神恩典的榮耀得著稱讚，乃是祂兒子名分的結果。（5。）神豫定我們得祂兒子的名分，就是為了使祂在祂恩典裏的彰顯，就是祂恩典的榮耀，得著稱讚。至終，宇宙中每一樣正面的事物，都要為神兒子的名分稱讚神，（羅八19，）因而應驗本節的話。"]],["2",["榮耀是彰顯出來的神。（出四十34。）神恩典的榮耀，是神的恩典（神的自己作我們的享受）將祂彰顯出來。我們接受恩典而享受神時，確有這榮耀的感覺。"]],["3",["那蒙愛者就是神的愛子，神所喜悅的。（太三17，十七5。）因此，神恩賜我們，乃是使我們成為祂喜悅的對象。這全然是神所喜歡的。在基督裏，神用各樣的福分祝福了我們。在那蒙愛者裏，我們已蒙神恩賜，成為神所恩寵並喜歡的對象。我們既是這樣的對象，就在神的恩典裏，在祂所喜悅的愛子裏享受神，也給神享受。在祂的愛子裏，我們也成了祂所喜悅的。"]],["4",["這把我們擺在恩典的地位上，使我們成為神賜恩並恩寵的對象，就是使我們享受神之於我們的一切所是。"]]]},"弗2:7":{"t":"好在¹要來的諸世代中，²顯示祂在基督耶穌裏，向我們所施³恩慈中恩典超越的⁴豐富。","n":[["1",["指千年國時代和將來的永遠，就是在召會在其中產生的今世之後。"]],["2",["即向全宇宙公開展示。"]],["3",["恩慈是一種仁慈的良善，出自憐憫和愛。神的恩典是在這樣的恩慈中賜給我們的。"]],["4",["神恩典的豐富，超越各樣的限制。這是神自己的豐富，作我們的享受。這些豐富要公開顯示出來，直到永遠。"]]]},"創17:1":{"t":"亞伯蘭年¹九十九歲的時候，耶和華向他顯現，對他說，我是²全足的神；你要³行在我面前，並且要³完全；","n":[["1",["亞伯拉罕運用他天然的力量生了以實瑪利，這嚴重的觸犯了神和神的經綸。因此，以實瑪利出生以後，亞伯拉罕與神的交通就中斷了；神等候了十三年，（參十六16，）直到亞伯拉罕天然的力量被了結，祂纔再來與亞伯拉罕接觸。（羅四19與註。）見十五4註1。"]],["2",["希伯來文， El Shaddai， 伊勒沙代。伊勒，意，大能者；沙代，源自另一希伯來字，意，胸部或乳房。這神聖的稱呼啟示神乃是有乳房的大能者，就是全豐全足的大能者。祂是恩典的源頭，用祂神聖所是的豐富供應祂所呼召的人，使他們能產生基督作後裔，以完成神的定旨。"]],["3",["在這裏，行在神面前，就是行在祂的同在裏，不斷享受祂和祂全豐全足的供應。得以完全，乃是得著神加到我們裏面作完全的元素和因素。實際上，這意思是，我們的生活和工作，並不倚靠肉體的力量，乃是信靠神這位全豐全足的大能者。"]]]},"創28:3":{"t":"願¹全足的神賜福給你，使你繁衍增多，成為²多族；","n":[["1",["希伯來文， El Shaddai， 伊勒沙代。見十七1註2。"]],["2",["直譯，多族的會眾。"]]]},"創17:15":{"t":"神又對亞伯拉罕說，至於你的妻子¹撒萊，不可再叫撒萊，她的名要叫²撒拉。","n":[["1",["意，我的公主。"]],["2",["意，公主。“公主”前面“我的”這辭（見15註1）指明狹窄與特別。這裏撒拉的改名表徵廣博，表示她這個人擴大且寬廣了，使她成為多國之母。（16。）正如在亞伯拉罕（5）和撒拉身上所看見的，這樣的改變要求我們的舊人和天然人被了結，使我們能變化成為新人；這樣的人纔能產生後裔並關心別人，使神的定旨得以完成。"]]]},"創17:16":{"t":"我必賜福給她，也要使你¹從她得一個兒子。我必賜福給她，她也要作多國之母，必有多民的君王從她而出。","n":[["1",["即憑神應許之約裏神的恩典，在此由亞伯拉罕的妻子，自主的婦人撒拉所象徵。（加四22～26。）以撒是從撒拉出生，表徵基督裏的信徒是憑神的恩典，在基督的復活裏出生，（彼前一3，）成為亞伯拉罕合法的後裔。（加四28，31，三29。）本章裏神割禮的約相當於新約，在這新約中基督的死割除我們肉體裏的舊人，並且基督的復活使我們的新人（由以撒所表徵）有新生的起頭，使我們成為新造。（林後五17。）"]]]},"創17:17":{"t":"亞伯拉罕就面伏於地笑了，心裏說，一百歲的人還能得孩子麼？撒拉已經九十歲了，還能生孩子麼？","n":[]},"創17:18":{"t":"亞伯拉罕對神說，但願以實瑪利活在你面前。","n":[]},"創17:19":{"t":"神說，不然，你妻子撒拉必給你生一個兒子，你要給他起名叫¹以撒。我要²與他堅定所立的約，作他後裔永遠的約。","n":[["1",["意，他喜笑。"]],["2",["以實瑪利是肉體所產生的後裔，為神所棄絕。（二一10。）惟有以撒是憑神恩典所產生的後裔，是為著完成神定旨所立定的。（21，二一12，羅九7～9。）"]]]},"創18:10":{"t":"¹其中一位說，²到明年這時候，我必回到你這裏；你的妻子撒拉必生一個兒子。撒拉在³那位後邊的帳棚口也聽見了這話。","n":[["1",["其中一位，直譯，祂。"]],["2",["直譯，照著生命的時候。14節者同。"]],["3",["那位，直譯，祂。15節者同。"]]]},"創18:11":{"t":"亞伯拉罕和撒拉年紀老邁，撒拉的月經已經停了。","n":[]},"創18:12":{"t":"撒拉心裏暗笑，說，我既已衰敗，我主也老邁，豈能有這樂趣呢？","n":[]},"創18:13":{"t":"耶和華對亞伯拉罕說，撒拉為甚麼笑，說，我既年邁，果真能生孩子麼？","n":[]},"創18:14":{"t":"耶和華豈有¹難成的事麼？到了²約定的日期，明年這時候，我必回到你這裏，撒拉必生一個兒子。","n":[["1",["難成，直譯，太奇妙。"]],["2",["生命的時候，（10，）就是約定生以撒的日期，（十七21，）乃是神眷顧的時候。（二一1。）以撒的出生是耶和華的來臨，就是恩典的來臨。（參約一17。）以撒不是憑人天然生命的力量，乃是憑神恩典的力量生的。這發生在亞伯拉罕受割禮之後，他和他的妻子撒拉，如同完全死了；（11，羅四18～19；）這表徵生命的時候，就是基督成為我們生命的時候，要在我們天然的力量被了結之後纔來到。"]]]},"創21:1":{"t":"¹耶和華按先前的話²眷顧撒拉，便照祂所應許的給撒拉成就。","n":[["1",["1～13節，見加四22～31註。"]],["2",["見十八14註2。"]]]},"創21:2":{"t":"當亞伯拉罕年老的時候，撒拉懷了孕；到神和亞伯拉罕約定的日期，就給亞伯拉罕¹生了一個兒子。","n":[["1",["神在祂經綸中的目標，是要產生基督為後裔，以完成祂永遠的定旨。（三15，十二7，二二18，加三16，撒下七12～14上。）以撒的出生，表徵基督這應許的後裔是在神豫定的時候，藉著神恩典的工作所產生的。這事的首要條件，乃是我們天然的生命和力量，必須藉著屬靈的割禮被了結。（十七10～16。）"]]]},"創21:3":{"t":"亞伯拉罕為撒拉給他生的兒子起名叫¹以撒。","n":[["1",["意，他喜笑。"]]]},"創21:4":{"t":"以撒生下來¹第八日，亞伯拉罕照著神所吩咐的，給他的兒子以撒²行了割禮。","n":[["1",["見十七12註1。"]],["2",["見十七10註1。"]]]},"創21:5":{"t":"他兒子以撒出生的時候，亞伯拉罕年一百歲。","n":[]},"創21:6":{"t":"撒拉說，神使我歡笑，凡聽見的必與我一同歡笑；","n":[]},"創21:7":{"t":"又說，誰能豫先對亞伯拉罕說，撒拉要乳養兒女呢？然而在他年老的時候，我竟給他生了一個兒子。","n":[]},"加4:23":{"t":"然而那出於使女的，是¹按著肉體生的；那出於自主婦人的，是¹藉著應許生的。","n":[["1",["按著肉體，是靠著人肉體的努力；藉著應許，意即在神的應許所含示之恩典裏，藉著神的能力。以實瑪利是按著肉體生的，以撒卻是藉著應許生的。"]]]},"加4:24":{"t":"這些都是寓意：¹兩個婦人就是²兩約，一個是出於³西乃山，生子⁴為奴，乃是⁵夏甲。","n":[["1",["指22節的兩個婦人。"]],["2",["一個是給亞伯拉罕的應許之約，這與新約，恩典之約相關聯；另一個是給摩西的律法之約，這與新約完全無關。撒拉是自主的婦人，象徵應許之約；夏甲是使女，象徵律法之約。"]],["3",["降律法之地。（出十九20，二四12。）"]],["4",["在律法之下為奴。"]],["5",["亞伯拉罕的妾夏甲，表徵律法。因此，律法的地位像妾的地位。亞伯拉罕的妻子撒拉，象徵神的恩典，（約一17，）在神的經綸中有合法的地位。律法像夏甲，生子為奴，如猶太教徒；恩典像撒拉，生子得兒子的名分，這些是新約的信徒。他們不再在律法之下，乃在恩典之下。（羅六14。）他們該站在這恩典中，（羅五2，）不從其中墜落。（五4。）"]]]},"加4:25":{"t":"這夏甲就是在亞拉伯的西乃山，相當於現在的¹耶路撒冷，因耶路撒冷同她的兒女都是²作奴僕的。","n":[["1",["耶路撒冷是神所揀選的，（王上十四21，詩四八2，8，）應當屬於撒拉所象徵的應許之約。然而，因她將神的選民帶到律法的轄制之下，所以相當於西乃山，屬於夏甲所象徵的律法之約。"]],["2",["直譯，作奴僕服事。指律法之下的奴僕。在使徒時代，耶路撒冷同她的兒女都是律法之下的奴僕。"]]]},"加4:26":{"t":"但那¹在上的耶路撒冷是自主的，她是我們的母，","n":[["1",["這至終將是在新天新地中的新耶路撒冷，（啟二一1～2，）與應許之約相關聯。她是新約信徒之母，這些信徒不是律法之下的奴僕，乃是恩典之下的兒子。我們新約的信徒，都是從上頭由她生的，也都要在新天新地中的新耶路撒冷裏。"]]]},"加4:27":{"t":"因為經上記著：“那不生育，沒有生產過的，你要快樂；那未曾經過產難的，你要放聲呼喊，因為¹獨居的，比有丈夫的兒女²更多。”","n":[["1",["如無夫之婦，所以是獨居的。"]],["2",["這指明亞伯拉罕屬靈的子孫，比他天然的子孫更多。他屬靈的子孫屬於天上的耶路撒冷，屬於在恩典自由下的應許之約；他天然的子孫屬於地上的耶路撒冷，屬於在律法奴役下的律法之約。"]]]},"加4:28":{"t":"弟兄們，你們乃是藉著¹應許生的兒女，像以撒一樣。","n":[["1",["藉著應許生的兒女，就是在應許之約下，藉著恩典，由天上的耶路撒冷所生的兒女。"]]]},"加4:31":{"t":"所以，弟兄們，我們¹不是使女的兒女，乃是自主婦人的兒女了。","n":[["1",["我們在基督裏的信徒，不是在律法奴役下律法的兒女，乃是在恩典自由下恩典的兒女，享受包羅萬有的靈，連同基督一切的豐富。"]]]},"彼前3:7":{"t":"照樣，作丈夫的，要¹按情理與妻子同住，因為她是比你²軟弱的³器皿，是女性；又要⁴按她應得的分敬重她，因為她是與你一同承受⁵生命之恩的，好叫你們的禱告不受攔阻。","n":[["1",["情理，直譯，知識。按情理與妻子同住，即明智、合理的與妻子同住；不是由情慾和情感所管治，乃是由為人和屬靈的知識所管治，認識婚姻關係的性質，以及女性的軟弱。"]],["2",["照著神創造的本性，女性在生理和心理上都比男性軟弱。"]],["3",["人（包括女人）是被造以盛裝神的器皿，（羅九21，23，）並且在基督裏的信徒又是盛裝基督這寶貝的器皿。（林後四7。）雖然作妻子的是女性的器皿，比較軟弱，但她們仍是主的器皿，能作貴重的器皿。（提後二21。）"]],["4",["按她應得的分敬重她，直譯，將敬重分配與她。敬重，原文意寶貴、貴重的價值。丈夫應當珍賞妻子的寶貴、貴重的價值，將妻子應得的敬重分給她這一同承受生命之恩的。"]],["5",["生命之恩就是神在祂的三一裏作我們的生命和生命的供應─父是生命的源頭，子是生命的流道，靈是生命的流出，同著子與父在我們裏面湧流，作對我們的恩典。（約壹五11～12，約七38～39，啟二二1。）所有信徒都是承受這恩典的人。見一4註4。"]]]},"創17:21":{"t":"到明年這¹約定的日期，撒拉必給你生以撒，我要與他堅定所立的約。","n":[["1",["見十八14註2。"]]]},"羅4:18":{"t":"他在無可指望的時候，仍¹靠指望而信，就得以照先前所說，“你的後裔將要如此”的話，作多國的父。","n":[["1",["亞伯拉罕是本於信得稱義之人的表樣，他靠著所望之事而活。（見來十一1註2。）"]]]},"羅4:19":{"t":"他將近百歲的時候，雖然想到自己的身體如同¹已死，撒拉的生育也已斷絕，他的信還是不軟弱，","n":[["1",["這表明亞伯拉罕天然力量的了結，這了結有關神對他主觀的稱義。"]]]},"創17:11":{"t":"你們都要受割禮，這是我與你們¹立約的記號。","n":[["1",["雖然神關於祂選民承受美地的應許（十二1～2，7，十三15～17）已立為約，（十五4～5，18～21，）但仍需要用割禮的約堅定神應許的約。割禮是神選民所必須經過的步驟，好承受神的應許。割禮表徵神新約的選民必須藉著十字架被了結，好承受神所應許在基督裏的一切豐富。（參加二20。）見羅四11與註1。"]]]},"腓3:3":{"t":"真¹受割禮的，乃是我們這憑神的靈²事奉，在基督耶穌裏誇口，³不信靠⁴肉體的。","n":[["1",["新約的信徒，藉著基督釘十字架真正受了割禮。（見加五11註1與西二11註2。）他們與熱中猶太教者完全不同。他們不憑律法的規條，乃憑神的靈作祭司事奉；他們不在律法上誇口，只在基督裏誇口；他們不信靠肉體，只信靠那靈。"]],["2",["原文與二17的供奉，同指像祭司的事奉。"]],["3",["在2～3節，有三重的對比：憑神的靈事奉的信徒，與犬類成對比；在基督裏誇口的信徒，與作惡的成對比；不信靠肉體的信徒，與妄自行割的成對比。"]],["4",["這裏的肉體，包含我們天然人的一切所是和所有。熱中猶太教者信靠割禮，表明他們信靠肉體，不信靠那靈。"]]]},"林後1:8":{"t":"弟兄們，關於我們在亞西亞所遭遇的患難，我們不願意你們不知道，就是我們¹被壓太重，力不能勝，甚至連²活命的指望都³絕了，","n":[["1",["被壓，即負重，受壓。原文與五4之“負重”同。"]],["2",["或，生命。"]],["3",["原文與四8之“絕無出路”同。"]]]},"林後1:9":{"t":"¹自己裏面也²斷定是必死的，叫我們不信靠自己，只信靠³那叫死人復活的神；","n":[["1",["本書陳明使徒在五方面是為著召會活基督的榜樣：(一)不信靠自己，只信靠那叫死人復活的神，（9，）這包括一些相關的事，就如在世為人，不靠屬肉體的智慧，乃靠神的恩典，（12，）以及與信實之神那不變的基督是一；（18～20；）(二)聯於基督，為祂的靈所膏、所印，被祂俘擄、征服，並受祂帥領散佈祂的香氣；（21～22，二14～16；）(三)彀資格以基督為屬靈的字母，用活神賜生命的靈寫活的信；（三3～6；）(四)有新約榮光的照耀；（三7～11；）(五)以沒有帕子遮蔽的臉，觀看並返照主的榮光，變化成為與祂同樣的形像，從榮耀到榮耀，乃是從主靈變化成的。（三16～18。）"]],["2",["斷定是必死的，直譯，是死的答案，或，是死的反應。當使徒在患難的重壓之下，甚至連活命的指望都絕了，他們也許問自己，他們受苦的結果是甚麼？答案或反應乃是死。這使他們作了重大的決定，就是不信靠自己，只信靠那叫死人復活的神。"]],["3",["死的經歷引我們進入復活的經歷。復活就是那叫死人復活的神。十字架的工作了結我們的己，使我們在復活裏經歷神。十字架的經歷總是帶進對復活之神的享受。這樣的經歷產生並形成職事。（4～6。）這在四7～12有進一步的描述。"]]]},"林後1:12":{"t":"我們所誇的，是我們的¹良心見證我們²憑著神的³單純和⁴純誠，在世為人，不⁵靠⁶屬肉體的智慧，乃⁷靠神的⁸恩典，對你們更是這樣。","n":[["1",["我們必須有清潔的良心，（提後一3，）無虧的良心，（徒二四16，）見證我們的所是和所作。"]],["2",["直譯，在神的單純和純誠裏。"]],["3",["或，簡單。有些古卷作，聖別。使徒所處的死境，逼著他們簡單，也就是不信靠他們自己，或他們天然的能力，解決他們的困境。這是他們良心的見證，也是他們所深信的。（15。）"]],["4",["一種神聖的美德，神之所是的美德。憑這樣的美德為人，意即經歷神自己。因此，憑這樣的美德為人，等於本節下半“靠神的恩典。”"]],["5",["直譯，在屬肉體的智慧裏。"]],["6",["即在肉體裏屬人的智慧。這等於我們自己，正如神的恩典等於神自己。"]],["7",["直譯，在神的恩典裏。"]],["8",["即給我們享受的神。（見林前十五10註1。）這裏的恩典就是11節的恩賜，這是使徒所領受的，為著在苦難中經歷復活。"]]]},"羅5:3":{"t":"不但如此，就是在¹患難中，我們也是誇耀，因為知道患難生²忍耐，","n":[["1",["患難也是八28所說“萬有”的一部分，由神使之效力，叫我們得益處，好把我們聖別、變化並模成祂進入榮耀之兒子的形像。因此我們將患難當作甜美的眷顧與恩典的化身來接受，而能在其中誇耀。聖靈藉著患難，將基督的十字架殺死天然之人的果效，實施到我們裏面，使復活的神有路將祂自己加給我們。（見林後四16～18。）"]],["2",["意堅忍。堅忍是耐心加上受苦的產物。"]]]},"羅5:4":{"t":"忍耐生¹老練，老練生盼望，","n":[["1",["指一種蒙稱許的品質或屬性，是忍受並經歷患難和試驗的結果。"]]]},"羅5:5":{"t":"盼望不至於蒙羞；因為¹神的愛已經藉著所賜給我們的聖靈，澆灌在我們心裏。","n":[["1",["神的愛就是神自己，（約壹四8，16，）神已將這愛隨同所賜給我們的聖靈，澆灌在我們心裏，作了我們裏面的動力，叫我們在一切的患難中得勝有餘。（見八37註1。）所以我們忍受任何的患難，都不至於蒙羞。"]]]},"創21:8":{"t":"孩子¹漸長，就斷了奶。以撒斷奶的日子，亞伯拉罕設擺盛大的筵席。","n":[["1",["以撒的長大，表徵基督生在新約信徒裏面之後的長大。基督在我們裏面需要長大，好使基督成形在我們裏面。（加四19與註4。）"]]]},"彼後3:18":{"t":"你們卻要在我們的主和救主耶穌基督的¹恩典和²知識上³長大。願榮耀⁴歸與祂，從現今直到永遠之日。阿們。","n":[["1",["見約一14註4，林前十五10註1，林後十三14註1。"]],["2",["對我們主的知識的領會等於真理，就是祂一切所是的實際，如約一14、17者。（見約一17註1。）彼得囑咐信徒不僅要在恩典上長大，也要在這真理上長大。"]],["3",["這指明彼得在這兩封書信裏所寫的，乃是生命的事。在恩典上長大，就是因著那由神聖的能力所供備永遠生命的全備供應而長大；（一3～4；）在主的知識上長大，就是因著認識基督的所是而長大。這就是藉著享受恩典並認識真理而長大。（約一14與註4，17與註1。）"]],["4",["指歸與我們的主和救主耶穌基督。這樣的讚美既是歸給神的，（羅十一36，十六27，）就指明我們的主和救主耶穌基督就是神。"]]]},"彼前2:2":{"t":"像纔¹生的嬰孩一樣，切慕那²純淨的³話奶，叫你們靠此⁴長大，⁵以致得救；","n":[["1",["信徒藉著重生，（一3，23，）出生為嬰孩，就能靠著靈奶的滋養，在生命裏長大，以致進一步的得救，這樣的得救乃是為著神的建造。"]],["2",["純淨，直譯，誠實。與1節的詭詐相對，就是不為著虛假的目的，不為著其他的目標，只為著滋養魂。"]],["3",["話，原文同羅十二1“合理的，”為形容詞，源自名詞“話，”因此可譯為“話的，”有屬於心思（與體相對）、屬於理性機能之意；因此是理性的、邏輯的、合理的。話奶不是為著身體，乃是為著魂，就是裏面的人。這奶是在神的話裏傳輸出來，藉我們理性心思的領會，且由我們心思機能的吸收，滋養我們裏面的人。"]],["4",["長大是生命的事，也是在生命裏的事。我們藉著重生得著了神的生命，就需要由神的話所傳輸的奶得著滋養，在這生命裏並因這生命而長大。"]],["5",["以致，即結果。在生命裏長大的結果就是得救。這裏的得救不是起初的救恩，乃是在生命裏長大的結果。神完滿、全備的救恩從重生（包括稱義）到得榮，（羅八30，）有一段很長的期間。我們重生時，得著了起初的救恩。（見一5註6。）然後需要藉著享用基督作神話語中滋養的奶，得餧養而長大，達到完全的救恩，達到成熟而得榮。這救恩就是主耶穌顯現時，所要顯現與我們魂的救恩。（一5與註6，9～10，13。）然而，照上下文看，這裏的以致得救是直接指5節的被建造成為屬靈的殿，成為聖別的祭司體系，獻上屬靈的祭物，以及9節的宣揚神的美德。"]]]},"林前3:6":{"t":"我¹栽種了，亞波羅澆灌了，惟有神叫他生長。","n":[["1",["栽種、澆灌、叫人生長，都與生命的事有關。這指明信徒是神的耕地，（9，）為要生長基督。基督的執事只能栽種並澆灌，惟有神能叫人生長。哥林多的信徒高估栽種的和澆灌的，卻忽略那叫人生長的。因此，他們沒有在作他們生命的基督裏長大。","哥林多的信徒受了盛行的希臘哲學智慧的影響，忽略了生命，過分注意知識。保羅在本章的用意，是要把他們的注意力，從知識轉到生命，指出他是餧養的、栽種的，亞波羅是澆灌的，而神是叫人生長的。在四15，他甚至告訴他們，他是他們屬靈的父親，在基督裏藉著福音生了他們。從生命的觀點，神聖的觀點看，他們乃是神的耕地，為要生長基督。這完全是生命的事，但那些受魂生命、天然生命管轄支配，在天然智慧影響下的信徒，卻把這事完全疏漏了。"]]]},"彼前4:10":{"t":"各人要照所得的恩賜，將這恩賜彼此¹供應，作²神諸般恩典的好管家。","n":[["1",["或，服事。"]],["2",["見一2註12，五10註2。神諸般的恩典就如五章裏全般的恩典，乃是生命豐富的供應，也就是三一神在多方面供應到我們裏面。（林後十三14，十二9。）我們既是好管家，就該藉著所得的恩賜，將這樣的恩典供應給召會和眾聖徒，而不該僅僅講些道理或虛妄的事。"]]]},"彼前5:10":{"t":"¹但那²全般恩典的神，就是那曾³在基督耶穌裏召你們⁴進入祂永遠榮耀的，等你們暫受苦難之後，必要⁵親自⁶成全你們，⁷堅固你們，⁸加強你們，給你們⁹立定根基。","n":[["1",["但，指明對比，給受苦的信徒帶來安慰和鼓勵。你們和你們的眾弟兄受到你們對頭的威嚇，就是魔鬼如同獅子的吼叫，不過是暫時的，但那全般恩典的神，就是超過你們一切的需要，有全備充裕生命供應的神，必成全你們，堅固你們，加強你們，給你們立定根基。"]],["2",["全般恩典是指在神的經綸裏，按著在我們身上及裏面神聖工作的許多步驟，供應給我們神聖生命多面全備供應的豐富。開頭的一步是呼召我們，終結的一步是叫我們得榮耀，正如這裏所說，召你們進入祂永遠的榮耀。在這兩步之間，是祂管教我們時愛的關切，以及祂在我們身上成全、堅固、加強並立基的工作。在這一切神聖的舉動裏，神聖生命全備的供應就作恩典在各樣的經歷中供應我們。（見一2註12，四10註2。）遭逼迫的信徒暫受苦難之後，這樣恩典的神必要成全他們，堅固他們，加強他們，給他們立定根基。"]],["3",["在基督耶穌裏，指明那全般恩典的神經過成為肉體、為人生活、釘十字架、復活並升天的過程，成就完備且完滿的救贖，使祂能將祂所救贖的人帶進與祂自己生機的聯結裏。這樣他們就能有分於三一神的豐富作他們的享受。神聖工作的一切步驟都是在基督裏，祂是三一神的具體化身，成了包羅萬有賜生命的靈，作我們全備的生命供應。在這基督裏，藉著祂包羅萬有的救贖，並基於祂一切的成就，神就能成為全般恩典的神，召我們得享祂永遠的榮耀，並在那作穩固根基的三一神（一2）裏成全我們，堅固我們，加強我們，給我們立定根基，這樣就使我們能達到祂榮耀的目標。墮落的罪人竟能被帶進神永遠的榮耀裏，這是何等的神蹟！祂在我們身上成全、堅固、加強、並立基的工作又是何其超絕！這都是藉祂全般的恩典，也就是真實的恩典（12）所成就的。"]],["4",["進入，意即有分於，得享。"]],["5",["指明神在恩典工作裏親身的行動。"]],["6",["見林後十三9註2。"]],["7",["直譯，使你們穩固、堅定。在路二二32，主曾用同樣的辭囑咐彼得。"]],["8",["與堅固的意義非常接近。"]],["9",["原文這辭源自“根基；”因此，是扎實的立定根基，與太七25，弗三17，來一10者同。恩典的四項神聖舉動是有進展的。成全帶來堅固，堅固帶來加強，加強帶來在全般恩典的神裏立定根基。全般恩典的神，就是在祂的分賜裏作穩固根基的三一神。（一2。）"]]]},"徒20:28":{"t":"聖¹靈立你們作全²群的³監督，你們就當為自己謹慎，也為全群謹慎，⁴牧養神的召會，就是祂用⁵自己的血所買來的。","n":[["1",["在各召會選立長老的乃是使徒。（十四23。）但領頭的使徒保羅，雖然選立了長老，卻在這裏說是聖靈立的；這指明使徒選立長老時，聖靈與他們是一，也指明使徒選立長老是照著聖靈的引導。"]],["2",["見彼前五2註2。"]],["3",["即17節召會的長老。這證明監督和長老是同義辭，指同一班人。立監督作一區的主教，轄管該區各地的長老，乃是極大的錯誤。這就是以格那提（Ignatius）所行的。這錯誤的教訓成了階級的依據，帶進了宗教組織。（見提前三2註1。）"]],["4",["長老作監督，主要的責任不是轄管，乃是牧養，給群羊，就是神的召會，周全柔細的照顧。（見彼前五2註1，3註1。）"]],["5",["指明神寶愛召會，以及召會在神眼中寶貴、超絕的價值。這裏使徒沒有說到召會的神聖生命和性質，如在弗五23～32，乃是說到召會的價值對神猶如珍寶，是祂用自己的寶血所買來的。保羅盼望作監督的長老，和神一樣寶愛召會。","聖靈和神自己的血，二者都是神給祂所寶愛之召會的神聖供應。聖靈就是神的自己，神自己的血是指神的工作。神救贖的工作把召會買來，然後神的自己，就是那包羅萬有賜生命的靈，（林前十五45，）藉著監督照顧召會。","神自己的血，就是耶穌基督的血。這也含示主耶穌就是神。"]]]},"太26:28":{"t":"因為這是我立¹約的²血，為多人流出來，使³罪得赦。","n":[["1",["有些古卷作，新約。主的血既滿足了神的公義，就立了新約。在這新約中，神賜給我們赦罪、生命、救恩，和一切屬靈、屬天、神聖的福分。當神將這新約賜給我們時，這約乃是一個杯，（路二二20，）就是我們的分。主流了血，神立了約，而我們享受這杯；在這杯裏，神和一切屬神的都是我們的分。血是基督為我們所付的代價，約是神為我們所立的契據，杯是我們從神所領受的分。"]],["2",["主筵席上杯裏葡萄樹的產品（29）也是個表號，象徵主在十字架上為我們的罪所流的血。這血乃是神的公義所要求的，為使我們的罪得赦免。（來九22。）"]],["3",["原文，複數。"]]]},"利16:11":{"t":"亞倫要把為自己作贖罪祭的公牛牽來，為自己和家人遮罪，把公牛宰了。","n":[]},"利16:12":{"t":"他要拿一個香爐，從耶和華面前的壇上盛滿火炭，又拿一滿捧搗細的馨香之¹香，都帶入幔內，","n":[["1",["宰了贖罪祭之後要燒香，（見出三十34～38與註，）免得亞倫死亡，（11～13，）這表徵主耶穌在祂的復活裏成為馨香之氣，作了我們的憑藉和保護，使我們坦然無懼的親近神，蒙神悅納，不至遭受死亡。（參來十19～22。）這是主耶穌在十字架上救贖、流血的死（由來自壇上的火炭，以及搗細的香所表徵）所產生的一個結果。","這香用取自外院祭壇上的火焚燒，表徵基督作為香被焚燒，使我們在神面前蒙悅納，乃是基於祂為我們的罪死在十字架上。基督首先成為供物除去我們的罪；然後以祂在十字架上的死為基礎，在復活裏成了香，使我們蒙悅納。"]]]},"利16:13":{"t":"在耶和華面前，把香放在火上，使香的煙雲遮掩見證櫃上的遮罪蓋，免得他死亡；","n":[]},"利16:14":{"t":"也要取些公牛的¹血，用指頭彈在²遮罪蓋上朝東的一面，又在遮罪蓋的前面用指頭彈血七次。","n":[["1",["把贖罪祭的血彈在遮罪蓋上，（14～15，）表徵基督救贖的血被帶進諸天，到神面前，為著救贖我們，彈在神面前，以滿足神公義的要求。（來九12。）"]],["2",["見出二五17註1。"]]]},"利16:15":{"t":"隨後他要宰那為百姓作贖罪祭的公山羊，把羊的血帶入幔內，彈在遮罪蓋的上面和前面，好像彈公牛的血一樣。","n":[]},"利16:16":{"t":"他要因以色列人諸般的不潔、過犯，就是他們一切的罪，為¹至聖所遮罪；也要為那在他們不潔之中與他們同住的¹會幕，照樣而行。","n":[["1",["因以色列人的不潔和過犯，要為至聖所和會幕遮罪，這表徵雖然我們蒙了救贖，得著基督之血的洗淨，但因我們仍在舊造裏，仍活在不潔裏，所以在敬拜神的時候，還是有罪的感覺，需要基督之血所成就的平息。（約壹一7～二2。）這種罪的感覺會持續到我們被提，身體改變形狀的時候。（腓三21。）"]]]},"來10:19":{"t":"弟兄們，我們既因耶穌的血，得以坦然¹進入至聖所，","n":[["1",["今天至聖所是在主耶穌所在的天上。（九12，24。）當我們還在地上時，如何能進入？祕訣就是四12所說我們的靈。這位在天上的基督，現今也在我們的靈裏。（提後四22。）祂是那天梯，（創二八12，約一51，）將我們的靈聯於天，也將天帶到我們的靈裏。因此，我們一轉到靈裏，就進入了至聖所，在那裏與施恩寶座上的神相會。見四16註1。"]]]},"徒20:32":{"t":"如今我把你們交託¹神和祂²恩典的話，這話能建造你們，叫你們在一切³聖別的人中得著⁴基業。","n":[["1",["有些古卷作，主。"]],["2",["見十一23註1。"]],["3",["有分於神的基業需要我們被聖別，被聖別需要神恩典的話。（約十七17與註2。）"]],["4",["原文指得到的一分合法產業。參二六18註8。"]]]},"耶15:16":{"t":"耶和華萬軍之神阿，我得著你的言語，就當食物¹喫了；你的言語成了我心中的歡喜快樂；因我是稱為你名下的人。","n":[["1",["按照聖經的整個啟示，神的話適合給我們喫，我們需要喫神的話。（詩一一九103，太四4，來五12～14，彼前二2～3。）神的話是神聖的供應，作食物滋養我們。話是我們的食物，藉此神將祂的豐富分賜到我們裏面的人裏，滋養我們，使我們得以由祂的元素所構成。這是神經綸極重要的方面。我們喫神的話，祂的話就成為我們心中的歡喜快樂。"]]]},"約6:63":{"t":"¹賜人生命的乃是靈，²肉是無益的；我對你們所說的³話，就是靈，就是生命。","n":[["1",["到這裏，帶進了賜生命的靈。林前十五45說得很清楚，那成了肉體的主耶穌，（一14，）在復活之後，藉著復活成了賜生命的靈。因著祂是賜生命的靈，祂纔能成為我們的生命和生命的供應。我們接受祂這位釘死並復活的救主時，賜生命的靈就進到我們裏面，將永遠的生命分賜給我們。我們接受的是主耶穌，得著的卻是賜生命的靈。"]],["2",["按上下文看，這裏的肉是指物質身體的肉。主說，“我所要賜的糧，就是我的肉。”（51。）猶太人沒有正確領會主的話，以為主是要把祂物質身體的肉給他們喫。（52。）對他們而言，這話甚難。（60。）因此，主在本節加以解釋，祂不是要把祂物質身體的肉給他們喫；這肉，就是人身體的肉，是無益的。至終，祂所要給人的乃是賜生命的靈，就是祂在復活裏的自己。"]],["3",["這裏的“話，”希臘文，rhema，雷瑪，意思是即時、現時所說的話。這字不同於logos，婁格斯，常時的話，如本福音一1裏的“話。”這裏在靈之後題到話。靈是活的，也是真實的，卻相當奧祕，不易捉摸，叫人難以了解；但話是具體的。主首先指明，為了賜人生命，祂要成為靈。然後祂說，祂所說的話就是靈，就是生命。這表明祂所說的話，乃是生命之靈的具體化。現今祂在復活裏是賜生命的靈，而這靈又具體化於祂的話。我們運用靈接受祂的話，就得著那是生命的靈。68節者同。"]]]},"來1:9":{"t":"你愛公義，恨惡不法；所以神，就是¹你的神，用歡樂的油膏你，勝過膏你的²同夥。”","n":[["1",["見8註1。"]],["2",["在神的經綸裏，基督是神所立，完成神計畫者，我們乃是基督在神聖權益上的同夥。祂為神所膏，我們也與祂一同分受這膏，好完成神的定旨。見三15註1。"]]]},"詩133:3":{"t":"又好比黑門的¹甘露，降在錫安²山；因為在那裏有耶和華所命定的福，就是³永遠的生命。","n":[["1",["表徵神新鮮、復甦的恩典，藉著神新鮮的憐恤臨到我們。（哀三22～23，參箴十九12。）這恩典—三一神經過過程並終極完成，成為我們生命的供應，作我們的享受（約一14，16～17，林後十三14）—滋潤了我們。黑門是一座高山，表徵諸天，最高的地方，甘露從那裏降下。那靈的膏抹（2）和恩典的供應，使我們能在一裏生活。參出十六13註2。"]],["2",["原文，複數。一個錫安有許多山，豫表許多地方召會，作惟一宇宙召會的組成分子。我們在地方召會中，每天享受主的恩典如同降下的甘露。"]],["3",["指神永遠的生命，（約三16，弗四18，）是神命定給那些在召會生活裏，在一裏同住之人的福。一三二篇豫表召會生活，在其中神進入祂的安息，我們也在神的居所中，得著滿足和安息。一三三篇豫表召會生活，最高的生活，弟兄在一裏同住的生活。這樣的生活使神進來，以施膏的靈、滋潤的恩典、和永遠的生命祝福我們。"]]]},"哀3:22":{"t":"我們不至¹消滅，是出於耶和華的慈愛，因祂的憐恤不至斷絕；","n":[["1",["無論神怎樣懲罰以色列，祂並沒有完全消滅他們。耶利米和其他許多人還存留下來。這是神的慈愛。以色列人失敗了，但神的憐恤不至斷絕。祂的憐恤保守了以色列餘民，為著完成祂的經綸。見耶二三5～6與6註3。"]]]},"哀3:23":{"t":"¹每早晨這些都是新的；你的²信實，極其廣大。","n":[["1",["這指明耶利米每早晨都接觸主這憐恤者。藉著他與主的接觸，他得著了關於神的慈愛、憐恤、與信實的這話。"]],["2",["神的憐恤不至斷絕，因為祂是信實者。神的信實是指祂的話，也與祂的約有關。因著神與亞伯拉罕立了約，並與以撒和雅各堅定了這約，（創十五1～21，十七1～22，二六1～4，三五11～12，）祂就必須信實的遵守祂的話。"]]]},"來4:16":{"t":"所以我們只管坦然無懼的來到施恩的¹寶座前，為要受²憐憫，得恩典，作應時的幫助。","n":[["1",["這裏所說的寶座，毫無疑問，是指天上神的寶座。（啟四2。）神的寶座，對全宇宙是掌權的寶座，（但七9，啟五1，）但對我們信徒，卻成了施恩的寶座，由至聖所裏的遮罪蓋（施恩座）所表徵。（出二五17，21。）這也是神和羔羊的寶座。（啟二二1。）當我們還活在地上時，怎能來到天上神和羔羊（基督）的寶座前？祕訣在於12節所說我們的靈。那在天上坐在寶座上的基督，（羅八34，）現今也在我們裏面，（羅八10，）就是在我們的靈裏，（提後四22，）這靈就是神居所的所在。（弗二22。）伯特利是神的家，神的居所，也是天的門；在那裏基督是梯子，把地聯於天，並把天帶到地。（創二八12～17，約一51。）我們的靈今天既是神居所的所在，這靈就是天的門，在這裏基督是梯子，把我們在地上的人聯於天，並把天帶給我們。因此，每當我們轉到靈裏，就能進入天的門，藉著基督作天梯，摸著天上施恩的寶座。"]],["2",["神的憐憫和祂的恩典都是神愛的彰顯。當我們在可憐的光景中，神的憐憫先臨到我們，把我們帶進一種光景，使神能以恩典厚待我們。路十五20～24告訴我們，父親看見浪子回家，對他動了慈心，這就是憐憫，彰顯出父的愛。接著，父親給他穿上上好的袍子，又給他喫肥牛犢，這就是恩典，也顯明了父的愛。神的憐憫比恩典搆得更遠，如同一座橋梁，將我們與神的恩典連接起來。","神的憐憫和恩典對我們總是便利的，然而我們需要運用靈，來到施恩的寶座前，摸著在我們諸般的軟弱上同情我們的大祭司，纔能受憐憫，得恩典。本書作者用這話，勉勵疲倦的希伯來信徒要受憐憫，得恩典，作應時的幫助，使他們能挺身而立。（十二12。）"]]]},"羅5:17":{"t":"若因一人的過犯，死就藉著這一人作了王，那些受¹洋溢之恩，並洋溢之²義恩賜的，就更要藉著耶穌基督一人，在³生命中⁴作王了。","n":[["1",["那些受洋溢之恩的，能在生命中作王，因為生命是從洋溢之恩產生的。"]],["2",["義的恩賜消除審判。審判來自罪，但義來自恩典。義總是隨著恩典，乃是恩典的結果。主觀的義（四25下）來自恩典，（17，19，）恩典來自客觀的義。（1～2。）"]],["3",["本節和10、18、21，六4，八2、6、10的生命，都是指神永遠、神聖、非受造的生命（zoe，奏厄），就是基督自己作了我們的生命。（約十一25，十四6，西三4。）這與我們的肉身生命（bios，白阿司─路八14）以及我們的魂生命（psuche，樸宿克─太十六25～26，約十二25）都不一樣。神這永遠的生命，乃是所賜給我們神聖恩典的主要元素，也是我們能在其中作王的。"]],["4",["我們所得的生命，不僅拯救我們脫離一些事物，更使我們作王管理一切，這遠高過在生命裏得救。我們已經在客觀上接受了義，現今還需要不斷的接受洋溢的恩典，使我們能在主觀的生命中作王。後文六至十六章，就是向我們說明作王的意義，所闡述的一切，都不是由於我們的努力，乃是藉著我們接受洋溢的恩典。"]]]},"羅5:21":{"t":"使¹罪怎樣在死中作王，恩典也照樣藉著²義作王，叫人藉著我們的主耶穌基督得永遠的生命。","n":[["1",["罪藉著死的權柄作王，又藉著作王帶進死，因此犯罪的人必須死。"]],["2",["義是神將祂自己分賜給我們作恩典的立場、根基和憑藉。這義使我們有地位，要求基督作我們的恩典。神賜恩典給人，顯示祂的義。（見一17。）不僅如此，這恩典的大能，還在我們裏面運行，產生主觀的義，使我們與神、與人、甚至與自己，都是對的；並在我們裏面不只征服罪，也勝過撒但和死。因此，恩典藉著義作王，結果乃是永遠的生命。"]]]},"啟4:2":{"t":"我立刻就在¹靈裏；看哪，有一個²寶座安置在天上，又有一位坐在寶座上。","n":[["1",["見一10註2。"]],["2",["在本書中，神的寶座乃是神行政的中心。書信中的寶座是施恩的寶座，從這寶座我們受憐憫、得恩典。（來四16。）本書中的寶座乃是審判的寶座，從這寶座世界受審判。至終，在執行了神一切的審判之後，神這寶座要成為永遠生命供應的寶座，從這寶座要流出生命的活水，帶著長在其中的生命樹，作神贖民在永世裏的供應。"]]]},"啟22:1":{"t":"天使又指給我看在城內¹街道當中一道²生命水的³河，明亮如⁴水晶，從⁵神和羔羊的寶座流出來。","n":[["1",["聖城的街道是純金，（二一21，）金象徵神聖的性情。生命水的河在街道當中流著，表徵神聖的生命在神聖的性情裏湧流，作神贖民日常生活的惟一道路。那裏有神聖生命的湧流，那裏就有神聖的性情作聖別的道路，給神的百姓憑以行事；那裏有神聖性情的聖別道路，那裏就有神聖生命的湧流。神聖的生命和作聖別道路之神聖的性情，總是同行的。所以神生命水的河，是順著神聖的道路便於應用的。我們是藉著行在這生命的道路中，享受這生命水的河。"]],["2",["生命水象徵神在基督裏成為那靈，將自己流進祂所救贖的人裏面，作他們的生命和生命的供應。這是從裂開磐石流出的水（出十七6，民二十11）所豫表的，也是從主耶穌被扎的肋旁流出的水（約十九34）所象徵的。這裏的生命水成了一道河，從神和羔羊的寶座流出來，供應並浸透整個新耶路撒冷，所以這城充滿神聖的生命，在神生命的榮耀中彰顯祂。"]],["3",["這河就如創二10～14，詩四六4，結四七5～9的河所豫表的，是表徵在其流中生命的豐盛。這是一道河，流遍聖城的四方，就像創二10～14的一條河分為四道。這一道河連同它的豐富，在我們對神生命之靈各面的豐富（羅八2，十五30，帖前一6，帖後二13，加五22～23）所有不同的經歷中，成了許多道河，如約七38所指明的。"]],["4",["生命水明亮如水晶，毫無糢糊、不透明之處。這生命水在我們裏面湧流時，就純淨我們，使我們透明如同水晶。"]],["5",["“神和羔羊的寶座，”一個寶座既為著神，也為著羔羊，表徵神和羔羊乃是一─祂是羔羊神，是救贖的神，是神那救贖者。在永世裏，坐寶座的神乃是我們救贖的神，從祂的寶座有生命水的河流出來，作我們的供應和滿足。這描述三一神─神、羔羊和生命水所象徵的那靈─如何在祂元首權柄（寶座的權柄所含示的）之下，將自己分賜給祂所救贖的人，直到永遠。"]]]},"西1:18":{"t":"祂也是召會身體的頭；祂是元始，是從死人中復活的¹首生者，使祂可以在萬有中居首位；","n":[["1",["15～17節揭示，基督在創造中是首生者，在一切受造之物中居首位。18節顯示，基督在復活裏是首生者，是身體的頭，在召會，神的新造（林後五17，加六15）裏居首位。"]]]},"啟2:4":{"t":"然而有一件事我要責備你，就是你離棄了¹起初的²愛。","n":[["1",["“起初的，”原文與路十五22“上好的”同字。我們對主起初的愛，必定是上好的愛。"]],["2",["召會是基督的身體，（弗一23，）是生命的事；召會是新人，（弗二15，）是基督人位的事；召會是基督的新婦，（約三29，）是愛的事。寫給在以弗所召會的第一封書信指出，為著召會的生活，我們需要得加強到裏面的人裏，使基督安家在我們心裏，叫我們在愛裏生根立基，能認識基督那超越知識的愛，使我們被充滿，成為神一切的豐滿；（弗三16～19；）又說，為著召會的生活，恩典要與一切愛主耶穌的人同在。（弗六24。）現今，寫給在以弗所召會的第二封書信啟示，召會的墮落開始於離棄了對主起初的愛。惟有愛能保守我們與主有正確的關係。在以弗所的召會雖然有好行為、為主勞碌、忍耐、並試驗出假使徒，（2～3，）但她離棄了對主起初的愛。離棄起初的愛，是召會在以後各階段中一切墮落的根源。"]]]},"彼前5:5":{"t":"照樣，年幼的，要服從¹年長的；你們眾人彼此相待，也都要以²謙卑³束腰，因為神⁴敵擋⁵狂傲的人，賜⁶恩給⁷謙卑的人。","n":[["1",["雖然原文與1節的長老同字，但這裏原則上該是指所有年長的人。"]],["2",["或，卑微。與弗四2者同。"]],["3",["原文源自奴僕的圍裙一辭，指服事時用以束緊寬鬆之外衣者，這裏用作比喻，表徵在服事時穿上謙卑為美德。這比喻顯然是出於彼得的印象，就是主如何以手巾束腰，降卑自己洗門徒的腳，特別是洗彼得的腳。（約十三4～7。）彼得在一13已經引進了束腰的思想。"]],["4",["為很強的字眼，用以說到軍隊豫備抵抗仇敵。"]],["5",["直譯，表現在（別人）上面的人。"]],["6",["嚴格的說，恩典是指三一神自己作生命的供應，在謙卑的信徒裏面繁增。見一2註12，四10註2。"]],["7",["或，卑微的。與太十一29者同。"]]]},"林後5:14":{"t":"原來¹基督的愛²困迫我們，因我們³斷定：⁴一人既替眾人死，⁵眾人就都死了；","n":[["1",["指基督對我們的愛，這愛藉著祂在十字架上為我們受死，已經顯明出來。（加二20。）"]],["2",["原文意，從各面壓逼，逼到一邊，強加限制，在某種界限內限於一個目標，限於一條線和一個目的（如同在有牆的窄路上）。（原文同字用於路四38，十二50，徒十八5，腓一23。）使徒乃是這樣的為基督的愛所困迫，而向祂活著。"]],["3",["即下了結論（也許是在悔改相信時）。"]],["4",["基督那愛的死，乃是使徒受困迫，為基督活出愛之生活的原動力。"]],["5",["基督既替我們死，為我們眾人受了死的刑罰，我們眾人在神眼中就都死了。因此，我們無需按著定命而死。（來九27。）"]]]},"弗6:24":{"t":"願¹恩典與一切在²不朽壞之中，³愛我們主耶穌基督的人同在。","n":[["1",["我們若要過召會生活，成就神永遠的定旨，並解決神與祂仇敵的難處，恩典是必需的。"]],["2",["為著正確的召會生活，我們需要在不朽壞之中愛主，就是在本書全部六章所啟示並教導的一切重要事項中，並照著這些事項愛主。這些重要的事項，就如召會是基督的身體、新人、神奧祕的經綸、那靈的一、實際和恩典、光和愛，以及神軍裝的各項等，全是不朽壞的。為著召會，我們向主的愛必須在這些不朽壞的事物中。"]],["3",["享受主作恩典，是為著那些愛祂之人的。本書一再用“在愛裏”這一富有情意的辭句。（一4，三17，四2，15～16，五2。）以後，在以弗所的召會被主責備，因為她離棄了向主起初的愛。（啟二4。）本書的啟示所著重的，有一點就是作基督身體的召會，也是基督的新婦─妻子。身體重在以基督為生命，妻子重在對基督的愛。所以本書注重我們對主的愛，也結束於我們對主的愛。接受這書信的以弗所召會就是在對主的愛上失敗了。這失敗成了歷代召會失敗的源頭和主因。（啟二～三。）"]]]},"利6:12":{"t":"壇上的火要在其上一直燒著，不可熄滅。祭司要每¹早晨在上面燒柴，把²燔祭擺列在上面，並在其上燒²平安祭牲的脂油。","n":[["1",["祭司每早晨在壇上燒柴，表徵神的願望（見9註4）需要事奉的人合作，把更多燃料加到聖火裏，好加強焚燒，使神接納燔祭作食物。（參羅十二11，提後一6。）早晨表徵焚燒的新開始。"]],["2",["見三5註1。燒燔祭替平安祭的甘美立定根基。這指明我們應當將自己獻給神作常獻的燔祭，（參羅十二1，）好為我們與神甘美的交通，就是燒平安祭牲的脂油所表徵者，立定根基。燒燔祭和燒平安祭，表徵我們向著神的絕對，以及我們對三一神的享受，都該如火焚燒。"]]]},"利6:13":{"t":"火要在壇上一直不斷的燒著，不可熄滅。","n":[]},"創21:9":{"t":"當時，撒拉看見埃及人夏甲給亞伯拉罕所生的兒子¹戲笑，","n":[["1",["見加四29註2，三17註2。"]]]},"創21:10":{"t":"就對亞伯拉罕說，你把這使女和她兒子¹趕出去，因為這使女的兒子不可與我的兒子以撒，一同承受產業。","n":[["1",["把夏甲和以實瑪利趕出去，表徵把律法和肉體努力的結果趕出去，這些在神的經綸中毫無地位。（見加四24註5，30註1。）"]]]},"創21:11":{"t":"亞伯拉罕因他兒子的緣故甚是愁煩。","n":[]},"創21:12":{"t":"神對亞伯拉罕說，你不必為這童子和你的使女愁煩。凡撒拉對你說的話，你都要聽；因為¹從以撒生的，纔要稱為你的後裔。","n":[["1",["直譯，在以撒裏的。"]]]},"羅8:17":{"t":"既是兒女，便是後嗣，就是神的後嗣，和基督同作後嗣，¹只要我們與祂一同受苦，好叫我們也與祂一同得榮耀。","n":[["1",["這表明作後嗣是有條件的。我們是神的兒女，並不就是後嗣。我們生為兒女後，必須在生命裏長大成為兒子；還必須經過受苦，纔可得榮成為法定的後嗣。"]]]},"徒26:18":{"t":"我差你到他們那裏去，¹叫他們的眼睛得開，從²黑暗轉入光中，從³撒但權下⁴轉向神，又因信入我，得蒙⁵赦⁶罪，並在一切⁷聖別的人中得著⁸基業。","n":[["1",["這是要實現神的禧年，主悅納人的禧年，就是主耶穌在路四18～21照著神新約的經綸所宣揚的。（見路四19註1。）新約禧年屬靈和神聖的福分，也就是神福音的福分，其中第一項是叫墮落的人眼睛得開，從黑暗轉入光中，使他們能在屬靈的範圍裏看見神聖的事。要看見這些事，需要屬靈的視力和神聖的光。"]],["2",["黑暗是罪和死的標記；光是義和生命的標記。（約一4，八12。）"]],["3",["撒但的權勢就是撒但的國，這國屬於黑暗。（太十二26與註1。）"]],["4",["即轉向神的權柄，就是神屬於光的國。"]],["5",["赦罪是新約禧年一切福分的基礎。"]],["6",["原文，複數。"]],["7",["不僅在地位一面，也在性質一面。（羅六19與註2，22。）地位一面的聖別，只是在地位和用途上有改變；性質一面的聖別，乃是在性情上，為神的聖別性情所變化，也是用神的聖別性情所完成的變化。（林後三18。）聖別就是給神浸透；祂是我們的產業，作我們今天的享受。這要完成於我們在神生命裏成熟，得以像神，並有資格在來世和永世，完滿得著並享受神作我們的基業。"]],["8",["直譯，一分。指基業的一分。這基業是三一神自己並祂所有的、所作成的、以及為祂贖民所要作的一切。這位三一神化身在包羅萬有的基督裏面；（西二9；）這基督是分給眾聖徒的分，作他們的基業。（西一12。）而賜給眾聖徒的聖靈，乃是這神聖基業的豫嘗、憑質和保證。（羅八23，弗一14。）我們今天在神新約的禧年裏，就有分於並享受這基業作為豫嘗；到來世和永遠裏還要完滿的享受這基業。（彼前一4。）在利二五8～13禧年的豫表裏，主要的福分乃是宣告自由，以及各人歸回自己的產業。這裏，在禧年的應驗裏，從黑暗的權勢得著釋放，以及得著神聖的基業，也是主要的福分。參二十32註4。"]]]},"弗1:11":{"t":"我們既在祂裏面，照著那位按祂¹意願所¹決議的，行作萬事者的²定旨，蒙了³豫定，也就在祂裏面⁴成了所選定的基業，","n":[["1",["神的意願，指祂的目的；神的決議，指祂的思量，要怎樣完成祂的意願或目的。"]],["2",["即計畫。"]],["3",["或，豫先標出。見5註2。"]],["4",["成了所選定的基業，或，得了基業。原文全句是一個動詞，意選擇，或抽籤指定。因此全句意即，我們在祂裏面被標明為所選定的基業。我們成了所選定的基業，以承受神作基業。一面我們成了神的基業，（18，）給神享受；一面我們承受神作我們的基業，（14，）給我們享受。"]]]},"弗1:14":{"t":"這聖靈是我們得¹基業的²憑質，³為使神⁴所買的產業⁵得贖，使祂的榮耀得著⁶稱讚。","n":[["1",["見徒二十32註4。18節者同。"]],["2",["或，豫嘗，擔保。即象徵性的付款，先付的部分款，保證全額的付清。我們是神的基業，聖靈在我們身上乃是印記；神是我們的基業，聖靈對我們乃是這基業的憑質。神將聖靈賜給我們，不僅作我們基業的保證，擔保我們所承受的；也作我們從神所要承受的豫嘗，使我們豫先嘗到完全的基業。在古時，“憑質”的原文是用於土地的買賣，賣主給買主那片土地的一些泥土作樣品；因此，根據古代希臘文的用法，憑質也是樣品。聖靈乃是我們從神所要完滿承受之產業的樣品。"]],["3",["為使神所買的產業得贖，乃是13節蓋印的目的。聖靈的印記是活的，在我們裏面作工，用神聖的元素浸潤、變化我們，直到我們在神的生命裏成熟，至終甚至在身體裏完全變化得贖。"]],["4",["我們蒙神救贖的人─召會，乃是神用基督的寶血所買的產業。（徒二十28。）在神的經綸裏，神成了我們的基業，我們也成了神的產業。何等奇妙！我們沒有付出甚麼，卻得著了一切！神得著我們是有代價的，我們承受神卻是白白的。這是使神的榮耀得著稱讚。"]],["5",["這裏的得贖是指我們身體的得贖，（羅八23，）就是我們卑賤的身體改變形狀，成為榮耀的身體。（腓三21。）今天聖靈是我們神聖基業的擔保、豫嘗和樣品，直等到我們的身體在榮耀裏改變形狀，那時我們就要完全承受神。從已過的永遠神的揀選，（4，）到我們的身體得贖，直到將來的永遠，其中一切的要點都包含在神所賜給我們之福分的範圍裏。"]],["6",["這是本辭第三次的重複，這次是神對我們的祝福（3～14）這段話的結語。3～6節揭示父神為我們所計畫的，就是揀選並豫定我們得兒子的名分，使祂恩典的榮耀得著稱讚。7～12節啟示子神如何完成父神所計畫的，就是救贖我們，並使我們成為神的基業，使祂的榮耀得著稱讚。13～14節告訴我們靈神如何將子神所完成的，應用到我們身上，就是印我們，並作我們永遠、神聖基業的保證和豫嘗，使神的榮耀得著稱讚。在神所賜給我們的福分裏，三一神的榮耀配得三重的稱讚。"]]]},"弗1:18":{"t":"¹光照你們的²心⁵眼，使你們知道祂的⁶³呼召有何等⁴盼望；祂在聖徒中之基業的榮耀，有何等豐富；","n":[["1",["我們不僅要有智慧、啟示和能看見的眼睛，也需要光，照明那向我們開啟的事物，使我們得著異象。"]],["2",["指看見屬靈事物的眼睛。我們有智慧，就是認識的能力；也有啟示，就是屬靈事物的開啟；然而，我們仍需要眼睛，就是看見的屬靈機能。（徒二六18，啟三18。）","要我們的心眼蒙到光照，需要徹底對付我們的良心、心思、情感和意志，就是我們的心所藉以組成的。（參三17註2。）首先我們需要敞開的靈，帶著為基督救贖之血所灑，經過我們認罪和對付，而有的清潔良心。（來九14，十22。）其次，我們還需要清明的心思，（提後一7與註2，）愛的情感，（約十四21，）和服從的意志，（約七17，）好有純潔的心。有了這樣的靈和心，我們的心眼就能看見。"]],["3",["神的呼召，是3～14節所列一切福分的總和，這些福分就是父神的揀選和豫定、子神的救贖、以及靈神的蓋印和作質。我們一旦蒙召，就有分於父的揀選和豫定、子的救贖、以及靈的蓋印和作質。"]],["4",["神呼召的盼望包括：(一)基督自己，以及祂回來時所要帶給我們的救恩；（西一27，彼前一5，9；）(二)被提的遷移，從屬地、屬物質的範圍，遷到屬天、屬靈的範圍，以及得榮；（羅八23～25，30，腓三21；）(三)在千年國裏與基督一同作王的享受；（啟五10，提後四18；）(四)在新耶路撒冷裏對基督終極的享受，連同在新天新地裏普遍而永遠的福分。（啟二一1～7，二二1～5。）"]],["5",["神先使我們成為祂的基業，（11下，）作祂所買的產業，（14下，）又使我們分享祂的一切所是、所有並所完成的，作我們的基業。（14上。）總結起來，這一切成了祂在聖徒中的基業，直到永遠。這要成為祂永遠的彰顯，就是祂的榮耀，帶著祂一切的豐富，普遍且永遠的彰顯祂，達到極點。"]],["6",["這榮耀是豐富的，這豐富就是神聖屬性的許多不同項目，就如光、生命、能力、愛、義、聖等不同程度的彰顯。"]]]},"弗3:8":{"t":"這恩典賜給了我這比眾聖徒中最小者¹還小的，叫我將基督那²追測不盡的³豐富，當作福音傳給外邦人，","n":[["1",["這指明眾聖徒都能得著所賜給使徒保羅的恩典。就保羅這人說，他是使徒中最小的；（林前十五9；）但就他的職事說，他一點不在最大的使徒之下。（林後十一5，十二11。）然而，就他所得的恩典說，他比眾聖徒中最小的還小。這含示眾聖徒都能得著他所得的恩典。這如同我們身體的肢體，不論多小，都得到同樣的血；但這血所產生的本能（恩賜），在眾肢體卻各不相同。基督身體的眾肢體，都能得著與保羅同樣的生命恩典，但他們的恩賜卻與保羅的不同。"]],["2",["直譯，無法追蹤的。"]],["3",["使徒傳的不是道理，乃是基督的豐富。基督的豐富，就是基督之於我們的所是，就如光、生命、義、聖等，以及祂為我們之所有，並祂為我們所完成的、所達到的、並所得著的。基督的這些豐富，測不透也追不盡。"]]]},"弗3:19":{"t":"並認識基督那¹超²越知³識的愛，⁴使你們被充滿，成為神一切的豐滿。","n":[["1",["基督的愛就是基督自己。基督是不可度量的，祂的愛也是這樣，因此，是超越知識的愛。然而，我們能藉著經歷認識這愛。"]],["2",["當基督安家在我們心裏，當我們滿有力量，能和眾聖徒一同領略基督的量度，並藉著經歷，認識祂那超越知識的愛，我們就要被充滿，成為神一切的豐滿，就是召會，作神團體的彰顯，以完成祂的意願。","神的豐滿，含示神所是的豐富成了祂的彰顯。神的豐富在神裏面，乃是神的豐富；這豐富彰顯出來，就成了祂的豐滿。（約一16。）神這豐滿都居住在基督裏面。（西一19，二9。）基督藉著祂的內住，將神這豐滿分賜到我們裏面，使我們被充滿，甚至成為神一切的豐滿，作召會實際的出現，使神在其中得著祂彰顯的榮耀。（21。）"]],["3",["父（14）答應並成就使徒藉著靈（16）的禱告，使基督（子─17）安家在我們心裏；這樣，我們就被充滿，成為神（三一神）的豐滿。這是三一神分賜到我們全人裏面的結果。"]],["4",["在新約裏，豐滿是豐富得著完全而有的彰顯。這說明為何保羅在8節說到基督的豐富，又在一23和四13說到基督的豐滿。基督的豐富乃是基督的所是、所有、以及祂所完成、所達到、並所得著的一切。基督的豐滿乃是我們享受祂這些豐富的結果並流出。基督的豐富給我們新陳代謝的吸收到裏面，就將我們構成基督的豐滿─基督的身體，就是召會，作祂的彰顯。這彰顯先在一23是基督的豐滿，後在本節是神的豐滿，因為基督這神具體化身的豐滿，就是三一神的豐滿。"]]]},"腓1:19":{"t":"因為我知道，這事藉著¹你們的祈求，和²耶穌基督之靈³全備的供應，終必叫我⁴得救。","n":[["1",["這是基督身體（召會）的供應。被囚並沒有使保羅與基督的身體隔離，斷絕這身體的供應。"]],["2",["在聖經中，有關神、基督和那靈的啟示是漸進的。頭一次說的是在創造裏神的靈。（創一2。）其次是在神與人關係中耶和華的靈。（士三10，撒上十6。）而後是有關基督成孕並出生的聖靈。（路一35，太一20。）再後是在主為人生活中耶穌的靈。（徒十六7。）然後是在主復活中基督的靈。（羅八9。）在這裏是耶穌基督的靈。","耶穌基督的靈，就是約七39所說的那靈。這不僅是主成為肉體前之神的靈，更是主復活後之神的靈，就是具有神性的聖靈，與主的成為肉體（人性）、十字架下的為人生活、釘十字架並復活調和而成的。在出三十23～25，由橄欖油和四種香料調和而成的聖膏油，是這複合之神的靈完滿的豫表。現今這靈乃是耶穌基督的靈。這裏不是說耶穌的靈，（徒十六7，）也不是說基督的靈，（羅八9，）乃是說耶穌基督的靈。耶穌的靈主要的是為著主的人性和為人生活，基督的靈主要的是為著主的復活。我們要經歷二5～8所描繪主的人性，就需要耶穌的靈；要經歷三10所說主復活的大能，就需要基督的靈。使徒在受苦時，經歷了主在人性中的受苦並主的復活；因此，那靈對他乃是耶穌基督的靈，就是三一神那複合、包羅萬有、賜生命的靈。對於像使徒那樣經歷並享受基督的為人生活和復活的人，這樣一位靈有全備的供應，甚至就是全備的供應。至終，這複合的耶穌基督之靈，成了神的七靈，祂是神寶座前的七盞火燈，在地上完成神的行政，使神關乎召會的經綸得以成就；祂也是羔羊的七眼，為要把祂一切的所是傳輸到召會裏面。（啟一4，四5，五6。）"]],["3",["原文指歌詠團的首領，供給團員所需用的一切。包羅萬有之靈這全備的供應，叫保羅在為基督受苦時，能活基督並顯大基督。"]],["4",["原文同二12的救恩。這裏的得救就是那裏的作成救恩，指得著維持並加力，能活基督而顯大基督。（見二12註5。）這需要耶穌基督之靈全備的供應。"]]]},"羅8:2":{"t":"因為¹生命之²靈的³律，在基督耶穌裏已經⁴釋放了⁵我，使我脫離了⁶罪與死的律。","n":[["1",["本章揭示屬靈的生命有四重。第一，這生命是在那靈裏神的生命。（2。）第二，這生命藉著重生，成了我們靈裏的生命。（10。）而後，這生命要從我們的靈，浸透我們的心思，使我們心思所屬的魂變化，而成為在我們魂裏的生命。（6。）最終，這生命要滲入我們的身體，成為我們身體裏的生命。（11。）終極的結果，是我們的身體改變形狀，（腓三21，）也就是我們的身體得贖。（23。）"]],["2",["在這裏，律、那靈和生命，與律、罪和死相對。兩個律相對，那靈與罪相對，生命與死相對。在五章，恩典（神在我們裏面的化身）與罪（撒但在我們裏面的化身）相對；（五21；）在本章，那靈（活在我們裏面的神）與罪相對。因此，五章的恩典就是本章的那靈，也就是神化身在我們裏面作恩典，在我們裏面生活行動。","本書在前面多次說到生命。（一17，二7，五10，17～18，21，六4，22～23。）到本章，“生命之靈”一辭將生命與那靈聯在一起，指明前面關於生命的一切，都包含在本章的那靈裏，生命屬於那靈，那靈是生命的，二者實際上乃是一。（約六63。）經歷並享受那神聖、永遠、非受造之生命的路，乃是藉著這生命的靈。"]],["3",["生命之靈的律，是本章的主題。本節只說到與這律的運行有關的那靈和生命。生命乃是那靈的內容與流出，那靈乃是三一神終極完滿的顯出。這位三一神，經過成為肉體、釘死並復活的過程，成了內住、賜生命的靈，作所有在基督裏之信徒的生命。罪的律，乃是出於住在我們墮落身體肢體中的撒但。（七23，17。）那釋放我們，使我們脫離這罪律的，乃是這生命之靈的律。不是神，也不是那靈，乃是這律，在我們裏面運行，救我們脫離肉體中罪律的運行，並使我們認識神，得著神，而將祂活出。這生命之靈的律，是生命之靈的自然能力，只要情形符合這律的要求，這自然的律就會自動運行。（見4註3。）","不論撒但還是神，在進入並住在我們裏面以後，其運行都不是藉著外面客觀的活動，乃是藉著裏面主觀的律。生命之靈的律的運行，就是經過過程的三一神，在我們靈裏的運行，也就是這三一神在祂生命中，在我們裏面的工作。"]],["4",["住在我們靈裏經過過程的三一神，作生命之靈的律，主要的功用乃是在各方面釋放我們，使我們脫離撒但，就是那住在我們墮落性情裏罪與死的律。（七23～25。）這釋放不僅是為著我們主觀的稱義，更是為著我們在性質上的聖別。"]],["5",["有些古卷作，你，使你…。"]],["6",["罪的律，就是在人裏面自生自發的犯罪能力，叫人作罪的奴僕，（約八34，）不能自主，被罪轄制，受罪捉弄，作許多自己所不願意的。死的律，就是叫人衰弱、枯萎、老死的自然能力，住在人裏面，叫人的各部分都沉沒在死衰中。死一面叫人失去能力，一面又叫人失去感覺，叫人為善無能力，犯罪無感覺。"]]]},"創22:5":{"t":"亞伯拉罕對他的僕人說，你們和驢在這裏等著，我與童子往那裏去敬拜，然後回到你們這裏來。","n":[]},"創22:6":{"t":"亞伯拉罕把燔祭的柴放在他兒子以撒身上，自己手裏拿著火與刀；於是二人同行。","n":[]},"創22:7":{"t":"以撒對他父親亞伯拉罕說，父親哪。亞伯拉罕說，我兒，我在這裏。以撒說，請看，火與柴都有了，但燔祭的羊羔在那裏？","n":[]},"創22:8":{"t":"亞伯拉罕說，我兒，神必自己豫備作燔祭的羊羔。於是二人同行。","n":[]},"創22:9":{"t":"他們到了神所指示的地方，亞伯拉罕在那裏築壇，把柴擺好，就捆綁他的兒子以撒，放在壇的柴上。","n":[]},"創22:10":{"t":"亞伯拉罕伸手拿刀，要殺他的兒子。","n":[]},"提後2:1":{"t":"所以，我的孩子，你要在基督耶穌裏的¹恩典上得著²加力，","n":[["1",["見一9註2。"]],["2",["使徒親身經歷了生命中恩典的加力。（一9～12。）現今他勸勉提摩太，要在同樣的恩典上得著加力。"]]]},"加2:21":{"t":"我不廢棄¹神的恩；因為²義若是藉著律法得的，基督就是³白白死了。","n":[["1",["神的恩就是基督，三一神的具體化身，藉著賜生命的靈，將神的生命分賜到我們裏面。不憑這靈活著，就是廢棄神的恩。"]],["2",["基督為我們死，使我們在祂裏面得著義，藉此我們就得著神的生命。（羅五18，21。）這義不是藉著律法，乃是藉著基督的死得著的。"]],["3",["或，無緣無故的。義若是藉著律法得的，基督就是無緣無故的死了。但，義乃是藉著基督的死得的，並且基督的死已經將我們從律法分別出來。"]]]},"加5:4":{"t":"你們這要靠律法得稱義的，是¹與基督隔絕，²從恩典中墜落了。","n":[["1",["即從基督貶為無有，從基督喪失一切的益處，因而與祂隔絕，（達祕新譯本，）使祂變為無效。回到律法，就是與基督分開，與基督隔絕。"]],["2",["與基督隔絕，就是從恩典中墜落。這含示我們信徒所在的恩典，就是基督。"]]]},"創16:16":{"t":"夏甲給亞伯蘭生以實瑪利的時候，亞伯蘭年八十六歲。","n":[]},"約15:4":{"t":"你們要住在我裏面，我也住在你們裏面。枝子若不住在葡萄樹上，¹自己就不能結果子，你們若不住在我裏面，也是這樣。","n":[["1",["直譯，從自己。"]]]},"約15:5":{"t":"我是葡萄樹，你們是枝子；住在我裏面的，我也住在他裏面，這人就多結果子；因為離了我，你們就不能作甚麼。","n":[]},"西2:18":{"t":"不可讓人憑故意¹卑微，並敬拜天使，²所作反對你們的判斷，騙取你們的獎賞；這等人³留戀於所⁴見過的，隨著自己肉體的心思，徒然自高自大，","n":[["1",["敬拜天使之異端的教師，教導聖徒表示卑微，看見自己不配直接敬拜神。他們在這樣故意卑微和敬拜天使的元素和範圍裏，騙取聖徒在基督裏的獎賞。"]],["2",["所作反對你們的判斷，騙取你們的獎賞，或，斷定你們不配。異端的教師斷定聖徒不配直接敬拜神，必須經由天使作中保纔能進到神前。這就騙取了聖徒的獎賞，叫他們不能享受基督。基督是我們惟一的中保，我們在祂裏面就能直接敬拜神。"]],["3",["或，窺察，探究（隱密之事）。"]],["4",["異端的教師是在眼見的範圍裏，與12節的信心相對。他們喜歡看見奇特的事。這樣堅持眼見的經歷，就產生肉體的驕傲，隨著肉體的心思，徒然自高自大。"]]]},"來13:9":{"t":"你們不要被¹各樣怪異的教訓帶入歧途，因為心²靠恩典得堅固，不靠祭物作³食物，纔是好的；那靠祭物作食物而行的，從來沒有得著益處。","n":[["1",["各樣怪異的教訓，總是為撒但利用，在召會中引起分爭，甚至分裂。因此使徒囑咐人不可教導不同的事。（提前一3。）這各樣怪異的教訓，必是當時熱中猶太教者所教導的。作者警告希伯來的信徒，不要被他們的教訓帶入歧途，離開新約之下的召會生活。"]],["2",["在當時，靠恩典得堅固，就是留在新約裏，享受基督作恩典，（加五4，）不被帶入歧途回到猶太教，有分於他們宗教的禮儀，喫他們的食物（祭物）。"]],["3",["這裏的食物與恩典相對，指舊約禮儀規條中的食物，（九10，西二16，）就是熱中猶太教者想用以將希伯來的信徒帶入歧途，以致不能享受恩典，就是不能在新約裏有分於基督的。"]]]},"路8:8":{"t":"但有別的落在好土裏，生長起來，結實百倍。耶穌說了這些話，就大聲說，有耳可聽的，就應當聽。","n":[]},"路8:11":{"t":"這比喻乃是這樣：種子就是神的道。","n":[]},"路8:15":{"t":"但那落在好土裏的，就是人用美好善良的心聽了道，便持守住，並且忍耐著結實。","n":[]},"弗1:7":{"t":"我們在這蒙愛者裏面，藉著祂的血，照著神恩典的豐富，得蒙¹救贖，就是²過犯得以赦免，","n":[["1",["我們是蒙揀選並豫定的。但在受造之後，我們墮落了。因此，我們需要救贖，就是神在基督裏，藉著祂的血為我們成就的。這是神賜給我們的另一項福分。"]],["2",["我們的過犯得以赦免，是藉著基督的血所成就的救贖。沒有流血，就沒有赦罪。（來九22。）救贖是基督為我們的過犯所成就的，赦免是將基督所成就的，應用在我們的過犯上。"]]]},"創25:11":{"t":"亞伯拉罕死了以後，神¹賜福給他的兒子以撒。以撒靠近庇耳拉海萊居住。","n":[["1",["舊約的祝福相當於新約的恩典。（見弗一3註7。）神賜給我們白白的恩賜，乃是祂的祝福。當神在基督裏白白的恩賜作到我們裏面，成為我們裏面的生命元素時，這恩賜就成了恩典。見羅五2註3。"]]]},"創21:25":{"t":"從前，亞比米勒的僕人霸佔了一口¹水井，亞伯拉罕為這事指責亞比米勒。","n":[["1",["以撒的井豫表基督這賜生命的靈，（林前十五45，林後三6，17，）祂是活水的源頭，作神子民神聖的供應。（約四14，七37～39，林前十二13，啟二二17。）以撒生活的源頭，使他成為叫神滿足的燔祭，並將他帶到摩利亞山；（二二2；）這山至終成為錫安山，就是耶路撒冷建造神殿的地方。（代下三1。）最終，正確的生活源頭使我們成為以撒，並將我們帶到新耶路撒冷。（加四26～28。）"]]]},"創21:33":{"t":"亞伯拉罕在別是巴栽了一棵¹垂絲柳樹，又在那裏呼求耶和華²永遠之神的名。","n":[["1",["垂絲柳樹有細長的枝條，葉子很細，描繪生命之豐富的湧流，就是經歷生命樹的結果。（二9～10，參約七37～38。）因此，垂絲柳樹表徵被人經歷並得著彰顯的生命樹。"]],["2",["希伯來文， El　Olam， 伊勒俄拉姆。伊勒，意，大能者，乃是神的名字之一。俄拉姆，意，永遠的或永遠，原文字根意，隱藏、遮藏。伊勒俄拉姆這神聖的稱呼，含示永遠的生命。（參約一1，4。）因此，亞伯拉罕藉著呼求耶和華這永遠大能者的名，就經歷神是永活、隱密、奧祕的一位，祂就是永遠的生命。"]]]},"創26:5":{"t":"都因亞伯拉罕聽從我的話，遵守我的吩咐、命令、律例、法度。","n":[]},"加3:14":{"t":"為叫¹亞伯拉罕的福，在基督耶穌裏可以臨到外邦人，使我們藉著信，可以²接受³所應許的那⁴靈。","n":[["1",["指神為著地上的萬國，應許給亞伯拉罕的福。（創十二3。）這應許已經成就了，這福已經在基督裏，藉十字架的救贖臨到了萬國。"]],["2",["在福音裏，我們不僅接受赦罪、洗淨和潔淨的福，更接受那最大的福，就是三一神，父、子、靈，成為經過過程，包羅萬有賜生命的靈，極其主觀的住在我們裏面作我們的享受。我們能享受這包羅萬有者作我們每天的分，這是何等的福！"]],["3",["直譯，那靈的應許。"]],["4",["本節指明，那靈就是神為著萬國所應許亞伯拉罕的福，也是信徒藉著相信基督所接受的。那靈，就是5註2所說複合的靈，實際上就是神自己在祂神聖的三一裏，經過成為肉體、釘十字架、復活、升天並降下的過程，給我們接受，作我們的生命和一切。這是神福音的中心。","神應許亞伯拉罕物質方面的福乃是美地，（創十二7，十三15，十七8，二六3～4，）作包羅萬有之基督的豫表。（見西一12與註3。）因著基督至終實化為包羅萬有賜生命的靈，（林前十五45，林後三17，）這應許之靈的福，就與應許亞伯拉罕之地的福相符。實際上，這靈作基督在我們經歷中的實化，就是美地，作神全備供應的源頭，給我們享受。"]]]},"加3:16":{"t":"¹應許原是向亞伯拉罕和他後裔說的。並不是說，和眾後裔，像是指著許多人，乃是說，“和你那後裔，”指著一個人，就是²基督。","n":[["1",["原文，複數。"]],["2",["基督是那後裔，後裔乃是承受應許的後嗣。在這裏，基督是承受應許的惟一後裔。因此，我們要承受那應許的福，就必須與基督是一；在祂以外，我們無法承受神所賜給亞伯拉罕的應許。在神眼中，亞伯拉罕只有一個後裔，就是基督。我們必須在祂裏面，纔能有分於神所賜給亞伯拉罕的應許。基督不僅是那承受應許的後裔，也是神所應許給人承受的福。加拉太信徒若從基督轉回到律法，就要喪失這位後嗣，以及神所應許的產業。"]]]},"加3:29":{"t":"你們既屬於基督，就是¹亞伯拉罕的後裔，是照著²應許為後嗣了。","n":[["1",["亞伯拉罕的後裔只有一位，就是基督。（16。）因此，要成為亞伯拉罕的後裔，我們就必須屬於基督，成為基督的一部分。因我們與基督是一，我們就也是亞伯拉罕的後裔，是照著應許為後嗣，承受神所應許的福，就是那包羅萬有的靈，祂是經過過程之三一神終極的完成，作了我們的分。在新約之下作神選民的信徒，是成年的兒子，乃是這樣的後嗣，不在律法之下，乃在基督裏。猶太教徒仍然留在律法之下，將自己與基督隔絕，乃像以實瑪利，（四23，）是亞伯拉罕按著肉體的後裔，不像以撒，（四28，）是藉著應許的後嗣。但在基督裏的信徒，乃是這樣的後嗣，承受所應許的福。因此，我們該留在基督裏，而不轉向律法。","律法既不能賜我們生命，（21，）就不能產生神的兒子；但本於信所接受，（2，）並賜我們生命的那靈，（林後三6，）能產生神的兒子。律法把神的選民保守在它的監護下，直等信仰來到。（23。）在基督這包羅萬有賜生命之靈裏的信，使神的選民照著神的應許，成為亞伯拉罕的後裔，如同“天上的星。”（創二二17。）"]],["2",["本章啟示神照祂永遠的定旨賜給亞伯拉罕應許。在這應許成就以先，律法被賜下作神選民的監護人。隨後，在豫定的時候，基督這應許的後裔來成就應許，並帶進所應許的福。這就是恩典。因此，恩典與基督同來，並帶著應許的成就而來。這一切都是在神那一面。在我們這一面，就需要一條路，好領略、體認並享受基督這後裔的一切所是和所完成的。因此，有神那一面的恩典，也有我們這一面的信。現今，既有恩典、信、以及那成就了應許的後裔，就不再需要律法作監護人。因此，我們該把律法擺在一邊，轉離這監護人，而與基督在一起，使我們藉著留在恩典和信裏，享受所應許的福。這福一點不差，就是經過過程的三一神這包羅萬有賜生命的靈。"]]]},"林前15:45":{"t":"經上也是這樣記著：“首先的人亞當成了活的¹魂；”末後的亞當成了賜生命的¹靈。","n":[["1",["亞當藉著受造，成了活的魂，有屬魂的身體。基督藉著復活，成了賜生命的靈，有屬靈的身體。亞當是活的魂，乃是天然的；基督是賜生命的靈，乃是復活的。首先，在成為肉體裏，基督為著救贖成了肉體；（約一14，29；）然後，在復活裏，祂為著分賜生命（約十10下）成了賜生命的靈。祂藉著成為肉體，有屬魂的身體，和亞當一樣；祂藉著復活，有屬靈的身體。祂屬魂的身體，藉著復活已成了屬靈的身體。祂現今在復活裏，乃是賜生命的靈，帶著屬靈的身體，豫備好了給信祂的人接受。我們一信入祂，祂就進到我們的靈裏，我們就聯於祂這賜生命的靈。因此，我們與祂成為一靈。（六17。）我們的靈被點活，並與祂一同復活。至終，我們現今屬魂的身體，也要在復活裏成為屬靈的身體，正如祂的身體一樣。（52～54，腓三21。）"]]]},"約12:24":{"t":"我實實在在的告訴你們，一粒麥子不¹落在地裏死了，仍舊是一粒；若是死了，就結出²許多子粒來。","n":[["1",["按屬世的看法，這時耶穌正處於祂的黃金時期。因著拉撒路復活，許多猶太人對主極為尊崇，熱烈歡迎，（12～19，）甚至希利尼人也來求見。（20～22。）但祂寧願像一粒麥子，落在地裏死了，好為著召會結出許多子粒來。"]],["2",["這許多子粒成了基督在復活裏的擴增，這擴增就是基督經過死而復活所進入的榮耀。（路二四26。）從本章23節到十七章末了，乃是詳論這榮耀的奧祕。基督原是與神同有榮耀。（十七5。）祂成為肉體，使祂神聖的榮耀都遮藏在祂的肉體裏。藉著祂的死與復活，祂這榮耀就得著釋放，產生許多子粒，成為祂的擴增，彰顯祂的榮耀。23、28，十三31～32，十四13，十五8，十六14和十七1、4、5、10、22、24所說的，都與這榮耀有關。這榮耀在祂末後對門徒所說十四至十六章的話裏，有三個具體的團體彰顯，就是十四2所說父的家（召會），十五1～5所說葡萄樹的枝子（基督身體的組成成分），和十六21所說一個新生的團體人（新人）。這三者都是指召會，說明召會乃是榮耀的基督經過死與復活所產生的榮耀擴增。在這榮耀的擴增裏，神子基督得著榮耀，叫父神在祂的得榮裏也得著榮耀，就是藉著召會，得著豐滿的彰顯。（弗三19～21。）這需要在三一神裏的一來維持。所以，主在十七章結束的禱告，特別為此祈求。（十七20～23。）基督這榮耀的擴增，乃是約翰福音奧祕啟示的高峰，其終極完成是約翰所寫啟示錄中的新耶路撒冷。那新的聖城是基督歷代擴增的集大成，基督那神聖的榮耀，要在其中彰顯得完滿盡致；父神在子神的得榮中，也要得著永遠無比的榮耀，成為祂在永世裏豐滿的彰顯，完成祂永遠的經綸，直到永永遠遠。"]]]},"賽53:10":{"t":"耶和華卻喜悅將祂壓傷，使祂受痛苦。祂使¹自己成了²為著罪的祭，祂必看見³後裔，並且⁴延長年日；耶和華所⁵喜悅的事，必在祂手中亨通。","n":[["1",["直譯，祂的魂。下節者同。"]],["2",["基督自願成了為著罪的祭，這是指為著全部的罪—為著過錯、錯誤、罪愆、過犯、惡行和罪孽—的祭，（約一29，）包括贖罪祭（利四）和贖愆祭。（利五。）"]],["3",["10下～11節是指在復活裏的基督。這裏的後裔是團體的後裔，就是召會作基督的身體，由基督作那一粒麥子而死，並藉著祂繁增的復活所產生的許多子粒，就是所有的信徒所組成的。（約十二24，彼前一3。）基督作耶和華的僕人，乃是復活的賜生命者，就是賜生命的靈，（林前十五45，林後三6，17，）產生了一個後裔，以建造祂的身體作祂的延續，使耶和華喜悅，並使基督得滿足。"]],["4",["今天基督乃是藉著活在祂的信徒裏而延長祂的年日。（加二20，見徒二八9註1。）祂的信徒作祂的身體，就是祂的延長。"]],["5",["神的喜悅（弗一5，9，腓二13）乃是要看見許多兒子，由祂而生，成為基督的肢體，構成召會作基督的身體，就是基督團體的彰顯。這完全在於基督的死與復活。"]]]},"創1:26":{"t":"神說，¹我們要按著我們的²形像，照著我們的²樣式造³人，使⁴他們⁵管理海裏的魚、空中的鳥、地上的牲畜、和全地、並地上所爬的一切⁶爬物。","n":[["1",["“我們要…”啟示，神格的三者之間，為著人的創造，舉行了會議。在已過的永遠，三一神決定要創造人，這指明人的創造乃是為著三一神永遠的定旨。（弗三9～11。）神造人的心意是要完成祂神聖的經綸，將祂自己分賜到人裏面。（提前一4與註4一段。）這在聖經以後各卷書中完全揭示出來。"]],["2",["神的形像，指神裏面的所是，是神屬性內裏素質的彰顯，這些屬性最顯著的是愛、（約壹四8、）光、（約壹一5、）聖、（啟四8、）義。（耶二三6。）神的樣式，指神的形狀，（腓二6，）乃是神身位之素質與性質的彰顯。因此，神的形像和神的樣式不當視為兩個分開的東西。人內裏的美德受造於人的靈裏，乃是神屬性的翻版，也是人彰顯神屬性的憑藉。人外面的形狀受造為人的身體，乃是神形狀的翻版。因此，神造人成為祂自己的複本，使人有盛裝神並彰顯神的性能。其他一切活物都是“各從其類”造的，（11～12，21，24～25，）人卻是從神類造的。（參徒十七28～29上。）既然神與人同類，人就有可能與神聯合，而在生機的聯結裏與祂同活。（約十五5，羅六5，十一17～24，林前六17。）","子基督是神的具體化身，（西二9，）是那不能看見之神的像，是神屬性之素質的彰顯。（西一15，林後四4，來一3。）人是照著基督創造的，目的是要基督進到人裏面，並藉著人得彰顯。（西一27，腓一20～21上。）受造的人是活的器皿，容器，以盛裝基督。（羅九21，23，林後四7。）至終，基督成為肉體，穿上人性，成為人的樣式，（腓二6～8，）好叫人藉著祂的死與復活，可以得著神永遠、神聖的生命，（彼前一3，約壹五11～12，）並且在裏面憑這生命得以變化，並模成基督的形像，（林後三18，羅八29，）在外面得以改變形狀，同形於基督榮耀的身體，（腓三21，）使人與基督一樣一式，（約壹三2下，）與基督一同向著宇宙彰顯神。（弗三21。）","受造的人雖然是神的複本，有神的形像和樣式，但還沒有神的實際和神的生命。因此，人還需要藉著喫生命樹，接受神作人的生命，使人得著神的實際而彰顯神。（二9與註2。）"]],["3",["或，人類；希伯來文，adam，亞當。下節者同。人的生命是最高的受造生命，這生命有神的形像和樣式，可以彰顯神，並能為神執掌管治權。亞當，頭一個人，豫表基督（羅五14，林前十五45，47，詩八4～8，來二6～9）是神創造的中心，（西一16～17，）是一切受造之物和眾人的元首，（西一15，林前十一3，）在神的形像和樣式上是神的彰顯，（來一3，林後四4，西一15，）也是神的代表，管理神一切的造物。（詩八6～8，太二八18。）"]],["4",["這裏和27～28節的代名詞“他們，”以及五2“他們的，”指明亞當是一個團體人，集體人，包括全人類。神沒有創造許多人；祂在一個人亞當裏面，集體的創造了人類。神按著祂的形像並照著祂的樣式造了這樣一個團體人，使人類能團體的彰顯神。"]],["5",["神創造了一個團體人，不僅有祂的形像以彰顯祂，也運用祂的管治權管理萬有以代表祂。神給人管治權，目的是：(一)征服神的仇敵，那背叛神的撒但；(二)恢復被撒但所篡竊的地；以及(三)運用神管理地的權柄，使神的國得以臨到地上，神的旨意得以行在地上，神的榮耀得以顯在地上。（太六10，13下。）","神的目的是要人有祂的形像彰顯祂，有祂的管治權代表祂，這不是在亞當這頭一個人（林前十五45上）—舊人（羅六6）—身上得著完成，乃是在基督這第二個人（林前十五47下與註2）—新人（弗二15與註8）—身上得著完成。這新人是由基督自己作頭，以及召會作祂的身體（弗一22～23，林前十二12與註2，西三10～11與11註9）所組成的。這要完全在得勝的信徒身上得著完成，他們活基督，作祂團體的彰顯，（腓一19～26，）並要得著權柄制伏列國，在千年國裏與基督一同作王。（啟二26～27，二十4，6。）這要終極完成於新耶路撒冷，彰顯神的形像，有祂的榮耀和祂顯出的樣子，（啟四3上，二一11，18上，）並且運用神的神聖權柄，維持神對全宇宙的管治權，直到永遠。（啟二一24，二二5。）"]],["6",["豫表那蛇撒但，（三1，14，啟十二9，）和他的使者，（太二五41，啟十二4上，7下，）以及跟隨撒但的鬼。（參路十19。）見啟四6註2一段。"]]]},"可4:26":{"t":"耶穌又說，¹神的國是這樣，如同²人把³種子撒在地上，","n":[["1",["神的國乃是召會的實際，藉著福音，由基督復活的生命所產生；（林前四15；）重生是其入門，（約三5，）而信徒裏面神生命的長大是其發展。（彼後一3～11。）見一15註1。"]],["2",["指奴僕救主作撒種的人。見3註1。"]],["3",["撒在奴僕救主之信徒裏面那神聖生命的種子，（約壹三9，彼前一23，）指明神的國（奴僕救主福音的結果和目標），以及今世的召會，（羅十四17，）都是生命，就是神生命的事。這生命發芽、長大、結果、成熟並產生收成。神的國和召會，都不是人的智慧和能力所產生無生命的組織。使徒在林前三6～9，以及啟十四4、15～16的話，證實這點。"]]]},"但2:34":{"t":"你觀看，見有一塊非人手鑿出來的¹石頭，²打在這像半鐵半泥的腳上，把腳²砸碎。","n":[["1",["大人像的定命乃是被一塊非人手鑿出來的石頭砸碎。（34～35上，44下～45。）這石頭就是基督。基督藉著釘十字架被治死，而為神所鑿；（亞三9，徒二23；）並且祂在復活裏，（徒二24，）被鑿成一塊具有三方面講究的石頭：為著建造召會，乃是基石和房角石；（賽二八16，太二一42；）對不信的猶太人，乃是絆腳的石頭；（賽八14，太二一44上，羅九33；）以及為著毀滅人類政權的總和，乃是砸人的石頭。（太二一44下。）","當基督這砸人的石頭來臨時，祂不是單獨的來，乃是同著祂的得勝者（祂的新婦，祂的擴增）作為祂的軍隊而來。（約三29～30，啟十七14，十九7～8，11，14。）在召會時代，就是奧祕時代，基督正在建造召會作祂的新婦。（弗五25～29。）基督降臨地上以前，將有一次婚禮，祂要迎娶得勝者，（啟十九7～9，）就是那些多年與神的仇敵爭戰，且已經勝過那惡者的人。（參啟十二11。）婚禮之後，祂這作丈夫的要與祂新娶的新婦同來，毀滅敵基督；這敵基督同他的軍隊將要直接與神爭戰。（啟十七14，十九19。）"]],["2",["當基督作為神所鑿的石頭顯現時，祂同祂的得勝者—團體的基督—要擊打十王和敵基督，（啟十九11～21，）把大人像從腳趾到頭砸得粉碎。（35。）這將是基督對那從敵基督回溯到寧錄之人類政權的集大成，包羅一切的審判，因而結束地上舊造裏人類政權的時代，並引進神在千年國，以及永世新天新地裏掌管全地的時代。"]]]},"但2:35":{"t":"於是鐵、泥、銅、銀、金，¹都一同砸得粉碎，成如夏天禾場上的糠秕，被風吹散，無處可尋。打碎這像的石頭，變成一座大²山，充滿全地。","n":[["1",["這表徵從寧錄到敵基督之整個人類政權的完全毀滅。"]],["2",["這裏的大山表徵神永遠的國，要永遠充滿全地。（44，七13～14。）團體的基督—基督同祂得勝的新婦—來砸碎人類政權的集大成以後，要變成一座大山，充滿全地，使全地成為神的國。因此，大人像要被地上神永遠的國所頂替。（啟十一15～17。）","石頭擴增成為大山，表徵基督的擴增。（參約三29～30。）召會是基督在生命上的擴增，而神永遠的國乃是基督在行政上的擴增。（可四26～29。）因此，基督不僅是召會，也是神的國。（林前十二12，路十七21。）基督作為石頭，乃是神行動的中心；祂作為山，乃是普及。因此，基督是包羅萬有者，就是那在萬有中充滿萬有者。（弗一23。）"]]]},"弗2:10":{"t":"我們原是神的¹傑作，在基督耶穌裏，為著神²早先豫備好，要我們行在其中的善良事工³創造的。","n":[["1",["原文意，作好的東西，手工，或寫成的詩章。不僅詩詞作品，凡是表達製作者智慧和設計的藝術品，都是詩章。我們─召會─是神工作的傑作，也是一首詩章，彰顯神無窮的智慧和神聖的設計。","神創造的諸天、地和人，不是神的傑作，但召會，基督的身體，那在萬有中充滿萬有者的豐滿，（一23，）團體和宇宙的新人，（15，）乃是這樣的傑作。我們為此已經靠著恩典得救，叫我們行在神早先豫備好的善良事工中。"]],["2",["神創造我們，要我們行的善良事工，不是我們一般觀念中的善事，乃是神所豫先計畫，豫先命定，叫我們行在其中的確定善工。這些善良事工必是指實行祂的旨意，過召會生活，並作耶穌的見證，如本書以下各章所啟示的。"]],["3",["我們，召會，是神工作的傑作，乃是宇宙中全新的東西，是神的新發明。我們藉著重生，在基督裏為神所創造，成為祂的新造。（林後五17。）"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
