<title>亞伯拉罕、以撒、雅各的神 第三週</title>

<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一","items":[{"lv":1,"label":"壹、","text":"撒拉和夏甲是亞伯拉罕的妻和妾，寓指兩個約，就是應許的約與律法的約—創十六1～3，加四24：","refs":[{"label":"創16:1-3","keys":["創16:1","創16:2","創16:3"]},{"label":"加4:24","keys":["加4:24"]}]},{"lv":2,"label":"一、","text":"自主的婦人撒拉，表徵應許的約，這與新約—恩典的約—相關聯—加四23～24，創十二7，十五7～21：","refs":[{"label":"加4:23-24","keys":["加4:23","加4:24"]},{"label":"創12:7","keys":["創12:7"]},{"label":"創15:7-21","keys":["創15:7","創15:8","創15:9","創15:10","創15:11","創15:12","創15:13","創15:14","創15:15","創15:16","創15:17","創15:18","創15:19","創15:20","創15:21"]}]},{"lv":3,"label":"1.","text":"在那約中神應許要給亞伯拉罕後裔，沒有一點意思要亞伯拉罕作任何事來得到；神要把一些東西作到他裏面，使他能生出一個後裔來完成神的定旨；這就是恩典—4節。","refs":[{"label":"創15:4","keys":["創15:4"]}]},{"lv":3,"label":"2.","text":"撒拉是自主的婦人，是亞伯拉罕正式的妻子，是這恩典之約的象徵；她生出以撒乃是憑神的恩典。","refs":[]},{"lv":3,"label":"3.","text":"恩典之應許的產品是以撒，他是完成神定旨的後裔—十七19，二一12下。","refs":[{"label":"創17:19","keys":["創17:19"]},{"label":"創21:12","keys":["創21:12"]}]}]},{"day":"週二","items":[{"lv":2,"label":"二、","text":"使女夏甲，表徵律法的約—加四24～25：","refs":[{"label":"加4:24-25","keys":["加4:24","加4:25"]}]},{"lv":3,"label":"1.","text":"亞伯拉罕的妾夏甲，乃是律法的象徵；由此我們可以看到，律法的地位乃是妾的地位—創十六1～3。","refs":[{"label":"創16:1-3","keys":["創16:1","創16:2","創16:3"]}]},{"lv":3,"label":"2.","text":"夏甲所象徵的律法之約，將神的選民帶到律法的奴役、轄制之下，作了律法之下的奴僕，與神的恩典隔絕了—加四25，五1、4。","refs":[{"label":"加4:25","keys":["加4:25"]},{"label":"加5:1","keys":["加5:1"]},{"label":"加5:4","keys":["加5:4"]}]},{"lv":3,"label":"3.","text":"亞伯拉罕藉夏甲生以實瑪利，象徵人想用自己肉體的努力與律法配合，以完成神的定旨—創十六4、15～16，加二16，四23上。","refs":[{"label":"創16:4","keys":["創16:4"]},{"label":"創16:15-16","keys":["創16:15","創16:16"]},{"label":"加2:16","keys":["加2:16"]},{"label":"加4:23","keys":["加4:23"]}]},{"lv":3,"label":"4.","text":"亞伯拉罕靠着他肉體的努力，不憑神的恩典，從夏甲生了以實瑪利；所以，以實瑪利乃是人照着律法，靠肉體努力的結果，爲神所棄絕—創十七18～19，二一10，加四30。","refs":[{"label":"創17:18-19","keys":["創17:18","創17:19"]},{"label":"創21:10","keys":["創21:10"]},{"label":"加4:30","keys":["加4:30"]}]}]},{"day":"週三","items":[{"lv":2,"label":"三、","text":"應許是在創世記十二章二節、七節，十三章十五至十七節，十五章四至五節給的；約是在十五章七至二十一節立的：","refs":[{"label":"創12:2","keys":["創12:2"]},{"label":"創12:7","keys":["創12:7"]},{"label":"創13:15-17","keys":["創13:15","創13:16","創13:17"]},{"label":"創15:4-5","keys":["創15:4","創15:5"]},{"label":"創15:7-21","keys":["創15:7","創15:8","創15:9","創15:10","創15:11","創15:12","創15:13","創15:14","創15:15","創15:16","創15:17","創15:18","創15:19","創15:20","創15:21"]}]},{"lv":3,"label":"1.","text":"按照神的心意，應許的約是在律法的約以先；神並沒有意思要帶進律法，要人努力遵守來完成祂的定旨。","refs":[]},{"lv":3,"label":"2.","text":"神原初的心意乃是要將祂自己作到人裏面，藉着人來完成祂的定旨—4節。","refs":[{"label":"創15:4","keys":["創15:4"]}]}]},{"day":"週四","items":[{"lv":2,"label":"四、","text":"在十五章七至二十一節神與亞伯拉罕立的約，在十七章一至十四節用割禮得了堅立：","refs":[{"label":"創15:7-21","keys":["創15:7","創15:8","創15:9","創15:10","創15:11","創15:12","創15:13","創15:14","創15:15","創15:16","創15:17","創15:18","創15:19","創15:20","創15:21"]},{"label":"創17:1-14","keys":["創17:1","創17:2","創17:3","創17:4","創17:5","創17:6","創17:7","創17:8","創17:9","創17:10","創17:11","創17:12","創17:13","創17:14"]}]},{"lv":3,"label":"1.","text":"在一節，神向亞伯拉罕啓示祂自己爲全豐全足的神；作爲全豐全足的大能者，祂是恩典的源頭，用祂神聖所是的豐富供應祂所呼召的人，使他們能產生基督作後裔，以完成神的定旨。","refs":[{"label":"創17:1","keys":["創17:1"]}]},{"lv":3,"label":"2.","text":"在十六章，亞伯拉罕運用他的肉體生了以實瑪利；在十七章，神要亞伯拉罕割除他的肉體，了結他天然的力量，使神可以進來藉着祂的恩典產生以撒。","refs":[]},{"lv":3,"label":"3.","text":"割禮的屬靈意義乃是藉着基督的釘十字架，脫去肉體，脫去己和舊人—西二11、13上，腓三3：","refs":[{"label":"西2:11","keys":["西2:11"]},{"label":"西2:13","keys":["西2:13"]},{"label":"腓3:3","keys":["腓3:3"]}]},{"lv":4,"label":"a.","text":"屬靈的割禮乃是不斷的將基督的死應用於我們的肉體—加五24，羅八13。","refs":[{"label":"加5:24","keys":["加5:24"]},{"label":"羅8:13","keys":["羅8:13"]}]},{"lv":4,"label":"b.","text":"割禮對付那想要憑着自己行神旨意並完成神應許的肉體；割禮的意義是割去肉體的自信—腓三3。","refs":[{"label":"腓3:3","keys":["腓3:3"]}]},{"lv":3,"label":"4.","text":"藉割禮堅立約，與完成神定旨的後裔和地有關—創十七2～8：","refs":[{"label":"創17:2-8","keys":["創17:2","創17:3","創17:4","創17:5","創17:6","創17:7","創17:8"]}]},{"lv":4,"label":"a.","text":"為了完成神要人彰顯並代表祂的永遠定旨，我們需要得着基督作我們的後裔和地，爲此我們需要受割禮，並過釘十字架的生活—加五24，六14。","refs":[{"label":"加5:24","keys":["加5:24"]},{"label":"加6:14","keys":["加6:14"]}]},{"lv":4,"label":"b.","text":"當肉體、己和舊人被了結，門就開了，讓神進來而生出以撒—創十八10、14，二一1～3。","refs":[{"label":"創18:10","keys":["創18:10"]},{"label":"創18:14","keys":["創18:14"]},{"label":"創21:1-3","keys":["創21:1","創21:2","創21:3"]}]}]},{"day":"週五","items":[{"lv":1,"label":"貳、","text":"我們需要在創世記亞伯拉罕之經歷的光中，來看加拉太四章二十一至三十一節：","refs":[{"label":"加4:21-31","keys":["加4:21","加4:22","加4:23","加4:24","加4:25","加4:26","加4:27","加4:28","加4:29","加4:30","加4:31"]}]},{"lv":2,"label":"一、","text":"保羅在這些經文裏告訴我們，夏甲表徵律法，由屬地的耶路撒冷所象徵；撒拉表徵恩典，由屬天的耶路撒冷所象徵—25～26節。","refs":[{"label":"加4:25-26","keys":["加4:25","加4:26"]}]},{"lv":2,"label":"二、","text":"夏甲和撒拉代表兩約—律法的約與恩典的約；律法是人的勞苦加上人的能力以產生一些東西，而恩典是將神賜給祂所揀選的人，好產生許多兒子—三26，四6。","refs":[{"label":"加3:26","keys":["加3:26"]},{"label":"加4:6","keys":["加4:6"]}]},{"lv":2,"label":"三、","text":"神與亞伯拉罕所立起初的約，乃是恩典的約：","refs":[]},{"lv":3,"label":"1.","text":"在這約裏，不需要人的能力或努力，只需要神的恩典以產生許多兒子—三29。","refs":[{"label":"加3:29","keys":["加3:29"]}]},{"lv":3,"label":"2.","text":"這約等於新約；這就是說，神與亞伯拉罕所立的約，實際上就是新約—加三8，來八7～8。","refs":[{"label":"加3:8","keys":["加3:8"]},{"label":"來8:7-8","keys":["來8:7","來8:8"]}]},{"lv":4,"label":"a.","text":"新約乃是神與亞伯拉罕所立之約的繼續—創十五7～21。","refs":[{"label":"創15:7-21","keys":["創15:7","創15:8","創15:9","創15:10","創15:11","創15:12","創15:13","創15:14","創15:15","創15:16","創15:17","創15:18","創15:19","創15:20","創15:21"]}]},{"lv":4,"label":"b.","text":"新約就是神與亞伯拉罕所立那恩典之約完全的延續，這約乃是要產生眾子；藉這約所產生眾子當中的頭一位，乃是亞伯拉罕自己—加三26，四6，來二10。","refs":[{"label":"加3:26","keys":["加3:26"]},{"label":"加4:6","keys":["加4:6"]},{"label":"來2:10","keys":["來2:10"]}]},{"lv":2,"label":"四、","text":"這兩約所生的兩種兒女，性質是不同的—加四24、28～31：","refs":[{"label":"加4:24","keys":["加4:24"]},{"label":"加4:28-31","keys":["加4:28","加4:29","加4:30","加4:31"]}]},{"lv":3,"label":"1.","text":"由律法之約生的，是按着肉體生的；由應許之約生的，是按着靈生的—29節。","refs":[{"label":"加4:29","keys":["加4:29"]}]},{"lv":3,"label":"2.","text":"按着肉體生的兒女，沒有權利有分於神所應許的福；按着靈生的兒女，卻有完全的權利—30～31節。","refs":[{"label":"加4:30-31","keys":["加4:30","加4:31"]}]},{"lv":3,"label":"3.","text":"因着我們有恩典、基督與賜生命的靈，所以我們是按着靈所生的兒女—六18，西一27，林前十五45下：","refs":[{"label":"加6:18","keys":["加6:18"]},{"label":"西1:27","keys":["西1:27"]},{"label":"林前15:45","keys":["林前15:45"]}]},{"lv":4,"label":"a.","text":"這靈現今在我們的靈裏，使我們成爲按着靈所生的兒女；這就是加拉太三章與四章裏奇妙的啓示。","refs":[]},{"lv":4,"label":"b.","text":"我們這些按着靈所生的兒女，應當停留在神心願的實現裏，享受恩典、基督、以及那包羅萬有的靈作爲福音的福—三14。","refs":[{"label":"加3:14","keys":["加3:14"]}]}]},{"day":"週六","items":[{"lv":2,"label":"五、","text":"加拉太四章啓示，信徒的母就是在上的耶路撒冷，新耶路撒冷，乃是撒拉所象徵恩典的新約—26節：","refs":[{"label":"加4:26","keys":["加4:26"]}]},{"lv":3,"label":"1.","text":"新耶路撒冷，屬天的耶路撒冷，在上的耶路撒冷，是我們的母，這母乃是恩典的新約—來八7～13，十二22～23：","refs":[{"label":"來8:7-13","keys":["來8:7","來8:8","來8:9","來8:10","來8:11","來8:12","來8:13"]},{"label":"來12:22-23","keys":["來12:22","來12:23"]}]},{"lv":4,"label":"a.","text":"新約是我們的母，因爲她生出我們作自由的兒女—加四31。","refs":[{"label":"加4:31","keys":["加4:31"]}]},{"lv":4,"label":"b.","text":"我們已經生在新約之下，那在上的耶路撒冷乃是我們的母—加四26。","refs":[{"label":"加4:26","keys":["加4:26"]}]},{"lv":4,"label":"c.","text":"這婦人是新約並我們的母，我們的母乃是神的恩典。","refs":[]},{"lv":3,"label":"2.","text":"父是賜恩者；恩典就是約；約又是城，就是那在上的耶路撒冷，新耶路撒冷，她是我們的母；母所產生的眾子，乃是母的組成成分；母歸回於父，與父成爲一，乃是由父而出，然後歸回於父這目的地—加一3，林前八6。","refs":[{"label":"加1:3","keys":["加1:3"]},{"label":"林前8:6","keys":["林前8:6"]}]},{"lv":3,"label":"3.","text":"接受並遵守新約，就是來到屬天的耶路撒冷和召會這裏；新約、屬天的耶路撒冷和召會乃是一—來八7～13，十二22～23。","refs":[{"label":"來8:7-13","keys":["來8:7","來8:8","來8:9","來8:10","來8:11","來8:12","來8:13"]},{"label":"來12:22-23","keys":["來12:22","來12:23"]}]},{"lv":3,"label":"4.","text":"信徒的母，乃是亞伯拉罕所等候的城—十一10：","refs":[{"label":"來11:10","keys":["來11:10"]}]},{"lv":4,"label":"a.","text":"十二章二十二節指明這座城是甚麼，這節告訴我們，我們乃是來到屬天的耶路撒冷，就是基督的妻並新約信徒的母這裏，這母是由神的眾子所組成，而眾子乃是由她而生。","refs":[{"label":"來12:22","keys":["來12:22"]}]},{"lv":4,"label":"b.","text":"神揀選亞伯拉罕，目的乃是要完成祂的經綸，就是要產生許多的兒子，由恩典而生，以構成新耶路撒冷，就是祂終極並永遠的團體彰顯—啓二一1～2、7。","refs":[{"label":"啟21:1-2","keys":["啟21:1","啟21:2"]},{"label":"啟21:7","keys":["啟21:7"]}]}]}],"days":[{"day":"週一","feed":{"verses":[["加四22～24","『因爲律法上記着，亞伯拉罕有兩個兒子，一個是出於使女，一個是出於自主的婦人。然而那出於使女的，是按着肉體生的；那出於自主婦人的，是藉着應許生的。這些都是寓意：兩個婦人就是兩約…。』"]],"paras":["自主的婦人撒拉，表徵應許的約。（加四23。）神與亞伯拉罕所立應許的約乃是恩典的約。在那約中神應許要給亞伯拉罕後裔，沒有一點意思要亞伯拉罕作任何事來得到。神要把一些東西作到他裏面，使他能生出一個後裔來完成神的定旨。這是神所作的，不是亞伯拉罕所作的。這就是恩典。撒拉是自主的婦人，是亞伯拉罕正式的妻子，是這恩典之約的象徵。她生以撒不是憑人的力量，而是憑神的恩典。（創世記生命讀經，七五二頁。）"]},"read":{"paras":["恩典之應許的產品是以撒，他是完成神定旨的後裔。（創十七19，二一12下。）完成神定旨的後裔，一點不差就是基督自己，爲神作到我們裏面，經過我們，又從我們出來。神所作到我們裏面的，帶進那作後裔的基督。（加三16。）這後裔至終變成了我們的地。…在裏面，我們有基督作生命，我們憑這生命活着；在外面，我們有基督作地，我們在其中活着。這就是召會生活連同基督作我們的生命。這是我們完成神定旨惟一的路。（創世記生命讀經，七五九頁。）","如果我們要得着基督來承受產業，來爲神站在地上，那我們就不能把自己帶進來，我們自己不能動，我們自己不能作，我們自己不能發起，我們自己必須放在一邊。這是最大的試驗，也是最難受的試驗。這是神的僕人們最容易失敗的一點。我們必須記得，在神的工作上，不只不可以犯罪，並且憑着自己去作好也是不可以的。神的問題不只是作得怎麼樣，神的問題更是誰在那裏作。…但願我們被神帶到一個地步，能對主說，『主，我要遵行你的旨意！是你自己在我裏面使我遵行你的旨意，不是我自己在這裏遵行你的旨意！是你，不是我！』","我們必須記得：『耶和華說，我的意念並非你們的意念，你們的道路並非我的道路。天怎樣高過地，照樣我的道路高過你們的道路，我的意念高過你們的意念。』（賽五五8～9。）因此，憑着我們自己所作的，卽使從我們看來是不錯的，也不能滿足祂的心。…只有祂自己作的，纔能滿足祂的心。雖然祂降卑祂自己，竟然肯使用我們，但是我們要記得，我們不過是被使用的僕人，我們不過是祂手裏的器皿，我們不能代替祂去作甚麼。我們只能讓神藉着我們去作，我們不能憑着我們自己去作。不錯。後來以撒還是亞伯拉罕生的，但是以撒是神應許的兒子，是神使亞伯拉罕生的兒子，是神藉着他生的兒子。應許的原則和以實瑪利的原則是完全不同的。但願神憐憫我們，拯救我們脫離以實瑪利的原則。","亞伯拉罕是一個信徒，他打算尋求神的喜歡，他打算達到神的目的。神要他生兒子，他就想方法生兒子，這豈不是遵行神的旨意、討神的喜歡麼？這一個難道還錯麼？但是，保羅說，『那出於使女的，是按着肉體生的。』〔加四23。〕我們是應當遵行神的旨意，但是，問題是誰來遵行神的旨意。如果是憑我們自己遵行神的旨意，結果就生出以實瑪利來。亞伯拉罕所以錯，不是他的目的錯，乃是他的源頭錯了。他的目的是要神的應許得着成功，但是，錯在他用自己的力量去作這件事。（倪柝聲文集第二輯第十五册，七二至七五頁。）"],"ref":"亞伯拉罕以撒雅各的神，第四章；真理課程三級卷一，第六課。"}},{"day":"週二","feed":{"verses":[["加四25","『這夏甲就是在亞拉伯的西乃山，相當於現在的耶路撒冷，因耶路撒冷同她的兒女都是作奴僕的。』"],["加五1","『基督釋放了我們，叫我們得以自由；所以要站立得住，不要再受奴役的軛挾制。』"]],"paras":["律法的地位像妾的地位，在神的經綸中沒有合法的地位。恩典像撒拉，生子得兒子的名分；而律法像夏甲，生子爲奴。加拉太四章二十四節說，『出於西乃山，生子爲奴，乃是夏甲。』西乃山卽頒佈律法之地；（出十九20，二四12；）夏甲所象徵的律法之約，將神的選民帶到律法的轄制之下，作了律法之下的奴僕，與神的恩典隔絕了。（眞理課程三級卷一，六五頁。）"]},"read":{"paras":["當人忽畧了神的恩典，他就想努力作點甚麼來討神的喜悅，這就帶進了律法；亞伯拉罕非正式的妻子，使女夏甲，乃是律法之約的象徵。…凡她所生的不能留在神的經綸中。這表徵律法不應該進來，而且律法的產品，在完成神定旨的事上沒有地位。夏甲生出以實瑪利，是靠人的努力，不是靠神的恩典；以實瑪利乃是神所棄絕的。人藉着律法而勞苦的產品，在完成神定旨的事上無分無關。","按照神的經綸，一個男人只該有一個妻子。因此，撒拉建議亞伯拉罕從夏甲得後裔，絕對違反神的經綸。夏甲不是正式的妻子，只是妾。…恩典是正式的妻子，是正確的後嗣之母；（加四26，28，31；）律法是妾，她的後代不被接納爲後嗣。按照古代習俗，男人娶妾主要是因妻子不能生孩子。這很有意思。當恩典還未工作，你卻急促，你就會與妾聯合，就是與律法聯合。…恩典是正式的妻子，律法是妾。","我們得救之後，就開始知道神要我們過一種像基督的生活，屬天的生活，得勝的生活，常常討神喜悅並榮耀神的生活。是的，神的確要我們過這樣的生活，但神要把基督作到我們裏面，替我們過這種屬天的生活，來討神的喜悅，並榮耀神。然而我們都是注意神的心願，卻忽畧了恩典。神的心意是要我們爲着神的榮耀，過屬天的生活，而恩典是神要把基督作到我們裏面，來完成祂的定旨。所以首先我們依賴羅得，就是我們從天然背景中所帶出來的，想要用他來完成神的定旨，爲神的榮耀過屬天的生活。當神不允許我們依賴羅得時，我們就轉向以利以謝，指望他能使我們爲神的榮耀過屬天的生活。但至終神告訴我們：『我不要那個，我不要任何客觀的東西，我是要從你這個人裏面出來主觀的東西。』我們一旦知道神要這個，就開始運用自己的力量，天然的能力，來完成神的定旨。…我們也許沒有摩西所賜的律法，但我們卻有很多自己制定的律法。我們都是頒賜律法者，爲自己制定律法。","也許你說，你絕不再向丈夫發脾氣，或者對他態度不好。這是你的第一條誡命。你的第二條誡命是：你旣是個基督徒女士，基督徒妻子，你就需要親切、甘甜且謙卑。你的第三條誡命是絕不批評別人。第四條是常常愛人，絕不恨人。這些自定的律法就是我們的夏甲。我們能否遵守我們的律法，在神看都沒有兩樣，因爲在祂看來，我們就是能守住，也不算數。（創世記生命讀經，七五二至七五五頁。）"],"ref":"創世記生命讀經，第四十六篇。"}},{"day":"週三","feed":{"verses":[["加五4","『你們這要靠律法得稱義的，是與基督隔絕，從恩典中墜落了。』"],["加四30","『…「把使女和她兒子趕出去，因爲使女的兒子，絕不可與自主婦人的兒子一同承受產業。」』"]],"paras":["神給亞伯拉罕應許是在創世記十二章二節、七節，十三章十五至十七節，十五章四至五節；並且神與亞伯拉罕立約是在十五章七至二十一節。按照神的心意，應許的約在先。神並沒有意思要帶進律法，要人努力遵守來完成祂的定旨。神原初的心意乃是要將祂自己作到人裏面，藉着人來完成祂的定旨。","新約告訴我們，人得救之後需要傳福音並結果子。…是的，你可以用夏甲得人，但所得來的是甚麼樣的人？他們不是以撒，乃是以實瑪利。按照新約，正確的結果子並傳福音乃是憑着裏面生命的湧流，憑着神把基督作到我們裏面，經過我們，再從我們出去。這意思就是，正確的傳福音乃是憑着基督作我們的恩典。（創世記生命讀經，七五三、七五六頁。）"]},"read":{"paras":["只要我們還有力量產生以實瑪利，神就不能作甚麼。以實瑪利產生以後，神要離開一段時間。當亞伯拉罕九十九歲的時候，照他的想法，自己如同已死。〔羅四19。〕…羅馬四章也指出，撒拉的生育已經斷絕。亞伯拉罕和撒拉都深信他們已經完了，自己不能再作甚麼了。就在那時，神來了。","所有復興佈道家都鼓動人，叫人爲基督活着，爲基督工作。但我們的職事卻告訴人停止憑自己過基督徒生活，停止用屬世的方法作基督徒工作。…若有人停下來，不憑自己過基督徒的生活，或者不靠屬世的方法爲主作工，他就有福了。要停下你基督徒生活中自己的努力，並基督徒工作上天然的熱心，是不容易的。…願意停下來的人有福了，因爲你一停下，神就來了。…我們人天然的生命一結束，神的生命就開始。","亞伯拉罕八十六歲的時候，他自己的力量仍舊太大，使神又等了十三年。…你禱告求神來作些甚麼，神卻盼望你停下自己。…當亞伯拉罕在地上忙碌的時候，神也許看着他說，『可憐的亞伯拉罕，你不必這麼忙碌。你可不可以停下，讓我來？…』神等候直到亞伯拉罕如同死人，失去了功能。然後祂來到，並且能說，『現在是我的開始，現在是我開始作一點事的時候了。』","肉體努力的產品是以實瑪利，以實瑪利是神所棄絕的。（創十七18～19，二一10～12上，加四30。）以實瑪利不但是神棄絕的，也是阻撓神顯現的。我們今天的經歷告訴我們同樣的事。我們的以實瑪利打斷了我們與神的交通，並使我們無法經歷神的顯現。由此可見，問題不在於我們的所作或所是，完全在於我們有沒有神的同在。…我們必須忘記我們的行爲和工作，而顧到神的顯出。當我們有神的顯出，我們就是在恩典中，在恩典的約中。但今天大多數的基督徒只顧到他們的行爲和工作，而不顧到神的顯出和同在。他們也許生出許多以實瑪利，卻沒有神的同在。我們所需要的是神的同在。我們所需要的不是我們外面的工作所得外面的果子，而是我們的神在裏面的顯現。你裏面有神的同在麼？這是最重要的試驗。（創世記生命讀經，七五七至七五九頁。）"],"ref":"創世記生命讀經，第四十六篇；真理課程三級卷一，第六課。"}},{"day":"週四","feed":{"verses":[["西二11","『你們在祂裏面也受了非人手所行的割禮，乃是在基督的割禮裏，脫去了肉體的身體。』"],["腓三3","『眞受割禮的，乃是我們這憑神的靈事奉，在基督耶穌裏誇口，不信靠肉體的。』"]],"paras":["神向亞伯拉罕啓示祂的名是伊勒沙代，就是全豐全足的大能者，要作恩典豐富供應的源頭，以信守祂的約，完成祂的旨意，並再次與〔亞伯拉罕〕立約。（創十七1～2，4。）在這次的約中，神用割禮來作立約的證據，以堅定祂給亞伯拉罕應許的約。這給我們看見，神賜給祂選民美地的應許，雖然已經立爲祂賜給祂選民的約，但還需要割禮的約來堅定神應許的約。割禮是神的選民承受神的應許所必須經過的手續，豫表神新約中的選民必須經過十字架的對付，纔能承受並得享神所應許在基督裏的一切豐富。（眞理課程三級卷一，六八頁。）"]},"read":{"paras":["在新約裏，我們可以看到割禮的意義。割禮的屬靈意義就是脫去肉體，脫去己和舊人。〔參西二11～12。〕…嚴格說來，割禮與對付罪無關；割禮乃是與基督一同釘十字架，並一同埋葬。割禮的意思就是了結你的己，了結你的肉體。在創世記十六章亞伯拉罕用他的肉體，但在十七章這裏，神要他割去肉體。在十六章他用天然的力量，但在十七章他的力量必須被了結。這就是受割禮。","只要我們天然的力量還在，神就很難進來作我們的一切，來完成祂的定旨。神要進到我們裏面作我們的一切，但我們的肉體、我們天然的人和力量、我們的舊人、我們老舊的己，阻撓神來作我們的一切。這個己，這個舊人，必須被了結，必須受割禮，也就是必須釘十字架。我要告訴你們好消息，我們的舊人已經釘了十字架。（羅六6。）…我們都必須看見這事實，算定這事實，並且憑信接受這事實。我們能憑信宣告，我們的肉體，我們天然的人及其力量，已經釘了十字架。『我已經與基督同釘十字架；現在活着的，不再是我，乃是基督在我裏面活着。』（加二20。）舊人，己，已經釘了十字架；我們都需要憑這認識活着。我們若宣告這事實，並照着這事實生活，復活的神就立刻有路進到我們裏面，作我們的一切，以完成祂的經綸。","藉割禮堅立約，與完成神定旨的後裔和地有關。（創十七2～8。）…爲了得着基督作我們的後裔和地，以完成神的定旨，我們需要受割禮，並過釘十字架的生活。…當肉體、己和舊人被了結，門就開了，讓神進來而生出以撒。","所有不受割禮的人都與這約隔絕。在創世記十七章十四節神對亞伯拉罕說，『但不受割禮的男子必從民中剪除，因他背了我的約。』今天這也是真實的。我們若不過釘十字架的生活，我們便與基督，與召會生活，並與神聖乳房的供應隔絕。甚麼時候我們不願受割禮，在完成神永遠的定旨上，我們就了了。今天我們享受神，憑基督活着，實行召會生活，全在於一件事，就是受割禮，過釘十字架的生活。（創世記生命讀經，七七二至七七五頁。）"],"ref":"創世記生命讀經，第四十七篇；亞伯拉罕以撒雅各的神，第五章。"}},{"day":"週五","feed":{"verses":[["加三8","『並且聖經旣豫先看明，神要本於信稱外邦人爲義，就豫先傳福音給亞伯拉罕，說，「萬國都必因你得福。」』"],["加26","『因爲你們眾人藉着相信基督耶穌，都是神的兒子。』"]],"paras":["神產生許多兒子的目標，不是藉着人的工作而成就的，乃是憑着神的恩典纔得以完成。…按照新約裏神聖的啓示，恩典實際上就是神將祂自己給了祂的選民，作他們的享受，這享受要使他們成爲神的眾子。","在約翰一章，我們看見話，就是神，成了肉體，（1，14，）並且恩典隨着祂而來。（17。）這意思就是祂作恩典而來。…凡信入祂並接受祂的，要從祂所生，成爲神的兒女。〔12～13。〕因此，神藉着把自己作爲恩典，賜給祂所揀選的人，就產生了許多兒子。（新約總論第八册，一三六至一三七頁。）"]},"read":{"paras":["在創世記十五章，神應許亞伯拉罕必會有後嗣，亞伯拉罕也相信神。然而，就在下一章，因着亞伯拉罕沒有從撒拉得孩子，他就聽從撒拉的建議，從她的使女夏甲得孩子。夏甲生了一個兒子，起名叫以實瑪利。亞伯拉罕從夏甲得的孩子，神並不喜悅，祂就十三年之久不再向亞伯拉罕顯現。當耶和華再次向亞伯拉罕顯現時，…〔祂〕向亞伯拉罕指明，祂的恩典要使亞伯拉罕產生一個兒子；〔參十七1～2；〕但亞伯拉罕憑着自己所作的，卻是出於肉體，他這樣作就被神定罪。…耶和華對亞伯拉罕說，『你妻子撒拉必給你生一個兒子，你要給他起名叫以撒。我要與他堅定所立的約，作他後裔永遠的約。』（19。）","在十八章，耶和華再次向亞伯拉罕顯現，對他說，『在生命的時候，（原文，）我必回到你這裏；你的妻子撒拉必生一個兒子。』（10上。）這指明以撒的出生是出於耶和華的來臨。這好比馬利亞的生出耶穌，乃是三一神的來臨。至終，撒拉真的生出了以撒。（二一1～3。）","產生以撒完全是件神恩典的事，就是將神自己賜給祂的選民，以產生祂許多的兒子。反之，以實瑪利不過是憑着亞伯拉罕天然的能力與力量產生的。…保羅在〔加拉太四章〕告訴我們，夏甲表徵律法，由屬地的耶路撒冷所象徵；撒拉表徵恩典，由屬天的耶路撒冷所象徵。…律法是人的勞苦加上人的能力以產生一些東西；而恩典是將神賜給祂所揀選的人，好產生許多兒子。","神與亞伯拉罕所立起初的約，乃是恩典的約，在這約裏，不需要人的能力或努力，只需要神的恩典以產生許多兒子。這約等於新約。…所有亞伯拉罕的真後裔，就如以撒、雅各、摩西和大衞，都在這約之下，今天我們也在這約之下。…律法的約雖然是藉着摩西賜的，摩西自己卻不在那約之下。反之，在神眼中，摩西乃是在恩典的約之下。律法的約不能爲神產生任何東西，這約只能產生『以實瑪利』。…新約就是神與亞伯拉罕所立那恩典之約完全的延續，這約乃是要產生眾子。藉這約所產生眾子中的頭一位，乃是亞伯拉罕自己。亞伯拉罕是一切相信之人的父，（羅四11，）…其他在舊約裏的兒子，包括雅各、大衞和耶利米等，但不包括以掃。（新約總論第八册，一三八至一四○頁。）"],"ref":"新約總論，第二百五十四篇；加拉太書生命讀經，第二十四篇。"}},{"day":"週六","feed":{"verses":[["加四26","『但那在上的耶路撒冷是自主的，她是我們的母。』"],["來十二22～23","『但你們乃是來到錫安山，來到活神的城，屬天的耶路撒冷，…來到…眾長子的召會…。』"]],"paras":["加拉太四章二十六至二十八節和三十一節，啓示新耶路撒冷是信徒的母。這位母親就是在上的耶路撒冷，屬天的耶路撒冷。…新耶路撒冷，屬天的耶路撒冷，在上的耶路撒冷，是我們的母親，這位母親乃是恩典的新約。新約是我們的母，因爲她生出我們作自由的兒女。（新約總論第八册，一四三頁。）"]},"read":{"paras":["撒拉表徵在上的耶路撒冷，也表徵新約。這指明新耶路撒冷就是新約。…一面，新耶路撒冷是新約；另一面，新約產生新耶路撒冷。這是主對亞伯拉罕所應許的，也是亞伯拉罕所仰望並等候的。","在加拉太四章那是我們之母的婦人，就是新約。我們已經生在新約之下，而那在上的耶路撒冷乃是我們的母。這婦人是新約並我們的母，我們的母乃是神的恩典。在希伯來十二章，我們乃是來到由我們信徒所組成的召會。…我們與召會是一。在加拉太四章，新耶路撒冷作我們的母，原則是一樣的。這婦人是眾子，眾子也就是母。此外，這母是恩典，恩典也就是母，因爲我們都已經從恩典並藉着恩典而生。這母也是新約，並且新約就是母。最終，新約還是聖城，那在上的耶路撒冷。","至終，這母，就是在上的耶路撒冷，乃與父是一。父是賜恩者；恩典就是約；約又是城，就是那在上的耶路撒冷，她是我們的母；母所產生的眾子，乃是母的組成成分；母歸回於父，與父成爲一，乃是由父而出，然後歸回於父這目的地。","接受並遵守新約，就是來到屬天的耶路撒冷和召會這裏。（來八7～13，十二22～23。）新約、屬天的耶路撒冷、和召會乃是一。要領會這點，我們必須看見加拉太書和希伯來書之間的連結。加拉太書對付猶太教，警告信徒不要退回到猶太教，乃要留在恩典裏。希伯來書囑咐我們不要漂回到舊約，乃要留在新約裏。希伯來七至十章論到更美之約，就是新約。八章指明舊約過去了，新約已經進來取而代之。然後在十二章保羅告訴我們，我們已經來到錫安山，來到活神的城，來到召會。（22～23。）","信徒的母，乃是亞伯拉罕所仰望的城。『他等候那座有根基的城，其設計者並建築者乃是神。』（十一10。）希伯來十二章二十二節指明這座城是甚麼，這節告訴我們，我們乃是來到屬天的耶路撒冷，就是基督的妻並新約信徒的母這裏，這母是由神的眾子所組成，而眾子乃是由她而生。因此，亞伯拉罕所等候並我們所來到的城，乃是基督的妻。","神揀選亞伯拉罕作新族類的父，與新耶路撒冷並我們對她的領會相關聯。神揀選亞伯拉罕，目的不僅是要將墮落的人類恢復到起初神創造人的情形裏；反之，神揀選亞伯拉罕，目的乃是要完成祂的經綸。…神揀選亞伯拉罕，目的不是要將人恢復到在神創造裏人起初的情形，乃是要產生許多的兒子。神在亞伯拉罕身上所作的一切，從頭一步到末了一步，都是按照這原則。（新約總論第八册，一四一至一四二、一四四、一三四、一三六頁。）"],"ref":"新約總論，第二百五十五篇。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第三週、兩個婦人的寓意","reading":"創十六1～十七14，加四21～31","readingRefs":[{"label":"創16:1-17:14","link":"創16:1","count":30,"chapters":2,"from":"16:1"},{"label":"加4:21-31","keys":["加4:21","加4:22","加4:23","加4:24","加4:25","加4:26","加4:27","加4:28","加4:29","加4:30","加4:31"]}]},"verses":{"加4:21":{"t":"¹你們這願意²在律法以下的，請告訴我，你們豈沒有聽過³律法麼？","n":[["1",["在21～31節有兩個婦人，夏甲和撒拉；兩個耶路撒冷，地上的和天上的；兩個約，屬律法的和屬應許的；以及兩個兒子，按著肉體的和按著靈的。使徒要加拉太人知道，他們是那在上之耶路撒冷的兒女，自主婦人的兒女，並且要他們取用應許的約，照著靈享受包羅萬有的那靈作福音的福。（三14。）在這段裏，自主的婦人撒拉象徵應許的約；這也是那在上的耶路撒冷，我們的母所象徵的；母親是恩典的表號，我們是藉著恩典，生為那是恩典源頭之神的兒女。因此，自主的婦人、應許的約、在上的耶路撒冷、以及母親，都是指神的恩典；這恩典乃是我們屬靈出生的憑藉。那些受猶太教打岔的加拉太人，是從這恩典─基督─墜落的。（五4。）"]],["2",["本書厲害的對付在律法以下對基督的偏離。這樣的偏離，使信徒不能享受基督作他們的生命和一切。"]],["3",["根據以下的經文，這裏的律法包括創世記。整本舊約稱為律法和申言者，（太二二40，）第一部分是律法，第二部分是申言者。"]]]},"加4:22":{"t":"因為律法上記著，亞伯拉罕有兩個兒子，一個是出於使女，一個是出於自主的婦人。","n":[]},"加4:23":{"t":"然而那出於使女的，是¹按著肉體生的；那出於自主婦人的，是¹藉著應許生的。","n":[["1",["按著肉體，是靠著人肉體的努力；藉著應許，意即在神的應許所含示之恩典裏，藉著神的能力。以實瑪利是按著肉體生的，以撒卻是藉著應許生的。"]]]},"加4:24":{"t":"這些都是寓意：¹兩個婦人就是²兩約，一個是出於³西乃山，生子⁴為奴，乃是⁵夏甲。","n":[["1",["指22節的兩個婦人。"]],["2",["一個是給亞伯拉罕的應許之約，這與新約，恩典之約相關聯；另一個是給摩西的律法之約，這與新約完全無關。撒拉是自主的婦人，象徵應許之約；夏甲是使女，象徵律法之約。"]],["3",["降律法之地。（出十九20，二四12。）"]],["4",["在律法之下為奴。"]],["5",["亞伯拉罕的妾夏甲，表徵律法。因此，律法的地位像妾的地位。亞伯拉罕的妻子撒拉，象徵神的恩典，（約一17，）在神的經綸中有合法的地位。律法像夏甲，生子為奴，如猶太教徒；恩典像撒拉，生子得兒子的名分，這些是新約的信徒。他們不再在律法之下，乃在恩典之下。（羅六14。）他們該站在這恩典中，（羅五2，）不從其中墜落。（五4。）"]]]},"加4:25":{"t":"這夏甲就是在亞拉伯的西乃山，相當於現在的¹耶路撒冷，因耶路撒冷同她的兒女都是²作奴僕的。","n":[["1",["耶路撒冷是神所揀選的，（王上十四21，詩四八2，8，）應當屬於撒拉所象徵的應許之約。然而，因她將神的選民帶到律法的轄制之下，所以相當於西乃山，屬於夏甲所象徵的律法之約。"]],["2",["直譯，作奴僕服事。指律法之下的奴僕。在使徒時代，耶路撒冷同她的兒女都是律法之下的奴僕。"]]]},"加4:26":{"t":"但那¹在上的耶路撒冷是自主的，她是我們的母，","n":[["1",["這至終將是在新天新地中的新耶路撒冷，（啟二一1～2，）與應許之約相關聯。她是新約信徒之母，這些信徒不是律法之下的奴僕，乃是恩典之下的兒子。我們新約的信徒，都是從上頭由她生的，也都要在新天新地中的新耶路撒冷裏。"]]]},"加4:27":{"t":"因為經上記著：“那不生育，沒有生產過的，你要快樂；那未曾經過產難的，你要放聲呼喊，因為¹獨居的，比有丈夫的兒女²更多。”","n":[["1",["如無夫之婦，所以是獨居的。"]],["2",["這指明亞伯拉罕屬靈的子孫，比他天然的子孫更多。他屬靈的子孫屬於天上的耶路撒冷，屬於在恩典自由下的應許之約；他天然的子孫屬於地上的耶路撒冷，屬於在律法奴役下的律法之約。"]]]},"加4:28":{"t":"弟兄們，你們乃是藉著¹應許生的兒女，像以撒一樣。","n":[["1",["藉著應許生的兒女，就是在應許之約下，藉著恩典，由天上的耶路撒冷所生的兒女。"]]]},"加4:29":{"t":"只是，當時那¹按著肉體生的，怎樣²逼迫了那¹按著³靈生的，現在⁴也是這樣。","n":[["1",["這兩約所生的兩種兒女，性質是不同的。由律法之約生的，是按著肉體生的；由應許之約生的，是按著靈生的。按著肉體生的兒女，沒有權利有分於神所應許的福；按著靈生的兒女，卻有完全的權利。猶太教徒是前一種兒女，在基督裏的信徒是後一種。關於肉體和靈，見三3註2，五19註1，22註1。"]],["2",["指以實瑪利逼迫以撒。（創二一9。）"]],["3",["藉著應許生的兒女（28）是按著靈，就是按著神生命之靈生的；這靈就是神所應許給亞伯拉罕的福。（三14。）"]],["4",["猶太教徒，亞伯拉罕按著肉體生的子孫，也逼迫信徒，就是亞伯拉罕按著靈生的子孫，正如以實瑪利逼迫以撒一樣。"]]]},"加4:30":{"t":"然而經上是怎麼說的？“把使女和她兒子趕出去，因為¹使女的兒子，絕不可與²自主婦人的兒子一同承受產業。”","n":[["1",["在律法奴役下的猶太教徒，是使女的兒子，絕不可承受神所應許的福，就是那作三一神終極表現，包羅萬有的靈。"]],["2",["在恩典自由下的新約信徒，是自主婦人的兒子，要承受所應許那靈的福。"]]]},"加4:31":{"t":"所以，弟兄們，我們¹不是使女的兒女，乃是自主婦人的兒女了。","n":[["1",["我們在基督裏的信徒，不是在律法奴役下律法的兒女，乃是在恩典自由下恩典的兒女，享受包羅萬有的靈，連同基督一切的豐富。"]]]},"創16:1":{"t":"亞伯蘭的妻子¹撒萊沒有給他生兒女。撒萊有一個使女，名叫¹夏甲，是埃及人。","n":[["1",["撒拉和夏甲是寓意，象徵兩約。（加四22～28，24註2與註5。）"]]]},"創16:2":{"t":"撒萊對亞伯蘭說，耶和華使我不能生育，求你和我的使女同房，或者我可以因她¹得孩子。亞伯蘭聽了撒萊的話。","n":[["1",["直譯，得建立。"]]]},"創16:3":{"t":"於是亞伯蘭的妻子撒萊，將使女埃及人夏甲給了她丈夫為妻；那時亞伯蘭在迦南地已經住了十年。","n":[]},"創12:7":{"t":"耶和華¹向亞伯蘭顯現，說，我要把這²地賜給你³的²後裔。亞伯蘭就在那裏為向他顯現的耶和華築了一座壇。","n":[["1",["這是神第二次向亞伯拉罕顯現。神在這裏再次顯現，乃是向亞伯拉罕證實，亞伯拉罕已答應神的呼召，並到達神要他去的地方。神的再次顯現，也加強亞伯拉罕憑信而活，（來十一8～10，）向人類在巴別所發展之無神生活作相反的見證。"]],["2",["後裔和地二者都豫表基督，祂是神永遠經綸的中心和普及。見十五3註1。","基督，成為肉體的神，乃是三重的後裔：女人的後裔、（三15，賽七14，加四4、）亞伯拉罕的後裔、（十二7，太一1，加三16、）和大衛的後裔。（撒下七12～14，太一1，二二42～45，羅一3，啟二二16。）基督作為女人的後裔，也就是馬利亞的後裔，（太一16，）完成了救贖，毀壞古蛇撒但，並拯救在基督裏的信徒脫離罪和死。（來二14，太一20～21，林前十五53～57。）基督作為亞伯拉罕的後裔，成了包羅萬有賜生命的靈，（林前十五45，林後三17，）使在基督裏作亞伯拉罕後裔（加三29）的信徒，得以承受終極完成的靈，就是經過過程之三一神的終極完成，作他們神聖的產業，他們屬靈的福，直到永遠。（徒二六18，弗一14上，加三14。）基督作為大衛的後裔，將祂的信徒帶進國度，使他們在復活裏，在神永遠的國裏有分於祂的王權。（提後二12，啟二十4，6，二二5下。）基督作為三重後裔的啟示，就是完滿福音的內容。"]],["3",["這是亞伯拉罕所築的第一座壇。壇是為著敬拜神，將我們一切所是並所有，為著神的定旨獻給神。亞伯拉罕築壇是受神再次顯現的激勵，這可視為對巴別塔的建造所作相反的見證。"]]]},"創15:7":{"t":"耶和華又對他說，我是耶和華，曾領你出了迦勒底的吾珥，為要將這地賜你為業。","n":[]},"創15:8":{"t":"亞伯蘭說，主耶和華阿，¹我怎能知道必得這地為業呢？","n":[["1",["亞伯拉罕信神關於後裔的應許，（6，）但他缺乏信心信神關於地的應許。為了加強亞伯拉罕的信心，神被迫與亞伯拉罕立約，以堅定祂對亞伯拉罕關於地的應許。（9～21。）神立定這約的特別方式，含示亞伯拉罕能完成神永遠定旨的路。","神與亞伯拉罕所立的約，乃是應許的約，要藉著神在祂恩典中的大能得著成就，而不是藉著亞伯拉罕在他肉體裏的努力。新約是這約的延續。（加三17與註1，四22～26與24註2。）"]]]},"創15:9":{"t":"祂說，你為我取一隻三歲的¹母牛、一隻三歲的母山羊、一隻三歲的公綿羊、一隻斑鳩、一隻雛鴿。","n":[["1",["神藉著釘十字架並復活的基督，與亞伯拉罕立約。這裏三種被殺的牲畜，表徵基督在祂的人性裏為我們釘十字架，兩隻活鳥表徵基督在祂的神性裏，是活著、復活的一位。（約十一25，啟一18。）基督在祂的人性裏被殺，但在祂的神性裏活著。（約十四19，彼前三18與註3。）","母牛是作平安祭，（利三1，）母山羊是作贖罪祭，（利四28，五6，）公綿羊是作燔祭。（利一10。）這些祭牲都是三歲，表徵基督是在復活裏被獻給神並釘十字架。（約二19，十一25，來九14。）","在豫表上，斑鳩表徵受苦的生活，雛鴿表徵相信的生活，信心的生活。這是主在地上生活的兩個特徵。二是見證的數字，（太十八16，林後十三1，）所以兩隻活鳥乃是為基督作見證，見證基督是復活的一位，活在我們裏面，並為我們活著。（約十四19～20，加二20。）","五是負責任的數字。（見太二五2註1。）因此，三隻牲畜和兩隻鳥共五項，這事實表徵基督作為釘十字架並活著的一位，如今為著完成神永遠的定旨，擔負一切的責任。"]]]},"創15:10":{"t":"亞伯蘭就¹取了這些來，每樣從中剖開，分成兩半，一半對著一半的擺列，只有鳥沒有剖開。","n":[["1",["神要亞伯拉罕將牲畜和鳥獻給祂，含示亞伯拉罕必須與他所獻的一切東西聯合為一。（見三21註2，利一4註1。）這指明我們要完成神永遠的定旨，就必須在基督的釘十字架裏釘死，也在基督的復活裏復活。（羅六5，8，加二20。）惟有如此，我們纔能在作為應許之地的基督裏面實行召會生活。"]]]},"創15:11":{"t":"有¹鷙鳥下來，落在死畜的肉上，亞伯蘭就把牠們嚇飛了。","n":[["1",["鷙鳥來喫這些祭牲，表徵撒但和他的使者來使基督對召會生活變為無效。（加五2，4。）"]]]},"創15:12":{"t":"日頭正落的時候，亞伯蘭沉沉的睡了；忽然有驚人的大黑暗落在他身上。","n":[]},"創15:13":{"t":"耶和華對亞伯蘭說，你要確實知道，你的後裔必寄居別人的地，又服事那地的人；那地的人要¹苦待他們²四百年。","n":[["1",["神豫言亞伯拉罕的後裔要在埃及寄居、受奴役並受苦，這確證亞伯拉罕必定會得著兒子，後裔，（4，）也確證神在祂的信實裏必定守住祂在十二7和十三14～17的應許，將尼羅河到幼發拉底河的地賜給他的後裔。（18與註。）"]],["2",["見加三17註2。"]]]},"創15:14":{"t":"但他們所要服事的那國，我要懲罰，後來他們必帶著許多財物從那裏出來。","n":[]},"創15:15":{"t":"至於你，你要享大壽數，被人埋葬，平平安安的歸到你列祖那裏。","n":[]},"創15:16":{"t":"到了第四代，他們必回到此地，因為亞摩利人的罪孽還沒有滿盈。","n":[]},"創15:17":{"t":"日落天黑，不料有冒煙的¹爐並燒著的¹火把，從那些肉塊中經過。","n":[["1",["爐是為著煉淨，火把是為著光照。神與亞伯拉罕立約，在黑夜裏如同冒煙的爐並燒著的火把，從祭牲中經過。這表徵神所呼召的人遭受苦難時，祂要進來煉淨並光照他們，使他們藉著後裔和地完成祂的定旨。"]]]},"創15:18":{"t":"當那日，耶和華與亞伯蘭立約，說，我已賜給你的後裔，從¹埃及河直到伯拉大河之地，","n":[["1",["神在與亞伯拉罕所立的約中，定了美地的界限；這地乃是以馬內利之地，（賽八8，）以色列的領土，從尼羅河到幼發拉底河。（參出二三31，申十一24，書一3～4。）這是亞伯拉罕獨一的後裔基督，（十二7上，加三16，）為著建立千年國所要承受的地。見申十一24註1與太二五34註1。"]]]},"創15:19":{"t":"就是基尼人、基尼洗人、甲摩尼人、","n":[]},"創15:20":{"t":"赫人、比利洗人、¹利乏音人、","n":[["1",["是巨人族。（申三11。）"]]]},"創15:21":{"t":"亞摩利人、迦南人、革迦撒人、耶布斯人之地。","n":[]},"創15:4":{"t":"但耶和華的話臨到他說，這人必不成為你的後嗣；你¹本身將要生的，纔是你的後嗣。","n":[["1",["本身，直譯，自己內裏的部分。完成神定旨所需要的後裔，不能是亞伯拉罕所已經擁有的（以利以謝—2，）也不能是他從自己所產生的（以實瑪利—十六15。）惟有神作到亞伯拉罕裏面的，纔能從亞伯拉罕產生神所要的後裔。照樣，惟有神藉著祂恩典作到我們裏面的，纔能產生基督作後裔，完成神的定旨。"]]]},"創17:19":{"t":"神說，不然，你妻子撒拉必給你生一個兒子，你要給他起名叫¹以撒。我要²與他堅定所立的約，作他後裔永遠的約。","n":[["1",["意，他喜笑。"]],["2",["以實瑪利是肉體所產生的後裔，為神所棄絕。（二一10。）惟有以撒是憑神恩典所產生的後裔，是為著完成神定旨所立定的。（21，二一12，羅九7～9。）"]]]},"創21:12":{"t":"神對亞伯拉罕說，你不必為這童子和你的使女愁煩。凡撒拉對你說的話，你都要聽；因為¹從以撒生的，纔要稱為你的後裔。","n":[["1",["直譯，在以撒裏的。"]]]},"加5:1":{"t":"基督釋放了我們，叫我們得以¹自由；所以要²站立得住，不要再³受⁴奴役的軛挾制。","n":[["1",["指從律法的奴役下得以自由。基督藉著祂救贖的死，和分賜生命的復活，釋放了我們，叫我們在恩典中得以享受這自由。"]],["2",["即在脫離律法奴役的自由中站立得住，不偏離基督，不從恩典中墜落。"]],["3",["受奴役的軛挾制，或，陷入奴役之軛的網羅。偏離基督轉向律法，就是被挾制，陷入網羅。"]],["4",["奴役的軛就是律法的轄制，使守律法的人在捆綁的軛下作奴僕。"]]]},"加5:4":{"t":"你們這要靠律法得稱義的，是¹與基督隔絕，²從恩典中墜落了。","n":[["1",["即從基督貶為無有，從基督喪失一切的益處，因而與祂隔絕，（達祕新譯本，）使祂變為無效。回到律法，就是與基督分開，與基督隔絕。"]],["2",["與基督隔絕，就是從恩典中墜落。這含示我們信徒所在的恩典，就是基督。"]]]},"創16:4":{"t":"亞伯蘭與夏甲同房，夏甲就懷了孕；她見自己有孕，就輕看她的主母。","n":[]},"創16:15":{"t":"後來夏甲給亞伯蘭生了一個兒子；亞伯蘭給他起名叫¹以實瑪利。","n":[["1",["亞伯拉罕藉夏甲生以實瑪利，象徵人想用自己肉體的努力與律法配合，以完成神的定旨。（見加二16註2，四23註1。）"]]]},"創16:16":{"t":"夏甲給亞伯蘭生以實瑪利的時候，亞伯蘭年八十六歲。","n":[]},"加2:16":{"t":"且知道人得稱義，不是本於行律法，乃是藉著¹信耶穌基督，連我們也信入了基督耶穌，使我們本於信基督得稱義，不是本於行律法；因為凡屬²肉體的人，都不能本於行律法得稱義。","n":[["1",["直譯，耶穌基督的信，或，在耶穌基督裏的信。見羅三22註1。在耶穌基督裏的信，指藉著信與祂有生機的聯結，這與信徒珍賞神的兒子是那最寶貴者有關。藉著所傳給他們的福音，基督的寶貴得以注入他們裏面，這位基督就在他們裏面，成為他們在其中相信的信，也成為他們因珍賞祂而相信的能力；這信創造一種生機的聯結，使他們在其中與基督是一。"]],["2",["這裏的肉體指墮落的人，因他們已成了肉體。（創六3，和合本譯為血氣。）這樣的人，絕不能本於行律法得稱義。"]]]},"創17:18":{"t":"亞伯拉罕對神說，但願以實瑪利活在你面前。","n":[]},"創21:10":{"t":"就對亞伯拉罕說，你把這使女和她兒子¹趕出去，因為這使女的兒子不可與我的兒子以撒，一同承受產業。","n":[["1",["把夏甲和以實瑪利趕出去，表徵把律法和肉體努力的結果趕出去，這些在神的經綸中毫無地位。（見加四24註5，30註1。）"]]]},"創12:2":{"t":"¹我必使你成為²大國；我必賜福給你，使你的名為大；你也要使別人得福。","n":[["1",["在2～3節神對亞伯拉罕的應許，乃是福音的傳揚。（加三8與註。）神不僅向亞伯拉罕說話並呼召他，也給他福音的應許作為激勵，鼓勵亞伯拉罕答應祂的呼召。"]],["2",["在神向亞伯拉罕所傳的福音裏，祂應許要使亞伯拉罕成為大國。這大國就是神的國，包括以色列國作為神在舊約的國、（太二一43、）召會作為神在新約的國、（太十六18～19上，羅十四17、）來世的千年國、（啟十一15，二十4，6、）以及永世裏的新天新地同新耶路撒冷。（啟二二3，5。）"]]]},"創13:15":{"t":"凡你所看見的一切地，我都要賜給你和你的後裔，直到永遠。","n":[]},"創13:16":{"t":"我也要使你的後裔如同¹地上的塵沙那樣多，人若能數算地上的塵沙，纔能數算你的後裔。","n":[["1",["見二二17註1。"]]]},"創13:17":{"t":"你起來，縱橫走遍這地，因為我必把這地賜給你。","n":[]},"創15:5":{"t":"於是領他走到外邊，說，你向天觀看，數算¹眾星，能數得過來麼？又對他說，你的後裔將要如此。","n":[["1",["見二二17註1。"]]]},"創17:1":{"t":"亞伯蘭年¹九十九歲的時候，耶和華向他顯現，對他說，我是²全足的神；你要³行在我面前，並且要³完全；","n":[["1",["亞伯拉罕運用他天然的力量生了以實瑪利，這嚴重的觸犯了神和神的經綸。因此，以實瑪利出生以後，亞伯拉罕與神的交通就中斷了；神等候了十三年，（參十六16，）直到亞伯拉罕天然的力量被了結，祂纔再來與亞伯拉罕接觸。（羅四19與註。）見十五4註1。"]],["2",["希伯來文， El Shaddai， 伊勒沙代。伊勒，意，大能者；沙代，源自另一希伯來字，意，胸部或乳房。這神聖的稱呼啟示神乃是有乳房的大能者，就是全豐全足的大能者。祂是恩典的源頭，用祂神聖所是的豐富供應祂所呼召的人，使他們能產生基督作後裔，以完成神的定旨。"]],["3",["在這裏，行在神面前，就是行在祂的同在裏，不斷享受祂和祂全豐全足的供應。得以完全，乃是得著神加到我們裏面作完全的元素和因素。實際上，這意思是，我們的生活和工作，並不倚靠肉體的力量，乃是信靠神這位全豐全足的大能者。"]]]},"創17:2":{"t":"我要與你立約，使你的後裔極其增多。","n":[]},"創17:3":{"t":"亞伯蘭面伏於地；神又與他談話，說，","n":[]},"創17:4":{"t":"我與你立的約是這樣：你要成為多¹國的父。","n":[["1",["4～6節以及三五11題到國與王，含示我們繁增的結果必定是正確的召會生活，作神在地上的國。（羅十四17與註1。）見十二2註2。"]]]},"創17:5":{"t":"你的名不要再叫¹亞伯蘭，要叫²亞伯拉罕，因為我已立你作多國的父。","n":[["1",["意，得高舉的父。"]],["2",["意，多人的父。神要完成祂永遠的定旨，所需要的不是一個得高舉的人，乃是一位多人的父。（參一28，九1。）所以，亞伯拉罕改名，表徵他的人位更換，乃是為著完成神的定旨。在屬靈的經歷裏，真正的改名是從“我”改成基督，（加二20，）並從“我”改成神的恩典。（林前十五10。）惟有作神恩典的基督，不是“我，”纔能產生完成神定旨所需眾多的人。（見十五4註1。）參三二27～28，約一42。"]]]},"創17:6":{"t":"我必使你的後裔極其繁多；我必使多國從你而立，多王從你而出。","n":[]},"創17:7":{"t":"我必與你並你世世代代的後裔堅立我的約，作永遠的約，為要作你和你後裔的神。","n":[]},"創17:8":{"t":"我要將你寄居的地，就是迦南全地，賜給你和你的後裔永遠為業，我也必作他們的神。","n":[]},"創17:9":{"t":"神又對亞伯拉罕說，至於你，你和你的後裔當世世代代遵守我的約。","n":[]},"創17:10":{"t":"你們所有的男子都要受¹割禮；這就是我與你並你的後裔所立的約，是你們所當遵守的。","n":[["1",["割禮的屬靈意義乃是藉著基督的釘十字架，脫去肉體，脫去己和舊人。（西二11，13上，申十16，耶四4上，徒七51，加五24，羅六6，弗四22，西三9。）在十六章，亞伯拉罕運用他的肉體生了以實瑪利。在這裏，神要他割除他的肉體，了結他天然的力量，使神可以進來藉著恩典產生以撒，以完成祂的定旨。舊約的割禮等於新約的受浸。（西二11～12與註。）真正的割禮不是外面肉體的，乃是裏面的，是“心裏的，在於靈，不在於字句。”（羅二28～29。）見書五2註1。"]]]},"創17:11":{"t":"你們都要受割禮，這是我與你們¹立約的記號。","n":[["1",["雖然神關於祂選民承受美地的應許（十二1～2，7，十三15～17）已立為約，（十五4～5，18～21，）但仍需要用割禮的約堅定神應許的約。割禮是神選民所必須經過的步驟，好承受神的應許。割禮表徵神新約的選民必須藉著十字架被了結，好承受神所應許在基督裏的一切豐富。（參加二20。）見羅四11與註1。"]]]},"創17:12":{"t":"你們世世代代的男子，無論是家裏生的，或是在你後裔之外用銀子從外人買的，生下來¹第八日，都要受割禮。","n":[["1",["在表號上，第八日作為新的七日的第一日，是指基督的復活。（太二八1，約二十1。）割禮必須是在復活裏，並且總是將我們引進復活，（西二12，參羅六3～5，）使我們成為新人，新造，（林後五17，加六15，）以完成神的定旨。","割禮相當於人的改名。（5。）二者都表徵我們舊人的了結，以及我們的所是被帶到復活裏，使我們不再是天然的人，乃是復活的人。"]]]},"創17:13":{"t":"你家裏生的和你用銀子買的，都必須受割禮。這樣，我的約就立在你們肉體上作永遠的約。","n":[]},"創17:14":{"t":"但不受割禮的男子必¹從民中剪除，因他背了我的約。","n":[["1",["神所呼召的人若不憑著了結他們的己和天然的人，過釘十字架的生活，他們就會在主觀的經歷裏，從基督、從召會生活、並從神恩典的供應被剪除，而與完成神定旨之神的約無分無關。（約十五6，加五4。）"]]]},"西2:11":{"t":"你們在祂裏面也受了¹非人手所行的²割禮，乃是在基督的割禮裏，³脫去了肉體的身體，","n":[["1",["這種脫去肉體之身體的割禮，不是人手所行的，乃是藉著基督的死所成就，並藉著大能的靈所應用、執行並完成的。"]],["2",["這是屬靈的割禮，基督的割禮，指正確的受浸；這浸藉著基督之死有力的效能，叫人脫去肉體的身體。這與禁慾主義相抵。（20～22。）"]],["3",["脫去，意剝去某物，如衣服。"]]]},"西2:13":{"t":"你們從前在過犯，和未受割禮的肉體中¹死了，神赦免了²你們一切的過犯，³叫你們一同與基督活過來；","n":[["1",["指因著罪，在靈裏死了。"]],["2",["直譯，我們。"]],["3",["指神在基督的復活裏，用祂的生命把我們都一同點活。這是在基督的復活裏所成就的，（彼前一3，）也是藉著我們的信心所經歷的。"]]]},"腓3:3":{"t":"真¹受割禮的，乃是我們這憑神的靈²事奉，在基督耶穌裏誇口，³不信靠⁴肉體的。","n":[["1",["新約的信徒，藉著基督釘十字架真正受了割禮。（見加五11註1與西二11註2。）他們與熱中猶太教者完全不同。他們不憑律法的規條，乃憑神的靈作祭司事奉；他們不在律法上誇口，只在基督裏誇口；他們不信靠肉體，只信靠那靈。"]],["2",["原文與二17的供奉，同指像祭司的事奉。"]],["3",["在2～3節，有三重的對比：憑神的靈事奉的信徒，與犬類成對比；在基督裏誇口的信徒，與作惡的成對比；不信靠肉體的信徒，與妄自行割的成對比。"]],["4",["這裏的肉體，包含我們天然人的一切所是和所有。熱中猶太教者信靠割禮，表明他們信靠肉體，不信靠那靈。"]]]},"加5:24":{"t":"¹但那屬基督耶穌的人，是²已經把肉體連肉體的邪情私慾，都³釘了十字架。","n":[["1",["22節的“但，”將該節那靈的果子，與19節肉體的行為作對比；而本節的“但，”是將肉體的釘十字架，與19節肉體的行為作對比。"]],["2",["在羅六6的舊人釘十字架，與本書二20的“我”釘十字架，都不是由我們成就的。然而這裏說，我們已經把肉體連肉體的邪情私慾，都釘了十字架。舊人和“我”是我們這人，肉體是我們這人在實際生活中的表現。我們的舊人和“我”被釘十字架，是基督在十字架上所成就的事實；把我們的肉體連肉體的邪情私慾釘十字架，是我們對這事實實行的經歷。這實行的經歷，需要我們藉著那靈，執行基督所成就的釘死纔得以完成。這就是靠著那靈，治死我們情慾的身體連同這情慾身體之邪惡肢體的行為。（羅八13下，西三5。）","關於十字架的經歷，有三方面：(一)基督所成就的事實；（羅六6，加二20；）(二)我們對已成就之事實的應用；（24；）(三)我們天天背起十字架，經歷所應用的。（太十六24，路九23。）"]],["3",["本書向我們揭示，被誤用的律法與基督相對，（二16，）以及肉體縱任貪慾，抵抗那靈。（17。）十字架已經廢去那傾向守律法的“我，”（二20，）並那縱任貪慾，抵抗那靈的肉體，使基督可以頂替律法，那靈可以頂替肉體。神不要我們憑著肉體守律法，乃要我們憑著那靈活基督。"]]]},"羅8:13":{"t":"因為你們若照肉體活著，必要¹死；但你們若靠著那靈²治死身體的³行為，必要活著。","n":[["1",["本節的死、治死並活著，都是屬靈的，不是肉身的。"]],["2",["我們必須治死身體的行為，但要靠著那靈治死。一面，我們必須主動治死身體的行為，那靈不替我們作。另一面，我們不能憑自己的努力，不靠聖靈的大能，而想對付我們的身體。","這裏的治死，實際上就是我們與住在裏面的那靈配合。在裏面，我們必須讓那靈安家，使祂能賜生命給我們必死的身體。（11。）在外面，我們必須治死身體的行為，使我們可以活著。當我們主動治死身體的行為，那靈就將基督死的功效應用在那些行為上，將其殺死。"]],["3",["我們必須治死的，不是身體本身，乃是身體的行為。身體需要得贖，（23，）但身體的行為需要治死。這些行為，不僅指那些關於罪的事，也包括我們身體在那靈之外，所行一切的事。"]]]},"加6:14":{"t":"但就我而論，除了我們主耶穌基督的¹十字架，別無可誇；藉著²祂，就我而論，³世界已經釘了十字架；就世界而論，我也已經釘了十字架。","n":[["1",["十字架確是一種屈辱，但使徒卻把基督的十字架當作他的誇口，當作他的誇耀。"]],["2",["就我們而論，世界已經釘了十字架，就世界而論，我們也是這樣；這不是直接的，乃是藉著釘十字架的基督。"]],["3",["下節經文的解釋，證明本節的世界，主要的是指宗教世界，因為在本書中，保羅是對付熱心宗教的人。他們關心神的事，卻誤入歧途，表現錯謬。他們的宗教，已經成了世界。我們藉著基督的十字架，已經從宗教世界分別出來，使我們有資格活在新造裏。"]]]},"創18:10":{"t":"¹其中一位說，²到明年這時候，我必回到你這裏；你的妻子撒拉必生一個兒子。撒拉在³那位後邊的帳棚口也聽見了這話。","n":[["1",["其中一位，直譯，祂。"]],["2",["直譯，照著生命的時候。14節者同。"]],["3",["那位，直譯，祂。15節者同。"]]]},"創18:14":{"t":"耶和華豈有¹難成的事麼？到了²約定的日期，明年這時候，我必回到你這裏，撒拉必生一個兒子。","n":[["1",["難成，直譯，太奇妙。"]],["2",["生命的時候，（10，）就是約定生以撒的日期，（十七21，）乃是神眷顧的時候。（二一1。）以撒的出生是耶和華的來臨，就是恩典的來臨。（參約一17。）以撒不是憑人天然生命的力量，乃是憑神恩典的力量生的。這發生在亞伯拉罕受割禮之後，他和他的妻子撒拉，如同完全死了；（11，羅四18～19；）這表徵生命的時候，就是基督成為我們生命的時候，要在我們天然的力量被了結之後纔來到。"]]]},"創21:1":{"t":"¹耶和華按先前的話²眷顧撒拉，便照祂所應許的給撒拉成就。","n":[["1",["1～13節，見加四22～31註。"]],["2",["見十八14註2。"]]]},"創21:2":{"t":"當亞伯拉罕年老的時候，撒拉懷了孕；到神和亞伯拉罕約定的日期，就給亞伯拉罕¹生了一個兒子。","n":[["1",["神在祂經綸中的目標，是要產生基督為後裔，以完成祂永遠的定旨。（三15，十二7，二二18，加三16，撒下七12～14上。）以撒的出生，表徵基督這應許的後裔是在神豫定的時候，藉著神恩典的工作所產生的。這事的首要條件，乃是我們天然的生命和力量，必須藉著屬靈的割禮被了結。（十七10～16。）"]]]},"創21:3":{"t":"亞伯拉罕為撒拉給他生的兒子起名叫¹以撒。","n":[["1",["意，他喜笑。"]]]},"加3:26":{"t":"因為你們眾人藉著¹相信基督耶穌，都是神的²兒子。","n":[["1",["相信基督耶穌，直譯，在基督耶穌裏的信。這信將我們帶到基督裏，使我們與基督成為一，在祂裏面得著兒子的名分。我們必須藉著這信，與基督聯合為一，使我們在祂裏面成為神的兒子。"]],["2",["指已經長大，不在奴隸監護者監管之下的成年兒子。在舊約下，神的選民被看為嬰孩；現今在新約下，他們被看為成年的兒子，承受所應許的福，就是基督那包羅萬有的靈。"]]]},"加4:6":{"t":"而且因你們是兒子，神就差出¹祂兒子的靈，進入我們的²心，³呼叫：⁴阿爸，父！","n":[["1",["神的兒子是神生命的具體化身。（約壹五12。）因此，神兒子的靈就是生命的靈。（羅八2。）神將祂生命的靈賜給我們，非因我們是守律法的人，乃因我們是祂的兒子。守律法的人無權享受神的生命之靈，但神的兒子有地位，有充分的權利，能有分於神的靈，這靈有全備生命的供應。這樣的靈，就是神兒子的靈，乃是神所應許給亞伯拉罕之福的中心。（三14。）","本章4～6節說到三一神產生許多兒子，以成就祂永遠的定旨。父神差出子神，要把我們從律法下贖出來，叫我們能得著兒子的名分。祂也差出靈神，將祂的生命分賜到我們裏面，叫我們能實際的成為祂的兒子。"]],["2",["實際上，神的靈在我們重生時，就進入我們的靈裏。（約三6，羅八16。）因我們的靈是隱藏在我們的心裏，（彼前三4，）又因這裏的話所指的，與我們的感覺和悟性有關，這兩部分又都屬於我們的心，所以說神兒子的靈受差遣進入我們的心。"]],["3",["與本節平行的羅八15說，我們這些得著兒子名分之靈的人，在這靈裏呼叫阿爸，父；而這裏說，神兒子的靈在我們心裏呼叫阿爸，父。這指明我們重生的靈，與神的靈調和為一，而且我們的靈是在我們的心裏。這也指明我們乃是藉著全人深處主觀的經歷，得以實化神兒子的名分。在本節，保羅訴之於加拉太信徒這樣的經歷，以支持他的啟示；這訴求很能說服人、征服人，因為不僅有客觀的道理，也有主觀經歷的事實。"]],["4",["“阿爸”是亞蘭文，“父”是希臘文，Pater，爸特的繙譯。主耶穌在客西馬尼園向父禱告時，首先用了這辭。（可十四36。）這個由亞蘭文和希臘文合併的稱呼，表達呼叫父時強烈的感情。這富有感情的呼叫，含示生父與親子在生命裏親密的關係。"]]]},"加3:29":{"t":"你們既屬於基督，就是¹亞伯拉罕的後裔，是照著²應許為後嗣了。","n":[["1",["亞伯拉罕的後裔只有一位，就是基督。（16。）因此，要成為亞伯拉罕的後裔，我們就必須屬於基督，成為基督的一部分。因我們與基督是一，我們就也是亞伯拉罕的後裔，是照著應許為後嗣，承受神所應許的福，就是那包羅萬有的靈，祂是經過過程之三一神終極的完成，作了我們的分。在新約之下作神選民的信徒，是成年的兒子，乃是這樣的後嗣，不在律法之下，乃在基督裏。猶太教徒仍然留在律法之下，將自己與基督隔絕，乃像以實瑪利，（四23，）是亞伯拉罕按著肉體的後裔，不像以撒，（四28，）是藉著應許的後嗣。但在基督裏的信徒，乃是這樣的後嗣，承受所應許的福。因此，我們該留在基督裏，而不轉向律法。","律法既不能賜我們生命，（21，）就不能產生神的兒子；但本於信所接受，（2，）並賜我們生命的那靈，（林後三6，）能產生神的兒子。律法把神的選民保守在它的監護下，直等信仰來到。（23。）在基督這包羅萬有賜生命之靈裏的信，使神的選民照著神的應許，成為亞伯拉罕的後裔，如同“天上的星。”（創二二17。）"]],["2",["本章啟示神照祂永遠的定旨賜給亞伯拉罕應許。在這應許成就以先，律法被賜下作神選民的監護人。隨後，在豫定的時候，基督這應許的後裔來成就應許，並帶進所應許的福。這就是恩典。因此，恩典與基督同來，並帶著應許的成就而來。這一切都是在神那一面。在我們這一面，就需要一條路，好領略、體認並享受基督這後裔的一切所是和所完成的。因此，有神那一面的恩典，也有我們這一面的信。現今，既有恩典、信、以及那成就了應許的後裔，就不再需要律法作監護人。因此，我們該把律法擺在一邊，轉離這監護人，而與基督在一起，使我們藉著留在恩典和信裏，享受所應許的福。這福一點不差，就是經過過程的三一神這包羅萬有賜生命的靈。"]]]},"加3:8":{"t":"並且聖經既豫先看明，神要本於信稱外邦人為義，就豫先傳¹福音給亞伯拉罕，說，“萬國都必因你得福。”","n":[["1",["神所給亞伯拉罕的應許，“萬國都必因你得福，”就是這福音。這福音傳給亞伯拉罕，不僅在基督完成救贖之先，也在藉摩西頒賜律法之前。神所應許亞伯拉罕的，與神藉基督所成就的相符；基督所成就的，就是神對亞伯拉罕應許的成就。新約的經綸是神對待亞伯拉罕的延續，與摩西的律法無關。新約所有的信徒，都該在這延續裏，並且與藉摩西所頒賜的律法無分無關。"]]]},"來8:7":{"t":"原來那¹第一約若沒有瑕疵，就沒有尋求¹第二約的²必要了。","n":[["1",["第一約指舊約，第二約指新約。"]],["2",["直譯，地方，地位。轉意為理由，條件。"]]]},"來8:8":{"t":"但神既找出祂百姓的瑕疵，就說，“看哪，日子將到，主說，我要與以色列家和猶大家，立定新約，","n":[]},"來2:10":{"t":"原來萬有因¹祂而有，藉祂而造的那位，為著要領²許多的兒子進³榮耀裏去，就藉著苦難⁴成全他們救恩的⁵創始者，這對祂本是合宜的。","n":[["1",["指創造萬有的神。"]],["2",["這裏許多的兒子，就是羅八29的許多弟兄，也是約十二24的許多子粒。"]],["3",["神莫大救恩的最後一步，是要領許多的兒子進榮耀裏去。羅八告訴我們，神在我們身上恩典的工作，開始於祂的豫知，經過祂的豫定、呼召、稱義，終結於祂叫我們得榮耀。（羅八29～30。）羅八也告訴我們，一切受造之物，正在熱切等待神的眾子顯示出來（得榮耀），指望著受造之物自己，也要得享神兒女之榮耀的自由。（羅八19～21。）這要藉著主的再來得著成就，（腓三21，）那時我們要與祂一同顯現在榮耀裏；（西三4；）這是我們的盼望。（西一27。）神的眾子這樣得榮耀，乃是神救恩的目標，要持續的經過千年國，且要完滿的顯於新耶路撒冷，直到永遠。（啟二一11，23。）"]],["4",["成全耶穌，乃指在資格上成全祂，並不含示祂在美德或屬性上，有甚麼不完全，只指使祂完成人生苦難的經歷，能適合作跟從祂者救恩的創始者和首領。","主耶穌是自有永有的神，從永遠到永遠是完全的。但祂需要成肉體，取人性，經人生，釘十架，復活，升天，得到這些過程的成全，纔彀資格作神的基督，和我們的救主。"]],["5",["或，元帥，起始者，開創者，首領，開拓者。本節所說以及3節和一14所題的救恩，乃是把我們從墮落的光景拯救到榮耀裏。身為開拓者、先鋒的耶穌，（六20，）已領先進入榮耀；現今我們這些跟從祂的人，正在同一路上，也要被帶進神所為我們命定同樣的榮耀裏。（林前二7，帖前二12。）祂已經開了路，我們現今正行在其中。因此，祂不僅是救主，拯救我們脫離墮落的光景；祂也是創始者，領先進入榮耀的開拓者，要把我們帶進同樣的光景裏。"]]]},"加6:18":{"t":"¹弟兄們，願我們主耶穌基督的²恩與你們的³靈同在。阿們。","n":[["1",["“弟兄們”這親密的稱呼，（一11，三15，四12，28，31，五11，13，六1，）已經多次用在受責備“無知的加拉太人”（三1）身上。在這嚴厲、責備、警戒的書信末了，使徒再次用這關切的稱呼，並且特別放在結尾，以表示對他們不變的愛，保證他們在信仰之家，（10，）仍是他的弟兄。"]],["2",["耶穌基督的恩，乃是三一神，具體化身在子裏，又實化為賜生命之靈的全備供應，藉著我們靈的運用，給我們享受。"]],["3",["指我們重生、有那靈內住的靈。那靈是本書所一再強調，神應許之福的中心。我們在我們重生的靈裏，經歷享受這靈作新約中心的福。因此，我們需要主的恩典，就是那包羅萬有之靈全備的供應，（腓一19，）與我們的靈同在。","基督、那靈、新造、以及我們的靈，乃是本書所啟示基要的四項，這些都是神經綸中基礎的思想。基督是神經綸的中心，那靈是基督的實際。當基督藉著那靈，實化在我們靈裏，我們就成為新造。因此，為著過新造的生活，以成就神的定旨，我們的靈是極其重要的。","本書極為強調十字架和釘十字架的經歷，為要對付消極的項目，如律法、肉體、“我、”宗教世界、奴役和咒詛，藉此帶進積極的項目，就是本書所啟示的基督、那靈、神的兒子、應許的後嗣、信仰之家、新造、以及神的以色列。本書的總結乃是：藉著基督的十字架，律法、肉體和宗教都了結了，好叫我們得著那靈、新造和我們的靈，使我們在靈裏藉著那靈，就是基督的實化，能作新造，帶著耶穌的烙印，並在我們靈裏得享主耶穌基督的恩。"]]]},"西1:27":{"t":"神願意叫他們知道，這奧祕的榮耀在外邦人中是何等的¹豐富，²就是³基督⁴在你們裏面成了⁵榮耀的盼望；","n":[["1",["這奧祕的榮耀在外邦人中的豐富，就是基督之於外邦信徒一切所是的豐富。（弗三8。）"]],["2",["這在外邦人中滿了榮耀的奧祕，就是基督在我們裏面。基督在我們裏面作生命是奧祕的，也是榮耀的。"]],["3",["這位在我們靈裏作我們生命和人位的基督，乃是我們榮耀的盼望。當祂來時，我們就要在祂裏面得榮耀。這指明內住的基督要浸透我們全人，叫我們的身體改變形狀，同形於祂榮耀的身體。"]],["4",["本書有一些重要的辭句，指出我們對基督的經歷，諸如：基督在你們裏面，（27，）在基督裏成熟，（28，）在祂裏面行事為人，（二7，）照著基督，（二8，）一同與基督活過來，（二13，）與基督同死，（二20～21，）持定元首，（二19，）本於祂，（二19，）以神的增長而長大。（二19。）這些辭句，給我們一幅正確經歷基督的完整圖畫。"]],["5",["基督現今是那滿了榮耀的奧祕。當基督回來叫祂的聖徒得榮耀時，（羅八30，）這榮耀要彰顯到極點。因此這是盼望，是榮耀的盼望。基督自己也就是這榮耀的盼望。"]]]},"林前15:45":{"t":"經上也是這樣記著：“首先的人亞當成了活的¹魂；”末後的亞當成了賜生命的¹靈。","n":[["1",["亞當藉著受造，成了活的魂，有屬魂的身體。基督藉著復活，成了賜生命的靈，有屬靈的身體。亞當是活的魂，乃是天然的；基督是賜生命的靈，乃是復活的。首先，在成為肉體裏，基督為著救贖成了肉體；（約一14，29；）然後，在復活裏，祂為著分賜生命（約十10下）成了賜生命的靈。祂藉著成為肉體，有屬魂的身體，和亞當一樣；祂藉著復活，有屬靈的身體。祂屬魂的身體，藉著復活已成了屬靈的身體。祂現今在復活裏，乃是賜生命的靈，帶著屬靈的身體，豫備好了給信祂的人接受。我們一信入祂，祂就進到我們的靈裏，我們就聯於祂這賜生命的靈。因此，我們與祂成為一靈。（六17。）我們的靈被點活，並與祂一同復活。至終，我們現今屬魂的身體，也要在復活裏成為屬靈的身體，正如祂的身體一樣。（52～54，腓三21。）"]]]},"加3:14":{"t":"為叫¹亞伯拉罕的福，在基督耶穌裏可以臨到外邦人，使我們藉著信，可以²接受³所應許的那⁴靈。","n":[["1",["指神為著地上的萬國，應許給亞伯拉罕的福。（創十二3。）這應許已經成就了，這福已經在基督裏，藉十字架的救贖臨到了萬國。"]],["2",["在福音裏，我們不僅接受赦罪、洗淨和潔淨的福，更接受那最大的福，就是三一神，父、子、靈，成為經過過程，包羅萬有賜生命的靈，極其主觀的住在我們裏面作我們的享受。我們能享受這包羅萬有者作我們每天的分，這是何等的福！"]],["3",["直譯，那靈的應許。"]],["4",["本節指明，那靈就是神為著萬國所應許亞伯拉罕的福，也是信徒藉著相信基督所接受的。那靈，就是5註2所說複合的靈，實際上就是神自己在祂神聖的三一裏，經過成為肉體、釘十字架、復活、升天並降下的過程，給我們接受，作我們的生命和一切。這是神福音的中心。","神應許亞伯拉罕物質方面的福乃是美地，（創十二7，十三15，十七8，二六3～4，）作包羅萬有之基督的豫表。（見西一12與註3。）因著基督至終實化為包羅萬有賜生命的靈，（林前十五45，林後三17，）這應許之靈的福，就與應許亞伯拉罕之地的福相符。實際上，這靈作基督在我們經歷中的實化，就是美地，作神全備供應的源頭，給我們享受。"]]]},"來8:9":{"t":"不是照著我拉他們祖宗的手，領他們出埃及地的日子，與他們所立的約；因為他們沒有恆守我的約，我也不理他們；這是主說的。","n":[]},"來8:10":{"t":"主又說，因為這是那些日子以後，我要與以色列家所立的約：我要將我的¹律法賜在他們²心思裏，並且將這些律法³寫在他們心上；⁴我要作他們的神，⁵他們要作我的子民。","n":[["1",["這段話引自耶三一33。那裏的律法是單數的，本節的律法是複數的，證明這是一個律擴展成幾個律。這就是生命之律。（見羅八2生命之靈的律。）每一種生命都有一個律。生命越高，生命的律就越高。我們從神所得神聖的生命是最高的，所以有最高的律，就是這裏所說的律。神將祂神聖的生命分賜到我們裏面，就把這最高的律放在我們靈裏，這律又從我們靈裏擴展到我們內裏的各部分，就如心思、情感和意志，而成為幾個律。","這生命之律與字句的律法不同。生命之律是憑著並照著生命的元素，從裏面規律我們；字句的律法是憑著並照著死的字句，從外面規律我們。死的字句律法在於外面的教導，這生命之律卻在於內在的知覺。我們眾人，無論大小，既然都有生命之律，就不需要照著字句的律法而有外面的教導。（11。）"]],["2",["這裏的“心思，”與耶三一33“內裏的各部分”（直譯）相符。這證明心思是內裏的一部分，也是對“內裏的各部分”這辭的解釋。內裏的各部分不僅包含心思，也包含情感和意志，三者都是本節所說之心的組成成分。"]],["3",["神首先將祂的律法分賜到我們裏面，然後寫在我們心上。祂是在我們經歷生命之律的時候寫的。"]],["4",["直譯，我要對他們作神。"]],["5",["直譯，他們要對我作子民。我們作神的子民，以及祂作我們的神，乃是照著生命之律。今天神與我們的關係，完全是基於生命之律；所以，我們今天的行事為人，無須照著字句律法的知識，乃要照著生命之律的知覺。"]]]},"來8:11":{"t":"他們各人絕不用教導自己同國之民，各人也絕不用教導自己的弟兄，說，你該¹認識主；因為他們從最小的到至大的，都必¹認識我；","n":[["1",["本節的兩個認識，在原文是不同的字，前者是ginosko，基諾司寇，表明外面客觀的知識；後者是oida，歐依達，指裏面主觀的知覺。在約八55，主耶穌對法利賽人說，他們未曾認識（基諾司寇）父神（連外面客觀的知識也沒有），但祂認識（歐依達）父（憑著裏面主觀的知覺）。這二辭在約壹二29也同時用到。"]]]},"來8:12":{"t":"因為我要¹寬恕他們的不義，絕不再記念他們的²罪。”","n":[["1",["寬恕，原文為二17之成就平息的字根，意即為我們的罪成就了平息。（見二17註5。）在新約裏，應許我們四項福分：(一)寬恕我們的不義，以及忘記（赦免）我們的罪；（12；）(二)將神的生命分賜到我們裏面，藉以分賜生命之律；（10上；）(三)有特權得著神作我們的神，我們作祂的子民─這生命使我們能在與神的交通中享受神；（10下；）(四)有生命的功能，使我們憑生命內裏的路認識神。（11。）照著神所成立的約，這四項福分都是祂的應許；但照著主所遺贈給我們的遺命，這四項福分乃是祂的遺贈物。見九16註1。"]],["2",["原文，複數。"]]]},"來8:13":{"t":"既說新約，就以¹第一約為舊了。但那漸漸陳舊並衰老的，就快要消逝了。","n":[["1",["即舊約。九1者同。"]]]},"來12:22":{"t":"但你們乃是來到¹錫安山，來到活神的²城，屬天的耶路撒冷，來到千萬天使³整體的聚集，","n":[["1",["22～24節所說的事物，是屬天的、屬靈的，與18～19節所列屬地、物質的事物成為對比，表徵恩典的一面。在恩典這面，眾長子和義人的靈，都是藉恩得救的。在舊約之下的人是來到律法那面，我們新約之下的基督徒是來到恩典這面。因此，我們不在律法之下，乃在恩典之下。（羅六14。）這一段話，（18～24，）與加四21～31一樣，給我們看見，我們不在律法的轄制下，乃在恩典的自由下，作承受產業的後嗣。這就是我們的長子名分！我們不該墜落離開恩典（15）而放棄長子的名分，乃該接受恩典。（28。）恩典這面的事物是屬天的，但還沒有完全在天上。召會中許多的長子還在地上，義人（舊約聖徒）的靈還在樂園裏，就是亞伯拉罕所在的地方，（路十六22～23，25～26，）也是主耶穌和得救的強盜，釘死十架以後所去的地方。（路二三43。）","在律法那面所列的六項，沒有一項是可樂的。首先有一座火燒著的山！誰願靠近這樣的地方？接著有黑暗、幽暗、和狂暴的旋風，最後還有可怕的角聲，和嚴厲警告說話的聲音。這一切呈現出可怕的景象！但在恩典這面，一切都是可樂的！這裏的八項可看為四組。高升的錫安山和榮美屬天的耶路撒冷是第一組，指神的居所和祂宇宙行政的中心。這地方何等可愛！然後是歡呼慶祝的天使，與所效力要承受救恩的人緊緊相聯；（一14；）這些天使和召會中有福的眾長子，形成這景象中的第二組。天使的聚集是何等歡樂的展示！他們慶賀那些承受救恩的人成了眾長子的召會，有分於新約的福分。審判眾人的公義之神，以及義人（舊約聖徒）的靈，（他們的身體尚未復活，不配列在這裏，）同為第三組，為展示神如何是義的，就因舊約中義之聖徒的信心，稱他們為義。末了，是親愛的主耶穌，和祂所灑的寶血，構成最後一組。主耶穌是新約那更美之約的中保，祂的血說出更美的事。這指明祂用更美的血立了更美的約；也指明祂已經死了，將這新約當作新遺命，遺贈給信徒；且指明祂現今是這新遺命的中保、執行者，使其中所包含一切有福的事實都完全實現。這是何等可樂的景象！與律法那面的景象是何等的對比！在律法那面，沒有說到神、救主，連天使也沒有說到！難怪在那裏一個得救的人也看不到！然而，恩典這面的景象，有稱人為義的神，有救主，就是新遺命的中保，連同祂說話的血，有效力的天使，和得救之人的聚集（召會），以及得稱義之聖徒的靈。律法那面的景象，結束於可怕的角聲和警告的話；恩典這面的景象，結束於同情的中保和辯護的說話。看過這樣的對比以後，誰還那麼愚昧，離開恩典的一面而轉向律法的一面！恩典這面的八項不僅是屬天的、屬靈的，也是永遠的。因此，即使天被震動，（26，）這八項永遠的事物，仍要常存。（27。）"]],["2",["見十一10註1。"]],["3",["或，節期的聚集。原文意，普遍的聚集，全部的聚集，用以說到慶祝公眾節期的聚集，就如奧林匹克運動會。整個新約時代就是一個節期，千萬的天使，就是在新約下，為承受救恩者效力的服役之靈，（一14，）乃是一個整體的聚集，慶祝“這麼大的救恩”（二3）這美妙的節期。這是宇宙中最大、最令人興奮的運動會！路十五7、10和彼前一12主的話，都可指明這一點。"]]]},"來12:23":{"t":"來到名字¹記錄在諸天之上²眾長子的召會，來到審判眾人的神這裏，來到被成全之義人的靈這裏，","n":[["1",["召會的眾長子雖然還未在天上，他們的名字卻已記錄在諸天之上。"]],["2",["見16註1二段。"]]]},"加1:3":{"t":"願¹恩典與²平安，從神我們的父，並主耶穌基督歸與你們。","n":[["1",["見弗一2註1與羅一7註2。"]],["2",["見弗一2註2。"]]]},"林前8:6":{"t":"在¹我們卻只有²一位神，就是³父，萬物都⁴本於祂，我們也⁴歸於祂；並有⁵一位主，就是⁶耶穌基督，萬物都是⁴藉著祂有的，我們也是⁴藉著祂有的。","n":[["1",["指在基督裏的信徒，基督徒。"]],["2",["與5節“許多的神”相對。我們的神是獨一的。"]],["3",["我們神的一種稱呼，祂是萬物的源頭。這種稱呼使我們的神與許多假神絕對有別。"]],["4",["父是萬物的源頭，因此萬物是“本於祂；”但只有我們信徒要轉向祂，因此我們是“歸於祂。”同樣，父所造的萬物，是以耶穌基督為憑藉而有的；而我們信徒是以主的重生為憑藉，使我們轉向而歸於父。因此，我們和萬物都是“藉著祂。”"]],["5",["與5節“許多的主”相對。我們的主也是獨一的。"]],["6",["我們的主神聖和屬人的名稱，這使祂與許多的主有別。我們的神，就是父，是萬物獨一的源頭；我們的主，就是耶穌基督，是獨一的憑藉，萬物都是藉著祂成的。"]]]},"來11:10":{"t":"因為他等候那座有根基的¹城，其設計者並建築者乃是神。","n":[["1",["這就是活神的城，屬天的耶路撒冷，（十二22，）在上的耶路撒冷，（加四26，）聖城新耶路撒冷，（啟二一2，三12，）是神為祂子民所豫備的；（16；）也是神的帳幕，神要在其中與人同住，直到永遠。（啟二一3。）列祖怎樣等候這座城，我們也照樣尋求她。（十三14。）"]]]},"啟21:1":{"t":"我又看見一個¹新天新地；因為²第一個天和第一個地已經過去了，³海也不再有了。","n":[["1",["在已過的永遠裏，神就定意要得著一個團體的彰顯，使祂得著完滿的彰顯和榮耀；（弗三9～11，一9～12；）為此祂創造了諸天、地和人類。從創世以來，共分四個時代：法前時代，從亞當到摩西；（羅五14；）律法時代，從摩西到基督；（約一17；）恩典時代，從基督第一次來臨到祂第二次來臨萬物復興的時候；（徒三20～21；）還有國度時代，從基督第二次來臨到千年國的末了。（十一15，二十4，6。）神用這四個時代成全並完成祂所揀選的人，使他們作祂永遠團體的彰顯，以成就祂的定旨。這四個時代都屬於舊天舊地。國度時代雖是復興的時代，卻仍在舊天舊地裏，因為神在祂所揀選之人身上那成全與完成的工作，要到國度時代末了纔能成就。等到神藉著國度時代完成這工作時，舊天舊地就要被火焚燒而過去，更新為新天新地，（彼後三10～13，）新耶路撒冷要降到其中作神永遠的彰顯。"]],["2",["按聖經所啟示的原則，第一的人或物，不是神所要的，（出十二12，）第二的纔是，所以凡是第一的，無論天、地、人、物都要廢去。（4，參林前十五47，來八7，13。）若將第一譯作先前，就會失去其靈意。"]],["3",["海是神用審判之水，審判亞當以前的世界所造成的結果。（參創世記生命讀經第二篇。）神復造的工作乃是限制審判之水的結果，使陸地得恢復。（創一9～10，耶五22。）亞當以前之世界的活類，受水的審判以後，就成了海裏的居住者，就是鬼。在牠們受了基督和祂信徒的對付，（太八29～32，路十17，徒十六16～18，十九12，）和海將牠們交出，受白色大寶座前的審判（二十13）之後，海就不需要有了。從神復造的工作以來，神就定意要對付撒但和鬼，好把海廢除。所以說，海也不再有了，指明撒但及其邪惡的跟從者都已經被處置，不會顯在新天新地裏。"]]]},"啟21:2":{"t":"我又看見聖城¹新耶路撒冷²由神那裏從天而降，豫備好了，就如³新婦妝飾整齊，等候丈夫。","n":[["1",["本書的啟示是用表號構成的，（見一1註2，）其中的重大事物都用表號表徵、描述，（因為深奧，用人的明言難以盡述，）如燈臺表徵召會，並星表徵召會的使者；（一；）耶洗別表徵墮落邪淫的羅馬教；（二下；）碧玉和寶石表徵生命和救贖的神；（四3；）獅子和羔羊表徵得勝救贖的基督；（五；）四馬表徵福音、戰爭、饑荒和死亡的普及；（六上；）宇宙婦人表徵神歷代的贖民，並她的孩子表徵神贖民中的強勝者，以及龍、蛇表徵殘忍、狡猾的撒但魔鬼；（十二；）海中上來的獸表徵敵基督，並地中上來的獸表徵假申言者；（十三；）莊稼表徵在神的耕種下生長的人，並初熟的果子表徵在神的耕種下生長之人中的早熟者；（十四；）大巴比倫表徵宗教和物質兩面的羅馬；（十七～十八；）新婦表徵成熟備妥可作基督配偶的聖徒；（十九上；）餘者還有好多；以及最後，也是最大的一個表號，就是新耶路撒冷，表徵神歷代所贖，經過重生、變化、得榮之聖徒總和的結構，並不是一座物質、無生命的城，乃是一個集體活的人位，如新婦，有基督這奇妙的人位為丈夫。（2。）","新耶路撒冷是歷代以來所有蒙神救贖的聖徒活的組合。她是基督的新婦，作基督的配偶；（約三29；）也是神的聖城，作神的居所，神的帳幕。（3。）這就是那屬天的耶路撒冷，（來十二22，）是神為我們豫備的，也是亞伯拉罕、以撒、雅各所羨慕的。（來十一10，16。）這也是在上的耶路撒冷，是我們眾人的母。（加四26。）作基督新婦的新耶路撒冷，是出自她的“丈夫”基督，而成為祂的配偶，正如夏娃是出自她的丈夫亞當，而成為亞當的配偶。（創二21～24。）她是藉著有分於基督的生命和性情的豐富，所豫備好的。作神的聖城，她全然聖別歸神，完全被神的聖別性情浸透，成為神的居所。","在新舊兩約，神將祂的選民比作自己的配偶（賽五四6，耶三1，結十六8，何二19，林後十一2，弗五31～32）和居所。（出二九45～46，民五3，結四三7，9，詩六八18，林前三16～17，六19，林後六16，提前三15。）配偶是在愛裏使神得著滿足，居所是在彰顯中使神得著安息。這兩面要終極完成於新耶路撒冷。因著她，神在愛裏得著完全的滿足，並在彰顯中得著終極的安息，直到永遠。"]],["2",["所有蒙神救贖的聖徒被提到諸天之上以後，他們就成了新耶路撒冷，由神那裏從天而降。這指明我們永遠的居所不在天上，乃在新地上的新耶路撒冷。"]],["3",["新耶路撒冷是一個新婦，指明她不是一座物質的城，乃是一個團體的人位。對基督，她是新婦，為叫祂得滿足；對神，她是一個帳幕，為著神可有安居之所，並藉以彰顯祂自己。"]]]},"啟21:7":{"t":"¹得勝的，必承受這些為業，我要作他的神，他要作我的²兒子。","n":[["1",["這裏的得勝，與二、三章用了七次的得勝意義不同。這裏的得勝指因信得勝，與約壹五4～5者同。二、三章的得勝，使得勝的信徒彀資格有分於千年國的享受，作神時代行政裏特別的賞賜；這裏的得勝，使所有的信徒彀資格有分於新耶路撒冷，連同其中一切的享受，作神永遠救恩共同的分。"]],["2",["3節的“百姓”就是24節的列國，他們要在新天新地作神的百姓，不是作神的兒子。他們要住在新耶路撒冷之外的新地上，且要在新天新地中享受共同的福。（見24註1。）本節的“兒子，”不是指神的百姓，乃是指歷代蒙救贖的聖徒。他們要住在新耶路撒冷，有分於新耶路撒冷一切的享受，事奉神和羔羊，並要作王，直到永遠。（二二3～5。）"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
