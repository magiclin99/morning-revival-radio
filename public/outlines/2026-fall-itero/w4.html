<title>亞伯拉罕、以撒、雅各的神 第四週</title>

<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一、週二","items":[{"lv":1,"label":"壹、","text":"神試驗亞伯拉罕，指示他帶着他獨生的兒子以撒，把他獻爲燔祭—創二二1～2：","refs":[{"label":"創22:1-2","keys":["創22:1","創22:2"]}]},{"lv":2,"label":"一、","text":"在別是巴的生活，產生了獻給神的燔祭（以撒）：","refs":[]},{"lv":3,"label":"1.","text":"以撒生活的源頭使他成爲燔祭，就是爲着神的滿足而獻給神的人—2、7～9節：","refs":[{"label":"創22:2","keys":["創22:2"]},{"label":"創22:7-9","keys":["創22:7","創22:8","創22:9"]}]},{"lv":4,"label":"a.","text":"燔祭，原文意，上升之物，指升到神面前的東西—利一3註1。","refs":[{"label":"利1:3","keys":["利1:3"]}]},{"lv":4,"label":"b.","text":"燔祭豫表基督，主要的不是在於救贖人脫離罪，乃是在於過一種完全且絕對爲着神並滿足神的生活，並在於祂是使神子民能過這樣一種生活的生命—9節，約五19、30，六38，七18，八29，十四24，林後五15，加二19～20。","refs":[{"label":"利1:9","keys":["利1:9"]},{"label":"約5:19","keys":["約5:19"]},{"label":"約5:30","keys":["約5:30"]},{"label":"約6:38","keys":["約6:38"]},{"label":"約7:18","keys":["約7:18"]},{"label":"約8:29","keys":["約8:29"]},{"label":"約14:24","keys":["約14:24"]},{"label":"林後5:15","keys":["林後5:15"]},{"label":"加2:19-20","keys":["加2:19","加2:20"]}]},{"lv":4,"label":"c.","text":"燔祭乃是神的食物，使神可以享受並得着滿足—民二八2。","refs":[{"label":"民28:2","keys":["民28:2"]}]},{"lv":3,"label":"2.","text":"正當的召會生活產生燔祭—利一1～2，羅十二1～2：","refs":[{"label":"利1:1-2","keys":["利1:1","利1:2"]},{"label":"羅12:1-2","keys":["羅12:1","羅12:2"]}]},{"lv":4,"label":"a.","text":"在別是巴的生活、成長並呼求耶和華伊勒俄拉姆的名，都是爲着產生燔祭—創二一33，二二1～2。","refs":[{"label":"創21:33","keys":["創21:33"]},{"label":"創22:1-2","keys":["創22:1","創22:2"]}]},{"lv":4,"label":"b.","text":"我們越留在召會生活中，召會生活就越把我們從別是巴帶到摩利亞。","refs":[]},{"lv":2,"label":"二、","text":"如同亞伯拉罕，我們需要學習一個功課，將神所賜給我們的獻回給神—1～18節，羅十一36：","refs":[{"label":"創22:1-18","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10","創22:11","創22:12","創22:13","創22:14","創22:15","創22:16","創22:17","創22:18"]},{"label":"羅11:36","keys":["羅11:36"]}]},{"lv":3,"label":"1.","text":"凡與以撒有關的都是出於神，且憑着神；神要求亞伯拉罕將以撒當作燔祭獻回給祂—創二二1～2。","refs":[{"label":"創22:1-2","keys":["創22:1","創22:2"]}]},{"lv":3,"label":"2.","text":"以撒，豫表基督是應許的後裔（加三16），由神賜給了亞伯拉罕，但神要亞伯拉罕把神所賜給他的，交還給神；這對亞伯拉罕必然是個試驗—創二二1，來十一17。","refs":[{"label":"加3:16","keys":["加3:16"]},{"label":"創22:1","keys":["創22:1"]},{"label":"來11:17","keys":["來11:17"]}]},{"lv":3,"label":"3.","text":"這裏我們看見在神經綸裏一個基本的原則：凡神所賜給我們的，甚至是祂作到我們裏面並藉着我們作的，至終都必須獻回給祂，好使我們過信心的生活，不抓住任何事物，甚至是神所賜的事物，而單單倚靠祂。","refs":[]},{"lv":3,"label":"4.","text":"神最高的要求，就是將祂所賜給我們的交還給祂。","refs":[]}]},{"day":"週三","items":[{"lv":1,"label":"貳、","text":"在創世記二十二章一至十八節，我們看見亞伯拉罕信而順從—來十一17～19：","refs":[{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕沒有照着他的觀念發起任何事，或作任何事。","refs":[]},{"lv":2,"label":"二、","text":"注入到亞伯拉罕裏面的信心，把他帶到摩利亞山（摩利亞山是錫安山的另一名稱），並使他能將以撒獻爲燔祭—創二二1～2。","refs":[{"label":"創22:1-2","keys":["創22:1","創22:2"]}]},{"lv":1,"label":"叁、","text":"亞伯拉罕將他獻上以撒的那地方，起名叫耶和華以勒—創二二14：","refs":[{"label":"創22:14","keys":["創22:14"]}]},{"lv":2,"label":"一、","text":"摩利亞的意思是『耶和華的異象』；在摩利亞山上，亞伯拉罕看見了神，神也看見了他—2節。","refs":[{"label":"創22:2","keys":["創22:2"]}]},{"lv":2,"label":"二、","text":"十四節下半可譯作，『在耶和華的山上必有豫備』，或，『在耶和華的山上祂必被看見』：","refs":[]},{"lv":3,"label":"1.","text":"在摩利亞山那裏，亞伯拉罕經歷了神的豫備，並且領受了清楚的異象。","refs":[]},{"lv":3,"label":"2.","text":"神的豫備總是同着祂的異象，所以每當我們享受神的豫備，我們就得着異象，在其中我們看見神，神也看見我們。","refs":[]},{"lv":2,"label":"三、","text":"今天神的豫備是在召會生活裏；在召會生活裏，我們有完全的豫備連同清楚的異象。","refs":[]},{"lv":2,"label":"四、","text":"在主的恢復裏，我們是在上摩利亞山，在那裏我們要獻上我們的以撒，享受神的豫備，並得着透亮的異象。","refs":[]}]},{"day":"週四","items":[{"lv":1,"label":"肆、","text":"以撒被獻上之後，又在復活裏歸還，以完成神的定旨—16～18節，來十一17～19，羅四17：","refs":[{"label":"創22:16-18","keys":["創22:16","創22:17","創22:18"]},{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]},{"label":"羅4:17","keys":["羅4:17"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕得回以撒，就相信並經歷神是叫死人復活的神—復活的神—來十一17～19，羅四17，林後一9。","refs":[{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]},{"label":"羅4:17","keys":["羅4:17"]},{"label":"林後1:9","keys":["林後1:9"]}]},{"lv":2,"label":"二、","text":"以撒在復活裏被歸還時，不再是天然的以撒，乃是復活的以撒。","refs":[]},{"lv":2,"label":"三、","text":"以撒被獻上之後，又在復活裏歸還亞伯拉罕，並且成爲祝福—創二二16～18。","refs":[{"label":"創22:16-18","keys":["創22:16","創22:17","創22:18"]}]},{"lv":2,"label":"四、","text":"我們生命中的每一件事，都必須經過死的最終試驗，使復活的神有路—約十一25，林後一9。","refs":[{"label":"約11:25","keys":["約11:25"]},{"label":"林後1:9","keys":["林後1:9"]}]},{"lv":2,"label":"五、","text":"我們向神獻上從祂所接受的之後，祂會在復活裏將其歸還我們—來十一17～19：","refs":[{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]}]},{"lv":3,"label":"1.","text":"我們從神所接受的每項恩賜、屬靈祝福、工作和成就，都必須經過死，最終在復活裏歸還我們。","refs":[]},{"lv":3,"label":"2.","text":"我們若把從神所接受的獻給神，它經過了死，而由神在復活裏歸還我們，就要成爲祝福，以完成神的定旨—創二二16～18。","refs":[{"label":"創22:16-18","keys":["創22:16","創22:17","創22:18"]}]},{"lv":3,"label":"3.","text":"神的祝福總是在復活裏來的；我們若將我們的以撒獻給神，又由神在復活裏歸還我們，就會在神的祝福之下。","refs":[]}]},{"day":"週五","items":[{"lv":1,"label":"伍、","text":"以撒被亞伯拉罕獻給神，就繁增成爲新耶路撒冷—16～18節，羅八29，啓二一2、7：","refs":[{"label":"創22:16-18","keys":["創22:16","創22:17","創22:18"]},{"label":"羅8:29","keys":["羅8:29"]},{"label":"啟21:2","keys":["啟21:2"]},{"label":"啟21:7","keys":["啟21:7"]}]},{"lv":2,"label":"一、","text":"新耶路撒冷乃是亞伯拉罕後裔—沙和星—的終極完成—創二二16～18，羅八29，啓二一2、7：","refs":[{"label":"創22:16-18","keys":["創22:16","創22:17","創22:18"]},{"label":"羅8:29","keys":["羅8:29"]},{"label":"啟21:2","keys":["啟21:2"]},{"label":"啟21:7","keys":["啟21:7"]}]},{"lv":3,"label":"1.","text":"在新耶路撒冷裏，由十二支派所代表的人是沙，由十二使徒所代表的人是星—12、14節。","refs":[{"label":"啟21:12","keys":["啟21:12"]},{"label":"啟21:14","keys":["啟21:14"]}]},{"lv":3,"label":"2.","text":"由沙和星所表徵的這兩班人要同被建造，成爲新耶路撒冷。","refs":[]},{"lv":2,"label":"二、","text":"在創世記二十二章，我們看見一個基本的原則，就是使神的恩賜繁增的路，乃是將神所賜給我們的獻回給神：","refs":[]},{"lv":3,"label":"1.","text":"一個以撒被獻給神並在復活裏歸還，就成爲無數的星和沙。","refs":[]},{"lv":3,"label":"2.","text":"我們若將我們的一粒獻給神，並且讓神置之於死，它就要在復活裏歸還我們，然後我們要看見在神祝福之下的繁增—約十二24。","refs":[{"label":"約12:24","keys":["約12:24"]}]}]},{"day":"週六","items":[{"lv":1,"label":"陸、","text":"摩利亞山是神所揀選的地方，至終成了錫安山，就是建殿的地點，也是美地的中心；在我們屬靈的經歷中，摩利亞山最終成了錫安山—創二二2、14，代下三1，來十一17～19，十二22～23，啓十四1～5：","refs":[{"label":"創22:2","keys":["創22:2"]},{"label":"創22:14","keys":["創22:14"]},{"label":"代下3:1","keys":["代下3:1"]},{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]},{"label":"來12:22-23","keys":["來12:22","來12:23"]},{"label":"啟14:1-5","keys":["啟14:1","啟14:2","啟14:3","啟14:4","啟14:5"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕是第一個帶着燔祭在錫安山上敬拜神的人—1節。","refs":[{"label":"代下3:1","keys":["代下3:1"]}]},{"lv":2,"label":"二、","text":"後來，神吩咐亞伯拉罕的子孫，就是以色列人，要一年三次到這地方敬拜神，向祂獻上他們的燔祭—申十六16，詩一三二13。","refs":[{"label":"申16:16","keys":["申16:16"]},{"label":"詩132:13","keys":["詩132:13"]}]},{"lv":2,"label":"三、","text":"今天，亞伯拉罕屬靈的子孫，就是新約的信徒，乃是在錫安山上—來十二22～23。","refs":[{"label":"來12:22-23","keys":["來12:22","來12:23"]}]},{"lv":2,"label":"四、","text":"至終，我們眾人要與亞伯拉罕一同在永遠的錫安山，新耶路撒冷，敬拜神；整個新耶路撒冷就是錫安，也就是至聖所，神所在的地方—啓十四1～5，二一22。","refs":[{"label":"啟14:1-5","keys":["啟14:1","啟14:2","啟14:3","啟14:4","啟14:5"]},{"label":"啟21:22","keys":["啟21:22"]}]},{"lv":2,"label":"五、","text":"主的恢復就是要建造錫安；錫安就是基督身體的實際，終極完成於新耶路撒冷—十四1，弗四16，啓二一2。","refs":[{"label":"啟14:1","keys":["啟14:1"]},{"label":"弗4:16","keys":["弗4:16"]},{"label":"啟21:2","keys":["啟21:2"]}]}]}],"days":[{"day":"週一","feed":{"verses":[["創二二1～2","『這些事以後，神試驗亞伯拉罕，對他說，亞伯拉罕。他說，我在這裏。神說，你帶着你的兒子，就是你獨生的兒子，你所愛的以撒，往摩利亞地去，在我所要指示你的山上，把他獻爲燔祭。』"]],"paras":["〔聖經在創世記二十一章〕題過亞伯拉罕栽種垂絲柳樹並呼求主的名以後，就題到神進來試驗他。（二二1。）神不像撒但，絕不試誘人。但祂的確試驗我們，就像祂試驗亞伯拉罕一樣。…亞伯拉罕在贖回別是巴的井以後，毫無疑問作了許多事，但…聖經沒有題起別的，反而立刻說到神試驗亞伯拉罕。（創世記生命讀經，九一一頁。）"]},"read":{"paras":["常常在我們對主有了上好的享受以後，祂不要求我們爲祂作甚麼，卻吩咐我們將祂所賜給我們的獻回給祂。…我們總是盼望在與主有了一段美好的時光以後，祂會吩咐我們爲祂作甚麼。我們從來沒有想到，祂會要求我們將祂所賜給我們的還給祂。當亞伯拉罕享受與神親密的交通時，神沒有囑咐他要爲祂作工。他從神領受了最高的要求，就是將神所賜給他的還給神。從起初，神就沒有接受亞伯拉罕所有的。…如今，在以利以謝、羅得、和以實瑪利都被棄絕以後，亞伯拉罕得着了以撒，就是神所應許的後裔，他安心了。凡與以撒有關的都是出於神，且憑着神。…但忽然神進來，似乎說，『我絕不棄絕以撒，他是出於我且從我生的。但是亞伯拉罕，你現在必須把他還給我。』","亞伯拉罕真了不起。…倘若我是亞伯拉罕，我不會獻上以撒。我會搖頭說，『不，這必定不是出於主。祂要以利以謝是合乎邏輯的，要求以實瑪利也是合理的；但神怎能要我將以撒還給祂？神不是沒有目的的。祂應許要給我一個後裔，祂的應許也已經堅定並且成就了。爲甚麼祂現在要使祂已往對我所作的一切報廢？』不錯，神是有目的的神，祂要求亞伯拉罕將以撒還給祂，的確是有目的的。","許多基督徒，包括一些基督教工人在內，從來沒有學習一個功課，將神所賜給他們的獻回給神。你得着了一項恩賜麼？不要緊持不放。遲早神要進來說，『將我所賜給你的恩賜獻回給我。』神賜給你成功的工作麼？到一個時候，神也許說，『這工作是我所賜給你的以撒，現在我要你獻回給我。』許多基督教工人，不願在神所賜給他們的工作上放手。然而，神所賜給我們的一切，甚至祂在我們裏面並藉着我們所作的，我們都必須獻回給祂。","在創世記二十二章二節…神吩咐亞伯拉罕將他所愛的獨生兒子以撒獻上。要亞伯拉罕這樣作真是爲難！倘若我們是他，我們會說，『主，我現在一百二十多歲了，撒拉也快要死了。你怎能要求我將你所賜給我的獻回給你？』…我們能作見證，已過好些時候，神要求我們將祂所賜給我們的還給祂。祂所給我們的恩賜、能力、工作和成就，我們必須獻回給祂。這是真正的試驗。要亞伯拉罕放棄羅得或以利以謝很容易，甚至要他趕出以實瑪利也不是那麼難，但要他獻上他所愛的獨生兒子卻是非常困難的事。有一天，在我們對主有了美好的享受以後，祂會要求我們將祂所賜給我們的恩賜、工作、或成就還給祂。祂也許說，『現在是我向你有所要求的時候了。我不要求你爲我工作或去佈道。我要求你獻回我所賜給你的。』這是我們今天都必須走的路。（創世記生命讀經，九一一至九一四頁。）"],"ref":"創世記生命讀經，第五十七篇。"}},{"day":"週二","feed":{"verses":[["約十二24","『我實實在在的告訴你們，一粒麥子不落在地裏死了，仍舊是一粒；若是死了，就結出許多子粒來。』"],["羅十一36","『…萬有都是本於祂、藉着祂、並歸於祂；願榮耀歸與祂，直到永遠。阿們。』"]],"paras":["當神吩咐亞伯拉罕獻以撒時，神吩咐他要往摩利亞地去，在那裏的一座山上將以撒獻上。（創二二2。）…獻以撒的那座山，後來稱爲摩利亞山，最終成爲錫安山，就是建造聖殿的地方。（代下三1。）…最終摩利亞山成爲美地的中心，亞伯拉罕的後裔必須每年三次到那座山將燔祭獻給神。（申十六16，詩一三二13。）因此，我們看見創世記二十二章是一粒種子。…我們不能也不該在我們所揀選的地方，將神所要的燔祭獻給祂。我們必須離開我們的地方，到神所揀選的地方。（創世記生命讀經，九一四至九一五頁。）"]},"read":{"paras":["你知道你的定命就是作燔祭麼？作燔祭就是被宰殺、被焚燒。在別是巴的成長、生活、並呼求伊勒俄拉姆的名，都是爲着燔祭的建立，使我們能在摩利亞山的祭壇上被焚燒。…我們越喝別是巴井的水，就越長大；我們越長大，就越豫備好接受摩利亞山上的火。因此，主的恢復絕不會是羣眾運動，乃是一條窄路。在創世記二十二章的時候，以撒是惟一生活並行走在這條窄路上的人。不要盼望許多人走召會的路。…住在別是巴並呼求主的名，從一面說似乎是枯燥的。最終，我們與主享受了一段美好的時光以後，祂會要求我們將以撒獻給祂。祂不容許我們在別是巴獻以撒。我們必須走一段很長的距離，並且登上摩利亞山。正當的召會生活…產生燔祭。我們都必須成爲燔祭。這雖然是一條窄路，卻是得勝的路。","在別是巴的生活，不過產生燔祭。…你在成長麼？要爲此感謝神。但你的成長乃是叫你豫備好被焚燒。我們都必須經過作燔祭被焚燒的過程。…在希伯來文裏，燔祭的意思是上升的祭。當燔祭被焚燒以後，就有馨香之氣升到神那裏，使祂滿足。是上升，不是擴散。","神似乎對亞伯拉罕說，『你愛以撒，我也愛他。現在你必須把他給我。』最終，以撒成了整個蒙揀選族類的先祖。他也成了基督的先祖。神永遠的目的絕不能藉以撒之外的人成就；以撒乃是在亞伯拉罕的照顧下長大並獻給神的人。","以撒被獻上以後，在復活裏歸回，爲要成就神永遠的目的。（創二二4，12～13，16，18。）以撒在復活裏歸回以後，成了另一個人。他不再是天然的以撒，乃是復活的以撒。…我們從神所得着的每項恩賜、屬靈祝福、工作和成就，都必須經過死的試驗。最終，這些要在復活裏回到我們這裏。…（約十二24。）假定神賜給你一種天然的恩賜；那是一粒麥子。你若保留這天然的恩賜，從不獻給神，它仍舊是一粒。你若把它獻給神，它經過了死，就要在復活裏歸還你，並且成爲祝福。…神的祝福總是在復活裏來的。一粒繁增爲一百粒，這就是神的祝福。你若將你的一粒獻給神，並且讓神把它置之於死，它就要在復活裏歸還給你。然後你要看見繁增和大的祝福。這是神的作法。（創世記生命讀經，九一六至九一九頁。）"],"ref":"亞伯拉罕以撒雅各的神，第六章。"}},{"day":"週三","feed":{"verses":[["來十一17～19","『亞伯拉罕因着信，被試驗的時候，就把以撒獻上；這正是那歡喜領受應許的，將自己獨生的兒子獻上。論到這兒子，曾有話說，「從以撒生的，纔要稱爲你的後裔。」他算定神甚至能叫人從死人中復活；就表樣說，他也實在從死人中得回了他的兒子。』"]],"paras":["在創世記二十二章，我們看見亞伯拉罕因信順從。…他迅速勇敢的回應神的命令，清早起來就往神所指示的地方去。…在舊約裏，我們看不到亞伯拉罕爲甚麼這樣迅速勇敢的順從神。但在新約裏，我們看見亞伯拉罕相信叫人復活的神。（來十一17～19，參雅二21～22。）他有信心，算定神能叫他所要殺死的以撒復活。他已經領受了穩定甚至堅立的應許，就是神要與以撒堅定祂的約，使他成爲大國。（創十七19～21。）若是亞伯拉罕將以撒獻在祭壇上，把他殺了，並且把他當作祭物燒給神，而神不叫他從死人中復活，那麼神的話就落空了。亞伯拉罕的信心乃是基於神堅定的應許。亞伯拉罕也許說，『倘若神要以撒，我就把他殺了。神會叫他復活，以應驗祂的應許。』（創世記生命讀經，九一九至九二○頁。）"]},"read":{"paras":["在〔羅馬四章十七節〕我們看見亞伯拉罕…相信神：叫死人復活，並且稱無爲有。以撒的出生與神稱無爲有有關，他的歸還與神賜生命給死人有關。因爲亞伯拉罕有這樣的信心，所以他立刻順從神的命令。〔參來十一17～19。〕","亞伯拉罕因信順從神，照着神的啓示而行。（創二二3～4，9～10。）在創世記二十二章裏，亞伯拉罕所作的每件事，完全是出於神。亞伯拉罕沒有照着他的觀念發起任何事，或作任何事。…神告訴亞伯拉罕要作甚麼，怎樣作，並在那裏作。亞伯拉罕獻以撒的行動，每一面都是照着神的啓示和指示。","四節指明亞伯拉罕走了三天，因爲這裏告訴我們，到了第三日，他遠遠的看見所指定的地方。…在第三天，亞伯拉罕將以撒放在祭壇上，然後他所獻給神的，在復活裏歸還給他。","摩利亞這名的意思是『耶和華的異象』，就是主的異象。這有雙重的意義—我們看見主，主也看見我們。在摩利亞山上，毫無疑問，亞伯拉罕看見了神，神也看見了他。照樣，在今天的錫安山上，我們也得着了異象。…召會生活就是異象，在這異象中我們看見神，神也看見我們。…因着我們在祂的豫備中，並得着異象，一切就都是明朗的，沒有一件事是不透明的，並且我們與祂沒有間隔。","今天神的豫備在那裏？在錫安山上的召會生活裏。…當我們享受這豫備時，我們得着何等的異象！我們看見神。我們看見永世。在召會生活這裏，一切在神和我們的眼中都是透明、透亮的，沒有一件事不透明。…今天在錫安山上的召會生活裏，我們有完全的豫備和完全的異象。","我們已經看見亞伯拉罕因信順從的記載。他完全爲神用信心所灌注，這信使他順從。這注入的信心把他帶到摩利亞山，在那裏他享受神的豫備，並且從神得着完全透亮的異象。…在摩利亞山那裏，亞伯拉罕經歷了神的豫備，並且領受了清楚的異象。在他眼中一切都是明朗的。我們不可將創世記二十二章僅僅當作故事來讀。我們必須從其中接受神聖的光，並看見今天在我們身上正重複亞伯拉罕的經歷。讚美主，我們有今天的別是巴和摩利亞。我們不是下埃及，乃是上摩利亞山，在那裏我們要享受神的豫備，並得着透亮的異象。（創世記生命讀經，九二○至九二五頁。）"],"ref":"羅馬書生命讀經，第八篇。"}},{"day":"週四","feed":{"verses":[["羅四17","『亞伯拉罕在他所信那叫死人復活，又稱無爲有的神面前，是我們眾人的父，如經上所記：「我已經立你作多國的父。」』"],["林後四16","『所以我們不喪膽，反而我們外面的人雖然在毀壞，我們裏面的人卻日日在更新。』"]],"paras":["請記得，神允許我們經過各種爲難，就是爲着這個原因，就是要使我們認識祂是復活的神。祂時常引我們進入死地，因爲只有在死裏，我們纔能經歷復活的生命。","聖經說到兩個創造：舊造與新造。…那裏有神，那裏就有新。在上的耶路撒冷稱爲『新耶路撒冷』，因爲其中滿了神。頭一個創造雖是活神的創造，卻沒有神聖的內容。然而，復活的神從死裏所復起的創造，具有神聖且屬人的內容。…頭一個創造…，神…任其經過死，好使其得以在復活裏顯出，成爲具有兩種性情，就是結合神性與人性的創造。（李常受文集一九五七年第三册，三三至三四頁。）"]},"read":{"paras":["同工們彼此相愛，在和諧中一同作工，他們可能以爲彼此的愛，以及他們的配搭是屬靈的事。…但這可能只是屬人的關係，沒有任何神聖的內容。…然而有一天，神的手臨到，這配搭被帶到盡頭。…他們爲此憂傷，禱告並渴望恢復從前的和諧。然而他們越禱告，就越沒有和諧。直到有一天，他們確實向自己的舊經歷死了，他們就發現彼此之間有了一種新的關係，這種關係…乃是屬人且神聖的一。","舊造雖然是藉活神大能的手造成的，但神自己並沒有住留在舊造裏。舊造是神所創造的；舊造展示神的大能，卻無法展示神的同在。舊造如何能變化成爲新的？乃是藉着神的進入。然而如何能有神的進入？主要的難處就在這裏：舊性情必須破碎，神纔有路進來。弟兄姊妹，你生命中的每一件事，都必須經過死的最終試驗，使復活的神有路。你若僅僅認識活神，你的認識就太客觀。神是神，你是你。你需要認識復活的神；惟有藉着死，神纔能爲自己打通一條路，進到你的生命裏。","苦難所帶給舊造的毀壞，給復活的神機會，把祂自己分授到祂的造物裏，使其從死的過程裏出來時，在其構成上有了神聖的元素。宇宙中苦難的主要目的，特別對神的兒女來說，乃是要藉此使神的性情得以作到人的性情裏。…（林後四16。）藉着外面毀壞的過程，裏面的過程得以發生，將新的構成成分加到我們的生命裏。","你〔若〕想要有分於新造，…想要認識永遠的新，…那麼當神要帶你經過毀壞的過程時，你必須向祂表同意。你不需要懼怕，因爲神知道如何分配苦難。…祂準確無誤的量過萬事，揀選特定的試煉，配合特定的需要。祂爲每個人所選定的分，總是爲着這目標，就是使我們生命裏神聖的內容得以加增。祂若懲治我們，總是『爲了我們的益處，使我們有分於祂的聖別』。（來十二10。）『萬有都互相効力，叫…人得益處，就是按祂旨意被召的人。』（羅八28。）得甚麼益處？就是『模成神兒子的形像』。（29。）（李常受文集一九五七年第三册，三四至三六頁。）"],"ref":"活神與復活的神，第三篇；哥林多後書生命讀經，第一篇。"}},{"day":"週五","feed":{"verses":[["創二二17～18","『論福，我必賜福給你；論繁增，我必使你的後裔繁增，如同天上的星，海邊的沙；你的後裔必得着仇敵的城門；並且地上萬國，都必因你的後裔得福；因爲你聽從了我的話。』"]],"paras":["亞伯拉罕蒙神賜福。這裏的福不是物質的事物。…我們都聽過，要一一數算主給我們的祝福，就如我們的學位、升遷、妻子、房子與兒女。…在創世記二十二章，神沒有這樣祝福亞伯拉罕。神乃是以繁增的後裔祝福他。…（17。）我不在意物質的福，我在意繁增。我首先願意在美國看見五十個召會，然後一百個，再後一千個。我也願意看見這種繁增從美國擴展到非洲、澳洲、歐洲，甚至回到耶路撒冷。這是我所要看見的福。（創世記生命讀經，九三二至九三三頁。）"]},"read":{"paras":["神以兩類的人祝福亞伯拉罕，一類好比天上的星，（創二二17，十五5，）另一類好比海邊的沙，（二二17，）也好比地上的塵沙。（十三16。）…我們基督徒是星，是亞伯拉罕屬天的子孫；而真正的猶太人，神屬地的子民，是沙、塵沙。最終，猶太人要在地上作神的祭司，並要教導萬國。在撒迦利亞八章二十至二十三節清楚的豫言這事。爲甚麼神把猶太人描述爲沙和塵沙？海表徵撒但所敗壞的世界，而塵沙屬於神所創造的地。猶太人已經被恢復到神的創造，因此他們由沙來表徵，沙就是海邊的塵沙。雖然他們是屬地的子民，但他們不是海底的塵沙，乃是海邊的塵沙。他們從敗壞的海，從撒但所敗壞的世界分別出來。然而，星不僅從敗壞的世界分別出來，並且還是屬天的。","照着啓示錄二十章八至九節，在千年國末了，歌革和瑪各要與聖徒的營和蒙愛的城爭戰。聖徒的營是一切屬天之星的營，蒙愛的城耶路撒冷是分別之沙的城。亞伯拉罕的這兩類子孫，那時要顧到神在宇宙中的權益，他們要受到歌革和瑪各在撒但煽動下的攻擊。那是宇宙的末了一次戰爭，是屬魔鬼的人與亞伯拉罕子孫之間的戰爭。","新耶路撒冷是由代表舊約聖徒的以色列十二支派，和代表新約信徒的十二使徒所組成。由使徒所代表的人是屬天的星，由十二支派所代表的人是海邊的沙。這兩班人最終要同被建造，成爲永遠的新耶路撒冷。因此，永遠的新耶路撒冷乃是亞伯拉罕後裔的終極完成。這就是神給亞伯拉罕的福。…我們看見了這點以後，需要說，『讚美主，神的祝福不是好房子、好汽車、學位、升遷、妻子或兒女。神的祝福乃是聖徒在神恢復裏的繁增，和召會的繁增。』我盼望有一天，新耶路撒冷的一部分將是我們的繁增，作爲神所給我們的福。…只有在神祝福裏的繁增要存到永遠。我們要看見在新耶路撒冷裏神繁增的福，直到永遠。","在創世記二十二章這裏，我們看見一個基本的原則，就是凡神所賜給我們的，都要繁增。神給亞伯拉罕一個以撒，亞伯拉罕將他獻回給神，然後這一個以撒就繁增成無數的星和沙。亞伯拉罕若不願將以撒獻回給神，他可能只有一個以撒。但亞伯拉罕將以撒獻回給神以後，以撒就繁增爲新耶路撒冷。將神所賜給我們的獻回給神，這就是使神的恩賜在我們身上繁增的路。（創世記生命讀經，九三三至九三五頁。）"],"ref":"創世記生命讀經，第五十八篇。"}},{"day":"週六","feed":{"verses":[["腓三10","『使我認識基督、並祂復活的大能、以及同祂受苦的交通，模成祂的死。』"],["來十二22～23","『但你們乃是來到錫安山，來到活神的城，屬天的耶路撒冷，來到千萬天使整體的聚集，來到名字記錄在諸天之上眾長子的召會…。』"]],"paras":["在創世記二十二章二節神吩咐亞伯拉罕往摩利亞地去，在神所要指示他的山上獻以撒。下節告訴我們，亞伯拉罕『就起身往神所指示他的地方去』。…四節告訴我們：『到了第三日，亞伯拉罕舉目遠遠的看見那地方。』亞伯拉罕沒有照着他的觀念或揀選作甚麼，他是照着神的啓示作一切。","亞伯拉罕在創世記二十二章所作的，乃是聖經中一粒重要的種子。…神吩咐亞伯拉罕的後裔以色列人，要每年三次上摩利亞山去敬拜神，在那裏將他們的燔祭獻給祂。我們已經看見，摩利亞山成了錫安山，那是美地的中心。亞伯拉罕是頭一個帶着燔祭在錫安山上敬拜神的人。最終，我們都要在錫安山上敬拜神。一面，在今天的召會生活中，我們這些亞伯拉罕的真後裔，是在錫安山上；另一面，我們是在往那裏去的路上。亞伯拉罕在創世記二十二章所作的，乃是種子。他的後裔以色列人，是這粒種子的發展，而我們今天是這粒種子進一步的發展。（創世記生命讀經，九二一至九二二頁。）"]},"read":{"paras":["我們要在基督身體的實際裏，就需要完全在基督復活的生命裏。在眾地方召會中，我們的確有些美好的配搭，但是我要問：『這種配搭是憑天然的生命，還是在復活裏作出來的？』在復活裏，意思就是我們天然的生命被釘死，然後我們這人裏神所造的部分就在復活裏被拔高，在復活裏與基督成爲一。在腓立比三章十節保羅說，我們都需要憑着基督復活的大能，模成祂的死。我們都需要問自己：我們中間的配搭是憑着基督復活的大能，或僅僅是憑着我們天然的人。","任何一件照着聖經卻在天然生命裏完成的事，卽使是合乎聖經，也不是基督身體的實際。基督的身體完全是在基督復活生命裏的事。…今天，在眾地方召會中，我們一般所能看見的，多半是在聚會、活動、工作和事奉上的『召會』；我們看不見多少在復活裏，就是在那靈裏，在那是靈的基督裏，並在終極完成的神裏面。…我們需要竭力，在召會生活中達到基督身體之實際的最高峯，就是今日的錫安，直到我們完成於新耶路撒冷，包括錫安。…我們有相調，就是要應付這需要。","在召會時代，被成全並得成熟的神人乃是錫安，就是得勝者，也就是召會中的活力排。…在新天新地，…整個新耶路撒冷都要成爲錫安。…錫安就是神所在之處，也就是至聖所。…有一個表號，表徵新耶路撒冷將是至聖所。新耶路撒冷的量度是個正方體的量度，長一萬二千斯泰底亞，寬一萬二千斯泰底亞，高一萬二千斯泰底亞。（啓二一16。）那就是至聖所；因爲在舊約裏，不論在帳幕或聖殿中，至聖所都是立方的，其長、寬、高都相等。（出二六2～8，王上六20。）","在啓示錄這卷書中，主所要得着的，並主所要建造的，乃是錫安，就是得勝者。得勝者就是錫安，就是神所在之處。這是神聖言中屬靈啓示的內在實際。…主的恢復就是要建造錫安。（李常受文集一九九四至一九九七年第一册，一四○至一四一、一七一、一七三頁。）"],"ref":"關於相調的實行，第二至五章。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第四週、獻上以撒並經歷神是叫死人復活的神","reading":"創二二1～18，來十一17～19，羅四17","readingRefs":[{"label":"創22:1-18","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10","創22:11","創22:12","創22:13","創22:14","創22:15","創22:16","創22:17","創22:18"]},{"label":"來11:17-19","keys":["來11:17","來11:18","來11:19"]},{"label":"羅4:17","keys":["羅4:17"]}]},"verses":{"創22:1":{"t":"這些事以後，神試驗亞伯拉罕，對他說，亞伯拉罕。他說，我在這裏。","n":[]},"創22:2":{"t":"神說，你帶著你的兒子，就是你¹獨生的兒子，你所愛的以撒，往²摩利亞地去，在我所要指示你的山上，把他³獻為⁴燔祭。","n":[["1",["亞伯拉罕將他獨生的愛子以撒獻在祭壇上，乃是一幅生動的圖畫，說出父神將祂的獨生愛子耶穌基督，當作祭物獻在十字架上。在這幅圖畫中，以撒很詳細的豫表基督。以撒是亞伯拉罕的獨生子，（2，12，16，）豫表基督是神的獨生子。（約三16。）以撒是亞伯拉罕的愛子，（2，）而基督是父的愛子，是父所喜悅的。（太三17。）以撒接受他父親的意願，（6，）基督也揀選祂父的意思。（太二六39。）以撒順從至死；（9～10；）照樣，基督也順從至死。（腓二8。）以撒背著燔祭的柴，走到摩利亞山頂；（6；）同樣的，基督也背著祂的十字架，走到各各他。（約十九17。）以撒在摩利亞山當作燔祭獻給神；基督也在同一座山被獻給神，（見可十1註1，）應驗了燔祭的豫表。以撒在祭壇上“被殺，”在第三日，也就是在復活裏，歸還給亞伯拉罕；（4，10～13，來十一19；）同樣，基督也被釘在十字架上，並且第三天復活了。（林前十五4。）以撒在復活裏得著繁增，（17，）基督也在祂的復活裏得著繁增。（約十二24，彼前一3。）以撒是亞伯拉罕的後裔，使萬國得福；（18；）照樣，基督是亞伯拉罕惟一的後裔，亞伯拉罕的福在祂裏面臨到了萬國。（加三8，14，16。）"]],["2",["意，耶和華的異象。摩利亞山是神所揀選的地方，至終成了錫安山，就是建殿的地點，（參代下三1，）也是美地的中心。亞伯拉罕是第一個帶著燔祭在錫安山上敬拜神的人。後來，神吩咐亞伯拉罕的子孫，就是以色列人，要一年三次到這地方敬拜神，向祂獻上他們的燔祭。（申十六16，詩一三二13。）今天，新約的信徒是亞伯拉罕屬靈的子孫，乃是在錫安山上。（來十二22～23。）至終，我們眾人要與亞伯拉罕一同在永遠的錫安山，新耶路撒冷，敬拜神。（啟二一22。）"]],["3",["以撒豫表基督是應許的後裔，（加三16，）由神賜給了亞伯拉罕。神在這裏要亞伯拉罕把神所賜給他的，交還給神。這對亞伯拉罕必然是個試驗。（1，來十一17。）這說出在神的經綸裏一個基本的原則：凡神所賜給我們的，甚至是祂作到我們裏面並藉著我們作的，至終都必須獻回給祂，好使我們過信心的生活，不抓住任何事物，甚至是神所賜的事物，而單單倚靠祂。以撒被獻上之後，又在復活裏歸還亞伯拉罕，並且成為祝福。（12～13，16，18，來十一19。）照樣，我們向神獻上從祂所接受的之後，祂也會在復活裏將其歸還我們，這要成為祝福，以完成神的定旨。見羅四17與註。"]],["4",["見利一3註1。"]]]},"創22:3":{"t":"亞伯拉罕¹清早起來，備上驢，帶著兩個僕人和他兒子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去。","n":[["1",["亞伯拉罕立即順從神，因為他相信那使人復活的神。（5，來十一17～19，雅二21～22，羅四17與註1。）"]]]},"創22:4":{"t":"到了第三日，亞伯拉罕舉目遠遠的看見那地方。","n":[]},"創22:5":{"t":"亞伯拉罕對他的僕人說，你們和驢在這裏等著，我與童子往那裏去敬拜，然後回到你們這裏來。","n":[]},"創22:6":{"t":"亞伯拉罕把燔祭的柴放在他兒子以撒身上，自己手裏拿著火與刀；於是二人同行。","n":[]},"創22:7":{"t":"以撒對他父親亞伯拉罕說，父親哪。亞伯拉罕說，我兒，我在這裏。以撒說，請看，火與柴都有了，但燔祭的羊羔在那裏？","n":[]},"創22:8":{"t":"亞伯拉罕說，我兒，神必自己豫備作燔祭的羊羔。於是二人同行。","n":[]},"創22:9":{"t":"他們到了神所指示的地方，亞伯拉罕在那裏築壇，把柴擺好，就捆綁他的兒子以撒，放在壇的柴上。","n":[]},"創22:10":{"t":"亞伯拉罕伸手拿刀，要殺他的兒子。","n":[]},"創22:11":{"t":"¹耶和華的使者從天上呼叫他說，亞伯拉罕！亞伯拉罕！他說，我在這裏。","n":[["1",["見十六7註1。"]]]},"創22:12":{"t":"使者說，你不可在這童子身上下手，一點不可害他。現在我知道你是敬畏神的了，因為你沒有將你的兒子，就是你獨生的兒子，留下不給我。","n":[]},"創22:13":{"t":"亞伯拉罕舉目觀看，不料，在他後面有一隻¹公羊，兩²角扣在樹叢中，亞伯拉罕就去取了那隻公羊來，獻為燔祭，代替他的兒子。","n":[["1",["這裏的公羊頂替亞伯拉罕的兒子被殺，豫表基督是神的羔羊，（約一29，）由神所豫備，頂替神所揀選的人，就是那些要承受神應許之產業的人，作為燔祭，（2，）使神得著滿足。"]],["2",["角表徵爭戰的能力，樹叢表徵人性。基督作為神的羔羊，自願讓祂的“角”被祂的人性扣住，使祂可以獻給神作我們的代替。（彼前三18。）參太二六50～54。"]]]},"創22:14":{"t":"亞伯拉罕給那地方起名叫¹耶和華以勒，直到今日人還說，在耶和華的山上²必有豫備。","n":[["1",["意，耶和華必豫備，或耶和華必看見。"]],["2",["或，祂必被看見。"]]]},"創22:15":{"t":"耶和華的使者第二次從天上呼叫亞伯拉罕，說，","n":[]},"創22:16":{"t":"耶和華宣示說，你既行了這事，不留下你的兒子，就是你獨生的兒子，我指著自己起誓：","n":[]},"創22:17":{"t":"論福，我必賜福給你；論繁增，我必使你的後裔繁增，如同¹天上的星，¹海邊的沙；你的後裔必得著仇敵的城門；","n":[["1",["天上的星表徵亞伯拉罕屬天的子孫，就是信心的子孫，（加三7，29，）而海邊的沙和地上的塵沙（十三16）表徵亞伯拉罕屬地的子孫，就是肉身的子孫。海邊的沙就是沿海的塵沙。這沙與海分開，也被海的波浪所沖刷。海表徵外邦列國。（賽五七20，啟十七15。）歷世紀以來，被神用來懲治以色列的外邦列國，（見珥一4與註，）就像從地中海來的波浪，他們入侵的軍隊一波一波的上來沖刷以色列這塵沙，所產生的遺民就像海邊的沙。（亞十二～十四，羅九27～29。）新耶路撒冷是由亞伯拉罕的這兩班子孫組成。（啟二一12，14。）因此，新耶路撒冷將是亞伯拉罕後裔的終極總結。以撒被亞伯拉罕獻給神，就繁增成為新耶路撒冷；這乃是神對亞伯拉罕的祝福。"]]]},"創22:18":{"t":"並且地上萬國，都必因你的¹後裔得福；因為你聽從了我的話。","n":[["1",["按照加三14，神賜給亞伯拉罕的應許，乃是神自己要來成為亞伯拉罕的後裔，這後裔要藉著成為包羅萬有的靈給人類接受，（林前十五45，）而成為賜給萬國的福。神賜福給亞伯拉罕，至終產生基督這獨一的後裔，地上萬國都要因祂得福。（徒三25～26，加三16。）所有在基督裏的信徒乃是團體基督的肢體，（林前十二12，）都包含在這後裔之內，成為承受神應許之福的後嗣。（加三7，29與註1。）","在本章，基督以三種方式啟示出來：祂是耶和華的使者，（11～12，15～18，）是公羊，（13，）也是亞伯拉罕的後裔。（18。）耶和華的使者，就是基督，豫備了豫表基督的公羊，最終產生了後裔，這後裔也是基督。"]]]},"來11:17":{"t":"亞伯拉罕因著信，被試驗的時候，就把以撒獻上；這正是那歡喜領受應許的，將自己獨生的兒子獻上。","n":[]},"來11:18":{"t":"論到這兒子，曾有話說，“¹從以撒生的，纔要稱為你的後裔。”","n":[["1",["從以撒生的，直譯，在以撒裏的。"]]]},"來11:19":{"t":"他算定神甚至能叫人從死人中復活；就¹表樣說，他也實在從死人中得回了他的兒子。","n":[["1",["直譯，比喻。"]]]},"羅4:17":{"t":"亞伯拉罕在他所¹信那²叫死人復活，又³稱無為有的神面前，是我們眾人的⁴父，如經上所記：“我已經立你作多國的父。”","n":[["1",["亞伯拉罕在兩件事上信神：(一)以撒的出生，關係到神是“稱無為有”的神；(二)獻上又得回以撒，關係到神是“叫死人復活”的神。亞伯拉罕乃是信這樣一位神，並將祂應用在他的處境中。因為亞伯拉罕有這樣的信，他就信神所說，以撒要出生這似乎不可能的話，並且他也立刻順從神的命令，將以撒獻上，信神必叫他從死人中復活。（來十一17～19。）"]],["2",["這是神復活的大能。這大能使我們能消除死亡，勝過屬死的事物。亞伯拉罕照神的吩咐獻上以撒，經歷了這復活的大能。"]],["3",["這是神創造的大能。祂是創造的神，不需要使用材料作出甚麼；祂只要說話，就能從無創造出有。祂“說有，就有。”（詩三三9。）"]],["4",["亞伯拉罕是所有蒙神呼召之人的父，是神所揀選新族類的頭一位。我們原是生在墮落的亞當族類中，如今蒙了重生，進入蒙召的亞伯拉罕族類中。凡像亞伯拉罕以信為本的人，都是這新族類中的人，都是亞伯拉罕的子孫。（加三7。）"]]]},"利1:3":{"t":"他的供物若以牛為¹燔祭，就要獻一隻沒有²殘疾的²公牛；他要在³會幕門口把公牛獻上，使他可以在耶和華面前蒙悅納。","n":[["1",["原文意，上升之物，指升到神面前的東西。燔祭豫表基督，主要的不是在於救贖人脫離罪，乃是在於過一種完全且絕對為著神並滿足神的生活，（9，約五19，30，六38，七18，八29，十四24，）並在於祂是使神子民能過這樣一種生活的生命。（林後五15，加二19～20。）燔祭乃是神的食物，使神可以享受並得著滿足。（民二八2。）這祭每天早晚都要獻上。（出二九38～42，利六8～13，民二八3～4。）"]],["2",["基督作為燔祭，滿了力量（公的）和新鮮（牛犢—5註2，）祂毫無缺陷和過失。（彼前一19，來九14。）"]],["3",["燔祭是在會幕門口，即帳幕的外院獻上的。外院表徵地，（參啟六9註2，）祭壇表徵十字架。基督將自己獻於其上的十字架是在地上，但祂乃是在神面前獻上自己，並且在神面前蒙神悅納。"]]]},"利1:9":{"t":"但燔祭牲的內臟與腿，那人要用水¹洗。祭司要把這一切全²燒在壇上，當作燔祭，獻與耶和華為怡爽³香氣的⁴火祭。","n":[["1",["洗燔祭牲的內臟和腿，並不含示基督是污穢的；反之，這指明基督內裏的各部分和祂日常的生活行動，一直為聖靈（由水所表徵—約七38～39）所洗滌，使祂蒙保守，不因接觸屬地的事物而被玷污。","我們要將基督當作我們的燔祭獻給神，就需要在祂的經歷裏經歷祂，並按著我們對祂的經歷把祂獻給神。（彼前二5，來十三15。）我們特別需要在祂的被宰殺、（羅八36，林後四11、）被剝皮、（太五11，徒二四5～6，林後六8，十二16～18、）以及被切成塊子（林前四13）的事上經歷祂。我們也需要在祂的智慧上，（林前一24，30，二7，西一26～27，）在祂的為神所喜悅上，（林後五9，加一10，羅十四18，）在祂內裏的各部分上，（腓二5，林前二16下，十六24，腓一8，林後十一10，）在祂的行事為人上，（太十一29，弗四20，林前十一1，彼前二21，）並在祂蒙聖靈保守免於玷污的事上（林前六11，多三5）經歷祂。在基督的經歷裏經歷祂，並不是在外面模倣祂，乃是在我們日常的生活裏活祂。（加二20，腓一21。）我們如何將基督當作燔祭獻上，實際上乃是我們日常經歷基督的展示與回顧。見14註1。"]],["2",["原文意，使…在煙中上升。這辭用於焚燒（獻上）燔祭和香。"]],["3",["基督作為燔祭，過絕對使神滿足的生活，（約五30，六38，八29，）就是純淨且聖別、無墮落元素、無缺點、無罪的生活。（約十四30，路二三14，林後五21，來四15，彼前一19，二22。）這樣的生活乃是怡爽的香氣，是升到神面前，使神喜樂並滿足的馨香之氣。"]],["4",["火表徵聖別的神。（來十二29。）燔祭的火不是為審判，乃是為蒙神悅納。這火要晝夜一直燒著。（六9，12～13。）"]]]},"約5:19":{"t":"耶穌對他們說，我實實在在的告訴你們，子從自己不能作甚麼，惟有看見父所作的，子纔能作；¹父所作的事，子也照樣作。","n":[["1",["直譯，那一位。"]]]},"約5:30":{"t":"我從自己不能作甚麼；我怎麼聽見，就怎麼審判；我的審判也是公平的，因為我不尋求自己的意思，只尋求那差我來者的意思。","n":[]},"約6:38":{"t":"因為我從天上降下來，不是要行我自己的意思，乃是要行那差我來者的意思。","n":[]},"約7:18":{"t":"那從自己說的，是尋求自己的榮耀；惟有那尋求差祂來者之榮耀的，這人纔是真的，在祂裏面沒有不義。","n":[]},"約8:29":{"t":"那差我來的是與我同在，祂沒有撇下我獨自一人，因為我始終作祂所喜悅的事。","n":[]},"約14:24":{"t":"那不愛我的，就不遵守我的話；你們所聽見的話不是我的，乃是差我來之父的。","n":[]},"林後5:15":{"t":"並且祂替眾人死，是叫那些活著的人，¹不再向自己活，乃²向那替他們死而復活者活。","n":[["1",["基督的死不僅救我們脫離死，使我們免於死，更藉著祂的復活，使我們不再向自己活，乃向祂活。"]],["2",["向主活比為主活意義更深。為主活含有我與主仍是二者之意；向主活指明我與主乃是一，如在婚姻生活中，妻子之於丈夫。"]]]},"加2:19":{"t":"我¹藉著律法，已經²向律法死了，叫我可以³向神活著。","n":[["1",["律法對我這罪人的要求是死，基督按這要求為我死，也帶著我一同死。因此，我藉著律法已經在基督裏死了，也與基督一同死了。"]],["2",["意即在律法下的義務，就是與律法的關係，已經了結。"]],["3",["意即在神聖的生命裏對神盡義務。在基督的死裏，我們脫離了與律法的關係；在基督的復活裏，我們在祂復活的生命裏向神負責。"]]]},"加2:20":{"t":"我已經¹與基督同釘十字架；現在活著的，²不再是我，乃是³基督在我裏面活著；並且我如今在肉身裏所活的⁴生命，是我⁵在⁶神兒子的⁷信裏，與祂聯結所活的，祂是⁸愛我，為我⁹捨了自己。","n":[["1",["這解釋我如何藉著律法，向律法死了。照著神的經綸，基督被釘十字架時，我也包括在祂裏面。這是已經成就的事實。"]],["2",["“不再是我，”不是指一種替換的生命─基督進來，我出去；因為保羅在本節後面仍說“我…活。”我們重生的人，有已經釘死的舊我，（羅六6，）也有重生的新我。對舊我，保羅說不再是我；對新我，他說“我…活。”釘死的舊我，沒有神性；重生的新我，卻有神加到裏面作生命。舊我復活加上神，就成了新我。一面保羅已經了結，另一面復活的保羅，重生以神作生命的保羅，仍然活著。不僅如此，保羅雖然說不再是我，但他也說基督在我裏面活著。雖是基督活著，卻是活在保羅裏面。基督和保羅，二者同有一個生命，同過一個生活。"]],["3",["藉著基督的死，我已在祂裏面死了；現今藉著祂的復活，祂在我裏面活著。祂活在我裏面，完全憑著祂是賜生命的靈；（林前十五45下；）這點在以下各章有充分的發展，向我們陳明並強調，那靈乃是我們已經接受作生命的那一位，也是我們應該活在祂裏面的那一位。","我，天然的人，傾向守律法以得完全，（腓三6，）但神要我活基督，使神藉著基督能從我得著彰顯。（腓一20～21。）因此，神的經綸乃是，“我”在基督的死裏被釘死，基督在祂的復活裏活在我裏面。守律法，是在我的生活中高舉律法在一切之上；活基督，是在我的生活中使基督作中心和一切。律法是神為著基督，用以看守祂選民的，只是一段時期，（三23，）至終要帶他們歸於基督，（三24，）使他們接受祂作生命，並活祂作神的彰顯。現今基督既已來了，律法的功用就了結了；基督必須在我的生活裏頂替律法，以成就神永遠的定旨。"]],["4",["這裏的生命不是肉身的生命，也不是魂的生命，乃是屬靈、神聖的生命。"]],["5",["在神兒子的信裏，或，在神兒子裏的信裏。參16註1。"]],["6",["基督這名稱，主要的是指基督的使命，為著完成神的計畫；神的兒子，是指基督的人位，為著分賜神的生命到我們裏面。因此，我們所用以活神之生命的信，乃是神兒子這賜生命者的信。"]],["7",["我們活神聖的生命，不是憑著眼見，也不是憑著感覺，不同於我們活肉身和魂的生命。我們活神聖的生命，就是活我們靈裏屬靈的生命，乃是藉著運用信，這信是由賜生命之靈的同在所激發的。"]],["8",["神的兒子愛我們，特意為我們捨了自己，使祂能將神的生命分賜到我們裏面。"]],["9",["直譯，交出。"]]]},"民28:2":{"t":"你要吩咐以色列人說，獻給我的供物，就是獻給我作怡爽香氣之火祭的¹食物，你們要謹慎，在所定的日期獻給我。","n":[["1",["神的食物包括祂子民向祂獻上的供物，這些供物豫表基督的不同方面，（見利一～七註，）基督乃是舊約一切供物的實際和頂替。（來十5～9。）基督是神每日的食物，（3～8，）每週的食物，（9，）每月的食物，（11～15，）和每年的食物。（16～二九38。）因此，神的食物與神子民每日、每週、每月、和每年的生活有關。"]]]},"利1:1":{"t":"¹耶和華從²會幕中呼叫摩西，對他³說，","n":[["1",["聖經中神聖的啟示是漸進的，從創世記到啟示錄一直持續的進展。創世記啟示神的創造與人的墮落，出埃及記啟示神的救恩與神居所的建造。利未記是神聖啟示的進一步發展，揭示蒙神救贖之人的敬拜與生活。以色列人在西乃山停留在神面前約十一個月，（出十九1，參民十11，）神訓練他們敬拜、有分於祂而享受祂，並訓練他們過聖別、潔淨、喜樂的生活。本書給我們看見，神的贖民藉帳幕，用供物，並憑祭司，就能與神交通，事奉神，並作神聖別的子民，過彰顯神的聖別生活。基督是神子民在交通、事奉和生活上的一切。利未記所描繪的敬拜，乃是在於享受基督作我們與神之間，並我們彼此之間共同的分，藉此接觸神。（參約四24與註。）與神一同享受基督的結果，就是神子民聖別的生活。"]],["2",["帳幕是神的居所，（出四十34～35，）會幕是神與祂贖民相會的地方。（參出二五22，三三7。）二者都是指召會，就是神在地上的居所，（提前三15，）也是得救之人與拯救之神相會的地方。（參林前十四23～25。）"]],["3",["利未記第一節和末了一節，指明整卷書乃是神說話的記載。從這裏開始的說話，不是在諸天之上，也不是在西乃山上，乃是在帳幕，就是會幕中。在豫表上，這表徵神在作祂帳幕的召會中說話。（參林前三16，十四23～31。）召會作為會幕，乃是神說話惟一的地方。"]]]},"利1:2":{"t":"你要對以色列人說，你們中間若有人獻¹供物給耶和華，要從牛群羊群中獻²牲畜為供物。","n":[["1",["希伯來文， qorban， 各耳板，意，禮物或贈品。嚴格來說，供物不是祭物，乃是珍賞基督之人獻給神的禮物。祭物是為著救贖，為著平息，而禮物是為著我們與神之間親密的交通。以色列人要在美地上勞苦，然後將他們所享受並珍賞的出產獻給神作禮物。照樣，我們也該竭力經歷並享受基督，然後極其珍賞的將基督獻給神為禮物。帳幕是給神居住的，供物是藉著我們的珍賞和獻上，使神與我們同享的。","出埃及記結束於立起帳幕，（出四十，）利未記開始於供物，（一～七，）這含示兩卷書之間直接的延續。帳幕和供物都是基督的豫表。基督藉著成為肉體來作帳幕。（約一14。）這同一位基督也是神的羔羊，（約一29，）是一切供物的總和，集大成。（來十5～10。）基督成為肉體而來，將神帶給我們，（約一1～十三38，）祂經過了釘十字架與復活，將我們帶給神，（約十四1～二一25，）使神與我們成為一，並使我們與神成為一。帳幕表徵神在基督裏，使我們能接觸、經歷、進入並聯於神。供物表徵神在基督裏給我們享受，甚至給我們喫、消化並吸收，（約六53～58，）使我們與神調和。享受基督作一切供物之實際的路，乃是接觸祂，並將祂這實際的靈接受進來。（約六63，十四16～18，20，林前十五45。）","根據利未記，有五種主要的祭：燔祭、（1～17、）素祭、（二1～16、）平安祭、（三1～17、）贖罪祭、（四1～35、）和贖愆祭。（五1～六7。）這些祭有三種功用：(一)作為著罪的祭物，藉著平息神與祂百姓之間的光景，為神的百姓遮罪；(二)作討神喜悅的禮物；(三)作神和事奉神之人（祭司）的食物。"]],["2",["在本章，用來作燔祭的各種牲畜，都是能按牠們的意志行動並活動的活牲畜。基督乃是這樣活的一位，祂有剛強的意志，卻使自己的意志降服而服從神。祂是毫無殘疾的，（3，）因為祂的意志總是降服而服從神的旨意。（約五30，六38。）基督作為燔祭上到十字架，為要實行神的旨意。（來十5～10與7註1。）"]]]},"羅12:1":{"t":"¹所以弟兄們，我藉著神的²憐恤³勸你們，將身體⁴獻上，當作聖別並討神喜悅的⁵活祭，這是你們⁶合理的⁷事奉。","n":[["1",["本書在詳述神揀選的插語之後，接著八章，繼續說出神在基督裏完整救恩的後半，就是那些蒙了並得享神完整救恩前半的人，互相作肢體，成為基督的身體，（5，）而在地上的各地方（如十六章所列舉者），過基督身體的生活，以彰顯基督，使經過過程的三一神，在其中得著彰顯，如本段五章聖言，從這生活的各方面所指導的。一至八章所啟示神完整救恩的前半，乃是神達到祂目的的手續；十二至十六章所啟示神完整救恩的後半，乃是神完整救恩的目的。"]],["2",["見九15註2。這裏的憐恤，原文是複數。神對我們有多種的憐恤，顯於揀選、呼召、拯救，以及將我們帶進祂的生命，得享祂的豐富，成為祂的彰顯。使徒以神這許多的憐恤為憑藉，為動力，勸我們將身體獻給神，以完成祂的定旨。"]],["3",["或，懇求。"]],["4",["要實現召會，就是基督身體的生活，需要我們的全人。因此，本章說到我們的身體，（1，）我們的魂，（2，）以及我們的靈。（11。）為著基督的身體，我們的身體必須獻給神。"]],["5",["在六章是為著爭戰與事奉獻上我們的肢體作義的兵器。（六13。）但在本章，乃是為著召會的生活將我們的身體獻上當作活祭。這祭是活的，因為是復活而有生命的，不像舊約的祭是殺死的。這祭也是聖別的，因為在地位上，是基督的血，從世界和一切凡俗的人事物，分別出來歸與神的；並且在性質上，也是聖靈用神的生命，和神聖別的性情，將天然的生命和舊造，為著神的滿足，聖別而變化的，所以能討神喜悅。","在原文，身體是複數，祭是單數。這表明我們所獻上的，乃是許多身體，但我們所獻成的，卻是惟一的祭，這含示我們眾人在基督身體裏的事奉，不該是許多分開、各不相干、個別的事奉；我們一切的事奉，該是一個整體的事奉，且該是獨一無二的，因為是基督一個身體的事奉。"]],["6",["或，聰慧的，合邏輯的，合理性的，合最高理智的。"]],["7",["意在敬拜中事奉神。見一9註2。在本章以前，除了使徒以外，沒有題到信徒也有這樣的事奉。這表明信徒的事奉乃是前面各章所描述之生命長大的結果，而且這事奉必須在召會─身體裏，正如出埃及記與利未記中的豫表，所描述的祭司體系對神的事奉，是在會幕建造以後纔建立的。"]]]},"羅12:2":{"t":"¹不要模倣²這世代，反要藉著心思的³更新而⁴變化，叫你們⁵驗證何為神那美好、可喜悅、並純全的⁶旨意。","n":[["1",["意即不要被這世代同化，使我們這些從世界被聖別歸神的人，又變成和這世代同形狀，而不顧主靈藉著神的生命和祂聖別的性情，在我們裏面運行、工作，用神在我們裏面的素質，將我們模成主榮耀形像的變化。（林後三18。）"]],["2",["這世代是指世界現今、實際的部分，（見加一4註3，）就是我們所接觸並活在其中的。世界，撒但邪惡的系統，（見弗二2註1，）乃是神以外一切人事物的組合，包括世俗的事物，也包括宗教的事物，如加六14所說的世界，乃是保羅時代的宗教世界。這撒但的世界，乃是由許多不同的世代所組成的，每一世代各有其特殊的形態、特徵、時尚、流行與潮流。我們若不棄絕現今顯在我們跟前的世代，就不能棄絕世界。"]],["3",["我們將身體獻上以後，還需要心思的更新。這心思的更新，是我們魂變化的基礎，是我們的心思置於靈（八6）的結果。我們的心思是我們魂主要的部分，我們的心思既被更新，與心思同作魂其他部分的意志與情感，也自然隨著更新。更新的意思是有新的素質加到我們裏面，因而產生新陳代謝的變化，使我們適合基督身體的建造，就是召會生活的實行。十二至十六章內一切的美德及得勝，也都是這變化的結果。"]],["4",["變化是神工作內在、新陳代謝的過程，為將神的生命和性情，擴展到我們全人，特別到我們的魂裏面，將基督和祂的豐富，帶進我們全人各部分，作我們新的元素，而把我們老舊、天然的元素逐漸排除。結果，我們就變化成祂的形像，（林後三18，）就是模成神長子的形像，作祂的許多弟兄，（八29，）適合祂身體的建造。"]],["5",["即察看並分辨。基於身體的奉獻，與心思的變化，我們會察看、分辨並驗證，神的旨意乃是要為基督得著一個身體，作祂的豐滿和彰顯。"]],["6",["在本章，神的旨意是要我們這些在前十一章裏，蒙神揀選、呼召、救贖、稱義、聖別、並模成以得榮的人，互相作肢體，而過基督身體的生活。（3～5。）基督的身體，是神聖啟示的頂點。這身體的生活，乃是我們獻上身體、更新心思、以及前面各章裏，生命一切實行的結果和目標。"]]]},"創21:33":{"t":"亞伯拉罕在別是巴栽了一棵¹垂絲柳樹，又在那裏呼求耶和華²永遠之神的名。","n":[["1",["垂絲柳樹有細長的枝條，葉子很細，描繪生命之豐富的湧流，就是經歷生命樹的結果。（二9～10，參約七37～38。）因此，垂絲柳樹表徵被人經歷並得著彰顯的生命樹。"]],["2",["希伯來文， El　Olam， 伊勒俄拉姆。伊勒，意，大能者，乃是神的名字之一。俄拉姆，意，永遠的或永遠，原文字根意，隱藏、遮藏。伊勒俄拉姆這神聖的稱呼，含示永遠的生命。（參約一1，4。）因此，亞伯拉罕藉著呼求耶和華這永遠大能者的名，就經歷神是永活、隱密、奧祕的一位，祂就是永遠的生命。"]]]},"羅11:36":{"t":"因為萬有都是本於祂、藉著祂、並歸於祂；願榮耀歸與祂，直到永遠。阿們。","n":[]},"加3:16":{"t":"¹應許原是向亞伯拉罕和他後裔說的。並不是說，和眾後裔，像是指著許多人，乃是說，“和你那後裔，”指著一個人，就是²基督。","n":[["1",["原文，複數。"]],["2",["基督是那後裔，後裔乃是承受應許的後嗣。在這裏，基督是承受應許的惟一後裔。因此，我們要承受那應許的福，就必須與基督是一；在祂以外，我們無法承受神所賜給亞伯拉罕的應許。在神眼中，亞伯拉罕只有一個後裔，就是基督。我們必須在祂裏面，纔能有分於神所賜給亞伯拉罕的應許。基督不僅是那承受應許的後裔，也是神所應許給人承受的福。加拉太信徒若從基督轉回到律法，就要喪失這位後嗣，以及神所應許的產業。"]]]},"林後1:9":{"t":"¹自己裏面也²斷定是必死的，叫我們不信靠自己，只信靠³那叫死人復活的神；","n":[["1",["本書陳明使徒在五方面是為著召會活基督的榜樣：(一)不信靠自己，只信靠那叫死人復活的神，（9，）這包括一些相關的事，就如在世為人，不靠屬肉體的智慧，乃靠神的恩典，（12，）以及與信實之神那不變的基督是一；（18～20；）(二)聯於基督，為祂的靈所膏、所印，被祂俘擄、征服，並受祂帥領散佈祂的香氣；（21～22，二14～16；）(三)彀資格以基督為屬靈的字母，用活神賜生命的靈寫活的信；（三3～6；）(四)有新約榮光的照耀；（三7～11；）(五)以沒有帕子遮蔽的臉，觀看並返照主的榮光，變化成為與祂同樣的形像，從榮耀到榮耀，乃是從主靈變化成的。（三16～18。）"]],["2",["斷定是必死的，直譯，是死的答案，或，是死的反應。當使徒在患難的重壓之下，甚至連活命的指望都絕了，他們也許問自己，他們受苦的結果是甚麼？答案或反應乃是死。這使他們作了重大的決定，就是不信靠自己，只信靠那叫死人復活的神。"]],["3",["死的經歷引我們進入復活的經歷。復活就是那叫死人復活的神。十字架的工作了結我們的己，使我們在復活裏經歷神。十字架的經歷總是帶進對復活之神的享受。這樣的經歷產生並形成職事。（4～6。）這在四7～12有進一步的描述。"]]]},"約11:25":{"t":"耶穌對她說，我是復活，我是生命；信入我的人，雖然死了，也必復活；","n":[]},"羅8:29":{"t":"因為神所¹豫知的人，祂也²豫定他們³模成神兒子的形像，使祂兒子在⁴許多弟兄中作⁵長子。","n":[["1",["29～30節描述神工作的每一步，原文所用的動詞，都是過去式，指明在神看，祂一切的工作都已經作成。神是永遠的神，在祂並沒有時間的因素。"]],["2",["神豫定我們，目的不是僅僅要我們聖別、屬靈、得勝，乃是要我們模成祂兒子的形像。這是我們的定命，是神在已過的永遠所決定的。"]],["3",["模成是變化的最終結果，包括我們裏面素質和性情的變化，和我們外面樣式的變化，好使我們與神而人者的基督，在榮耀裏的形像相配。祂是原型，我們是大量產品。我們這些產品裏外兩面的變化，都是生命之靈的律（2）在我們裏面運行的結果。"]],["4",["神的豫知、豫定和呼召，是要為祂的長子豫備並產生許多弟兄，（見約二十17註2，）叫他們一面和祂的長子同作神的眾子，有神的生命和性情，叫神得著彰顯；一面作祂長子的眾肢體，構成祂長子的身體，作神在祂長子裏面的團體彰顯，就是神長子的豐滿，也是神在祂長子裏的豐滿。（弗一23，三19。）"]],["5",["基督從永遠就是神的獨生子，（約一18，）到神差祂到世上來時，仍是神的獨生子。（約壹四9，約一14，三16。）等祂經過死進入復活，將祂的人性提高到祂的神性裏，祂就帶著祂死而復活的人性，在祂的神性裏，在復活中生為神的長子；（徒十三33；）同時也在祂的復活裏，帶著所有信祂的人一同復活，（彼前一3，）和祂一同生為神的眾子，使他們成為祂的許多弟兄，好構成祂的身體，作神在祂裏面的團體彰顯。","基督是神的獨生子，有神性而無人性，乃是與神同樣的自有永有。祂成為神的長子，兼有神性和人性，乃是從祂的復活開始。祂這長子，是神產生眾子的根據、標本、元素和憑藉；所產生的眾子，就是信入祂，與祂聯結為一的眾信徒，在生命和性情上完全與祂相同，也像祂一樣兼有人性和神性，作祂的擴增和彰顯，以彰顯那永遠的三一神，直到永永遠遠。今日的召會，是這彰顯的雛形，（弗一23，）永世裏的新耶路撒冷，就成為這彰顯的終極表現。（啟二一11。）本書啟示神將罪人作成祂的兒子，就是為著這一彰顯，（十二5，）也是指向這一彰顯的終極表現。（弗三19。）"]]]},"啟21:2":{"t":"我又看見聖城¹新耶路撒冷²由神那裏從天而降，豫備好了，就如³新婦妝飾整齊，等候丈夫。","n":[["1",["本書的啟示是用表號構成的，（見一1註2，）其中的重大事物都用表號表徵、描述，（因為深奧，用人的明言難以盡述，）如燈臺表徵召會，並星表徵召會的使者；（一；）耶洗別表徵墮落邪淫的羅馬教；（二下；）碧玉和寶石表徵生命和救贖的神；（四3；）獅子和羔羊表徵得勝救贖的基督；（五；）四馬表徵福音、戰爭、饑荒和死亡的普及；（六上；）宇宙婦人表徵神歷代的贖民，並她的孩子表徵神贖民中的強勝者，以及龍、蛇表徵殘忍、狡猾的撒但魔鬼；（十二；）海中上來的獸表徵敵基督，並地中上來的獸表徵假申言者；（十三；）莊稼表徵在神的耕種下生長的人，並初熟的果子表徵在神的耕種下生長之人中的早熟者；（十四；）大巴比倫表徵宗教和物質兩面的羅馬；（十七～十八；）新婦表徵成熟備妥可作基督配偶的聖徒；（十九上；）餘者還有好多；以及最後，也是最大的一個表號，就是新耶路撒冷，表徵神歷代所贖，經過重生、變化、得榮之聖徒總和的結構，並不是一座物質、無生命的城，乃是一個集體活的人位，如新婦，有基督這奇妙的人位為丈夫。（2。）","新耶路撒冷是歷代以來所有蒙神救贖的聖徒活的組合。她是基督的新婦，作基督的配偶；（約三29；）也是神的聖城，作神的居所，神的帳幕。（3。）這就是那屬天的耶路撒冷，（來十二22，）是神為我們豫備的，也是亞伯拉罕、以撒、雅各所羨慕的。（來十一10，16。）這也是在上的耶路撒冷，是我們眾人的母。（加四26。）作基督新婦的新耶路撒冷，是出自她的“丈夫”基督，而成為祂的配偶，正如夏娃是出自她的丈夫亞當，而成為亞當的配偶。（創二21～24。）她是藉著有分於基督的生命和性情的豐富，所豫備好的。作神的聖城，她全然聖別歸神，完全被神的聖別性情浸透，成為神的居所。","在新舊兩約，神將祂的選民比作自己的配偶（賽五四6，耶三1，結十六8，何二19，林後十一2，弗五31～32）和居所。（出二九45～46，民五3，結四三7，9，詩六八18，林前三16～17，六19，林後六16，提前三15。）配偶是在愛裏使神得著滿足，居所是在彰顯中使神得著安息。這兩面要終極完成於新耶路撒冷。因著她，神在愛裏得著完全的滿足，並在彰顯中得著終極的安息，直到永遠。"]],["2",["所有蒙神救贖的聖徒被提到諸天之上以後，他們就成了新耶路撒冷，由神那裏從天而降。這指明我們永遠的居所不在天上，乃在新地上的新耶路撒冷。"]],["3",["新耶路撒冷是一個新婦，指明她不是一座物質的城，乃是一個團體的人位。對基督，她是新婦，為叫祂得滿足；對神，她是一個帳幕，為著神可有安居之所，並藉以彰顯祂自己。"]]]},"啟21:7":{"t":"¹得勝的，必承受這些為業，我要作他的神，他要作我的²兒子。","n":[["1",["這裏的得勝，與二、三章用了七次的得勝意義不同。這裏的得勝指因信得勝，與約壹五4～5者同。二、三章的得勝，使得勝的信徒彀資格有分於千年國的享受，作神時代行政裏特別的賞賜；這裏的得勝，使所有的信徒彀資格有分於新耶路撒冷，連同其中一切的享受，作神永遠救恩共同的分。"]],["2",["3節的“百姓”就是24節的列國，他們要在新天新地作神的百姓，不是作神的兒子。他們要住在新耶路撒冷之外的新地上，且要在新天新地中享受共同的福。（見24註1。）本節的“兒子，”不是指神的百姓，乃是指歷代蒙救贖的聖徒。他們要住在新耶路撒冷，有分於新耶路撒冷一切的享受，事奉神和羔羊，並要作王，直到永遠。（二二3～5。）"]]]},"啟21:12":{"t":"有¹高大的牆；有²十二個門，門上有十二位³天使；門上又寫著⁴以色列十二個支派的名字；","n":[["1",["牆是為著分別和保護。新耶路撒冷要絕對分別歸神，也要完全保護神的權益。這牆是高大的，今天所有的信徒都需要這樣高大的牆，來分別並保護他們。"]],["2",["門是為著交通、進出的。十二是神行政中絕對完全並永遠完整的數字。因此，十二個門指明為著神的行政，新耶路撒冷的交通是絕對完全且永遠完整的。"]],["3",["在神永遠的經綸裏，天使是服役的靈，（來一14，）為那些承受救恩，並有分於新耶路撒冷（新天新地的中心）永遠之福的人效力。這些天使要為我們的產業看門，我們卻要享受神永遠經綸裏豐富的產業。"]],["4",["以色列，直譯，以色列的眾子。在這裏，以色列代表舊約的律法，指明新耶路撒冷的門上有律法的代表。律法在看守並觀看，以保證聖城一切的交通、進出都合乎律法的要求。十二門上有這以色列十二支派的名字，也表徵以色列十二支派是聖城的入門，藉著福音的傳揚，引人進入三一神的豐富，享受其中的供應。","這裏的以色列也指明新耶路撒冷的組成，包括舊約所有蒙救贖的聖徒。"]]]},"啟21:14":{"t":"城牆有十二¹根基，根基上有羔羊十二²使徒的十二個名字。","n":[["1",["這裏的根基不是林前三10～11所說的根基─基督，乃是羔羊的十二使徒。今天召會是建造在使徒和申言者的根基上；（弗二20；）在永世裏，不再需要申言者，所以只有使徒為聖城的根基。"]],["2",["這裏的使徒代表新約的恩典，表徵新耶路撒冷是建造在神的恩典上。進入聖城乃是照著神的律法，城卻是建造在神的恩典上。這裏的“使徒”也含示新耶路撒冷的組成，不僅包括以色列所代表的舊約聖徒，也包括使徒所代表的新約聖徒。"]]]},"約12:24":{"t":"我實實在在的告訴你們，一粒麥子不¹落在地裏死了，仍舊是一粒；若是死了，就結出²許多子粒來。","n":[["1",["按屬世的看法，這時耶穌正處於祂的黃金時期。因著拉撒路復活，許多猶太人對主極為尊崇，熱烈歡迎，（12～19，）甚至希利尼人也來求見。（20～22。）但祂寧願像一粒麥子，落在地裏死了，好為著召會結出許多子粒來。"]],["2",["這許多子粒成了基督在復活裏的擴增，這擴增就是基督經過死而復活所進入的榮耀。（路二四26。）從本章23節到十七章末了，乃是詳論這榮耀的奧祕。基督原是與神同有榮耀。（十七5。）祂成為肉體，使祂神聖的榮耀都遮藏在祂的肉體裏。藉著祂的死與復活，祂這榮耀就得著釋放，產生許多子粒，成為祂的擴增，彰顯祂的榮耀。23、28，十三31～32，十四13，十五8，十六14和十七1、4、5、10、22、24所說的，都與這榮耀有關。這榮耀在祂末後對門徒所說十四至十六章的話裏，有三個具體的團體彰顯，就是十四2所說父的家（召會），十五1～5所說葡萄樹的枝子（基督身體的組成成分），和十六21所說一個新生的團體人（新人）。這三者都是指召會，說明召會乃是榮耀的基督經過死與復活所產生的榮耀擴增。在這榮耀的擴增裏，神子基督得著榮耀，叫父神在祂的得榮裏也得著榮耀，就是藉著召會，得著豐滿的彰顯。（弗三19～21。）這需要在三一神裏的一來維持。所以，主在十七章結束的禱告，特別為此祈求。（十七20～23。）基督這榮耀的擴增，乃是約翰福音奧祕啟示的高峰，其終極完成是約翰所寫啟示錄中的新耶路撒冷。那新的聖城是基督歷代擴增的集大成，基督那神聖的榮耀，要在其中彰顯得完滿盡致；父神在子神的得榮中，也要得著永遠無比的榮耀，成為祂在永世裏豐滿的彰顯，完成祂永遠的經綸，直到永永遠遠。"]]]},"代下3:1":{"t":"所羅門在耶路撒冷，耶和華向他父親大衛顯現的¹摩利亞山上，就是耶布斯人阿珥楠的禾場上，大衛所豫備的地方，開工建造耶和華的殿。","n":[["1",["神揀選耶路撒冷作敬拜祂的中心，開始於祂在創二二2對亞伯拉罕所說的話，（見創二二2註2，）並清楚見於申十二5～18。（見申十二5～18註。）因此，所羅門不需要揀選建殿的地方，因為神已經選好地方，並且告訴了大衛。（撒下二四18～25。）"]]]},"來12:22":{"t":"但你們乃是來到¹錫安山，來到活神的²城，屬天的耶路撒冷，來到千萬天使³整體的聚集，","n":[["1",["22～24節所說的事物，是屬天的、屬靈的，與18～19節所列屬地、物質的事物成為對比，表徵恩典的一面。在恩典這面，眾長子和義人的靈，都是藉恩得救的。在舊約之下的人是來到律法那面，我們新約之下的基督徒是來到恩典這面。因此，我們不在律法之下，乃在恩典之下。（羅六14。）這一段話，（18～24，）與加四21～31一樣，給我們看見，我們不在律法的轄制下，乃在恩典的自由下，作承受產業的後嗣。這就是我們的長子名分！我們不該墜落離開恩典（15）而放棄長子的名分，乃該接受恩典。（28。）恩典這面的事物是屬天的，但還沒有完全在天上。召會中許多的長子還在地上，義人（舊約聖徒）的靈還在樂園裏，就是亞伯拉罕所在的地方，（路十六22～23，25～26，）也是主耶穌和得救的強盜，釘死十架以後所去的地方。（路二三43。）","在律法那面所列的六項，沒有一項是可樂的。首先有一座火燒著的山！誰願靠近這樣的地方？接著有黑暗、幽暗、和狂暴的旋風，最後還有可怕的角聲，和嚴厲警告說話的聲音。這一切呈現出可怕的景象！但在恩典這面，一切都是可樂的！這裏的八項可看為四組。高升的錫安山和榮美屬天的耶路撒冷是第一組，指神的居所和祂宇宙行政的中心。這地方何等可愛！然後是歡呼慶祝的天使，與所效力要承受救恩的人緊緊相聯；（一14；）這些天使和召會中有福的眾長子，形成這景象中的第二組。天使的聚集是何等歡樂的展示！他們慶賀那些承受救恩的人成了眾長子的召會，有分於新約的福分。審判眾人的公義之神，以及義人（舊約聖徒）的靈，（他們的身體尚未復活，不配列在這裏，）同為第三組，為展示神如何是義的，就因舊約中義之聖徒的信心，稱他們為義。末了，是親愛的主耶穌，和祂所灑的寶血，構成最後一組。主耶穌是新約那更美之約的中保，祂的血說出更美的事。這指明祂用更美的血立了更美的約；也指明祂已經死了，將這新約當作新遺命，遺贈給信徒；且指明祂現今是這新遺命的中保、執行者，使其中所包含一切有福的事實都完全實現。這是何等可樂的景象！與律法那面的景象是何等的對比！在律法那面，沒有說到神、救主，連天使也沒有說到！難怪在那裏一個得救的人也看不到！然而，恩典這面的景象，有稱人為義的神，有救主，就是新遺命的中保，連同祂說話的血，有效力的天使，和得救之人的聚集（召會），以及得稱義之聖徒的靈。律法那面的景象，結束於可怕的角聲和警告的話；恩典這面的景象，結束於同情的中保和辯護的說話。看過這樣的對比以後，誰還那麼愚昧，離開恩典的一面而轉向律法的一面！恩典這面的八項不僅是屬天的、屬靈的，也是永遠的。因此，即使天被震動，（26，）這八項永遠的事物，仍要常存。（27。）"]],["2",["見十一10註1。"]],["3",["或，節期的聚集。原文意，普遍的聚集，全部的聚集，用以說到慶祝公眾節期的聚集，就如奧林匹克運動會。整個新約時代就是一個節期，千萬的天使，就是在新約下，為承受救恩者效力的服役之靈，（一14，）乃是一個整體的聚集，慶祝“這麼大的救恩”（二3）這美妙的節期。這是宇宙中最大、最令人興奮的運動會！路十五7、10和彼前一12主的話，都可指明這一點。"]]]},"來12:23":{"t":"來到名字¹記錄在諸天之上²眾長子的召會，來到審判眾人的神這裏，來到被成全之義人的靈這裏，","n":[["1",["召會的眾長子雖然還未在天上，他們的名字卻已記錄在諸天之上。"]],["2",["見16註1二段。"]]]},"啟14:1":{"t":"我又觀看，看哪，羔羊站在¹錫安山上，同祂還有²十四萬四千人，額上都寫著³祂的名，和祂父的名。","n":[["1",["這裏的錫安山不是地上的，乃是天上的。（來十二22。）"]],["2",["這該是帶有象徵意義的實際數字。十四萬四千是十二乘十二的一千倍。十二是神永遠行政裏完整的數字。一百四十四（二一17）是十二乘十二，表徵完整的完整，最豐滿的終極完整。這裏乃是這終極完整的一千倍。"]],["3",["這些早期的得勝者，額上寫著羔羊的名和父的名，表明他們與羔羊和父是一，屬於羔羊和父，與那些拜獸的人，額上寫著獸的名相對。（十三16～17。）"]]]},"啟14:2":{"t":"我聽見從天上有聲音，像¹眾水的聲音，又像²大雷的聲音，並且我所聽見的，好像彈琴的所彈的³琴聲。","n":[["1",["眾水表徵聲音鬨嚷。"]],["2",["大雷表徵聲音莊嚴。"]],["3",["琴聲表徵聲音悅耳。"]]]},"啟14:3":{"t":"他們在寶座前，並在四活物和眾長老前唱新歌；除了¹從地上買來的那十四萬四千人以外，²沒有人能學這歌。","n":[["1",["“從地上”證明他們已不在地上，乃是被提到諸天之上了。"]],["2",["這首批得勝者所唱的新歌，該與他們對羔羊的經歷相合；沒有人能學這歌，因為沒有人有他們對基督那特別又特殊的經歷。"]]]},"啟14:4":{"t":"這些人未曾與婦女在一起受到玷污，他們原是¹童身。羔羊無論往那裏去，他們都跟隨祂。他們是從人間買來的，作²初熟的果子歸與神和羔羊；","n":[["1",["這該是主在太十九11～12所說的童身。然而，同樣的原則也可適用於姊妹。（林前七7，37。）"]],["2",["這些早期的得勝者在神的田地裏是初熟的，因此他們要在莊稼收割以先被收割，作初熟的果子歸與神和羔羊。以後到了14～16節，莊稼纔被收割。這是說，得勝者要在莊稼收割以先被提到諸天之上，正如美地的初熟果子要在莊稼收割以先被收割，且被帶到神的殿中。（利二三10～11，出二三19。）6～13節所記的事，都是發生在大災難期間；（太二四21；）這清楚的指明，且有力的證明，首批得勝者，就是1～5節所說初熟的果子，要在大災難之前被提；14～16節的莊稼包括大體信徒，要在大災難末了被提。見十二6註1。"]]]},"啟14:5":{"t":"在他們口中¹找不著謊言，他們是²沒有瑕疵的。","n":[["1",["魔鬼是所有說謊之人的父，謊言是從他而出。（約八44。）在得勝者口中找不著謊言，指明在他們的表現裏毫無撒但的成分。"]],["2",["沒有瑕疵，指明他們沒有斑點、皺紋，在神的聖別裏是完全的，（弗五27，）是絕對聖別歸神，且完全被神浸透的。（帖前五23。）"]]]},"申16:16":{"t":"你一切的男丁，要在除酵節、七七節、住棚節，一年三次，在耶和華你神所選擇的地方朝見祂。他們不可空手朝見耶和華；","n":[]},"詩132:13":{"t":"因為耶和華揀選了¹錫安，願意當作自己的居所，","n":[["1",["錫安作為耶和華的安息之所，（14，）豫表眾召會中的得勝者。見四八2註1。"]]]},"啟21:22":{"t":"¹我未見城內有²殿，因主神全能者和羔羊為城的²殿。","n":[["1",["在舊約裏，神的帳幕是神殿的前身。新耶路撒冷乃是神的帳幕，（3，）作神的殿。這指明在新天新地裏，神的殿要擴大成為一座城。城的尺寸，長寬高都相等，（16，）指明全城就是至聖所，也就是內殿；所以城內沒有殿。"]],["2",["原文意內殿。主神全能者和羔羊就是內殿；這表徵神和羔羊自己是我們事奉神並居住的地方。聖城是神的帳幕，是為給神居住；神和羔羊是殿，是為給蒙救贖的聖徒居住。在新天新地裏，新耶路撒冷乃是神與人相互的居所，直到永遠。"]]]},"弗4:16":{"t":"¹本於祂，全身藉著每一²豐富³供應的節，⁴並藉著⁵每一部分依其度量而有的⁶功用，得以⁷聯絡在一起，並⁷結合在一起，便⁸叫⁹身體漸漸長大，以致在¹⁰愛裏把自己建造起來。","n":[["1",["我們在生命裏的長大，是長到元首基督裏面；但我們在基督身體裏的功用，是從元首出來的。首先我們長到元首裏面，然後我們就有一些本於（出於）元首為著祂的身體建造的東西。"]],["2",["原文這裏有指定冠詞，以加強語氣。因此，這裏的豐富供應，該是特殊的供應，基督的供應。"]],["3",["供應的節，指像11節所說特別有恩賜的人。"]],["4",["並藉著，大多數古卷作，照著。"]],["5",["每一部分，指身體的每一肢體。基督身體的每一肢體，都有其藉生命的長大與恩賜的發展而有的度量，可以為著基督身體的長大而盡功用。"]],["6",["原文，同三7，西一29之運行，與林前十二6之功效同源。"]],["7",["聯絡，含使之適於安置意。結合，含交織意。"]],["8",["基督的身體藉著供應的節，和盡功用的各部分，叫自己長大。"]],["9",["基督身體的長大，就是基督在召會裏的加增，結果叫基督的身體把自己建造起來。"]],["10",["見15註1。"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
