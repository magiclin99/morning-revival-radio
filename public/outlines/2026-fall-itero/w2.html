<title>亞伯拉罕、以撒、雅各的神 第二週</title>

<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一","items":[{"lv":1,"label":"壹、","text":"亞伯拉罕的神（出三15），見於祂對待亞伯拉罕的事如下：","refs":[{"label":"出3:15","keys":["出3:15"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕的神是榮耀的神，見於祂向亞伯拉罕第一次顯現以及第一次呼召並第一次說話時，對亞伯拉罕如同巨大的磁石和極大的推動力，使他從屬撒但拜偶像的國出來—創十一31，徒七2～4上：","refs":[{"label":"創11:31","keys":["創11:31"]},{"label":"徒7:2-4","keys":["徒7:2","徒7:3","徒7:4"]}]},{"lv":3,"label":"1.","text":"神藉着一再向亞伯拉罕顯現，將祂自己灌輸到他裏面，使他經歷屬靈的注入—創十二1～3、7～8，十三14～17，十五1～7，羅四3，創十八17～19。","refs":[{"label":"創12:1-3","keys":["創12:1","創12:2","創12:3"]},{"label":"創12:7-8","keys":["創12:7","創12:8"]},{"label":"創13:14-17","keys":["創13:14","創13:15","創13:16","創13:17"]},{"label":"創15:1-7","keys":["創15:1","創15:2","創15:3","創15:4","創15:5","創15:6","創15:7"]},{"label":"羅4:3","keys":["羅4:3"]},{"label":"創18:17-19","keys":["創18:17","創18:18","創18:19"]}]},{"lv":3,"label":"2.","text":"亞伯拉罕所以能到迦南，是因神的堅持不放；神緊緊抓住了祂的子民；祂是堅持不放的神—約十28～30，猶24。","refs":[{"label":"約10:28-30","keys":["約10:28","約10:29","約10:30"]},{"label":"猶1:24","keys":["猶1:24"]}]},{"lv":3,"label":"3.","text":"神向亞伯拉罕啓示爲稱義信祂之人的神，將祂自己灌輸到他們裏面作相信的元素，成爲他們的信；這信就是他們對祂的珍賞，作爲對祂吸引的神聖回應—創十五1～6，來十二1～2上，加二20。","refs":[{"label":"創15:1-6","keys":["創15:1","創15:2","創15:3","創15:4","創15:5","創15:6"]},{"label":"來12:1-2","keys":["來12:1","來12:2"]},{"label":"加2:20","keys":["加2:20"]}]}]},{"day":"週二","items":[{"lv":2,"label":"二、","text":"亞伯拉罕的神是賜福的神，見於祂向亞伯拉罕第二次呼召並第二次說話時，應許必叫他成爲大國，使他的名爲大，並使他成爲別人的福，地上的萬族都必因他得福；這話吸引亞伯拉罕前去進入神聖應許的美地—創十二1～4：","refs":[{"label":"創12:1-4","keys":["創12:1","創12:2","創12:3","創12:4"]}]},{"lv":3,"label":"1.","text":"按照加拉太三章十四節，這裏所應許的福實際上就是作爲那靈的神自己；最大的福乃是三一神—父、子、靈—作爲經過過程、包羅萬有賜生命的靈，極其主觀的住在我們裏面，給我們享受—六18，腓一19。","refs":[{"label":"加3:14","keys":["加3:14"]},{"label":"加6:18","keys":["加6:18"]},{"label":"腓1:19","keys":["腓1:19"]}]},{"lv":3,"label":"2.","text":"無論誰咒詛神的子民，必受咒詛；無論誰祝福神的子民，必蒙祝福—民二三21，二四5、9，參林前一2，林後五17。","refs":[{"label":"民23:21","keys":["民23:21"]},{"label":"民24:5","keys":["民24:5"]},{"label":"民24:9","keys":["民24:9"]},{"label":"林前1:2","keys":["林前1:2"]},{"label":"林後5:17","keys":["林後5:17"]}]}]},{"day":"週三","items":[{"lv":2,"label":"三、","text":"亞伯拉罕的神是這地的神，見於祂第二次顯現並第三次說話時，應許亞伯拉罕，要把迦南地賜給他的後裔—創十二6～7。","refs":[{"label":"創12:6-7","keys":["創12:6","創12:7"]}]},{"lv":2,"label":"四、","text":"亞伯拉罕的神是祕密照顧祂選民的神，見於祂拯救亞伯拉罕脫離法老對他妻子的侮辱—10～20節。","refs":[{"label":"創12:10-20","keys":["創12:10","創12:11","創12:12","創12:13","創12:14","創12:15","創12:16","創12:17","創12:18","創12:19","創12:20"]}]},{"lv":2,"label":"五、","text":"亞伯拉罕的神是安慰並鼓勵的神，見於祂在羅得離別亞伯拉罕後，第四次說話時，應許亞伯拉罕，要把他向四方所能看見的迦南地賜給他和他的後裔，也要使他的後裔如同地上的塵沙那樣多—十三14～17：","refs":[{"label":"創13:14-17","keys":["創13:14","創13:15","創13:16","創13:17"]}]},{"lv":3,"label":"1.","text":"基督這亞伯拉罕的後裔必須作到我們裏面，使祂藉着我們生出來，好叫祂得着擴增—加三16，一15～16，二20，四19。","refs":[{"label":"加3:16","keys":["加3:16"]},{"label":"加1:15-16","keys":["加1:15","加1:16"]},{"label":"加2:20","keys":["加2:20"]},{"label":"加4:19","keys":["加4:19"]}]},{"lv":3,"label":"2.","text":"迦南地表徵包羅萬有的基督作爲包羅萬有的靈，在我們的靈裏給我們享受，使我們被祂構成，作祂團體的彰顯—西一12，二6～7，加三14，五16、25。","refs":[{"label":"西1:12","keys":["西1:12"]},{"label":"西2:6-7","keys":["西2:6","西2:7"]},{"label":"加3:14","keys":["加3:14"]},{"label":"加5:16","keys":["加5:16"]},{"label":"加5:25","keys":["加5:25"]}]}]},{"day":"週四","items":[{"lv":2,"label":"六、","text":"亞伯拉罕的神是至高的神，天地的主，見於祂在亞伯拉罕與四王爭戰後，藉着祂的祭司麥基洗德，將祂神聖的供應帶給亞伯拉罕，並爲他祝福—創十四17～20。","refs":[{"label":"創14:17-20","keys":["創14:17","創14:18","創14:19","創14:20"]}]},{"lv":2,"label":"七、","text":"亞伯拉罕的神是那是盾牌並極大賞賜的神，見於祂在亞伯拉罕懼怕四王報復，而向他第五次說話時（這次是在異象中），向他指出那些按神聖性情是他屬天後裔的，要如天上的星那樣多，是地上任何人所不能摸着的；亞伯拉罕信耶和華，耶和華就以此算爲他的義—十五1～6。","refs":[{"label":"創15:1-6","keys":["創15:1","創15:2","創15:3","創15:4","創15:5","創15:6"]}]},{"lv":2,"label":"八、","text":"亞伯拉罕的神是信實的神，見於祂在亞伯拉罕沉睡中，第六次向他說話時，對他豫言，那些按屬人性情是他屬地後裔的，必寄居埃及，服事埃及人，被他們苦待四百年，到了第四代必回到迦南；祂是信實的神，也見於祂與亞伯拉罕立約，要把從埃及河直到伯拉大河之地賜給他的後裔—12～21節。","refs":[{"label":"創15:12-21","keys":["創15:12","創15:13","創15:14","創15:15","創15:16","創15:17","創15:18","創15:19","創15:20","創15:21"]}]},{"lv":2,"label":"九、","text":"亞伯拉罕的神是靜默的神，由於亞伯拉罕在八十六歲時聽從他妻子撒拉，娶了夏甲，憑着肉體得着一個兒子（十六1～4、15～16）；然後神向亞伯拉罕靜默了十三年，直到他九十九歲，神纔再向他顯現（十七1）。","refs":[{"label":"創16:1-4","keys":["創16:1","創16:2","創16:3","創16:4"]},{"label":"創16:15-16","keys":["創16:15","創16:16"]},{"label":"創17:1","keys":["創17:1"]}]}]},{"day":"週五","items":[{"lv":2,"label":"十、","text":"亞伯拉罕的神是全豐全足的神，見於祂向亞伯拉罕第三次顯現並第七次說話時，作給人行割禮的神，割除神選民在肉體裏天然的人，使他們得以成爲神的新造；這新造是由那憑神恩典而生的以撒所表徵，不是由那憑亞伯拉罕肉體而生的以實瑪利所表徵—1～21節，加四22～31：","refs":[{"label":"創17:1-21","keys":["創17:1","創17:2","創17:3","創17:4","創17:5","創17:6","創17:7","創17:8","創17:9","創17:10","創17:11","創17:12","創17:13","創17:14","創17:15","創17:16","創17:17","創17:18","創17:19","創17:20","創17:21"]},{"label":"加4:22-31","keys":["加4:22","加4:23","加4:24","加4:25","加4:26","加4:27","加4:28","加4:29","加4:30","加4:31"]}]},{"lv":3,"label":"1.","text":"神被啓示爲全豐全足的神（原文，El Shaddai，伊勒沙代），爲叫相信祂的人行在祂面前，不斷享受祂和祂全豐全足的供應，並得着神加到他們裏面，作他們得以完全的元素和因素—創十七1。","refs":[{"label":"創17:1","keys":["創17:1"]}]},{"lv":3,"label":"2.","text":"伊勒沙代 （El Shaddai） 這神聖的稱呼，由兩個希伯來字組成—El，伊勒，意，大能者；Shaddai，沙代，源自另一希伯來字，意，胸部或乳房。","refs":[]},{"lv":3,"label":"3.","text":"因此，神乃是有乳房的大能者，就是全豐全足的大能者，作蒙祂呼召，不斷接受祂之人的滋養者、加力者和全備供應者—腓一19～21上，加三2、5，約一16。","refs":[{"label":"腓1:19-21","keys":["腓1:19","腓1:20","腓1:21"]},{"label":"加3:2","keys":["加3:2"]},{"label":"加3:5","keys":["加3:5"]},{"label":"約1:16","keys":["約1:16"]}]},{"lv":3,"label":"4.","text":"全豐全足的神乃是釘十字架的神，爲着了結我們肉體裏天然的人；祂也是復活的神，爲着新造使我們的新人有新生的起頭—創十七1～21，二二1～10，西二11，加五24，彼前一3，林後五17，腓三3。","refs":[{"label":"創17:1-21","keys":["創17:1","創17:2","創17:3","創17:4","創17:5","創17:6","創17:7","創17:8","創17:9","創17:10","創17:11","創17:12","創17:13","創17:14","創17:15","創17:16","創17:17","創17:18","創17:19","創17:20","創17:21"]},{"label":"創22:1-10","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10"]},{"label":"西2:11","keys":["西2:11"]},{"label":"加5:24","keys":["加5:24"]},{"label":"彼前1:3","keys":["彼前1:3"]},{"label":"林後5:17","keys":["林後5:17"]},{"label":"腓3:3","keys":["腓3:3"]}]}]},{"day":"週六","items":[{"lv":2,"label":"十一","text":"、亞伯拉罕的神是具有屬人友情的神，見於祂作一個人，有人的形狀（在祂向亞伯拉罕第四次顯現並第八次說話時），在人性的水平上，來訪問祂的朋友亞伯拉罕（代下二十7，賽四一8，雅二23）；亞伯拉罕與祂同行，祂也與亞伯拉罕談話，如人和朋友之間談話一樣，說到祂要審判所多瑪，就是祂朋友的姪兒羅得和家人所住的地方（創十八～十九）。","refs":[{"label":"代下20:7","keys":["代下20:7"]},{"label":"賽41:8","keys":["賽41:8"]},{"label":"雅2:23","keys":["雅2:23"]},{"label":"創18-19","link":"創18:1","count":71,"chapters":2,"from":"18:1"}]},{"lv":2,"label":"十二","text":"、亞伯拉罕的神是在人性裏具有友情的神，見於祂打發亞伯拉罕的姪兒及其兩個女兒，從所多瑪的傾覆之中出來，因祂記念祂的密友亞伯拉罕—29、12～22節。","refs":[{"label":"創19:29","keys":["創19:29"]},{"label":"創19:12-22","keys":["創19:12","創19:13","創19:14","創19:15","創19:16","創19:17","創19:18","創19:19","創19:20","創19:21","創19:22"]}]},{"lv":2,"label":"十三","text":"、亞伯拉罕的神是給人友愛照顧的全能神，見於祂用祂全能的大力拯救祂的密友亞伯拉罕，使他的妻子免於落在基拉耳王亞比米勒手中—二十章。","refs":[{"label":"創20","link":"創20:1","count":18,"chapters":1,"from":"20:1"}]},{"lv":2,"label":"十四","text":"、亞伯拉罕的神是不改變的神，見於祂向亞伯拉罕第九次說話時，守住祂恩典的原則，承認亞伯拉罕從撒拉所生的兒子以撒，是他惟一的兒子—二一1～12。","refs":[{"label":"創21:1-12","keys":["創21:1","創21:2","創21:3","創21:4","創21:5","創21:6","創21:7","創21:8","創21:9","創21:10","創21:11","創21:12"]}]},{"lv":2,"label":"十五","text":"、亞伯拉罕的神是試煉人的神，見於祂第十次對亞伯拉罕說話時，試驗祂親密的屬人朋友亞伯拉罕，要他將所愛的獨生子作爲燔祭獻給神—二二1～10。","refs":[{"label":"創22:1-10","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10"]}]},{"lv":2,"label":"十六","text":"、亞伯拉罕的神是豫備的三一神（原文爲，耶和華以勒），見於祂第十一次向亞伯拉罕說話時，豫備一隻公羊，代替以撒爲燔祭獻給祂（就是耶和華的使者—基督）—11～14節。","refs":[{"label":"創22:11-14","keys":["創22:11","創22:12","創22:13","創22:14"]}]},{"lv":2,"label":"十七","text":"、亞伯拉罕的神是賜福的三一神，見於祂第十二次（末次）向亞伯拉罕說話時，應許亞伯拉罕，祂（就是耶和華的使者—基督）必賜福給亞伯拉罕，必叫他的後裔繁增，如同天上的星，海邊的沙，並且地上萬國都必因他的後裔（基督）得福—15～18節。","refs":[{"label":"創22:15-18","keys":["創22:15","創22:16","創22:17","創22:18"]}]},{"lv":2,"label":"十八","text":"、亞伯拉罕的神是在人的水平上友情的神，見於引領祂朋友亞伯拉罕的老僕人，去爲亞伯拉罕的兒子以撒娶妻—二四章。","refs":[{"label":"創24","link":"創24:1","count":67,"chapters":1,"from":"24:1"}]},{"lv":1,"label":"貳、","text":"總括而言，亞伯拉罕的神乃是藉着祂的顯現，帶着呼召，在異象中，在屬人的友情裏說話的神，向祂在地上親密的朋友揭示，祂按着祂的心願，渴望祂的朋友成爲甚麼，以及要祂的朋友作甚麼，以完成神聖三一的永遠經綸。","refs":[]}]}],"days":[{"day":"週一","feed":{"verses":[["徒七2～4","『…我們的祖宗亞伯拉罕…，榮耀的神向他顯現，對他說，「你要從你本地和你親族中出來，往我所要指示你的地去。」他就從迦勒底人之地出來，住在哈蘭。他父親死了以後，神使他從那裏遷到你們現在所住之地。』"]],"paras":["在聖經裏，我們找不到另一個人像亞伯拉罕那樣多次與神接觸，有神向他顯現，並對他說話。在神對待亞伯拉罕的事上，神啓示祂自己是怎樣的一位神。在出埃及三章十五節，神宣告祂是亞伯拉罕的神，但沒有說到細節。乃是在神對待亞伯拉罕的許多事上，神所是的細節纔揭示出來。","亞伯拉罕的神乃是榮耀的神。…神在榮耀裏向他顯現爲榮耀的神。（徒七2～4上。）神的榮耀就是神自己彰顯出來。…如果神顯現出來，那就是榮耀。神在祂顯現裏的榮耀，可能含示一種輝煌，光明而照耀。（李常受文集一九九一至一九九二年第四册，一二六至一二七頁。）"]},"read":{"paras":["榮耀的神向亞伯拉罕第一次顯現以及第一次呼召並第一次說話時，對亞伯拉罕如同巨大的磁石和極大的推動力，使他從屬撒但拜偶像的國出來。（創十一31。）…亞伯拉罕受了吸引，但創世記給我們看見，他沒有絕對並情願的答應神的呼召。…乃是他的父親帶頭，他跟從。但事實上，激動亞伯拉罕遷離撒但拜偶像之國的那個吸力和動力乃是神。神若沒有來向亞伯拉罕顯爲榮耀的神，亞伯拉罕是不會採取這樣的行動的。那個顯現吸引了他，推動了他。（李常受文集一九九一至一九九二年第四册，一二七頁。）","在神的稱義裏，神呼召墮落的人離開一切，歸向祂自己。所以，神呼召亞伯拉罕時，沒有告訴他該往那裏去，因爲祂的心意是要帶亞伯拉罕歸向祂自己。亞伯拉罕的心必須時時刻刻，一步一步的緊聯於神。他必須爲着每個行動信靠神，一刻也不離開祂的同在。換句話說，亞伯拉罕必須與神是一。","神呼召亞伯拉罕離開迦勒底的吾珥以後，就訓練亞伯拉罕相信祂。…相信神的意思就是信入神，並使我們自己與神成爲一。在這樣的信裏，人承認他一無所是，一無所有，也一無所能。…相信神的意思是了結自己，並讓神成爲我們這人，讓神成爲我們所該是的一切。從我們起初相信祂的時候，我們就該一無所是。我們該完全被了結，並讓神在我們裏面作一切。","人這樣蒙神呼召，活神就將祂自己傳輸到人裏面。傳輸這辭很重要，描述神呼召人時所發生的事。活神自然而然將祂自己傳輸到蒙召的人裏面。結果，他就受神吸引並歸向神。不知不覺，活神的某種元素、某種素質傳輸到他裏面，他就藉着相信神而對神有反應；這反應就是信。","信不是起源於我們，乃是來自神。信不是與基督分開的，因爲信實際上就是基督親自將祂自己傳輸到我們裏面，並在我們裏面產生反應。…神將祂自己傳輸到我們裏面。我們一旦有這傳輸，神的素質滲透我們這人，我們就會經歷屬靈的注入。神的元素這樣注入，會浸透並彌漫我們這人。傳輸帶進注入，這注入用神的元素彌漫我們。…亞伯拉罕的確被榮耀之神的顯現所吸引。被吸引的意思是，神將祂自己傳輸到亞伯拉罕裏面，而他並不知道，也不覺得。…我們若在祂之下坐一小時，祂就會傳輸到我們裏面。這傳輸會引起注入、浸透和彌漫。（羅馬書生命讀經，九○至九一、一○四、一○六頁。）"],"ref":"羅馬書生命讀經，第七篇。"}},{"day":"週二","feed":{"verses":[["創十二2～3","『我必使你成爲大國；我必賜福給你，使你的名爲大；你也要使別人得福。…地上的萬族都必因你得福。』"],["加三14","『爲叫亞伯拉罕的福，在基督耶穌裏可以臨到外邦人，使我們藉着信，可以接受所應許的那靈。』"]],"paras":["在神向亞伯拉罕第二次呼召並第二次說話時，我們看見神也是賜福的神。（創十二1～4。）神不僅呼召他，神也應許他，必叫他成爲大國，必叫他的名爲大。…神不僅賜福給他，也使他叫別人得福。這福乃是新約福音的福。（加三9，14。）…神作爲賜福的神，向亞伯拉罕第二次的呼召並第二次的說話，吸引了亞伯拉罕進入神所應許的美地。（李常受文集一九九一至一九九二年第四册，一二七至一二八頁。）"]},"read":{"paras":["我們的福就是神自己，祂具體化在基督裏，實化爲那靈，爲着分賜到我們裏面，給我們享受。在宇宙中，惟有神自己是福，其他一切都是虛空的虛空。（傳一2。）…我們若有神，就有福。然而，神要成爲我們的福分，這牽涉到一個過程。…這位神的總和，就是經過過程、終極完成、包羅萬有、賜生命、內住的靈。祂這奇妙之靈，乃是從神給我們的福。福音的福乃是那靈，就是經過過程之三一神的總和與集大成。","我們永世屬靈的福，乃是要承受那靈，就是經過過程之三一神的終極完成，作我們的基業。在新天新地的新耶路撒冷裏，我們要享受經過過程的三一神，就是那包羅萬有、終極完成、賜生命的靈。（啓二二1，約七37～39。）甚至今天，最令我們享受的就是內住的靈。","在神完全的福音裏，我們在基督裏不僅接受赦罪、洗淨和潔淨的福，更接受那最大的福，就是三一神—父、子、靈—作爲經過過程、包羅萬有賜生命的靈，極其主觀的住在我們裏面，給我們享受。我們能享受這包羅萬有者作我們每日的分，這是何等的福！","應許給亞伯拉罕之福音的福，乃是包羅萬有的靈，這靈複合着基督的神性、人性、人性生活、包羅萬有的死同其功效、大能的復活同其生命能力、以及升天。這複合的靈就是約翰七章三十九節所說，在耶穌得榮耀之前還沒有的那靈。…聖靈已經有了，但包羅萬有、複合的靈還沒有，因爲在耶穌說這話時，祂尚未得着榮耀，就是尚未釘十字架並復活。（路二四26。）基督藉着釘十字架與復活，成了賜生命的靈，複合的靈，就是經過過程之三一神的終極完成。","這包羅萬有、複合的靈，由出埃及三十章的聖膏油所豫表；這複合的膏油包含了橄欖油和四種香料。一欣橄欖油與四種香料複合，產生了聖膏油。四種香料—沒藥、肉桂、菖蒲、桂皮—與橄欖油複合，製成複合的膏油。在豫表裏，油表徵神的靈；複合的膏，就是油與四種香料調和，表徵複合的靈。…在出埃及三十章之前，『還沒有』這膏，但在三十章之後，這樣的膏就確實存在了。照樣，在基督釘十字架、復活、並得榮之前，還沒有作爲包羅萬有賜生命之靈的那靈；（約七39；）但藉着基督釘十字架並復活的過程，油所豫表之神的靈，成了膏所豫表之複合的靈。（新約總論第十一册，五○至五二頁。）"],"ref":"羅馬書生命讀經，第八篇。"}},{"day":"週三","feed":{"verses":[["創十二7","『…我要把這地賜給你的後裔。亞伯蘭就在那裏爲向他顯現的耶和華築了一座壇。』"],["加三16","『應許原是向亞伯拉罕和他後裔說的。並不是說，和眾後裔，像是指着許多人，乃是說，「和你那後裔，」指着一個人，就是基督。』"]],"paras":["神在第一次顯現時呼召亞伯拉罕。神在第二次顯現時應許亞伯拉罕，要把迦南地賜給他的後裔。〔創十二7。〕一般的說，亞伯拉罕的後裔是指他屬地的子孫，就是猶太人，也就是以色列。但狹義的說，這後裔乃是指基督。（加三16。）","關於以色列國的境界，多年來一直有許多的爭論和會議，但是當耶穌回來作亞伯拉罕獨一的後裔時，祂要清理局面，承受美地。（李常受文集一九九一至一九九二年第四册，一二九頁。）"]},"read":{"paras":["神把這地賜給亞伯拉罕的後裔，因爲神是這地的神，是全地的神，全地的擁有者。地上的政府以爲他們各自的領土是屬於他們的，但事實上全地乃是屬於耶和華神的。（詩二四1。）…神是這地的所有者和擁有者，神有權利把這地賜給祂朋友的子孫。","神運用祂暗中的照顧，祂隱密的照顧，拯救祂朋友亞伯拉罕和他的妻子。〔創十二10～20。〕祂是隱密照顧祂選民的神，拯救祂的選民脫離他們的難處。","神在羅得離別亞伯拉罕後，第四次向亞伯拉罕說話，這給我們看見神是安慰並鼓勵的神。在這次說話中，神應許亞伯拉罕，要把他向四方所能看見的迦南地賜給他和他的後裔，也要使他的後裔如同地上的塵沙那樣多。（十三14～17。）亞伯拉罕和羅得都富有起來。他們有許多羊羣牛羣和帳棚，那地太小，使他們不能同住。亞伯拉罕要羅得揀選他所喜歡的地，羅得就離開了亞伯拉罕。","這時神來安慰並鼓勵亞伯拉罕，應許要把他所能看見的迦南地賜給他和他的後裔，也要使他的後裔如同地上的塵沙那樣多。沒有人能數算神所給亞伯拉罕的後裔有多少，因爲他們是數不清的。在約珥書一章四節說到，有許多亞伯拉罕的子孫被四種蝗蟲所表徵的外邦政權和入侵軍隊所殺害。這些蝗蟲如同地中海的波浪，來沖洗如同塵沙的以色列。但無論有多少塵沙被水沖去，仍然有些沙子留下來。所以在創世記二十二章十七節，亞伯拉罕的子孫不是比作塵沙，乃是比作海邊的沙。…有些好像塵沙，但其中有許多被沖走了。在沖洗之後還留下的人，如同在地中海邊的沙。（李常受文集一九九一至一九九二年第四册，一二九至一三一頁。）","保羅寫歌羅西二章七節的時候，必定想到舊約裏美地的圖畫這包羅萬有之基督的豫表。…在歌羅西二章七節保羅告訴我們，要在基督裏行事爲人，而在加拉太五章十六節他囑咐我們，當憑着靈而行。不但如此，在羅馬八章四節他說到照着靈而行。這些經文指明，今天我們的美地，就是那住在我們靈裏包羅萬有的靈。這包羅萬有的靈，就是包羅萬有的基督這經過過程的三一神。三一神經過過程之後，乃是包羅萬有的基督，成了包羅萬有的靈，給我們經歷並享受。今天這包羅萬有的靈，就是基督自己，住在我們的靈裏，作我們的美地，並活在我們裏面，使我們能在祂這包羅萬有的地上行事爲人。","在基督裏行事爲人，就是享受祂活在我們裏面；祂活在我們裏面，乃是神聖的分賜。當基督活在我們裏面，祂就將經過過程之三一神的豐富，分賜到我們全人裏面。（新約總論第五册，五四五至五四六頁。）"],"ref":"新約總論，第一百四十一篇。"}},{"day":"週四","feed":{"verses":[["創十五5～6","『於是領他走到外邊，說，你向天觀看，數算眾星，能數得過來麼？又對他說，你的後裔將要如此。亞伯蘭信耶和華，耶和華就以此算爲他的義。』"]],"paras":["亞伯拉罕的神是至高的神，天地的主，這是見於祂在亞伯拉罕與四王爭戰後，藉着祂的祭司麥基洗德，將祂神聖的供應帶給亞伯拉罕，並爲亞伯拉罕祝福。（創十四17～20。）…亞伯拉罕帶了三百一十八個精練的家僕，擊敗了擄去羅得的四王。（14～15。）在那次勝利中，亞伯拉罕救回了羅得和他的家人，以及他們的財物。（16。）那時亞伯拉罕需要一些供應和使人舒爽的飲食。神的祭司來供應他餅和酒，作爲一種使人舒爽的飲食，那樣使人舒爽的飲食與主的桌子相似。（太二六26～28。）在主的桌子上，主供應我們，使我們這些疲累困乏的罪人得舒暢。（李常受文集一九九一至一九九二年第四册，一三一頁。）"]},"read":{"paras":["神在第五次向亞伯拉罕說話時（這次在異象中），顯示爲那是盾牌並極大賞賜的神。（創十五1～6。）…亞伯拉罕擊敗四王之後，可能懼怕四王報復；因此神來告訴亞伯拉罕，神要作盾牌保護他。神也要因亞伯拉罕救了羅得而作他的賞賜。神關心羅得，而亞伯拉罕與神合作，救了羅得。…這給我們看見，神在照顧祂子民的事上，是很細緻的。","神…也應許亞伯拉罕，那些按神聖性情是他屬天後裔的，要如天上的星那樣多，是地上任何人所不能摸着的。亞伯拉罕信耶和華，耶和華就以此算爲他的義。（5～6。）在羅馬四章，保羅把這事看作稱義的表樣。神是盾牌，神是極大的賞賜，神也是稱義者。神稱義亞伯拉罕，意思是說，神對亞伯拉罕感到快樂，亞伯拉罕也完全與神和諧一致。他完全蒙神悅納，與神沒有問題。","神…第六次向〔亞伯拉罕〕說話時，顯示爲信實的神。…在創世記十五章十二至二十一節，…神在夢中對亞伯拉罕說話，豫言那些按屬人性情是『地上的塵沙』，（十三16，）是他屬地後裔的，必寄居埃及…，到了第四代要回到迦南。因着神信守祂的應許，所以神也與亞伯拉罕立約，向亞伯拉罕保證，祂必信守祂的應許，把從埃及河（就是尼羅河），直到伯拉大河（就是幼發拉底河）之地賜給他的後裔。","我們也看見，神對亞伯拉罕是靜默的神。這是由於亞伯拉罕在八十六歲時聽從他妻子撒拉，娶了夏甲，憑着肉體得着一個兒子。（十六1～4，15～16。）那件事得罪神到了極點。然後神向亞伯拉罕靜默了十三年，直到他九十九歲，神纔再向他顯現。（十七1。）","亞伯拉罕的姪兒羅得與他離別之後，留下他孤單一人，沒有後嗣承受他的產業，那時神對他說，『凡你所看見的一切地，我都要賜給你和你的後裔，直到永遠。我也要使你的後裔如同地上的塵沙那樣多。』（十三15～16。）這是重複在十二章七節對亞伯拉罕的應許，堅定的保證神的應許是不變的，必使亞伯拉罕的後裔如同地上的塵沙那樣多。","當亞伯拉罕救回他的姪兒羅得和他家人脫離擄掠的四王之後，他懼怕四王可能來尋仇，那時神在十五章，在異象中對亞伯拉罕說話。神應許亞伯拉罕，他的後裔必像天上的星那樣多，（5，）並且與他立約。（李常受文集一九九一至一九九二年第四册，一三一至一三四頁。）"],"ref":"神在祂與人聯結中的歷史，第七章。"}},{"day":"週五","feed":{"verses":[["創十七9～10","『神又對亞伯拉罕說，至於你，你和你的後裔當世世代代遵守我的約。你們所有的男子都要受割禮；這就是我與你並你的後裔所立的約，是你們所當遵守的。』"]],"paras":["在創世記十二章，神說的話是神對亞伯拉罕的應許。在十三章神重複那個應許，並加以保證。在十五章，神與亞伯拉罕立約，（8～12，18，）再次保證那個應許。雖然神一再的應許，並且立約作爲保證，在十六章亞伯拉罕的妻子卻題議亞伯拉罕娶她的使女夏甲爲妾，使她從夏甲得子。（1～3。）亞伯拉罕運用自己的肉體，娶了夏甲爲妾，夏甲就爲他生了一子，起名叫以實瑪利。這實在得罪了神！於是神對亞伯拉罕靜默了十三年之久。","當亞伯拉罕九十九歲時，神來重新堅定祂的約，這約成了割禮之約。（十七9～14。）在祂向亞伯拉罕第三次顯現並第七次說話時，祂這位全豐全足的神成了給人行割禮的神，割除神選民在肉體裏天然的人，使他們成爲神的新造；這新造是由那憑神恩典而生的以撒所表徵，不是由那憑亞伯拉罕肉體而生的以實瑪利所表徵。（1～21，加四22～31。）","割禮就是割除肉體，表徵我們墮落之人，我們天然之人的肉體，必須割除、了結、終止。使徒保羅說，在舊約裏肉身的割禮，乃是基督釘十字架對付我們身體之肉體的完全豫表。（西二11。）…祂的釘十字架，乃是我們真實的割禮，割除我們的肉體及其邪情私慾。（加五24。）（李常受文集一九九一至一九九二年第四册，一三四至一三五頁。）"]},"read":{"paras":["甚至在神與亞伯拉罕立了割禮的約之後，亞伯拉罕仍然不願意放棄以實瑪利。（創十七18。）他求神讓以實瑪利留下來，但神告訴他，神只與以撒堅定所立的約。（19。）神只承認亞伯拉罕從撒拉所生的後裔。按照加拉太四章，以撒是從恩典所生之人的豫表，而恩典是由撒拉所豫表。（22～31。）惟有從神恩典所生的一位，神纔算作是合法後裔，合法後嗣，可以承受神對亞伯拉罕的應許，並神與亞伯拉罕所立的約。","割禮指明神要我們天然的人被割除。然後神要我們在復活裏藉祂的恩典重生，這是由以撒所豫表的。因此，創世記十七章啓示基督的釘十字架與復活。釘十字架就是割除舊人；復活就是產生或生出新人，而新人乃是由以撒所表徵。…以撒的出生是基督復活的表號。神只承認由基督復活所生出的人是亞伯拉罕合法的後裔。（加三29。）在創世記十七章，基督的釘十字架是由割禮所表徵，而基督的復活是由撒拉生以撒所表徵。彼前一章三節說，我們都已經藉基督的復活得重生了。…基督的死了結我們的舊人，基督的復活使我們的新人有新生的起頭，使我們成爲新造。","以撒是自主婦人所生，就是從恩典所生的。他是新約信徒的表樣。我們這些新約的信徒，都是從自主婦人生的，就是從神恩典生的。因此，以撒作爲亞伯拉罕的後裔，豫表基督，（加三16，）也豫表所有新約的信徒。（29。）基督是頭，信徒是祂的身體。以撒不是從舊人憑肉體生的，乃是在復活裏憑神的恩典生的。…創世記十七章事實上是說到新約，就是新遺命。神在新約裏的經綸是全豐全足的。在新約裏，我們得着一切。我們有基督的死割除我們的舊人，我們也藉着基督的復活有了新的出生。（李常受文集一九九一至一九九二年第四册，一三五至一三六頁。）"],"ref":"神在祂與人聯結中的歷史，第七章。"}},{"day":"週六","feed":{"verses":[["創二二13～14","『亞伯拉罕舉目觀看，不料，在他後面有一隻公羊，兩角扣在樹叢中，亞伯拉罕就去取了那隻公羊來，獻爲燔祭，代替他的兒子。亞伯拉罕給那地方起名叫耶和華以勒，直到今日人還說，在耶和華的山上必有豫備。』"]],"paras":["神向亞伯拉罕就像朋友一樣。具有屬人友情的神，作一個人，有人的形狀，（在祂向亞伯拉罕第四次顯現並第八次說話時，）在人性的水平上，（創十八～十九，）來訪問祂的朋友亞伯拉罕。","在創世記十八章這裏，神的顯現是在人性的水平上。亞伯拉罕與神同行，神與亞伯拉罕談話，如同人和朋友之間談話一樣。…祂對亞伯拉罕說到祂要審判所多瑪，就是亞伯拉罕的姪兒羅得和家人所住的地方。神來找祂的朋友，要救祂朋友的姪兒。在羅得的事上，我們再次看見神對祂選民隱密的照顧，祕密的照顧。（李常受文集一九九一至一九九二年第四册，一三七至一三八頁。）"]},"read":{"paras":["在人性裏具有友情的神，顯示於祂打發亞伯拉罕的姪兒及其兩個女兒，從所多瑪的傾覆之中出來，因祂記念祂的密友亞伯拉罕。（創十九29，12～22。）…亞伯拉罕的神乃是我們的神。","創世記二十章給我們看見，給人友愛照顧的全能神，用祂全能的大力拯救祂的密友亞伯拉罕，使他的妻子免於落在比米勒手中。神使亞比米勒王的家喪失生育的能力。（17～18。）…然後神告訴亞比米勒王，亞伯拉罕要爲他禱告。亞伯拉罕後來爲他禱告，他家的婦女就得了醫治。神用祂的大能大力，給與亞伯拉罕友情的照顧。","神也是不改變的神，這見於祂向亞伯拉罕第九次說話時，守住祂恩典的原則，承認亞伯拉罕從撒拉所生的兒子以撒，是他惟一的兒子。（二一1～12。）亞伯拉罕的神在持守祂的話，祂的應許上，乃是不改變的神。…二十二章一至十節啓示試煉人的神，在第十次對亞伯拉罕說話時，試驗祂親密的屬人朋友亞伯拉罕，要他將他所愛的獨生子作爲燔祭獻給神。","二十二章十一至十四節啓示豫備的三一神，豫備一隻公羊，代替以撒爲燔祭獻給祂（就是耶和華的使者—基督）。這是神第十一次向亞伯拉罕說話。對亞伯拉罕說話的那一位是耶和華，但這一位是耶和華的使者。所以在二十二章，我們看見基督的兩方面。…公羊是作罪人的代替，而耶和華的使者是服事耶和華的一位，照顧神的朋友。","賜福的三一神，見於祂第十二次（末次）向亞伯拉罕說話時，應許亞伯拉罕，祂（就是耶和華的使者—基督）必賜福給亞伯拉罕，必叫他的後裔繁增，如同天上的星，海邊的沙，並且地上的萬國都必因他的後裔（基督）得福。","亞伯拉罕的神是在人的水平上友情的神，這是見於祂引領祂朋友亞伯拉罕的老僕人，去爲亞伯拉罕的兒子以撒娶妻的事上。（二四。）雖然這不是直接由神所推動，卻是由神所作成。亞伯拉罕吩咐他的老僕人去爲以撒娶得妻子，而他的老僕人乃是跟隨神的引導作成這事。","總括而言，亞伯拉罕的神乃是藉着顯現，帶着呼召，在異象中，在屬人的友情裏說話的神，向祂在地上親密的朋友揭示，祂按着祂的心願，渴望祂的朋友成爲甚麼，以及要祂的朋友作甚麼，以完成神聖三一的永遠經綸。（李常受文集一九九一至一九九二年第四册，一三八至一四一頁。）"],"ref":"神在祂與人聯結中的歷史，第七章。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第二週、亞伯拉罕的神見於祂對待亞伯拉罕的事","reading":"徒七2，創十二7～8，十三14～17，十四17～20，十五1，十七1，十八1，二四14","readingRefs":[{"label":"徒7:2","keys":["徒7:2"]},{"label":"創12:7-8","keys":["創12:7","創12:8"]},{"label":"創13:14-17","keys":["創13:14","創13:15","創13:16","創13:17"]},{"label":"創14:17-20","keys":["創14:17","創14:18","創14:19","創14:20"]},{"label":"創15:1","keys":["創15:1"]},{"label":"創17:1","keys":["創17:1"]},{"label":"創18:1","keys":["創18:1"]},{"label":"創24:14","keys":["創24:14"]}]},"verses":{"徒7:2":{"t":"司提反說，¹諸位，弟兄父老請聽。當日我們的祖宗亞伯拉罕在米所波大米還未住哈蘭的時候，²榮耀的神向他顯現，","n":[["1",["直譯，人們。如此稱呼比單純稱弟兄父老顯得更尊貴、莊重。"]],["2",["這也許是看得見的榮耀，（參55，）就如雲和火向以色列人顯現，（出十六10，二四16～17，利九23，民十四10，十六19，二十6，申五24，）並充滿帳幕和殿。（出四十35，王上八11。）乃是這樣榮耀的神，向亞伯拉罕顯現並呼召他。這榮耀對亞伯拉罕乃是極大的吸引，將他從世界裏分別（聖別）出來歸給神；（出二九43；）也是極大的鼓勵和力量，使他能跟從神。（創十二1，4。）同樣的原則，神也用祂看不見的榮耀，呼召新約的信徒。（彼後一3。）"]]]},"創12:7":{"t":"耶和華¹向亞伯蘭顯現，說，我要把這²地賜給你³的²後裔。亞伯蘭就在那裏為向他顯現的耶和華築了一座壇。","n":[["1",["這是神第二次向亞伯拉罕顯現。神在這裏再次顯現，乃是向亞伯拉罕證實，亞伯拉罕已答應神的呼召，並到達神要他去的地方。神的再次顯現，也加強亞伯拉罕憑信而活，（來十一8～10，）向人類在巴別所發展之無神生活作相反的見證。"]],["2",["後裔和地二者都豫表基督，祂是神永遠經綸的中心和普及。見十五3註1。","基督，成為肉體的神，乃是三重的後裔：女人的後裔、（三15，賽七14，加四4、）亞伯拉罕的後裔、（十二7，太一1，加三16、）和大衛的後裔。（撒下七12～14，太一1，二二42～45，羅一3，啟二二16。）基督作為女人的後裔，也就是馬利亞的後裔，（太一16，）完成了救贖，毀壞古蛇撒但，並拯救在基督裏的信徒脫離罪和死。（來二14，太一20～21，林前十五53～57。）基督作為亞伯拉罕的後裔，成了包羅萬有賜生命的靈，（林前十五45，林後三17，）使在基督裏作亞伯拉罕後裔（加三29）的信徒，得以承受終極完成的靈，就是經過過程之三一神的終極完成，作他們神聖的產業，他們屬靈的福，直到永遠。（徒二六18，弗一14上，加三14。）基督作為大衛的後裔，將祂的信徒帶進國度，使他們在復活裏，在神永遠的國裏有分於祂的王權。（提後二12，啟二十4，6，二二5下。）基督作為三重後裔的啟示，就是完滿福音的內容。"]],["3",["這是亞伯拉罕所築的第一座壇。壇是為著敬拜神，將我們一切所是並所有，為著神的定旨獻給神。亞伯拉罕築壇是受神再次顯現的激勵，這可視為對巴別塔的建造所作相反的見證。"]]]},"創12:8":{"t":"從那裏他又遷到¹伯特利東邊的山，支搭²帳棚；西邊是伯特利，東邊是¹艾；他在那裏又為耶和華築了一座壇，並且³呼求耶和華的名。","n":[["1",["伯特利，意，神的家；艾，意，亂堆。伯特利和艾互成對比，表徵在蒙神呼召的人眼中，只有神的家是有價值的；其他的一切不過是亂堆。"]],["2",["亞伯拉罕先築壇，為著敬拜神；然後支搭帳棚，為著自己的生活。亞伯拉罕、以撒和雅各俱各住在帳棚裏。（十二8，二六25，三五21。）住帳棚乃是宣告他們在地上是客旅，是寄居的，在尋找一個更美的家鄉，等候“那座有根基的城，其設計者並建築者乃是神。”（來十一9～10，13～16。）更美的家鄉和那座有根基的城就是新耶路撒冷。（見來十一10註1，13註2。）"]],["3",["見四26註2。"]]]},"創13:14":{"t":"羅得離別亞伯蘭以後，¹耶和華對亞伯蘭說，從你所在的地方，舉目向東西南北觀看；","n":[["1",["因著亞伯拉罕在關乎羅得的試驗上得勝，神再次向他說話，並向他堅定十二7關於美地的應許，（14～15，17，）和十二2關於加增他後裔的應許。（16。）這把亞伯拉罕引進對神經歷的高峰，因他搬了帳棚到希伯崙居住，他餘生大部分時間都在那裏，活在與神的交通中。（見18註1與註2。）"]]]},"創13:15":{"t":"凡你所看見的一切地，我都要賜給你和你的後裔，直到永遠。","n":[]},"創13:16":{"t":"我也要使你的後裔如同¹地上的塵沙那樣多，人若能數算地上的塵沙，纔能數算你的後裔。","n":[["1",["見二二17註1。"]]]},"創13:17":{"t":"你起來，縱橫走遍這地，因為我必把這地賜給你。","n":[]},"創14:17":{"t":"亞伯蘭擊敗基大老瑪和與他同盟的王回來的時候，所多瑪王出來，在沙微谷迎接他；沙微谷就是王谷。","n":[]},"創14:18":{"t":"又有¹撒冷王²麥基洗德帶著餅和酒出來迎接；他是至高神的³祭司。","n":[["1",["意，平安，乃耶路撒冷早期的稱呼。（參詩七六2。）"]],["2",["意，公義王。麥基洗德豫表基督是君尊的大祭司。（來七1～3與1註2，3註1。）亞伯拉罕得著勝利後，麥基洗德出現了。麥基洗德是神的祭司，他在出現之前，必定曾為亞伯拉罕代求。亞伯拉罕能殺敗四王得著勝利，必是藉著麥基洗德的代求。（參出十七8～13。）今天我們的大祭司基督，正以隱藏的方式為我們代求，（羅八34下，來七25下，）使我們成為祂的得勝者，擊敗神的仇敵，好使基督藉著我們的得勝，能在祂第二次來時公開的顯現。"]],["3",["這裏聖經題到麥基洗德的祭司職分，先於亞倫的祭司職分。（出二八1。）照著麥基洗德等次的祭司職分，高於亞倫的祭司職分。（來七。）基督在地上的職事裏，乃是照著亞倫的等次為大祭司，為著除掉罪。（來九14，26。）然後，基督在天上的職事裏，乃是照著麥基洗德的等次標出為大祭司，（來五6，10，）不是為著罪獻祭，乃是將那經過成為肉體、人性生活、釘十字架、和復活之過程的神（由餅和酒所表徵—太二六26～28）服事給我們，作我們生命的供應，使我們蒙拯救到底。（來七25上。）見亞六11註1，來五6註2，七1註1，11註1。"]]]},"創14:19":{"t":"他為亞伯蘭¹祝福，說，願²天地的主、至高的神賜福與亞伯蘭；","n":[["1",["見民六23註1。"]],["2",["因著亞伯拉罕這得勝者勝過了神的仇敵，在地上與神站在一起，神就能不僅稱為天上的神，（代下三六23，尼一5，二4，20，）也稱為天地的主。（19，22。）見太十一25註2。"]]]},"創14:20":{"t":"至高的神把敵人交在你手裏，是當受頌讚的。¹亞伯蘭就將所得的一切，拿了十分之一給他。","n":[["1",["見來七4註1。"]]]},"創15:1":{"t":"¹這些事以後，耶和華的話在異象中臨到亞伯蘭，說，亞伯蘭，你不要懼怕；我是你的²盾牌，是你極大的²賞賜。","n":[["1",["在本章之前，亞伯拉罕經歷了神是在外面保護他，並在物質的事上祝福他，（十二16，）以維持他生存的那一位。從本章開始，神進來給亞伯拉罕看見，他裏面需要神的恩典，好完成神的定旨，就是得著一班人有神的形像彰顯祂，有祂的管治權代表祂，並為著祂的國據有全地。（一26～28。）"]],["2",["亞伯拉罕擊敗四王之後，（十四13～17，）也許害怕他們報復。因此，神來告訴亞伯拉罕，祂是盾牌保護他。祂也要作亞伯拉罕的賞賜，因他拯救了羅得。"]]]},"創17:1":{"t":"亞伯蘭年¹九十九歲的時候，耶和華向他顯現，對他說，我是²全足的神；你要³行在我面前，並且要³完全；","n":[["1",["亞伯拉罕運用他天然的力量生了以實瑪利，這嚴重的觸犯了神和神的經綸。因此，以實瑪利出生以後，亞伯拉罕與神的交通就中斷了；神等候了十三年，（參十六16，）直到亞伯拉罕天然的力量被了結，祂纔再來與亞伯拉罕接觸。（羅四19與註。）見十五4註1。"]],["2",["希伯來文， El Shaddai， 伊勒沙代。伊勒，意，大能者；沙代，源自另一希伯來字，意，胸部或乳房。這神聖的稱呼啟示神乃是有乳房的大能者，就是全豐全足的大能者。祂是恩典的源頭，用祂神聖所是的豐富供應祂所呼召的人，使他們能產生基督作後裔，以完成神的定旨。"]],["3",["在這裏，行在神面前，就是行在祂的同在裏，不斷享受祂和祂全豐全足的供應。得以完全，乃是得著神加到我們裏面作完全的元素和因素。實際上，這意思是，我們的生活和工作，並不倚靠肉體的力量，乃是信靠神這位全豐全足的大能者。"]]]},"創18:1":{"t":"耶和華在幔利橡樹那裏向亞伯拉罕顯現。那時天正熱，亞伯拉罕坐在帳棚口。","n":[]},"創24:14":{"t":"我向那一個少女說，請你拿下水瓶，給我水喝；她若說，請喝，我也給你的駱駝喝；願她就作你所定，給你僕人以撒的妻子。這樣，我便知道你以慈愛待我主人了。","n":[]},"出3:15":{"t":"神又對摩西說，你要對以色列人這樣說，¹耶和華你們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，差我到你們這裏來。這是我的名，直到永遠；這也是我的記念，直到萬代。","n":[["1",["見創二4註3。這是神頭一次以“耶和華”這名使祂的百姓認識祂自己。（六3。）見6註1。"]]]},"創11:31":{"t":"¹他拉帶著他兒子亞伯蘭和他孫子哈蘭的兒子羅得，並他兒媳亞伯蘭的妻子撒萊，一起出了迦勒底的吾珥，要往迦南地去；他們走到²哈蘭，就住在那裏。","n":[["1",["按照徒七2～3，神在迦勒底的吾珥向亞伯拉罕顯現，呼召他：“從你本地和你親族中出來，往我所要指示你的地去。”這是神頭一次向他顯現並呼召他。神向亞伯拉罕顯現，對他是很強的吸引，（見徒七2註2，）鼓勵並加強他接受神的呼召。新約的信徒也是如此。（見太四20註2與22註1，九9註3，來十二2註2，彼後一3註4。）","神頭一次向亞伯拉罕顯現時，他沒有立即接受神的呼召，仍在吾珥住了一些時候。亞伯拉罕的兄弟哈蘭死了以後，（28，）神主宰的使他父親他拉將家人從吾珥遷到哈蘭。因此，起首離開吾珥的不是亞伯拉罕，乃是他的父親。見徒七4與註。"]],["2",["亞伯拉罕從迦勒底出來，沒有進入神呼召他去的迦南，（徒七3，）卻定居在哈蘭。這給我們看見，亞伯拉罕不願絕對答應神的呼召。"]]]},"徒7:3":{"t":"對他說，“你要從你本地和你親族中出來，往我所要指示你的地去。”","n":[]},"徒7:4":{"t":"他就從迦勒底人之地出來，住在哈蘭。他父親死了以後，神¹使他從那裏遷到你們現在所住之地。","n":[["1",["表面上是亞伯拉罕前往迦南，（創十二4～5，）實際上是神使他遷到美地。"]]]},"創12:1":{"t":"¹耶和華對亞伯蘭²說，你要離開本地、親族、³父家，往我所要指示你的地去。","n":[["1",["亞伯拉罕、以撒、雅各（連同約瑟—見三七2註1）的記載是重疊的。創世記描繪他們，不是三個分開的個人，乃是一個團體人的構成分子。這三個人的經歷，描繪一個完整的人對三一神經歷的不同方面。“亞伯拉罕的神，以撒的神，雅各的神”乃是耶和華，就是三一神—父、子、靈。（出三15，太二八19。）亞伯拉罕的經歷表徵對父神的經歷，祂呼召人、稱義人、裝備人，使人憑信而活，且活在與祂的交通裏。（十二1，十五6，十七～十八，十九29，二一1～13，二二1～18。）以撒的經歷表徵對子神的經歷，祂救贖人、（二二1～14、）祝福人，使人承受祂一切的豐富，過享受祂豐盛的生活，並活在平安中。（二五5，二六3～4，12～33。）雅各（連同約瑟）的經歷，表徵對父神的經歷，祂愛人並揀選人；（瑪一2，羅九10～13；）也表徵對靈神的經歷，祂使萬有效力，叫愛祂的人得益處，並且變化人，使人在神聖的生命裏成熟，能祝福所有的人，治理全地，並以子神作生命供應，滿足所有的人。（二七41，二八1～三五10，三七，三九～四九，羅八28～29。）"]],["2",["亞伯拉罕的父親死了以後，（十一32，）神第二次呼召亞伯拉罕。（見十一31註1。）神呼召亞伯拉罕時，就向他說話。除了神的顯現，神向亞伯拉罕說話，乃是激勵並加強他接受神呼召的另一因素。（徒七2～3，參羅一6，八30，林前一9。）參十一31註1一段。"]],["3",["神第二次向亞伯拉罕說話時，呼召亞伯拉罕不僅要離開本地、親族，也要離開父家。（參徒七3，見十一31註1。）這意思是，神只呼召亞伯拉罕和他的妻子撒萊。然而，亞伯拉罕離開哈蘭時，帶著他的姪兒羅得。（4～5。）這再次顯示，亞伯拉罕不彀絕對接受神的呼召。"]]]},"創12:2":{"t":"¹我必使你成為²大國；我必賜福給你，使你的名為大；你也要使別人得福。","n":[["1",["在2～3節神對亞伯拉罕的應許，乃是福音的傳揚。（加三8與註。）神不僅向亞伯拉罕說話並呼召他，也給他福音的應許作為激勵，鼓勵亞伯拉罕答應祂的呼召。"]],["2",["在神向亞伯拉罕所傳的福音裏，祂應許要使亞伯拉罕成為大國。這大國就是神的國，包括以色列國作為神在舊約的國、（太二一43、）召會作為神在新約的國、（太十六18～19上，羅十四17、）來世的千年國、（啟十一15，二十4，6、）以及永世裏的新天新地同新耶路撒冷。（啟二二3，5。）"]]]},"創12:3":{"t":"那為你祝福的，我必賜福與他；那¹咒詛你的，我必咒詛他。地上的²萬族都必因你³得福。","n":[["1",["從尼布甲尼撒毀滅耶路撒冷城直到如今，凡咒詛猶太人的國家、人民、種族或個人，都受了咒詛；凡祝福猶太人的，都蒙了祝福。"]],["2",["神在祂的呼召裏，從亞當轉到亞伯拉罕；但在祂的應許裏，神藉著亞伯拉罕的後裔基督，又從亞伯拉罕轉回到亞當族類的萬族。"]],["3",["這裏的福包括神創造的福和救贖的福，包含神要給人的一切，就是神自己和祂在今世並來世所有的一切。按照加三14，（見加三14註，）所應許的福實際上就是作為那靈的神自己。因此，神對亞伯拉罕傳福音時，（加三8，）應許要將祂自己作為福分賜給蒙召之人。按照二二18，這福要藉著亞伯拉罕的後裔，就是基督，（太一1，加三16，）臨到萬國。神賜給亞伯拉罕的福，使他成為別人的福；這福包含閃的帳棚。（見九27註1。）"]]]},"創15:2":{"t":"亞伯蘭說，主耶和華阿，我快要去世了還沒有兒子，你還賜我甚麼呢？那要承受我家業的，是大馬色人以利以謝。","n":[]},"創15:3":{"t":"亞伯蘭又說，你沒有給我¹後裔；²那在我家中的僕人，就是我的後嗣。","n":[["1",["要完成神的定旨，後裔（1～6）和地（7～21）這二者是必需的。後裔首先是個人的基督，（加三16與註2，）然後是團體的基督，（林前十二12，）由基督作頭與祂所有的信徒（加三29與註1一段）作身體所組成。地乃是基督作為包羅萬有賜生命的靈，信徒在其內生活；（申八7～10與7註1；）地也是召會作基督的擴大，擴展。我們要完成神的定旨，就需要接受神的恩典，使基督這後裔能作到我們裏面，並使基督這地能從我們活出而成為我們的召會生活，好叫我們享受神的安息，擊敗神的仇敵，並建立神的國同祂的居所，使祂得著彰顯和代表。"]],["2",["直譯，我家的兒子。"]]]},"創15:4":{"t":"但耶和華的話臨到他說，這人必不成為你的後嗣；你¹本身將要生的，纔是你的後嗣。","n":[["1",["本身，直譯，自己內裏的部分。完成神定旨所需要的後裔，不能是亞伯拉罕所已經擁有的（以利以謝—2，）也不能是他從自己所產生的（以實瑪利—十六15。）惟有神作到亞伯拉罕裏面的，纔能從亞伯拉罕產生神所要的後裔。照樣，惟有神藉著祂恩典作到我們裏面的，纔能產生基督作後裔，完成神的定旨。"]]]},"創15:5":{"t":"於是領他走到外邊，說，你向天觀看，數算¹眾星，能數得過來麼？又對他說，你的後裔將要如此。","n":[["1",["見二二17註1。"]]]},"創15:6":{"t":"亞伯蘭¹信耶和華，耶和華就以此算為他的義。","n":[["1",["見羅四3註1。這裏亞伯拉罕信神，不是要得關乎自身生存的外面祝福；他信神能把一些東西作到他裏面，好從他這個人裏面產生一個後裔，以完成神的定旨。這種信對神是寶貴的，神也算這信為義。亞伯拉罕因著這樣的信就得稱義。（羅四1～5與1註1。）"]]]},"創15:7":{"t":"耶和華又對他說，我是耶和華，曾領你出了迦勒底的吾珥，為要將這地賜你為業。","n":[]},"羅4:3":{"t":"原來經上說甚麼？說，“亞伯拉罕¹信神，這就算為他的義。”","n":[["1",["信神，是亞伯拉罕對神一再向他顯現的自然反應。神曾多次向亞伯拉罕顯現，（創十二1～3，7，十三14～17，十五1～7，十八，徒七2，）每次都將祂的榮耀與祂自己的一些成分，傳輸到亞伯拉罕裏面。因此，這信實際上就是神所傳輸到他裏面的元素，在他裏面的湧出。神對亞伯拉罕信的反應，乃是稱義他，就是算他為義。這不是本於行為，乃是基於他的信神。"]]]},"創18:17":{"t":"耶和華說，¹我所要作的事，豈可瞞著亞伯拉罕麼？","n":[["1",["神向亞伯拉罕啟示祂要毀滅所多瑪的心意，因為祂在尋找代求的人。當神要毀滅所多瑪時，祂的心關切住在所多瑪的羅得。（十三12，十四12，十九1。）祂想要拯救羅得，好保護經由路得（她是摩押人，是羅得的後裔）而有的基督家譜，（十九37，得一4，太一5，）但若沒有代求的人，祂就無法作這事。因此，在神與亞伯拉罕親密的交通中，祂未題羅得的名字，卻奧祕的啟示了祂心頭的願望。正確的代求不是由人發起，乃是由於神的啟示。因此，這樣的代求說出神的願望，並為成全神的旨意鋪路。"]]]},"創18:18":{"t":"亞伯拉罕必要成為又大又強的國，並且地上的萬國都必因他得福。","n":[]},"創18:19":{"t":"我¹眷顧他，為要叫他吩咐他的子孫和他以後的家屬，遵守我耶和華的道，秉行公義和公理，使我論到亞伯拉罕的話，都成就在他身上。","n":[["1",["直譯，認識。"]]]},"約10:28":{"t":"我又賜給他們¹永遠的生命，他們必永不滅亡，誰也不能從¹我手裏把他們奪去。","n":[["1",["永遠的生命（見三15註1）是為著信徒的生活。父因著祂的愛，照著祂的定旨而施行揀選的手，（十七23，六38～39，）並子憑著祂的恩，為著完成父的定旨而施行拯救的手，（一14，六37，）二者都有保守的大能，以保障信徒。永遠的生命永不枯竭，父和子的手永不失誤。所以信徒永遠穩固，永不滅亡。"]]]},"約10:29":{"t":"那把他們賜給我的父，比萬有都大，誰也不能從我¹父手裏把他們奪去。","n":[["1",["見28註1。"]]]},"約10:30":{"t":"¹我與父原是一。","n":[["1",["主在這裏確言祂的神性，說祂自己就是神。（33，五18，一1，二十28，約壹五20，腓二6。）"]]]},"猶1:24":{"t":"¹但願²榮耀、尊大、權能和權柄，藉著我們的主耶穌基督，歸與那能保守你們不失腳，並使你們無瑕無疵，³歡歡樂樂站在祂⁴榮耀之前的，獨一的⁵神我們的救主，","n":[["1",["在這結束的讚美裏，作者清楚指明，雖然他囑咐信徒要在20～23節所說的事上竭力，但惟有神我們的救主能保守他們不失腳，並使他們無瑕無疵，歡歡樂樂的站在祂榮耀之前。願榮耀…歸與祂！"]],["2",["榮耀是在輝煌中的彰顯，尊大是在尊貴裏的偉大，權能是在能力裏的力量，權柄是在管治中的能力。"]],["3",["直譯，在歡騰中。意即在歡騰的元素裏。歡騰，“表徵得勝歡樂的洋溢。”（Alford，阿福德。）"]],["4",["指至大的神和我們的救主耶穌基督的榮耀，這榮耀要在祂顯現時顯明出來，（多二13，彼前四13，）並且祂要在這榮耀裏來臨。（路九26。）"]],["5",["獨一的神是我們的救主，那人耶穌基督是我們的主。願榮耀、尊大、權能和權柄，藉著這樣一位主，歸與這樣一位救主，直到世世代代。"]]]},"來12:1":{"t":"所以，我們既有這許多的¹見證人，如同²雲彩圍著我們，就當脫去各樣的³重擔，和容易纏累我們的⁴罪，憑著忍耐奔那擺在我們前頭的⁵賽程，","n":[["1",["這裏的見證人，含殉道者意。"]],["2",["雲彩是為著引導百姓跟隨主，（民九15～22，）並且主是在雲彩中與百姓同在。（出十三21～22。）"]],["3",["或，重量，負擔，障礙。賽跑的人脫去各樣不必要的重量，纏累人的重擔，使他們沒有障礙，以贏得競賽。"]],["4",["這裏的罪，主要的是指纏累我們，使我們不能奔跑賽程的事，正如十26所說的故意犯罪，會使希伯來的信徒離開神經綸中新約的路一樣。（見十26註2。）重擔和纏累人的罪，都會阻撓並限制希伯來的信徒，使他們不能在新約的路上，跟從被猶太教所棄絕的耶穌，奔跑那屬天的賽程。"]],["5",["基督徒的一生就是一個賽程，所有得救的基督徒，都必須奔跑這賽程，好贏得獎賞。（林前九24。）這獎賞不是指一般的救恩，（弗二8，林前三15，）乃是指特別的賞賜。（十35，林前三14。）使徒保羅已經跑完這賽程，贏得了獎賞。（林前九26～27，腓三13～14，提後四7～8。）"]]]},"來12:2":{"t":"¹望斷以及於²耶穌，就是我們信心的³創始者與⁴成終者；祂為那擺在前面的喜樂，就輕看羞辱，忍受了十字架，便⁵坐在神寶座的右邊。","n":[["1",["原文指轉離其他各種目標，以專一的注意力注視。希伯來的信徒必須望斷他們環境中一切的事物，望斷他們老舊的宗教─猶太教，望斷猶太教的逼迫，望斷一切屬地的事物，好望斷以及於，以達到這位現今在諸天之上，坐在神寶座右邊的耶穌。"]],["2",["奇妙的耶穌，在天上登了寶座，並得了榮耀尊貴為冠冕，（二9，）祂是宇宙中最大的吸引，就像巨大的磁石，吸引所有尋求祂的人歸向祂。我們乃是受祂迷人的美麗所吸引，纔望斷祂以外一切的事物。沒有這樣迷人的對象，我們怎能望斷地上這麼多迷惑人的事物？"]],["3",["或，起始者，開創者，首領，開拓者，先鋒。原文與二10者同。舊約所有得勝的聖徒不過是信心的見證人，但耶穌乃是信心的創始者。祂是信心的發起者、開創者、源頭和因由。照我們天然的人，我們沒有信的能力，我們憑自己沒有信。那叫我們得救的信，乃是我們從主所得寶貴的信。（彼後一1。）當我們仰望耶穌，祂這賜生命的靈（林前十五45）就將祂自己，將祂信的成分，灌輸到我們裏面；這樣，自然而然的，有一種信在我們裏面升起，我們就有信心相信祂。這不是出於我們自己，乃是出於那將自己作信的成分，分賜到我們裏面，替我們信者的。因此，乃是主自己作我們的信。我們因著祂作我們的信而活，是因著祂的信，（加二20，）不是因著我們自己的信。","耶穌是信心的創始者和源頭，也是信心的首領、開拓者和先鋒。祂開了信心的路，並作了先鋒，領先開拓這路。因此，祂能帶我們隨著祂的腳蹤，走完信心的路。祂在一生中，在地上的行徑裏，作了信心的創始者；又在榮耀裏，在天上的寶座上，作了信心的成終者；當我們仰望祂時，祂就將所創始並成終的信心，傳輸甚至注入我們裏面。"]],["4",["或，完成者，完全者。耶穌也是信心的完成者、完全者。祂要完成祂所起始的，完全祂所開創的。我們不斷的仰望祂，祂就要完成並完全我們奔跑屬天賽程所需要的信心。"]],["5",["本書從一3起，不斷的將我們指向那坐在天上的基督。保羅在別的書信中，主要的是向我們陳明，基督作賜生命的靈，（林前十五45，）住在我們靈裏，（羅八10，提後四22，）作了我們的生命和一切。但在本書，他特別將我們指向這坐在天上、具備多面、在各面照顧我們的基督。在保羅別的書信裏，內住的基督與我們的肉體、己和天然的人相對。在本書，天上的基督與地上的宗教並一切地上的事物相對。我們要經歷內住的基督，就需要轉到靈裏接觸祂；我們要享受天上的基督，就需要望斷一切地上的事物，而及於這位坐在神寶座右邊的基督。祂藉著死與復活，已經成就了神和人所需要的一切；現今祂在升天裏，坐在諸天之上，乃是在神子（一5）和人子（二6）的身位裏，也就是在神（一8）和人（二6）的身位裏，作了神所立的承受萬有者、（一2、）神的受膏者、（一9、）我們救恩的創始者、（二10、）那聖別人者、（二11、）常時的救援者、（二16、）應時的幫助者、（四16、）從神來的使徒、（三1、）大祭司、（二17，四14，七26、）真帳幕的執事，（八2，）有更超特的職任，（八6，）是更美之約的保證和中保、（七22，八6，十二24、）新約的執行者、（九16～17、）先鋒、（六20、）信心的創始者與成終者、（2、）以及群羊的大牧人。（十三20。）我們若仰望祂這奇妙且包羅萬有的一位，祂就要把天、生命、和力量供應我們，將祂的所是傳輸並灌注到我們裏面，使我們能奔跑屬天的賽程，在地上過屬天的生活，帶我們走完一生的路途，領我們進榮耀裏去。（二10。）"]]]},"加2:20":{"t":"我已經¹與基督同釘十字架；現在活著的，²不再是我，乃是³基督在我裏面活著；並且我如今在肉身裏所活的⁴生命，是我⁵在⁶神兒子的⁷信裏，與祂聯結所活的，祂是⁸愛我，為我⁹捨了自己。","n":[["1",["這解釋我如何藉著律法，向律法死了。照著神的經綸，基督被釘十字架時，我也包括在祂裏面。這是已經成就的事實。"]],["2",["“不再是我，”不是指一種替換的生命─基督進來，我出去；因為保羅在本節後面仍說“我…活。”我們重生的人，有已經釘死的舊我，（羅六6，）也有重生的新我。對舊我，保羅說不再是我；對新我，他說“我…活。”釘死的舊我，沒有神性；重生的新我，卻有神加到裏面作生命。舊我復活加上神，就成了新我。一面保羅已經了結，另一面復活的保羅，重生以神作生命的保羅，仍然活著。不僅如此，保羅雖然說不再是我，但他也說基督在我裏面活著。雖是基督活著，卻是活在保羅裏面。基督和保羅，二者同有一個生命，同過一個生活。"]],["3",["藉著基督的死，我已在祂裏面死了；現今藉著祂的復活，祂在我裏面活著。祂活在我裏面，完全憑著祂是賜生命的靈；（林前十五45下；）這點在以下各章有充分的發展，向我們陳明並強調，那靈乃是我們已經接受作生命的那一位，也是我們應該活在祂裏面的那一位。","我，天然的人，傾向守律法以得完全，（腓三6，）但神要我活基督，使神藉著基督能從我得著彰顯。（腓一20～21。）因此，神的經綸乃是，“我”在基督的死裏被釘死，基督在祂的復活裏活在我裏面。守律法，是在我的生活中高舉律法在一切之上；活基督，是在我的生活中使基督作中心和一切。律法是神為著基督，用以看守祂選民的，只是一段時期，（三23，）至終要帶他們歸於基督，（三24，）使他們接受祂作生命，並活祂作神的彰顯。現今基督既已來了，律法的功用就了結了；基督必須在我的生活裏頂替律法，以成就神永遠的定旨。"]],["4",["這裏的生命不是肉身的生命，也不是魂的生命，乃是屬靈、神聖的生命。"]],["5",["在神兒子的信裏，或，在神兒子裏的信裏。參16註1。"]],["6",["基督這名稱，主要的是指基督的使命，為著完成神的計畫；神的兒子，是指基督的人位，為著分賜神的生命到我們裏面。因此，我們所用以活神之生命的信，乃是神兒子這賜生命者的信。"]],["7",["我們活神聖的生命，不是憑著眼見，也不是憑著感覺，不同於我們活肉身和魂的生命。我們活神聖的生命，就是活我們靈裏屬靈的生命，乃是藉著運用信，這信是由賜生命之靈的同在所激發的。"]],["8",["神的兒子愛我們，特意為我們捨了自己，使祂能將神的生命分賜到我們裏面。"]],["9",["直譯，交出。"]]]},"創12:4":{"t":"亞伯蘭就照著耶和華的吩咐去了；羅得也和他同去。亞伯蘭出哈蘭的時候，年七十五歲。","n":[]},"加3:14":{"t":"為叫¹亞伯拉罕的福，在基督耶穌裏可以臨到外邦人，使我們藉著信，可以²接受³所應許的那⁴靈。","n":[["1",["指神為著地上的萬國，應許給亞伯拉罕的福。（創十二3。）這應許已經成就了，這福已經在基督裏，藉十字架的救贖臨到了萬國。"]],["2",["在福音裏，我們不僅接受赦罪、洗淨和潔淨的福，更接受那最大的福，就是三一神，父、子、靈，成為經過過程，包羅萬有賜生命的靈，極其主觀的住在我們裏面作我們的享受。我們能享受這包羅萬有者作我們每天的分，這是何等的福！"]],["3",["直譯，那靈的應許。"]],["4",["本節指明，那靈就是神為著萬國所應許亞伯拉罕的福，也是信徒藉著相信基督所接受的。那靈，就是5註2所說複合的靈，實際上就是神自己在祂神聖的三一裏，經過成為肉體、釘十字架、復活、升天並降下的過程，給我們接受，作我們的生命和一切。這是神福音的中心。","神應許亞伯拉罕物質方面的福乃是美地，（創十二7，十三15，十七8，二六3～4，）作包羅萬有之基督的豫表。（見西一12與註3。）因著基督至終實化為包羅萬有賜生命的靈，（林前十五45，林後三17，）這應許之靈的福，就與應許亞伯拉罕之地的福相符。實際上，這靈作基督在我們經歷中的實化，就是美地，作神全備供應的源頭，給我們享受。"]]]},"加6:18":{"t":"¹弟兄們，願我們主耶穌基督的²恩與你們的³靈同在。阿們。","n":[["1",["“弟兄們”這親密的稱呼，（一11，三15，四12，28，31，五11，13，六1，）已經多次用在受責備“無知的加拉太人”（三1）身上。在這嚴厲、責備、警戒的書信末了，使徒再次用這關切的稱呼，並且特別放在結尾，以表示對他們不變的愛，保證他們在信仰之家，（10，）仍是他的弟兄。"]],["2",["耶穌基督的恩，乃是三一神，具體化身在子裏，又實化為賜生命之靈的全備供應，藉著我們靈的運用，給我們享受。"]],["3",["指我們重生、有那靈內住的靈。那靈是本書所一再強調，神應許之福的中心。我們在我們重生的靈裏，經歷享受這靈作新約中心的福。因此，我們需要主的恩典，就是那包羅萬有之靈全備的供應，（腓一19，）與我們的靈同在。","基督、那靈、新造、以及我們的靈，乃是本書所啟示基要的四項，這些都是神經綸中基礎的思想。基督是神經綸的中心，那靈是基督的實際。當基督藉著那靈，實化在我們靈裏，我們就成為新造。因此，為著過新造的生活，以成就神的定旨，我們的靈是極其重要的。","本書極為強調十字架和釘十字架的經歷，為要對付消極的項目，如律法、肉體、“我、”宗教世界、奴役和咒詛，藉此帶進積極的項目，就是本書所啟示的基督、那靈、神的兒子、應許的後嗣、信仰之家、新造、以及神的以色列。本書的總結乃是：藉著基督的十字架，律法、肉體和宗教都了結了，好叫我們得著那靈、新造和我們的靈，使我們在靈裏藉著那靈，就是基督的實化，能作新造，帶著耶穌的烙印，並在我們靈裏得享主耶穌基督的恩。"]]]},"腓1:19":{"t":"因為我知道，這事藉著¹你們的祈求，和²耶穌基督之靈³全備的供應，終必叫我⁴得救。","n":[["1",["這是基督身體（召會）的供應。被囚並沒有使保羅與基督的身體隔離，斷絕這身體的供應。"]],["2",["在聖經中，有關神、基督和那靈的啟示是漸進的。頭一次說的是在創造裏神的靈。（創一2。）其次是在神與人關係中耶和華的靈。（士三10，撒上十6。）而後是有關基督成孕並出生的聖靈。（路一35，太一20。）再後是在主為人生活中耶穌的靈。（徒十六7。）然後是在主復活中基督的靈。（羅八9。）在這裏是耶穌基督的靈。","耶穌基督的靈，就是約七39所說的那靈。這不僅是主成為肉體前之神的靈，更是主復活後之神的靈，就是具有神性的聖靈，與主的成為肉體（人性）、十字架下的為人生活、釘十字架並復活調和而成的。在出三十23～25，由橄欖油和四種香料調和而成的聖膏油，是這複合之神的靈完滿的豫表。現今這靈乃是耶穌基督的靈。這裏不是說耶穌的靈，（徒十六7，）也不是說基督的靈，（羅八9，）乃是說耶穌基督的靈。耶穌的靈主要的是為著主的人性和為人生活，基督的靈主要的是為著主的復活。我們要經歷二5～8所描繪主的人性，就需要耶穌的靈；要經歷三10所說主復活的大能，就需要基督的靈。使徒在受苦時，經歷了主在人性中的受苦並主的復活；因此，那靈對他乃是耶穌基督的靈，就是三一神那複合、包羅萬有、賜生命的靈。對於像使徒那樣經歷並享受基督的為人生活和復活的人，這樣一位靈有全備的供應，甚至就是全備的供應。至終，這複合的耶穌基督之靈，成了神的七靈，祂是神寶座前的七盞火燈，在地上完成神的行政，使神關乎召會的經綸得以成就；祂也是羔羊的七眼，為要把祂一切的所是傳輸到召會裏面。（啟一4，四5，五6。）"]],["3",["原文指歌詠團的首領，供給團員所需用的一切。包羅萬有之靈這全備的供應，叫保羅在為基督受苦時，能活基督並顯大基督。"]],["4",["原文同二12的救恩。這裏的得救就是那裏的作成救恩，指得著維持並加力，能活基督而顯大基督。（見二12註5。）這需要耶穌基督之靈全備的供應。"]]]},"民23:21":{"t":"祂¹未見雅各中有罪孽，也未見以色列中有禍患；耶和華他們的神與他們同在，有向²王歡呼的聲音在他們中間。","n":[["1",["這話不是按著人的看法，乃是按著神聖的看法。在神眼中，以色列沒有過犯。在他們自己裏面，神的子民有許多缺失；但在神的救贖裏，並在基督裏，他們沒有缺失。神看祂的子民，不是按著他們在自己裏面的所是，乃是按著他們在基督裏的所是。（參林後五16～17。）"]],["2",["這王至終乃指基督。"]]]},"民24:5":{"t":"雅各阿，你的帳棚何其¹佳美！以色列阿，你的帳幕何其華麗！","n":[["1",["巴蘭第一首詩歌啟示以色列是聖別的，（二三9，）第二首啟示以色列是完全的，（二三21，）第三首啟示以色列是美麗的，如這裏“佳美”一辭所指明。這將是千年國時以色列真實的光景。神應許亞伯拉罕的後裔要成為萬國的福。（創十二2～3。）至終，神要完全祝福猶太人，他們要成為全人類的福。（賽二2～3，亞八20～23。）巴蘭的詩歌也指明，就立場說，召會是聖別的；在神眼中，召會是完全的；就外表說，召會是美麗的、佳美的。（參弗五27。）"]]]},"民24:9":{"t":"他蹲臥如公獅，又如母獅，誰敢惹他？凡給你祝福的，願他¹蒙福；凡咒詛你的，願他受咒詛。","n":[["1",["巴蘭沒有咒詛神的百姓，反而代表神全然祝福他們。祝福人就是說他好話，積極的說到他。（弗一3與註3，註9。）我們越為著主的子民讚美祂，在信心裏說他們的好話，我們就越把自己擺在神的祝福之下。凡積極說到召會的，都得著祝福；凡消極說到召會的，就把自己擺在咒詛之下。"]]]},"林前1:2":{"t":"寫信¹給²在哥林多³神的召會，就是給⁴在基督耶穌裏被⁵聖別，⁶蒙召的聖徒，⁷同著所有在各處⁸呼求我們主耶穌基督之名的人；⁹祂是他們的，也是我們的；","n":[["1",["“給…神的召會”等於“給在基督耶穌裏被聖別，蒙召的聖徒。”這有力的指明，召會是眾聖徒的組合，眾聖徒是召會的構成分子。我們不該認為這二者是分開的實體。就個別說，我們是聖徒；就團體說，我們是召會。"]],["2",["召會是由宇宙的神所構成的，卻存在於地上的許多地方，哥林多就是其中之一。就性質說，召會在神裏面是宇宙性的；但就實行說，召會在一個確定的地方是地方性的。因此，召會有兩面：宇宙的，和地方的。缺了宇宙的一面，召會就沒有內容；缺了地方的一面，召會就不可能有出現和實行。因此，新約也強調召會地方的一面。（徒八1，十三1，啟一11等。）"]],["3",["神的召會！不是磯法的召會、亞波羅的召會、保羅的召會，也不是任何作法或道理的召會，乃是神的召會。雖然在哥林多的召會有分裂、犯罪、混亂、恩賜的濫用、以及異端的教訓，使徒仍稱之為神的召會，因為那使一同聚集的信徒，成為神之召會的神聖、屬靈素質，確實是在那裏。使徒用這樣屬靈的稱呼，是基於他用屬靈的眼光來看在基督裏的召會。單單這樣一個簡單的稱呼，就該消除一切作法和道理上的分裂與混亂。"]],["4",["在基督裏，指在基督的元素與範圍裏。當我們信入基督時，就是當我們藉著相信祂，被帶進與祂生機的聯結時，基督乃是那分別我們，使我們聖別歸神的元素與範圍。"]],["5",["意使之聖別，分別歸神，以完成神的定旨。見羅一2註3。"]],["6",["在基督裏的信徒乃是蒙召的聖徒，並不是蒙召作聖徒。這是地位上的事，是地位上的聖別，為了達到性質上的聖別。見羅六19註2。"]],["7",["不是“和，”乃是“同著”所有在各處呼求我們主耶穌基督之名的人。這指明：(一)一個地方召會，如在哥林多的召會，是單由那地方的信徒組成的，不是由各處所有的信徒組成的；(二)本書不僅是為著在哥林多一地的召會，乃是為著在各處所有的信徒。本書是為著任何時間或地方的所有信徒。"]],["8",["呼求主的名，包含信入祂。（羅十14。）所有在主裏的信徒，都該是呼求祂名的人。（徒九14，21，二二16。）我們已經蒙召來呼求，就是蒙神呼召來呼求主耶穌的名。"]],["9",["基督這包羅萬有者，屬於所有的信徒，祂是所分給我們的分，是神賜給我們的。（西一12。）使徒在本節末了加上這特別的辭句，為要強調一個重要的事實，就是無論在甚麼地方，或甚麼情況，基督乃是所有信徒惟一的中心。在本書信，使徒的用意是要解決哥林多信徒中間所存在的難處。對一切的難處，特別是分裂的事，惟一的解決乃是包羅萬有的基督。我們都已經蒙召進入祂的交通，有分於祂。（9。）所有的信徒都當以祂為惟一的中心，不為任何有恩賜的人、過分強調的道理、或特別的作法所岔開。"]]]},"林後5:17":{"t":"¹因此，若有人²在基督裏，他就是³新造；⁴舊事已過，⁵看哪，都變成新的了。","n":[["1",["這證實前節所說的。使徒不再按著肉體認人，因為若有人在基督裏，他就是新造。肉體的舊事，藉著基督的死已經過去了；在基督的復活裏，一切都變成新的了。"]],["2",["在基督裏，就是在生命和性情上與基督是一。這乃是出於神，並藉著我們相信基督。（林前一30，加三26～28。）"]],["3",["舊造沒有神的生命和性情；新造，就是由神所重生的信徒，卻有。（約一13，三15，彼後一4。）因此他們是新造，（加六15，）不是照著肉體的舊性情，乃是照著神生命的新性情。"]],["4",["或，古老的。"]],["5",["呼召人觀看新造奇妙的改變。"]]]},"創12:6":{"t":"亞伯蘭經過那地，到了示劍地方、摩利橡樹那裏。當時迦南人住在那地。","n":[]},"創12:10":{"t":"那地遭遇¹饑荒；因饑荒甚重，亞伯蘭就下埃及去，要在那裏寄居。","n":[["1",["神主宰權柄所豫備的饑荒乃是一個試驗，要看亞伯拉罕是否憑信而活，為他每日的需要信靠神。（參彼前一6～7。）亞伯拉罕沒有信靠神，反而下埃及去；埃及表徵在撒但管治下的世界。"]]]},"創12:11":{"t":"他將近埃及，就對妻子撒萊說，我知道你是容貌美麗的婦人。","n":[]},"創12:12":{"t":"埃及人看見你，必說，這是他的妻子，他們就會殺我，卻叫你活著。","n":[]},"創12:13":{"t":"求你說，你是我的妹妹，使我因你得善待，我的命也因你存活。","n":[]},"創12:14":{"t":"及至亞伯蘭到了埃及，埃及人看見那婦人極其美麗。","n":[]},"創12:15":{"t":"法老的大臣看見了她，就在法老面前稱讚她；那婦人就被帶進法老的宮裏去。","n":[]},"創12:16":{"t":"法老因這婦人就善待亞伯蘭，亞伯蘭得了許多牛、羊、駱駝、公驢、母驢、僕人、婢女。","n":[]},"創12:17":{"t":"耶和華因亞伯蘭妻子撒萊的緣故，以大災病擊打法老和他全家。","n":[]},"創12:18":{"t":"法老就召了亞伯蘭來，說，你這向我作的是甚麼事？為甚麼沒有告訴我，她是你的妻子？","n":[]},"創12:19":{"t":"為甚麼說她是你的妹妹，以致我把她取來要作我的妻子？現在你的妻子在這裏，把她帶走罷。","n":[]},"創12:20":{"t":"於是法老吩咐人將亞伯蘭¹和他妻子，並他所有的都送走了。","n":[["1",["亞伯拉罕在埃及的時候，經歷了神保守的恩典。雖然亞伯拉罕沒有信靠神，神卻祝福亞伯拉罕，使他富足，（16，十三2，）並且保守他的妻子撒萊。藉著在埃及的這個經歷，亞伯拉罕學了功課，知道這位呼召他的神也是照顧他的一位，並且一切事都在祂主宰的手中。"]]]},"加3:16":{"t":"¹應許原是向亞伯拉罕和他後裔說的。並不是說，和眾後裔，像是指著許多人，乃是說，“和你那後裔，”指著一個人，就是²基督。","n":[["1",["原文，複數。"]],["2",["基督是那後裔，後裔乃是承受應許的後嗣。在這裏，基督是承受應許的惟一後裔。因此，我們要承受那應許的福，就必須與基督是一；在祂以外，我們無法承受神所賜給亞伯拉罕的應許。在神眼中，亞伯拉罕只有一個後裔，就是基督。我們必須在祂裏面，纔能有分於神所賜給亞伯拉罕的應許。基督不僅是那承受應許的後裔，也是神所應許給人承受的福。加拉太信徒若從基督轉回到律法，就要喪失這位後嗣，以及神所應許的產業。"]]]},"加1:15":{"t":"然而那把我¹從母腹裏²分別出來，又藉著祂的³恩典⁴呼召我的神，","n":[["1",["即在出生以前。"]],["2",["即為著一個目的，標明或分別出來。"]],["3",["保羅蒙召成為使徒，乃是藉著基督的恩典，不是藉著摩西所傳的律法。"]],["4",["在他出生後，悔改信主時。"]]]},"加1:16":{"t":"既然樂意將祂¹兒子²啟示³在我裏面，叫我把⁴祂當作福音傳在⁵外邦人中，我就即刻⁶沒有與血肉之人商量，","n":[["1",["子神是父神的具體化身和彰顯，（約一18，十四9～11，來一3，）對我們乃是生命。（約十10，約壹五12，西三4。）神的心願，是要將祂的兒子啟示在我們裏面，使我們認識祂，接受祂作我們的生命，（約十七3，三16，）成為神的兒子。（約一12，加四5～6。）祂是活神的兒子，（太十六16，）遠勝過猶太教及其傳統。（13～14。）加拉太人受了猶太教徒的迷惑，認為律法的規條是在活神的兒子之上。因此，使徒在本書信的開頭見證說，他曾捲身於猶太教，且在其中極有長進；然而神將祂的兒子啟示在他裏面，藉此把他從神眼中所看為邪惡的世界系統中救出來。他從經歷裏領悟，他祖先所傳下的猶太教及其死的傳統，是無法與活神的兒子相比的。"]],["2",["不是教導，乃是揭示，使人看見，向人顯示。"]],["3",["神將祂的兒子啟示給我們，是在我們裏面，不是外在的，乃是內在的；不是藉著外面的異象，乃是藉著裏面的看見。這不是客觀的啟示，乃是主觀的啟示。","神分別、呼召使徒保羅，（15，）並將祂的兒子啟示在他裏面，藉此使他成為基督的執事。"]],["4",["使徒保羅不是傳律法，乃是把神的兒子基督當作福音傳揚；不是僅僅關於祂的道理，乃是祂活的人位。"]],["5",["信奉異教的外邦人。"]],["6",["這證實使徒不是從人領受福音。（12。）"]]]},"加4:19":{"t":"我的¹孩子們，我為你們再受²生產之苦，直等到³基督⁴成形在你們裏面。","n":[["1",["保羅認為自己是生身的父親，加拉太信徒是他在基督裏所生的孩子。（參林前四15，門10。）"]],["2",["指生產時疼痛的劬勞。在這隱喻裏，保羅把自己比作生孩子的母親。他初次傳福音給加拉太人時，曾這樣勞苦的重生他們。因著他們偏離他所傳的福音，他就再受生產之苦，直等到基督成形在他們裏面。"]],["3",["基督這活的人位，乃是保羅福音的中心。他的傳揚是把基督，活神的兒子，生在信徒裏面，這與憑字句教導律法極為不同。因此，本書是著重的以基督為中心。祂釘十字架，（三1，）贖出我們脫離律法的咒詛，（三13，）並把我們從世界這邪惡的宗教系救出來；（一4；）祂且從死人中復活，（一1，）使祂能活在我們裏面。（二20。）我們是浸入祂，與祂聯合為一，也穿上了祂，披戴了祂。（三27。）因此，我們是在祂裏面，（三28，）成了屬於祂的。（三29，五24。）另一面，祂已經啟示在我們裏面，（一16，）現今活在我們裏面，（二20，）還要成形在我們裏面。（19。）律法已經帶我們歸於祂，（三24，）在祂裏面我們都是神的兒子。（三26。）乃是在祂裏面，我們承受神所應許的福，享受包羅萬有的那靈；（三14；）也是在祂裏面，我們眾人都是一了。（三28。）我們不該喪失從祂來的這一切好處，而與祂隔絕。（五4。）我們需要祂在我們的靈裏，用恩典供應我們，（六18，）使我們能活祂。"]],["4",["當保羅初次向加拉太人傳福音，使他們得著重生時，基督已經生在他們裏面，但還沒有成形在他們裏面。現今使徒為他們再受生產之苦，使基督能成形在他們裏面。使基督成形在我們裏面，就是使基督在我們裏面完全長大。基督先是在我們悔改信主時，生在我們裏面；然後是在我們基督徒的生活中，活在我們裏面；（二20；）還要在我們成熟時，成形在我們裏面。我們要成為成年的兒子，成為承受神應許之福的後嗣，並在神聖的兒子名分上成熟，就需要讓基督成形在我們裏面。"]]]},"西1:12":{"t":"感謝父，叫你們¹彀資格在²光中同得所分給眾聖徒的³分；","n":[["1",["父神用子神的救贖，藉靈神的聖別，使我們彀資格同得包羅萬有的基督，就是經過過程之三一神的化身，作眾聖徒的分。"]],["2",["這裏的光，與下節的黑暗相對。當我們在撒但的權下，我們就是在黑暗裏。但現今我們是在神愛子的國裏，在光中享受祂。"]],["3",["指業分，如以色列人分得迦南美地之分，作他們的產業。（書十四1。）新約信徒的基業，我們所分得的分，不是物質的土地，乃是包羅萬有的基督。祂是眾聖徒所分得的分，作了我們神聖的基業，給我們享受。"]]]},"西2:6":{"t":"你們既然¹接受了基督，就是主耶穌，","n":[["1",["基督是眾聖徒的分，（一12，）給我們享受。信入祂就是接受祂。祂是包羅萬有的靈，（林後三17，）進入我們裏面，並住在我們靈裏，（提後四22，）作我們的一切。"]]]},"西2:7":{"t":"在祂裏面已經¹生根，並正被建造，且照著你們所受的教導，²在信心上得以堅固，洋溢著感謝，就要在祂裏面³行事為人。","n":[["1",["如同植物，我們乃是活的生機體，已經在基督這土壤、土地裏生根，吸取祂一切的豐富作營養，成為我們的元素和本質，使我們藉此長大並建造。生根，是為著生命的長大，這是已經完成的；被建造，是為著基督身體的建造，這是正在進行的。這兩件事都是在基督裏。"]],["2",["“在信心上，”這裏是指在我們的信心上，就是我們所藉以相信的主觀信心。"]],["3",["我們既然接受了基督，就該在祂裏面行事為人。行事為人就是生活、行動、舉止、為人。我們該在基督裏行事為人，生活行動，使我們能享受祂的豐富，就如以色列人住在美地，享受其上一切豐富的出產。今天的美地就是基督那包羅萬有的靈，（加三14，）祂住在我們的靈裏，（提後四22，羅八16，）作我們的享受。照著這靈而行，（羅八4，加五16，）乃是新約的中心和關鍵。"]]]},"加5:16":{"t":"我說，你們當憑著¹靈而²行，就絕不會滿足¹肉體的情慾了。","n":[["1",["按本章上下文，這裏的靈必是聖靈，這靈住在我們重生的靈裏，並與我們重生的靈調和。憑著靈而行，就是讓聖靈從我們的靈裏，規律我們的行動。這與我們在肉體中靠律法規律我們的行動相對。見三3註2。","肉體是墮落之三部分人極點的表現，（創六3，）那靈是經過過程之三一神終極的實化。（約七39。）因著基督的救贖與那靈重生的工作，我們已經接受神分賜的人，就能不憑著肉體，不憑著我們墮落的人而行，乃憑著那靈，憑著經過過程的三一神而行。保羅寫本書，不僅在消極一面拯救被岔開的加拉太信徒脫離律法，更在積極一面使他們認識，在信徒的靈裏有包羅萬有賜生命的靈，叫他們可以在這靈裏生活行動。"]],["2",["原文意踏遍各處，自由行走；因此指日常生活中的舉止行動，含示一般習慣的日常行動。（參羅六4，八4，腓三17～18。）"]]]},"加5:25":{"t":"我們若¹憑著靈活著，也就當憑著靈而²行。","n":[["1",["憑著靈活著，就是使我們的生活倚靠那靈並受那靈規律，而不受律法規律。這等於16節的憑著靈而行，但與本節的憑著靈而行不同。（見註2。）"]],["2",["直譯，按規則而行。原文意遵守原理，照原理而行，如列隊行走，在軍隊行列中前進，步伐一致；引伸為整齊有規律的行動。（參六16，徒二一24，羅四12與註，腓三16與註4。）","本章16節和本節的行，都是憑著那靈，受那靈的規律，但前者指一般、日常的行動，後者指以神惟一的目標為生活的方向和目的，並以那靈為我們的基本原則、基礎準則，藉著活在新造裏，（六16與註1，）竭力追求基督以取得祂，（腓三12與註，）並實行召會的生活，（羅十二1～5，弗四1～16，）使這種行動得著培養，而成全神在基督裏對召會的意願。"]]]},"創15:12":{"t":"日頭正落的時候，亞伯蘭沉沉的睡了；忽然有驚人的大黑暗落在他身上。","n":[]},"創15:13":{"t":"耶和華對亞伯蘭說，你要確實知道，你的後裔必寄居別人的地，又服事那地的人；那地的人要¹苦待他們²四百年。","n":[["1",["神豫言亞伯拉罕的後裔要在埃及寄居、受奴役並受苦，這確證亞伯拉罕必定會得著兒子，後裔，（4，）也確證神在祂的信實裏必定守住祂在十二7和十三14～17的應許，將尼羅河到幼發拉底河的地賜給他的後裔。（18與註。）"]],["2",["見加三17註2。"]]]},"創15:14":{"t":"但他們所要服事的那國，我要懲罰，後來他們必帶著許多財物從那裏出來。","n":[]},"創15:15":{"t":"至於你，你要享大壽數，被人埋葬，平平安安的歸到你列祖那裏。","n":[]},"創15:16":{"t":"到了第四代，他們必回到此地，因為亞摩利人的罪孽還沒有滿盈。","n":[]},"創15:17":{"t":"日落天黑，不料有冒煙的¹爐並燒著的¹火把，從那些肉塊中經過。","n":[["1",["爐是為著煉淨，火把是為著光照。神與亞伯拉罕立約，在黑夜裏如同冒煙的爐並燒著的火把，從祭牲中經過。這表徵神所呼召的人遭受苦難時，祂要進來煉淨並光照他們，使他們藉著後裔和地完成祂的定旨。"]]]},"創15:18":{"t":"當那日，耶和華與亞伯蘭立約，說，我已賜給你的後裔，從¹埃及河直到伯拉大河之地，","n":[["1",["神在與亞伯拉罕所立的約中，定了美地的界限；這地乃是以馬內利之地，（賽八8，）以色列的領土，從尼羅河到幼發拉底河。（參出二三31，申十一24，書一3～4。）這是亞伯拉罕獨一的後裔基督，（十二7上，加三16，）為著建立千年國所要承受的地。見申十一24註1與太二五34註1。"]]]},"創15:19":{"t":"就是基尼人、基尼洗人、甲摩尼人、","n":[]},"創15:20":{"t":"赫人、比利洗人、¹利乏音人、","n":[["1",["是巨人族。（申三11。）"]]]},"創15:21":{"t":"亞摩利人、迦南人、革迦撒人、耶布斯人之地。","n":[]},"創16:1":{"t":"亞伯蘭的妻子¹撒萊沒有給他生兒女。撒萊有一個使女，名叫¹夏甲，是埃及人。","n":[["1",["撒拉和夏甲是寓意，象徵兩約。（加四22～28，24註2與註5。）"]]]},"創16:2":{"t":"撒萊對亞伯蘭說，耶和華使我不能生育，求你和我的使女同房，或者我可以因她¹得孩子。亞伯蘭聽了撒萊的話。","n":[["1",["直譯，得建立。"]]]},"創16:3":{"t":"於是亞伯蘭的妻子撒萊，將使女埃及人夏甲給了她丈夫為妻；那時亞伯蘭在迦南地已經住了十年。","n":[]},"創16:4":{"t":"亞伯蘭與夏甲同房，夏甲就懷了孕；她見自己有孕，就輕看她的主母。","n":[]},"創16:15":{"t":"後來夏甲給亞伯蘭生了一個兒子；亞伯蘭給他起名叫¹以實瑪利。","n":[["1",["亞伯拉罕藉夏甲生以實瑪利，象徵人想用自己肉體的努力與律法配合，以完成神的定旨。（見加二16註2，四23註1。）"]]]},"創16:16":{"t":"夏甲給亞伯蘭生以實瑪利的時候，亞伯蘭年八十六歲。","n":[]},"創17:2":{"t":"我要與你立約，使你的後裔極其增多。","n":[]},"創17:3":{"t":"亞伯蘭面伏於地；神又與他談話，說，","n":[]},"創17:4":{"t":"我與你立的約是這樣：你要成為多¹國的父。","n":[["1",["4～6節以及三五11題到國與王，含示我們繁增的結果必定是正確的召會生活，作神在地上的國。（羅十四17與註1。）見十二2註2。"]]]},"創17:5":{"t":"你的名不要再叫¹亞伯蘭，要叫²亞伯拉罕，因為我已立你作多國的父。","n":[["1",["意，得高舉的父。"]],["2",["意，多人的父。神要完成祂永遠的定旨，所需要的不是一個得高舉的人，乃是一位多人的父。（參一28，九1。）所以，亞伯拉罕改名，表徵他的人位更換，乃是為著完成神的定旨。在屬靈的經歷裏，真正的改名是從“我”改成基督，（加二20，）並從“我”改成神的恩典。（林前十五10。）惟有作神恩典的基督，不是“我，”纔能產生完成神定旨所需眾多的人。（見十五4註1。）參三二27～28，約一42。"]]]},"創17:6":{"t":"我必使你的後裔極其繁多；我必使多國從你而立，多王從你而出。","n":[]},"創17:7":{"t":"我必與你並你世世代代的後裔堅立我的約，作永遠的約，為要作你和你後裔的神。","n":[]},"創17:8":{"t":"我要將你寄居的地，就是迦南全地，賜給你和你的後裔永遠為業，我也必作他們的神。","n":[]},"創17:9":{"t":"神又對亞伯拉罕說，至於你，你和你的後裔當世世代代遵守我的約。","n":[]},"創17:10":{"t":"你們所有的男子都要受¹割禮；這就是我與你並你的後裔所立的約，是你們所當遵守的。","n":[["1",["割禮的屬靈意義乃是藉著基督的釘十字架，脫去肉體，脫去己和舊人。（西二11，13上，申十16，耶四4上，徒七51，加五24，羅六6，弗四22，西三9。）在十六章，亞伯拉罕運用他的肉體生了以實瑪利。在這裏，神要他割除他的肉體，了結他天然的力量，使神可以進來藉著恩典產生以撒，以完成祂的定旨。舊約的割禮等於新約的受浸。（西二11～12與註。）真正的割禮不是外面肉體的，乃是裏面的，是“心裏的，在於靈，不在於字句。”（羅二28～29。）見書五2註1。"]]]},"創17:11":{"t":"你們都要受割禮，這是我與你們¹立約的記號。","n":[["1",["雖然神關於祂選民承受美地的應許（十二1～2，7，十三15～17）已立為約，（十五4～5，18～21，）但仍需要用割禮的約堅定神應許的約。割禮是神選民所必須經過的步驟，好承受神的應許。割禮表徵神新約的選民必須藉著十字架被了結，好承受神所應許在基督裏的一切豐富。（參加二20。）見羅四11與註1。"]]]},"創17:12":{"t":"你們世世代代的男子，無論是家裏生的，或是在你後裔之外用銀子從外人買的，生下來¹第八日，都要受割禮。","n":[["1",["在表號上，第八日作為新的七日的第一日，是指基督的復活。（太二八1，約二十1。）割禮必須是在復活裏，並且總是將我們引進復活，（西二12，參羅六3～5，）使我們成為新人，新造，（林後五17，加六15，）以完成神的定旨。","割禮相當於人的改名。（5。）二者都表徵我們舊人的了結，以及我們的所是被帶到復活裏，使我們不再是天然的人，乃是復活的人。"]]]},"創17:13":{"t":"你家裏生的和你用銀子買的，都必須受割禮。這樣，我的約就立在你們肉體上作永遠的約。","n":[]},"創17:14":{"t":"但不受割禮的男子必¹從民中剪除，因他背了我的約。","n":[["1",["神所呼召的人若不憑著了結他們的己和天然的人，過釘十字架的生活，他們就會在主觀的經歷裏，從基督、從召會生活、並從神恩典的供應被剪除，而與完成神定旨之神的約無分無關。（約十五6，加五4。）"]]]},"創17:15":{"t":"神又對亞伯拉罕說，至於你的妻子¹撒萊，不可再叫撒萊，她的名要叫²撒拉。","n":[["1",["意，我的公主。"]],["2",["意，公主。“公主”前面“我的”這辭（見15註1）指明狹窄與特別。這裏撒拉的改名表徵廣博，表示她這個人擴大且寬廣了，使她成為多國之母。（16。）正如在亞伯拉罕（5）和撒拉身上所看見的，這樣的改變要求我們的舊人和天然人被了結，使我們能變化成為新人；這樣的人纔能產生後裔並關心別人，使神的定旨得以完成。"]]]},"創17:16":{"t":"我必賜福給她，也要使你¹從她得一個兒子。我必賜福給她，她也要作多國之母，必有多民的君王從她而出。","n":[["1",["即憑神應許之約裏神的恩典，在此由亞伯拉罕的妻子，自主的婦人撒拉所象徵。（加四22～26。）以撒是從撒拉出生，表徵基督裏的信徒是憑神的恩典，在基督的復活裏出生，（彼前一3，）成為亞伯拉罕合法的後裔。（加四28，31，三29。）本章裏神割禮的約相當於新約，在這新約中基督的死割除我們肉體裏的舊人，並且基督的復活使我們的新人（由以撒所表徵）有新生的起頭，使我們成為新造。（林後五17。）"]]]},"創17:17":{"t":"亞伯拉罕就面伏於地笑了，心裏說，一百歲的人還能得孩子麼？撒拉已經九十歲了，還能生孩子麼？","n":[]},"創17:18":{"t":"亞伯拉罕對神說，但願以實瑪利活在你面前。","n":[]},"創17:19":{"t":"神說，不然，你妻子撒拉必給你生一個兒子，你要給他起名叫¹以撒。我要²與他堅定所立的約，作他後裔永遠的約。","n":[["1",["意，他喜笑。"]],["2",["以實瑪利是肉體所產生的後裔，為神所棄絕。（二一10。）惟有以撒是憑神恩典所產生的後裔，是為著完成神定旨所立定的。（21，二一12，羅九7～9。）"]]]},"創17:20":{"t":"至於以實瑪利，我也應允你；我已賜福給他，使他繁衍，極其增多。他必生十二個首領；我也要使他成為大國。","n":[]},"創17:21":{"t":"到明年這¹約定的日期，撒拉必給你生以撒，我要與他堅定所立的約。","n":[["1",["見十八14註2。"]]]},"加4:22":{"t":"因為律法上記著，亞伯拉罕有兩個兒子，一個是出於使女，一個是出於自主的婦人。","n":[]},"加4:23":{"t":"然而那出於使女的，是¹按著肉體生的；那出於自主婦人的，是¹藉著應許生的。","n":[["1",["按著肉體，是靠著人肉體的努力；藉著應許，意即在神的應許所含示之恩典裏，藉著神的能力。以實瑪利是按著肉體生的，以撒卻是藉著應許生的。"]]]},"加4:24":{"t":"這些都是寓意：¹兩個婦人就是²兩約，一個是出於³西乃山，生子⁴為奴，乃是⁵夏甲。","n":[["1",["指22節的兩個婦人。"]],["2",["一個是給亞伯拉罕的應許之約，這與新約，恩典之約相關聯；另一個是給摩西的律法之約，這與新約完全無關。撒拉是自主的婦人，象徵應許之約；夏甲是使女，象徵律法之約。"]],["3",["降律法之地。（出十九20，二四12。）"]],["4",["在律法之下為奴。"]],["5",["亞伯拉罕的妾夏甲，表徵律法。因此，律法的地位像妾的地位。亞伯拉罕的妻子撒拉，象徵神的恩典，（約一17，）在神的經綸中有合法的地位。律法像夏甲，生子為奴，如猶太教徒；恩典像撒拉，生子得兒子的名分，這些是新約的信徒。他們不再在律法之下，乃在恩典之下。（羅六14。）他們該站在這恩典中，（羅五2，）不從其中墜落。（五4。）"]]]},"加4:25":{"t":"這夏甲就是在亞拉伯的西乃山，相當於現在的¹耶路撒冷，因耶路撒冷同她的兒女都是²作奴僕的。","n":[["1",["耶路撒冷是神所揀選的，（王上十四21，詩四八2，8，）應當屬於撒拉所象徵的應許之約。然而，因她將神的選民帶到律法的轄制之下，所以相當於西乃山，屬於夏甲所象徵的律法之約。"]],["2",["直譯，作奴僕服事。指律法之下的奴僕。在使徒時代，耶路撒冷同她的兒女都是律法之下的奴僕。"]]]},"加4:26":{"t":"但那¹在上的耶路撒冷是自主的，她是我們的母，","n":[["1",["這至終將是在新天新地中的新耶路撒冷，（啟二一1～2，）與應許之約相關聯。她是新約信徒之母，這些信徒不是律法之下的奴僕，乃是恩典之下的兒子。我們新約的信徒，都是從上頭由她生的，也都要在新天新地中的新耶路撒冷裏。"]]]},"加4:27":{"t":"因為經上記著：“那不生育，沒有生產過的，你要快樂；那未曾經過產難的，你要放聲呼喊，因為¹獨居的，比有丈夫的兒女²更多。”","n":[["1",["如無夫之婦，所以是獨居的。"]],["2",["這指明亞伯拉罕屬靈的子孫，比他天然的子孫更多。他屬靈的子孫屬於天上的耶路撒冷，屬於在恩典自由下的應許之約；他天然的子孫屬於地上的耶路撒冷，屬於在律法奴役下的律法之約。"]]]},"加4:28":{"t":"弟兄們，你們乃是藉著¹應許生的兒女，像以撒一樣。","n":[["1",["藉著應許生的兒女，就是在應許之約下，藉著恩典，由天上的耶路撒冷所生的兒女。"]]]},"加4:29":{"t":"只是，當時那¹按著肉體生的，怎樣²逼迫了那¹按著³靈生的，現在⁴也是這樣。","n":[["1",["這兩約所生的兩種兒女，性質是不同的。由律法之約生的，是按著肉體生的；由應許之約生的，是按著靈生的。按著肉體生的兒女，沒有權利有分於神所應許的福；按著靈生的兒女，卻有完全的權利。猶太教徒是前一種兒女，在基督裏的信徒是後一種。關於肉體和靈，見三3註2，五19註1，22註1。"]],["2",["指以實瑪利逼迫以撒。（創二一9。）"]],["3",["藉著應許生的兒女（28）是按著靈，就是按著神生命之靈生的；這靈就是神所應許給亞伯拉罕的福。（三14。）"]],["4",["猶太教徒，亞伯拉罕按著肉體生的子孫，也逼迫信徒，就是亞伯拉罕按著靈生的子孫，正如以實瑪利逼迫以撒一樣。"]]]},"加4:30":{"t":"然而經上是怎麼說的？“把使女和她兒子趕出去，因為¹使女的兒子，絕不可與²自主婦人的兒子一同承受產業。”","n":[["1",["在律法奴役下的猶太教徒，是使女的兒子，絕不可承受神所應許的福，就是那作三一神終極表現，包羅萬有的靈。"]],["2",["在恩典自由下的新約信徒，是自主婦人的兒子，要承受所應許那靈的福。"]]]},"加4:31":{"t":"所以，弟兄們，我們¹不是使女的兒女，乃是自主婦人的兒女了。","n":[["1",["我們在基督裏的信徒，不是在律法奴役下律法的兒女，乃是在恩典自由下恩典的兒女，享受包羅萬有的靈，連同基督一切的豐富。"]]]},"腓1:20":{"t":"這是照著我所專切期待並盼望的，就是沒有一事會叫我羞愧，只要凡事放膽，無論¹是生，是死，總叫基督在我身體上，現今也照常²顯大，","n":[["1",["直譯，是藉著生，或是藉著死。"]],["2",["意在使徒的身體受苦時，基督得著顯大，也就是顯示或宣揚為大（沒有限量）、得著高舉、得著稱讚。他的受苦給他機會，彰顯基督無限的偉大。他不要律法，不要割禮，只要基督在他身上顯大。本書是論到經歷基督。在任何境遇下顯大基督，就是經歷基督而有最高的享受。"]]]},"腓1:21":{"t":"因為在我，¹活著就是基督，死了就有²益處。","n":[["1",["保羅的生活就是活基督；在他，活著就是基督，不是律法，也不是割禮。他不要活律法，乃要活基督；不要給人看出他是在律法裏，乃要給人看出他是在基督裏。（三9。）基督不僅是他的生命，也是他的生活。他活基督，因為基督活在他裏面。（加二20。）他在生命和生活上，都與基督是一；他與基督同有一個生命，同過一個生活。他們同活，如同一人。基督在他裏面活著，作他的生命；他在外面活基督，作基督的生活。對基督正常的經歷就是活基督，而活基督就是無論環境如何，總叫基督顯大。"]],["2",["這裏的益處，指在更高的程度上與基督同在。但在完成神永遠的定旨上，與基督同在不能與為基督的身體活基督相比。因此，保羅挑選活基督。"]]]},"加3:2":{"t":"我只願問你們這一件，你們¹接受了那²靈，是本於³行律法，還是本於³聽信仰？","n":[["1",["信徒一信入基督，就接受了那靈。我們若認為基督與那靈是分開的，乃是嚴重的誤解。在重生時，我們信入了基督，也接受了那靈，受了祂的印記。（弗一13。）在那一刻，一種生機的聯結發生了，我們就被接枝到三一神裏，（羅十一17，）得著那靈作憑質，（弗一14，）作福音終極的福。（14。）而後，接受那靈乃是一生之久、繼續不斷的事。神將那靈繼續不斷的供應我們。（5。）"]],["2",["加拉太人藉著聽福音，相信了釘十字架的基督，但他們所接受的乃是那靈。釘在十字架上的是基督，但進到信徒裏面的是那靈。在釘十字架救贖信徒時，祂是基督；但在內住成為信徒的生命時，祂是那靈，就是包羅萬有賜生命的靈，這靈是福音包羅一切、終極的福。信徒接受這樣一位神的靈，乃是本於聽信仰，不是本於行律法。這靈進入並活在信徒裏面，不是本於他們守律法，乃是本於他們信釘死又復活的基督。","在本書頭二章，有基督在神聖的啟示中，作為神經綸的中心；在後四章，有那靈在我們的經歷中，使我們得著神聖的生命，（三，）從神而生，（四，）憑這重生的生命行事為人，（五，）並以神聖的定旨為我們的目標。（六。）因此，我們得以不斷享受基督這包羅萬有賜生命的靈。（5上。）"]],["3",["在神舊約的經綸裏，律法是人與神關係的基本條件；（23；）在神新約的經綸裏，信仰是神在人身上完成祂新約經綸惟一的路。（提前一4。）律法與肉體有關，（羅七5，）倚靠肉體的努力；肉體是“我”的顯出。信仰與那靈有關，信靠那靈的運行；那靈是基督的實化。在舊約裏，“我”和肉體在守律法上，擔任重要的角色；在新約裏，基督和那靈接管了“我”和肉體的地位，信仰頂替了律法，使我們能憑那靈活基督。憑著肉體守律法，是人天然的路，在人觀念的黑暗裏，結局是死和苦惱。（羅七10～11，24。）本於聽信仰接受那靈，是神啟示的路，在神啟示的光中，結果是生命和榮耀。（羅八2，6，10～11，30。）因此，我們必須寶貴聽信仰，不寶貴行律法。我們是本於聽信仰接受那靈，使我們能有分於神所應許的福而活基督。本章7、8、9、11、12、23、24、25節所說的信，都是指這信仰。（見一23註3。）"]]]},"加3:5":{"t":"這樣，那¹豐富供應你們那²靈，又在你們中間³行異能的，是本於⁴行律法，還是本於聽信仰？","n":[["1",["原文意完滿、全備、大量的供應。見腓一19。在神一面，祂豐富的供應那靈；在我們一面，我們接受那靈。神供應，我們接受。這種奇妙的神聖傳輸，天天都在發生。我們向這屬天的傳輸敞開，接受包羅萬有賜生命之靈供應的路，乃是藉著運用靈禱告並呼求主。"]],["2",["指包羅萬有、複合的靈，如出三十23～25複合的膏所豫表的。這就是約七39所說的那靈，也就是在復活裏分賜生命的基督。對於在神新約經綸裏的信徒，這靈乃是全備的供應。這完全不是本於行律法，乃是本於信那被釘並得榮的基督。"]],["3",["行，直譯，運行。"]],["4",["神的仇敵撒但想要阻撓神的經綸，就利用神為著祂的定旨暫時所賜的律法，使神所揀選的人從祂的經綸岔開。當律法被用以激動人墮落的願望，想要藉著守律法高抬自己，好得著自己作成的義，這時，律法就被誤用了。"]]]},"約1:16":{"t":"¹從祂的豐滿裏我們都領受了，而且恩上加恩；","n":[["1",["從，直譯，出於。"]]]},"創22:1":{"t":"這些事以後，神試驗亞伯拉罕，對他說，亞伯拉罕。他說，我在這裏。","n":[]},"創22:2":{"t":"神說，你帶著你的兒子，就是你¹獨生的兒子，你所愛的以撒，往²摩利亞地去，在我所要指示你的山上，把他³獻為⁴燔祭。","n":[["1",["亞伯拉罕將他獨生的愛子以撒獻在祭壇上，乃是一幅生動的圖畫，說出父神將祂的獨生愛子耶穌基督，當作祭物獻在十字架上。在這幅圖畫中，以撒很詳細的豫表基督。以撒是亞伯拉罕的獨生子，（2，12，16，）豫表基督是神的獨生子。（約三16。）以撒是亞伯拉罕的愛子，（2，）而基督是父的愛子，是父所喜悅的。（太三17。）以撒接受他父親的意願，（6，）基督也揀選祂父的意思。（太二六39。）以撒順從至死；（9～10；）照樣，基督也順從至死。（腓二8。）以撒背著燔祭的柴，走到摩利亞山頂；（6；）同樣的，基督也背著祂的十字架，走到各各他。（約十九17。）以撒在摩利亞山當作燔祭獻給神；基督也在同一座山被獻給神，（見可十1註1，）應驗了燔祭的豫表。以撒在祭壇上“被殺，”在第三日，也就是在復活裏，歸還給亞伯拉罕；（4，10～13，來十一19；）同樣，基督也被釘在十字架上，並且第三天復活了。（林前十五4。）以撒在復活裏得著繁增，（17，）基督也在祂的復活裏得著繁增。（約十二24，彼前一3。）以撒是亞伯拉罕的後裔，使萬國得福；（18；）照樣，基督是亞伯拉罕惟一的後裔，亞伯拉罕的福在祂裏面臨到了萬國。（加三8，14，16。）"]],["2",["意，耶和華的異象。摩利亞山是神所揀選的地方，至終成了錫安山，就是建殿的地點，（參代下三1，）也是美地的中心。亞伯拉罕是第一個帶著燔祭在錫安山上敬拜神的人。後來，神吩咐亞伯拉罕的子孫，就是以色列人，要一年三次到這地方敬拜神，向祂獻上他們的燔祭。（申十六16，詩一三二13。）今天，新約的信徒是亞伯拉罕屬靈的子孫，乃是在錫安山上。（來十二22～23。）至終，我們眾人要與亞伯拉罕一同在永遠的錫安山，新耶路撒冷，敬拜神。（啟二一22。）"]],["3",["以撒豫表基督是應許的後裔，（加三16，）由神賜給了亞伯拉罕。神在這裏要亞伯拉罕把神所賜給他的，交還給神。這對亞伯拉罕必然是個試驗。（1，來十一17。）這說出在神的經綸裏一個基本的原則：凡神所賜給我們的，甚至是祂作到我們裏面並藉著我們作的，至終都必須獻回給祂，好使我們過信心的生活，不抓住任何事物，甚至是神所賜的事物，而單單倚靠祂。以撒被獻上之後，又在復活裏歸還亞伯拉罕，並且成為祝福。（12～13，16，18，來十一19。）照樣，我們向神獻上從祂所接受的之後，祂也會在復活裏將其歸還我們，這要成為祝福，以完成神的定旨。見羅四17與註。"]],["4",["見利一3註1。"]]]},"創22:3":{"t":"亞伯拉罕¹清早起來，備上驢，帶著兩個僕人和他兒子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去。","n":[["1",["亞伯拉罕立即順從神，因為他相信那使人復活的神。（5，來十一17～19，雅二21～22，羅四17與註1。）"]]]},"創22:4":{"t":"到了第三日，亞伯拉罕舉目遠遠的看見那地方。","n":[]},"創22:5":{"t":"亞伯拉罕對他的僕人說，你們和驢在這裏等著，我與童子往那裏去敬拜，然後回到你們這裏來。","n":[]},"創22:6":{"t":"亞伯拉罕把燔祭的柴放在他兒子以撒身上，自己手裏拿著火與刀；於是二人同行。","n":[]},"創22:7":{"t":"以撒對他父親亞伯拉罕說，父親哪。亞伯拉罕說，我兒，我在這裏。以撒說，請看，火與柴都有了，但燔祭的羊羔在那裏？","n":[]},"創22:8":{"t":"亞伯拉罕說，我兒，神必自己豫備作燔祭的羊羔。於是二人同行。","n":[]},"創22:9":{"t":"他們到了神所指示的地方，亞伯拉罕在那裏築壇，把柴擺好，就捆綁他的兒子以撒，放在壇的柴上。","n":[]},"創22:10":{"t":"亞伯拉罕伸手拿刀，要殺他的兒子。","n":[]},"西2:11":{"t":"你們在祂裏面也受了¹非人手所行的²割禮，乃是在基督的割禮裏，³脫去了肉體的身體，","n":[["1",["這種脫去肉體之身體的割禮，不是人手所行的，乃是藉著基督的死所成就，並藉著大能的靈所應用、執行並完成的。"]],["2",["這是屬靈的割禮，基督的割禮，指正確的受浸；這浸藉著基督之死有力的效能，叫人脫去肉體的身體。這與禁慾主義相抵。（20～22。）"]],["3",["脫去，意剝去某物，如衣服。"]]]},"加5:24":{"t":"¹但那屬基督耶穌的人，是²已經把肉體連肉體的邪情私慾，都³釘了十字架。","n":[["1",["22節的“但，”將該節那靈的果子，與19節肉體的行為作對比；而本節的“但，”是將肉體的釘十字架，與19節肉體的行為作對比。"]],["2",["在羅六6的舊人釘十字架，與本書二20的“我”釘十字架，都不是由我們成就的。然而這裏說，我們已經把肉體連肉體的邪情私慾，都釘了十字架。舊人和“我”是我們這人，肉體是我們這人在實際生活中的表現。我們的舊人和“我”被釘十字架，是基督在十字架上所成就的事實；把我們的肉體連肉體的邪情私慾釘十字架，是我們對這事實實行的經歷。這實行的經歷，需要我們藉著那靈，執行基督所成就的釘死纔得以完成。這就是靠著那靈，治死我們情慾的身體連同這情慾身體之邪惡肢體的行為。（羅八13下，西三5。）","關於十字架的經歷，有三方面：(一)基督所成就的事實；（羅六6，加二20；）(二)我們對已成就之事實的應用；（24；）(三)我們天天背起十字架，經歷所應用的。（太十六24，路九23。）"]],["3",["本書向我們揭示，被誤用的律法與基督相對，（二16，）以及肉體縱任貪慾，抵抗那靈。（17。）十字架已經廢去那傾向守律法的“我，”（二20，）並那縱任貪慾，抵抗那靈的肉體，使基督可以頂替律法，那靈可以頂替肉體。神不要我們憑著肉體守律法，乃要我們憑著那靈活基督。"]]]},"彼前1:3":{"t":"我們主耶穌基督的¹神與父是當受²頌讚的，祂曾照自己的大³憐憫，⁴藉耶穌基督從死人中復活，⁵重生了我們，⁶使我們有⁷活的盼望，","n":[["1",["見弗一3註2，17註1。"]],["2",["見弗一3註3。"]],["3",["見提前一13註3。"]],["4",["當基督復活的時候，我們這些信祂的人全都包括在祂裏面。因此我們也與祂一同復活。（弗二6。）在復活裏，祂把神聖的生命分賜到我們裏面，使我們與祂一樣。（見約二十17註3。）這是我們重生的基本因素。"]],["5",["重生，就如救贖和稱義，是神完全救恩的一面。救贖和稱義解決了我們與神之間的難處，使我們與神和好；重生是用神的生命點活我們，把我們帶進與神生命的關係，生機的聯結裏，因此帶來並產生活的盼望。這樣的重生是藉著基督從死人中復活而成全的。“基督的復活，帶進生命和賜生命之靈的恩賜，使新的出生有能力得著活的盼望。”（Alford，阿福德。）"]],["6",["即生出，結果，為要。"]],["7",["指我們今天寄居時對將來的盼望；不是客觀事物的盼望，乃是生命的盼望，就是永遠生命連同一切無窮盡神聖福分的盼望。這盼望該叫我們全然寄望於那要來的恩典。（13。）","重生所帶給得著重生之信徒那活的、生命的盼望，猶如新生嬰兒帶給父母對其將來的種種盼望。這一切都在於新生嬰兒的生命。照樣，信徒重生所得的生命，也使信徒對今世、來世以及永世有多而遠的盼望，就如今世在生命上的長大、成熟、顯出恩賜、能盡功用、變化、得勝、身體得贖、進入榮耀；在來世得進國度，與主同王，享受諸天之國實現裏永遠生命的福樂；以及在永世能在新耶路撒冷，豐滿的有分於神在永世裏，終極彰顯之永遠生命的終極福樂。這一切活的、生命的盼望，都在於信徒重生所得的永遠生命。惟有這神聖的生命，能叫信徒在這生命上長大，一直長到這生命所帶來之盼望的實際裏，使信徒得著前述的種種福樂，作他們不能朽壞、不能玷污、不能衰殘，存留到永遠的基業。（3～4。）"]]]},"腓3:3":{"t":"真¹受割禮的，乃是我們這憑神的靈²事奉，在基督耶穌裏誇口，³不信靠⁴肉體的。","n":[["1",["新約的信徒，藉著基督釘十字架真正受了割禮。（見加五11註1與西二11註2。）他們與熱中猶太教者完全不同。他們不憑律法的規條，乃憑神的靈作祭司事奉；他們不在律法上誇口，只在基督裏誇口；他們不信靠肉體，只信靠那靈。"]],["2",["原文與二17的供奉，同指像祭司的事奉。"]],["3",["在2～3節，有三重的對比：憑神的靈事奉的信徒，與犬類成對比；在基督裏誇口的信徒，與作惡的成對比；不信靠肉體的信徒，與妄自行割的成對比。"]],["4",["這裏的肉體，包含我們天然人的一切所是和所有。熱中猶太教者信靠割禮，表明他們信靠肉體，不信靠那靈。"]]]},"代下20:7":{"t":"我們的神阿，你不是曾把這地的居民從你民以色列人面前趕出去，將這地賜給你朋友亞伯拉罕的後裔永遠為業麼？","n":[]},"賽41:8":{"t":"惟你¹以色列我的僕人，雅各我所揀選的，我朋友亞伯拉罕的後裔；","n":[["1",["按照8～20節，基督作耶和華的僕人，是由以色列所豫表，為要成就耶和華對以色列所說仁慈安慰的話。（四十1～2。）以色列作耶和華僕人基督的豫表，乃是耶和華所揀選，並用祂公義的右手所扶持的。（8～10，四二1上，6。）以色列如同基督，藉耶和華勝過仇敵，並因祂這位以色列的聖者歡樂，以祂為誇耀。（11～16，啟三21，太十一25～26。）以色列也豫表基督是耶和華的見證人。（四三10，啟一5上，三14。）就如那靈澆灌在基督身上，耶和華的靈也澆灌在以色列身上，使他的後裔得福。（四四1～5，21，四二1下，太三16，路四18～19。）耶和華也要因以色列得榮耀，就如神因基督得榮耀一樣。（四三7，四九3，四六13下，約十七1，十二28。）"]]]},"雅2:23":{"t":"這就應驗經上所說的：“亞伯拉罕信神，這就算為他的義。”他又得稱為神的朋友。","n":[]},"創19:29":{"t":"當神毀滅平原諸城的時候，祂記念亞伯拉罕，正在傾覆羅得所住之諸城的時候，就打發羅得從傾覆之中出來。","n":[]},"創19:12":{"t":"那兩個人對羅得說，你這裏還有甚麼人？無論是女婿，是兒女，還是這城中一切屬你的人，你都將他們從這地方帶出去。","n":[]},"創19:13":{"t":"我們就要毀滅這地方；因為他們罪惡的聲音在耶和華面前甚大，耶和華差我們來，要毀滅這地方。","n":[]},"創19:14":{"t":"羅得就出去，告訴要娶他女兒的女婿們說，你們起來離開這地方，因為耶和華要毀滅這城。他女婿們卻以為他在說戲言。","n":[]},"創19:15":{"t":"天明了，天使催逼羅得說，起來，帶著你的妻子和你在這裏的兩個女兒出去，免得你因這城裏的罪孽同被剿滅。","n":[]},"創19:16":{"t":"但羅得¹遲延不走。那兩個人因為耶和華憐憫羅得，就抓著他的手和他妻子的手，並他兩個女兒的手，把他們領出來，安置在城外；","n":[["1",["羅得不願意逃離邪惡被定罪的城；但主有憐憫，將他從所多瑪拉出來，像從火中抽出柴來一樣。（參亞三2，猶23。）"]]]},"創19:17":{"t":"領他們出來以後，就說，逃命罷！不可回頭看，也不可在平原上任何一處站住。要往山上逃跑，免得你被剿滅。","n":[]},"創19:18":{"t":"羅得對他們說，主阿，但願不要如此。","n":[]},"創19:19":{"t":"你僕人已經在你眼前蒙恩，你又向我顯出莫大的慈愛，保全我的性命；我沒有力量逃到山上，恐怕這災禍追上我，我便死了。","n":[]},"創19:20":{"t":"看哪，這座小城很近，容易逃到。這不是一座小城麼？求你讓我逃到那裏，我的性命就得存活。","n":[]},"創19:21":{"t":"天使對他說，這事我也應允你；我不傾覆你所說的這城。","n":[]},"創19:22":{"t":"你要快快逃到那裏；因為你還沒有到那裏，我不能作甚麼。因此那城名叫¹瑣珥。","n":[["1",["意，小。"]]]},"創21:1":{"t":"¹耶和華按先前的話²眷顧撒拉，便照祂所應許的給撒拉成就。","n":[["1",["1～13節，見加四22～31註。"]],["2",["見十八14註2。"]]]},"創21:2":{"t":"當亞伯拉罕年老的時候，撒拉懷了孕；到神和亞伯拉罕約定的日期，就給亞伯拉罕¹生了一個兒子。","n":[["1",["神在祂經綸中的目標，是要產生基督為後裔，以完成祂永遠的定旨。（三15，十二7，二二18，加三16，撒下七12～14上。）以撒的出生，表徵基督這應許的後裔是在神豫定的時候，藉著神恩典的工作所產生的。這事的首要條件，乃是我們天然的生命和力量，必須藉著屬靈的割禮被了結。（十七10～16。）"]]]},"創21:3":{"t":"亞伯拉罕為撒拉給他生的兒子起名叫¹以撒。","n":[["1",["意，他喜笑。"]]]},"創21:4":{"t":"以撒生下來¹第八日，亞伯拉罕照著神所吩咐的，給他的兒子以撒²行了割禮。","n":[["1",["見十七12註1。"]],["2",["見十七10註1。"]]]},"創21:5":{"t":"他兒子以撒出生的時候，亞伯拉罕年一百歲。","n":[]},"創21:6":{"t":"撒拉說，神使我歡笑，凡聽見的必與我一同歡笑；","n":[]},"創21:7":{"t":"又說，誰能豫先對亞伯拉罕說，撒拉要乳養兒女呢？然而在他年老的時候，我竟給他生了一個兒子。","n":[]},"創21:8":{"t":"孩子¹漸長，就斷了奶。以撒斷奶的日子，亞伯拉罕設擺盛大的筵席。","n":[["1",["以撒的長大，表徵基督生在新約信徒裏面之後的長大。基督在我們裏面需要長大，好使基督成形在我們裏面。（加四19與註4。）"]]]},"創21:9":{"t":"當時，撒拉看見埃及人夏甲給亞伯拉罕所生的兒子¹戲笑，","n":[["1",["見加四29註2，三17註2。"]]]},"創21:10":{"t":"就對亞伯拉罕說，你把這使女和她兒子¹趕出去，因為這使女的兒子不可與我的兒子以撒，一同承受產業。","n":[["1",["把夏甲和以實瑪利趕出去，表徵把律法和肉體努力的結果趕出去，這些在神的經綸中毫無地位。（見加四24註5，30註1。）"]]]},"創21:11":{"t":"亞伯拉罕因他兒子的緣故甚是愁煩。","n":[]},"創21:12":{"t":"神對亞伯拉罕說，你不必為這童子和你的使女愁煩。凡撒拉對你說的話，你都要聽；因為¹從以撒生的，纔要稱為你的後裔。","n":[["1",["直譯，在以撒裏的。"]]]},"創22:11":{"t":"¹耶和華的使者從天上呼叫他說，亞伯拉罕！亞伯拉罕！他說，我在這裏。","n":[["1",["見十六7註1。"]]]},"創22:12":{"t":"使者說，你不可在這童子身上下手，一點不可害他。現在我知道你是敬畏神的了，因為你沒有將你的兒子，就是你獨生的兒子，留下不給我。","n":[]},"創22:13":{"t":"亞伯拉罕舉目觀看，不料，在他後面有一隻¹公羊，兩²角扣在樹叢中，亞伯拉罕就去取了那隻公羊來，獻為燔祭，代替他的兒子。","n":[["1",["這裏的公羊頂替亞伯拉罕的兒子被殺，豫表基督是神的羔羊，（約一29，）由神所豫備，頂替神所揀選的人，就是那些要承受神應許之產業的人，作為燔祭，（2，）使神得著滿足。"]],["2",["角表徵爭戰的能力，樹叢表徵人性。基督作為神的羔羊，自願讓祂的“角”被祂的人性扣住，使祂可以獻給神作我們的代替。（彼前三18。）參太二六50～54。"]]]},"創22:14":{"t":"亞伯拉罕給那地方起名叫¹耶和華以勒，直到今日人還說，在耶和華的山上²必有豫備。","n":[["1",["意，耶和華必豫備，或耶和華必看見。"]],["2",["或，祂必被看見。"]]]},"創22:15":{"t":"耶和華的使者第二次從天上呼叫亞伯拉罕，說，","n":[]},"創22:16":{"t":"耶和華宣示說，你既行了這事，不留下你的兒子，就是你獨生的兒子，我指著自己起誓：","n":[]},"創22:17":{"t":"論福，我必賜福給你；論繁增，我必使你的後裔繁增，如同¹天上的星，¹海邊的沙；你的後裔必得著仇敵的城門；","n":[["1",["天上的星表徵亞伯拉罕屬天的子孫，就是信心的子孫，（加三7，29，）而海邊的沙和地上的塵沙（十三16）表徵亞伯拉罕屬地的子孫，就是肉身的子孫。海邊的沙就是沿海的塵沙。這沙與海分開，也被海的波浪所沖刷。海表徵外邦列國。（賽五七20，啟十七15。）歷世紀以來，被神用來懲治以色列的外邦列國，（見珥一4與註，）就像從地中海來的波浪，他們入侵的軍隊一波一波的上來沖刷以色列這塵沙，所產生的遺民就像海邊的沙。（亞十二～十四，羅九27～29。）新耶路撒冷是由亞伯拉罕的這兩班子孫組成。（啟二一12，14。）因此，新耶路撒冷將是亞伯拉罕後裔的終極總結。以撒被亞伯拉罕獻給神，就繁增成為新耶路撒冷；這乃是神對亞伯拉罕的祝福。"]]]},"創22:18":{"t":"並且地上萬國，都必因你的¹後裔得福；因為你聽從了我的話。","n":[["1",["按照加三14，神賜給亞伯拉罕的應許，乃是神自己要來成為亞伯拉罕的後裔，這後裔要藉著成為包羅萬有的靈給人類接受，（林前十五45，）而成為賜給萬國的福。神賜福給亞伯拉罕，至終產生基督這獨一的後裔，地上萬國都要因祂得福。（徒三25～26，加三16。）所有在基督裏的信徒乃是團體基督的肢體，（林前十二12，）都包含在這後裔之內，成為承受神應許之福的後嗣。（加三7，29與註1。）","在本章，基督以三種方式啟示出來：祂是耶和華的使者，（11～12，15～18，）是公羊，（13，）也是亞伯拉罕的後裔。（18。）耶和華的使者，就是基督，豫備了豫表基督的公羊，最終產生了後裔，這後裔也是基督。"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
