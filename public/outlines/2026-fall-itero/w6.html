<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一","items":[{"lv":1,"label":"壹、","text":"雅各的夢乃是神目標的夢，也就是伯特利的夢，神家的夢（創二八10～22），這家就是今日的召會（提前三15），要終極完成於新耶路撒冷，作神和祂所救贖之選民永遠的居所（啓二一3、22）：","refs":[{"label":"創28:10-22","keys":["創28:10","創28:11","創28:12","創28:13","創28:14","創28:15","創28:16","創28:17","創28:18","創28:19","創28:20","創28:21","創28:22"]},{"label":"提前3:15","keys":["提前3:15"]},{"label":"啟21:3","keys":["啟21:3"]},{"label":"啟21:22","keys":["啟21:22"]}]},{"lv":2,"label":"一、","text":"神有一個夢，就是要得着新耶路撒冷這座建造的城，作祂經綸的終極完成；這建造就是神建造到人裏面，人建造到神裏面—神的建造乃是一位神人，在這建造裏，神是人的家（詩九十1，九一1、9），人也是神的家（賽六六1～2，五七15，約十四20、23，十五5，啓二一3、22）。","refs":[{"label":"詩90:1","keys":["詩90:1"]},{"label":"詩91:1","keys":["詩91:1"]},{"label":"詩91:9","keys":["詩91:9"]},{"label":"賽66:1-2","keys":["賽66:1","賽66:2"]},{"label":"賽57:15","keys":["賽57:15"]},{"label":"約14:20","keys":["約14:20"]},{"label":"約14:23","keys":["約14:23"]},{"label":"約15:5","keys":["約15:5"]},{"label":"啟21:3","keys":["啟21:3"]},{"label":"啟21:22","keys":["啟21:22"]}]},{"lv":2,"label":"二、","text":"我們的夢就是要成爲新耶路撒冷，作神經綸的終極完成—9～10節。","refs":[{"label":"啟21:9-10","keys":["啟21:9","啟21:10"]}]},{"lv":2,"label":"三、","text":"夢的原則就是說，在夢中有些不可能的事臨到了我們—參路一37，十八27，伯四二2～3，詩一二六1，耶三二27：","refs":[{"label":"路1:37","keys":["路1:37"]},{"label":"路18:27","keys":["路18:27"]},{"label":"伯42:2-3","keys":["伯42:2","伯42:3"]},{"label":"詩126:1","keys":["詩126:1"]},{"label":"耶32:27","keys":["耶32:27"]}]},{"lv":3,"label":"1.","text":"每一個屬靈的異象，都是一個夢；每一個屬靈的經歷，也都是一個夢。","refs":[]},{"lv":3,"label":"2.","text":"大多數屬天的異象是在受苦時臨到的，那時我們與屬人的東西斷絕，而信靠屬神的東西—參創二八10～12。","refs":[{"label":"創28:10-12","keys":["創28:10","創28:11","創28:12"]}]},{"lv":3,"label":"3.","text":"我們屬靈生命第一次的夢是我們的得救；進到召會生活是一個夢，認識召會的實行也是一個夢。","refs":[]},{"lv":3,"label":"4.","text":"每一個屬靈的夢的中心，總是基督這梯子，祂是那將天帶到地，並將地聯於天的一位—約一51。","refs":[{"label":"約1:51","keys":["約1:51"]}]}]},{"day":"週二","items":[{"lv":1,"label":"貳、","text":"雅各在創世記二十八章的夢，是整卷創世記最緊要的點，也是神啓示中最重要的話語：","refs":[]},{"lv":2,"label":"一、","text":"基督在祂成爲伯特利的天梯這事上，對我們說出神如何渴望在地上得着一個由蒙祂救贖並變化的選民所構成的家，使祂可以把天（神）帶到地（人），並把地（人）聯於天（神），使二者成爲一，直到永遠—約一51，創二八10～22。","refs":[{"label":"約1:51","keys":["約1:51"]},{"label":"創28:10-22","keys":["創28:10","創28:11","創28:12","創28:13","創28:14","創28:15","創28:16","創28:17","創28:18","創28:19","創28:20","創28:21","創28:22"]}]},{"lv":2,"label":"二、","text":"在雅各之夢的記載裏，石頭（11、18、22）、柱子（18）、神的家（17、19、22）和油（18），是特出的項目，也是組成聖經的基本因素：","refs":[{"label":"創28:11","keys":["創28:11"]},{"label":"創28:18","keys":["創28:18"]},{"label":"創28:22","keys":["創28:22"]},{"label":"創28:17","keys":["創28:17"]},{"label":"創28:19","keys":["創28:19"]}]},{"lv":3,"label":"1.","text":"石頭象徵基督是基石、頂石和房角石，爲着神的建造，就是祂屬靈的殿—賽二八16，亞四7，徒四10～12。","refs":[{"label":"賽28:16","keys":["賽28:16"]},{"label":"亞4:7","keys":["亞4:7"]},{"label":"徒4:10-12","keys":["徒4:10","徒4:11","徒4:12"]}]},{"lv":3,"label":"2.","text":"石頭也象徵變化過的人，由基督這變化人的元素所構成，成爲建造神家的材料（創二12，太十六18，約一42，林前三12，彼前二5，啓二一11、18～20）；神的家就是今日的召會（提前三15），要終極完成於新耶路撒冷，作神和祂所救贖之選民永遠的居所（啓二一3、22，約十四23）。","refs":[{"label":"創2:12","keys":["創2:12"]},{"label":"太16:18","keys":["太16:18"]},{"label":"約1:42","keys":["約1:42"]},{"label":"林前3:12","keys":["林前3:12"]},{"label":"彼前2:5","keys":["彼前2:5"]},{"label":"啟21:11","keys":["啟21:11"]},{"label":"啟21:18-20","keys":["啟21:18","啟21:19","啟21:20"]},{"label":"提前3:15","keys":["提前3:15"]},{"label":"啟21:3","keys":["啟21:3"]},{"label":"啟21:22","keys":["啟21:22"]},{"label":"約14:23","keys":["約14:23"]}]}]},{"day":"週三、週四","items":[{"lv":3,"label":"3.","text":"雅各用石頭作枕頭，表徵基督神聖的元素藉着我們對祂主觀的經歷，構成到我們這人裏面，成爲給我們安息（包括滿足）的枕頭，在我們裏面堅固的扶持我們—參太十一28。","refs":[{"label":"太11:28","keys":["太11:28"]}]},{"lv":3,"label":"4.","text":"雅各從夢中醒來，把所枕的石頭立作柱子，表徵我們所經歷那作到我們裏面、我們憑祂得安息的基督，成了神的建造—神的家—的材料和支撐—參王上七17、21，加二9，啓三12。","refs":[{"label":"王上7:17","keys":["王上7:17"]},{"label":"王上7:21","keys":["王上7:21"]},{"label":"加2:9","keys":["加2:9"]},{"label":"啟3:12","keys":["啟3:12"]}]},{"lv":3,"label":"5.","text":"最後，雅各澆油在柱子上面，油象徵那靈作爲三一神的終極完成臨到人（出三十23～30，路四18），澆了油的柱子象徵變化過的人與三一神是一，並且彰顯三一神。","refs":[{"label":"出30:23-30","keys":["出30:23","出30:24","出30:25","出30:26","出30:27","出30:28","出30:29","出30:30"]},{"label":"路4:18","keys":["路4:18"]}]},{"lv":3,"label":"6.","text":"那石頭成了伯特利，神的家（創二八17、19、22）：","refs":[{"label":"創28:17","keys":["創28:17"]},{"label":"創28:19","keys":["創28:19"]},{"label":"創28:22","keys":["創28:22"]}]},{"lv":4,"label":"a.","text":"神的家是神與祂所救贖的人相互的居所（約十四2、23）—人作神的居所（賽六六1～2，林前三16，弗二22，來三6，啓二一3），神作人的居所（詩九十1，九一1，約十五5，啓二一22）。","refs":[{"label":"約14:2","keys":["約14:2"]},{"label":"約14:23","keys":["約14:23"]},{"label":"賽66:1-2","keys":["賽66:1","賽66:2"]},{"label":"林前3:16","keys":["林前3:16"]},{"label":"弗2:22","keys":["弗2:22"]},{"label":"來3:6","keys":["來3:6"]},{"label":"啟21:3","keys":["啟21:3"]},{"label":"詩90:1","keys":["詩90:1"]},{"label":"詩91:1","keys":["詩91:1"]},{"label":"約15:5","keys":["約15:5"]},{"label":"啟21:22","keys":["啟21:22"]}]},{"lv":4,"label":"b.","text":"因此，神的家是由神與人調和爲一所構成；在神的家裏，神在人性裏彰顯祂自己，並且神與人都得着相互並永遠的滿足和安息—詩一三二13～14。","refs":[{"label":"詩132:13-14","keys":["詩132:13","詩132:14"]}]},{"lv":3,"label":"7.","text":"今天在召會生活裏，我們乃是在伯特利的實際裏，應驗了雅各的夢，這裏有天梯、石頭、柱子、神的家和油；這要終極完成於新耶路撒冷，作永遠的伯特利，就是神永遠的家—提前三15，啓二一3、22。","refs":[{"label":"提前3:15","keys":["提前3:15"]},{"label":"啟21:3","keys":["啟21:3"]},{"label":"啟21:22","keys":["啟21:22"]}]},{"lv":3,"label":"8.","text":"神的家是由神與人聯結、調和、合併爲一所構成—約十四23，約壹四15～16，參徒十七24。","refs":[{"label":"約14:23","keys":["約14:23"]},{"label":"約壹4:15-16","keys":["約壹4:15","約壹4:16"]},{"label":"徒17:24","keys":["徒17:24"]}]}]},{"day":"週五","items":[{"lv":1,"label":"叁、","text":"『他夢見一個梯子立在地上，梯子的頂通着天，有神的使者在梯子上，上去下來』（創二八12）；『〔耶穌〕對他〔拿但業〕說，我實實在在的告訴你們，你們將要看見天開了，神的使者上去下來在人子身上』（約一51）：","refs":[{"label":"創28:12","keys":["創28:12"]},{"label":"約1:51","keys":["約1:51"]}]},{"lv":2,"label":"一、","text":"這梯子是雅各之夢的中心、焦點；這夢乃是啓示基督，因爲基督是雅各所見梯子的實際。","refs":[]},{"lv":2,"label":"二、","text":"基督作爲人子，在祂的人性裏乃是立在地上的梯子，將天（神）帶到地（人），並將地與天聯合爲一—參十四6：","refs":[{"label":"約14:6","keys":["約14:6"]}]},{"lv":3,"label":"1.","text":"主耶穌藉着成爲肉體而來，將神帶到人裏面—一14。","refs":[{"label":"約1:14","keys":["約1:14"]}]},{"lv":3,"label":"2.","text":"主耶穌藉着死與復活而去，將人帶到神裏面—十四6、20。","refs":[{"label":"約14:6","keys":["約14:6"]},{"label":"約14:20","keys":["約14:20"]}]}]},{"day":"週六","items":[{"lv":2,"label":"三、","text":"我們重生的靈是神今日的居所（弗二22），是基督這天梯立在地上的基礎（創二八12，提後四22）；因此，我們一轉向我們的靈，就經歷基督作梯子，將神帶給我們，也將我們帶給神：","refs":[{"label":"弗2:22","keys":["弗2:22"]},{"label":"創28:12","keys":["創28:12"]},{"label":"提後4:22","keys":["提後4:22"]}]},{"lv":3,"label":"1.","text":"『弟兄們，我們旣因耶穌的血，得以坦然進入至聖所』—來十19：","refs":[{"label":"來10:19","keys":["來10:19"]}]},{"lv":4,"label":"a.","text":"今天至聖所是在主耶穌所在的天上（九12、24）；當我們還在地上時，如何能進入？","refs":[{"label":"來9:12","keys":["來9:12"]},{"label":"來9:24","keys":["來9:24"]}]},{"lv":4,"label":"b.","text":"祕訣就是希伯來四章十二節所說我們的靈；這位在天上的基督，現今也在我們的靈裏—提後四22。","refs":[{"label":"提後4:22","keys":["提後4:22"]}]},{"lv":4,"label":"c.","text":"祂是那天梯（創二八12，約一51），將我們的靈聯於天，也將天帶到我們的靈裏；因此，我們一轉到靈裏，就進入了至聖所，在那裏與施恩寶座上的神相會。","refs":[{"label":"創28:12","keys":["創28:12"]},{"label":"約1:51","keys":["約1:51"]}]},{"lv":3,"label":"2.","text":"『所以我們只管坦然無懼的來到施恩的寶座前，爲要受憐憫，得恩典，作應時的幫助』—來四16：","refs":[{"label":"來4:16","keys":["來4:16"]}]},{"lv":4,"label":"a.","text":"這裏所說的寶座，毫無疑問，是指天上神的寶座（啓四2）；神的寶座，對全宇宙是掌權的寶座（但七9，啓五1）。","refs":[{"label":"啟4:2","keys":["啟4:2"]},{"label":"但7:9","keys":["但7:9"]},{"label":"啟5:1","keys":["啟5:1"]}]},{"lv":4,"label":"b.","text":"但對我們信徒，卻成了施恩的寶座，由至聖所裏的遮罪蓋（施恩座）所表徵（出二五17、21）；這也是神和羔羊的寶座（啓二二1）。","refs":[{"label":"出25:17","keys":["出25:17"]},{"label":"出25:21","keys":["出25:21"]},{"label":"啟22:1","keys":["啟22:1"]}]},{"lv":4,"label":"c.","text":"那在天上坐在寶座上的基督（羅八34），現今也在我們裏面（10），就是在我們的靈裏（提後四22），這靈就是神居所的所在（弗二22）。","refs":[{"label":"羅8:34","keys":["羅8:34"]},{"label":"羅8:10","keys":["羅8:10"]},{"label":"提後4:22","keys":["提後4:22"]},{"label":"弗2:22","keys":["弗2:22"]}]},{"lv":4,"label":"d.","text":"伯特利是神的家，神的居所，也是天的門；在那裏基督是梯子，把地聯於天，並把天帶到地（創二八12～17，約一51）；我們的靈今天旣是神居所的所在，這靈就是天的門，在這裏基督是梯子，把我們在地上的人聯於天，並把天帶給我們。","refs":[{"label":"創28:12-17","keys":["創28:12","創28:13","創28:14","創28:15","創28:16","創28:17"]},{"label":"約1:51","keys":["約1:51"]}]},{"lv":4,"label":"e.","text":"因此，每當我們轉到靈裏，就能進入天的門，藉着基督作天梯，摸着天上施恩的寶座。","refs":[]},{"lv":2,"label":"四、","text":"這梯子所在之處，有敞開的天、變化過的人、這人身上的膏油塗抹以及用這人所建造神的家。","refs":[]},{"lv":2,"label":"五、","text":"基督作天梯的結果是伯特利，就是召會，基督的身體；這梯子的終極完成乃是新耶路撒冷。","refs":[]}]}],"days":[{"day":"週一","feed":{"verses":[["創二八11～12","『到了一個地方，因爲太陽落了，就在那裏過夜；他〔雅各〕拾起那地方的一塊石頭枕在頭下，在那裏躺臥睡了。他夢見一個梯子立在地上，梯子的頂通着天，有神的使者在梯子上，上去下來。』"]],"paras":["由於抓奪而陷入麻煩的青年抓奪者雅各，在孤寂的旅途上作了一個夢。雅各所看見的是一個夢，還未成爲事實，因爲雅各仍是一個抓奪者。在他的深處，他可能還抓着以掃的腳跟。這樣一個抓奪者，怎能成爲神的家？這是不可能的。因此，在那時候，雅各的夢只是一個夢。…我們需要在屬靈生命中有夢。…每一個屬靈的異象都是一個夢。","夢的原則乃是，不可能的事在夢中發生在你身上。我們的得救是一個夢，那是我們屬靈生命中的第一個夢。…進入召會生活也是一個屬靈的夢。每一個進入召會生活的人都有過一個夢，在夢中不可能的事發生了。我喜歡這些屬天的夢。（創世記生命讀經，一一一六至一一一七頁。）"]},"read":{"paras":["幾乎所有蒙召的人都能作見證，在他們得救以前，他們被迫受苦，忍受寂寞，並且在每樣人造的東西都變爲無有的環境中。按照他們的領會，一切人造的東西都是無用的，他們信靠神的創造，信靠神所造的東西。在這樣的時刻，屬天的夢就來了。","今天原則是一樣的。你若要另一個屬天的異象，你就必須受一些苦；…大多數屬天的異象是在你受苦或被苦待時臨到的。我所看見的異象，幾乎都是在受苦的時候臨到的。…在我們喜樂的時候，異象不常來；在我們受苦的時候，異象就來了。當我們正在美妙的召會生活中喜樂時，屬天的夢可能不會來。然而當我們受弟兄們、姊妹們、或長老們爲難時，夢就來了。…若沒有苦難，就不會有夢。然而每當我們許多人造的東西被剝奪，並且被帶到一個地方，只有神造的東西，也就是說，當我們與屬人的東西斷絕，而信靠屬神的東西，那時異象就來了。屬天的異象乃是這樣來的。","雅各在伯特利的夢不是出於他，乃是完全出於神。雅各已經失去一切，完全失望。他無望無家，然而…夢來了。這夢是甚麼？這夢就是異象，就是看見。在我們的經歷中，梯子在那裏，但我們沒有看見。現在我們有了視力，看見了一直在那裏的梯子。這就是雅各的夢的意義。","每一個屬靈的經歷都是一個夢。…進到召會生活是一個夢，認識召會的實行也是一個夢。許多時候我們說，『天哪，這個經歷真好！這必是個夢。我得了怎樣的夢！』我們的夢越多越好，因爲夢越多，我們接觸並享受那梯子也越多。","每一個屬靈的夢的中心總是基督這梯子，祂是那將天帶到地，並將地聯於天的一位。每當我們裏面深處覺得被帶到天上，並且聯於天，與天成爲一，天也與我們成爲一，那就是對基督的經歷。…正確生命的經歷乃是夢見基督這天梯，已經立在地上，並且將我們帶到天上。不要想去勝過罪，或克服輭弱。當你接觸這梯子，你就在天上，天就是你的。在天和地，地和天之間會有許多交通。你要得着你所需要的，一切消極的事物都要在你腳下。這就是經歷基督作天梯。（創世記生命讀經，一○六六至一○六七、一○七二頁。）"],"ref":"創世記生命讀經，第六十八至六十九、七十二篇。"}},{"day":"週二","feed":{"verses":[["創二八18","『雅各清早起來，把所枕的石頭立作柱子，澆油在上面。』"],["創二八22","『我所立爲柱子的石頭，也必作神的家…。』"]],"paras":["雅各的夢是整本創世記中最緊要的點。（二八10～22。）…這夢最顯著的一面是石頭。雅各經過了長途的跋涉，疲倦而孤寂，拾起一塊石頭作枕頭，露天而睡。…首先，雅各把石頭作枕頭；其次，他把這石頭立作柱子。（18。）枕頭是爲着休息，柱子是爲着建造。…除了石頭、柱子和家（殿）之外，〔22，〕還有澆在石頭頂上的油。（18。）…因此，在這夢中有四個基本元素：石頭、柱子、家（殿）和油。這四項是組成聖經的基本因素。（創世記生命讀經，一一一五頁。）"]},"read":{"paras":["聖經中的石頭主要是爲着神的建造。當彼得第一次來到主面前，主把他的名字從西門改爲磯法，（約一42，）說，『你是約翰的兒子西門，你要稱爲磯法。（磯法繙出來，就是彼得。）』約在三年之後，主問祂的門徒說，『人說人子是誰？』（太十六13。）彼得說，『你是基督，是活神的兒子。』主耶穌就對他說，『我還告訴你，你是彼得，我要把我的召會建造在這磐石上。』（16，18。）主說這話是題醒彼得，三年前把他的名字從西門改爲磯法的事。後來，彼得寫第一封書信時說，你們『也就像活石，被建造成爲屬靈的殿〔直譯，家〕』。（彼前二5。）在這一節彼得題到石頭和殿（家）。在林前三章，保羅有同樣的觀念，他告訴哥林多信徒說，他們是神的建築。（9。）在十節保羅告訴我們，要謹慎怎樣建造。我們必須小心怎樣建造，並用甚麼來建造，因爲我們的工程要受到火的試驗。我們若用金、銀、寶石建造，我們的工程就存得住。所以我們看見，在三章，保羅也說到石頭是爲着神的建造。到了啓示錄，聖經的終結，我們看見一座用寶石建造的城。按照聖經的原則，城總是家（殿）的擴大。…在新耶路撒冷中沒有殿，因爲殿已經擴大成了一座城。那城是用寶石所建，擴大的家（殿）。聖經是何等的一貫！由聖經這些話我們看見，石頭是建造神家（殿）的材料。","神的家就是神的滿足、安息和彰顯。你住在怎樣的家裏，就顯出你是怎樣的人。你若是骯髒的人，就會有骯髒的家；你若是清潔的人，就會有清潔的家。…我們的家是我們的彰顯。…同樣，神的家也是神的彰顯。至終，祂的家要擴大成爲一座城，那城顯出來的樣子與神一樣。按照啓示錄四章二至三節，神顯出來的樣子好像碧玉；按照二十一章十一節，整座新耶路撒冷城顯出來的樣子也好像碧玉。這就是說，那城有神顯出來的樣子，而成了祂的彰顯。我們甚至可以說，這城就是神的擴大。","雖然石頭和家（殿）是最緊要的，但仍然需要油。在豫表裏，油表徵臨到人的神。神是三一的。父是源頭，子是流道，靈是臨到我們的流。雅各澆油在石頭上，表徵三一神流到了人。神是在天上，但祂已經澆灌到人身上。當三一神臨到人的時候，祂就使人成爲神的家（殿）。在油澆石頭以前，石頭僅僅是石頭；但在油澆石頭以後，石頭就成了神的家（殿）。（創世記生命讀經，一一一八至一一二○頁。）"],"ref":"創世記生命讀經，第六十八至六十九、七十二篇。"}},{"day":"週三","feed":{"verses":[["彼前二5","『〔你們〕也就像活石，被建造成爲屬靈的殿，成爲聖別的祭司體系，藉着耶穌基督獻上神所悅納的屬靈祭物。』"],["啓三12","『得勝的，我要叫他在我神殿中作柱子，他也絕不再從那裏出去；我又要將我神的名，和我神城的名，（這城就是由天上從我神那裏降下來的新耶路撒冷，）並我的新名，都寫在他上面。』"]],"paras":["雅各拾起一塊石頭，當作枕頭。…在我們得救以前，我們沒有安息。…我們沒有堅固的東西可抓住、支持或維持。雖然你也許是百萬富翁，但你的錢財不能支持你；相反的，錢財奪去你的平安和安息。我們無論男女老幼，在得救以前，都沒有堅固的支持。但有一天我們得救了，有件事情在我們深處發生；我們在深處所經歷的，產生了一樣東西，成了我們堅固的支持。在得救以後，我們也許有難處，但我們在裏面深處卻有把握，有一塊堅固的磐石，我們可安息在其上。這塊堅固的磐石就是基督那已經作到我們裏面的性情、元素。（創世記生命讀經，一一二一頁。）"]},"read":{"paras":["我們人是用地上的塵土造的。（創二7。）羅馬九章指明我們是泥土器皿，不是石頭器皿。…我們人的生命，天然人的生命和所是，不能成爲我們的安息。無論我們受了多好的教育，得着多高的地位，只要我們裏面沒有神聖的性情，我們就不過是泥土。這種泥土不能作我們堅固的支持。我們沒有一個人尋得安息，直到我們得救的時候。在那一天，一種神聖、屬基督的東西，作到我們裏面，成了我們裏面堅固的支持。這是我們的安息，我們的枕頭。我們的枕頭就是那已經作到我們裏面的神聖元素，基督。當我們行走人生路程的時候，我們突然作了一個夢，在夢中基督自己作到我們裏面。基督的性情就是那已經作到我們泥土性情裏的磐石。因此，我們有一塊可以安枕的磐石。","我們的枕頭是石頭，是已經作到我們裏面的神聖元素，基督自己。…表面看來，在石頭上不能安息；但照着我們的經歷，這枕頭供給我們堅固的安息。這石頭不是客觀的基督，離我們很遠的基督；乃是作到我們裏面的基督，是我們可以安枕其上的主觀基督。這是那成爲我們經歷的基督，祂的神聖元素已經作到我們裏面。這位基督是我們人生的枕頭。","雅各夢醒以後，就把這塊石頭立作柱子。（創二八18。）我們所安枕的石頭，必須成爲建造的材料。…現在我們已進入召會生活，領悟我們所安枕的石頭必須成爲柱子，也就是說，那塊石頭必須成爲神建造的材料。讚美主，我們已經得救，且在安息中。但神有沒有安息？除非我們把所安枕的石頭立起來，作爲祂建造的柱子，祂就不能有安息。神不會立起這柱子，必須我們來立。我們的枕石必須立作柱子。換句話說，我們對基督的經歷必須成爲柱子。","在進入召會生活以後，一天又一天，我們把我們對基督的經歷立作柱子。它不再只是枕頭，乃是柱子。這不僅是我們安息的問題，乃是神的建造爲着祂安息的問題。你所經歷的那基督，僅僅是你的安息呢，或者祂是爲着神家的建造材料？答案可由我們的經歷來證明。首先，我們安枕於基督，尋得了安息。至終，我們使我們對基督的經歷成爲柱子，成爲爲着神建造的材料。凡我們對基督所經歷的，必須成爲建造神家的材料。（創世記生命讀經，一一二一至一一二四頁。）"],"ref":"亞伯拉罕以撒雅各的神，第九章。"}},{"day":"週四","feed":{"verses":[["創二八18～19","『雅各清早起來，把所枕的石頭立作柱子，澆油在上面。他就給那地方起名叫伯特利…。』"]],"paras":["在大多數的基督徒中間沒有建造，因爲他們最多只有枕頭，並沒有柱子。在進入召會生活以前，我們也只有爲着我們安息的枕頭，但在進入召會生活後不久，我們把我們對基督的經歷立作柱子，使它成爲爲着神家有價值的材料。…枕頭很適合叫我們得安息，但神需要一個家來安息其中。這家如何能得建造？只有藉着我們的枕頭成爲柱子。我們首先有石頭，然後有建造。（創世記生命讀經，一一二四頁。）"]},"read":{"paras":["雅各不但把石頭立作柱子，他也澆油在石頭上面。（創二八18。）許多基督徒談論聖靈的浸。這事不需要談論得這麼多。只要你把枕頭立作柱子，油就會澆在上面。自從我們進入召會生活，把我們的枕頭立作柱子以後，我們對油有何等的經歷！何等聖靈的經歷！…我多次經歷聖靈的浸。當你的枕頭立起來，油就要澆灌下來。…這可以由我們的經歷來證明。當我們說，『主耶穌，我愛你，』我們也許有一點興奮；但是當我們進一步說，『主耶穌，我愛你的召會，』我們會興奮得幾乎不能克制自己。…我們爲甚麼談論召會這麼多？因爲我們越說到召會，我們就越興奮。…召會生活是最好的甜點，這甜點甚至比正餐更豐富。這就是爲甚麼召會的人喜歡說，『阿們，主，我愛你，我也愛召會。我是爲着基督與召會。我將自己獻給基督與召會。』枕頭立作柱子的時候，便完全受了浸。這纔是真正聖靈的浸。在約翰一章也有浸、石頭和雅各的夢。（33，42，51。）","油澆柱子以後，柱子就成了神的家。我們說，『主耶穌，我愛你，我也愛你的召會，』結果就是家。在我們進入召會生活以前，我們是個人主義者。但自從我們進入召會生活，並且見證我們是多麼愛召會，就發現甚麼時候我們搞個人主義，我們就失去了甜點…。甚麼時候你享受美妙的召會生活，你每天就都有甜點。","對基督真正的經歷，成了建造的材料，這建造的材料終結於神家的建造。在這裏神有安息和滿足，在這裏我們也有安息和滿足。雅各的夢第一次是應驗在以色列人被救出埃及，帳幕立起來的時候。那是神在人中間的第一個家，是雅各的夢第一次的應驗。帳幕指明神與人尋得了安息，指明神在地上的居所是神與人的滿足和安息。以色列人在美地建造聖殿之後，神在地上有了更堅固的家。然後在新約裏，召會是神的家。（提前三15。）至終，在新天新地，將有新耶路撒冷作神永遠的居所。（啓二一1～3。）在那裏神與我們要有永遠的安息，享受永遠的滿足。今天，我們都在雅各之夢的應驗中。我們不僅有石頭和柱子；我們也有家。事實上，我們就是家。（來三6。）這家是神性與人性的組成，是三一神與人的組成。在這裏有成爲神與人共同安息的家。現在我們不僅在這夢中，也在這夢的應驗中。感謝主給我們石頭、柱子、家和油。在召會生活中，這四樣東西我們都經歷了。（創世記生命讀經，一一二四至一一二七頁。）"],"ref":"亞伯拉罕以撒雅各的神，第九章。"}},{"day":"週五","feed":{"verses":[["創二八12","『他〔雅各〕夢見一個梯子立在地上，梯子的頂通着天，有神的使者在梯子上，上去下來。』"],["約一51","『〔耶穌〕又對他〔拿但業〕說，我實實在在的告訴你們，你們將要看見天開了，神的使者上去下來在人子身上。』"]],"paras":["雅各的夢是基督的啓示，因爲基督這梯子乃是這夢的中心、焦點。這裏隨着這天梯有敞開的天、變化過的人、這人身上的膏油塗抹、以及用這人所建造神的家。今天的召會生活是雅各之夢完全的應驗，因爲召會生活是天的門，是柱子和梯子的所在地，也是使者升到天上報好消息，並降到地上帶來屬天之物的地方。伯特利就在召會生活這裏。我們是今日的伯特利。（創世記生命讀經，一○八六頁。）"]},"read":{"paras":["〔在約翰一章五十一節〕人子這名稱指明神不再只是神，祂也成了人。這啓示神不再只是在天上，祂也成了一個活在地上的人。梯子已經立在地上，因爲神已經成了人。…當主耶穌告訴拿但業說，他要看見使者上去下來在人子身上，拿但業必定立刻明白，這是雅各之夢的應驗。（創世記生命讀經，一○八五至一○八六頁。）","雅各說到天的門，這指明天是敞開的，人有可能進入天裏面。換句話說，人有可能進入神裏面。…那條梯子是介於地和天之間，就是從人上到神那裏，從神下到人這裏一條垂直的路。在這梯子，這條垂直的路上面，乃是神所在之天的開口之處。這表徵有一條途徑，讓人可以來摸着神並接觸神。","在約翰十四章六節主說，『我就是道路…；若不藉着我，沒有人能到父那裏去。』祂不是水平的路，而是垂直的路，我們憑着祂並藉着祂，可以到神那裏去。作爲道路，祂乃是梯子。乃是祂將天帶到地上，也是祂將地聯於天。…祂是那條垂直的路，把神和人帶在一起，使天和地成爲一。","神建造的主要原則，乃是神被帶進我們裏面，我們被帶進神裏面。…祂成了肉體，就將神帶到人裏面。在那時以前，神從未在肉體裏，但是藉着主的成爲肉體，神就進到人裏面。…主帶着神下來之後，又帶着人上去。祂藉着成爲肉體將神帶到人裏面，然後又藉着死與復活，將人帶回到神裏面。","在約翰福音，有主的來和主的去。祂的來是祂的成爲肉體，祂的去是祂的死與復活。藉着祂的來，祂將神帶到人裏面；藉着祂的去，祂將人帶到神裏面。在七章三十三至三十四節，主告訴人，祂要去的地方，他們那時不能到；然而過了一些時間，在十四章二至六節，祂告訴祂的門徒，祂要接他們到祂那裏。祂所在的地方不是天，而是神自己。祂似乎是說，『我在父裏面，父乃是我所在的地方。我藉着我的成爲肉體將神帶給你們，然而現在我需要受死並復活。藉着我的死與復活，我要把你們帶到神裏面。到那時候，你們就會在我所在的地方。』","主的來與去，乃是神聖建造的過程。主的來把神帶到我們裏面，主的去把我--帶到神裏面。藉着祂的來和祂的去，祂將神與我們調和。（李常受文集一九六三年第三册，二三八至二三九、二四一至二四三頁。）"],"ref":"神建造的概論，第二、四章。"}},{"day":"週六","feed":{"verses":[["來四16","『所以我們只管坦然無懼的來到施恩的寶座前，爲要受憐憫，得恩典，作應時的幫助。』"],["來十19","『弟兄們，我們旣因耶穌的血，得以坦然進入至聖所。』"]],"paras":["今天至聖所是在主耶穌所在的天上。（來九12，24。）當我們還在地上時，如何能進入？〔十19。〕祕訣就是希伯來四章十二節所說我們的靈。這位在天上的基督，現今也在我們的靈裏。（提後四22。）祂是那天梯，（創二八12，約一51，）將我們的靈聯於天，也將天帶到我們的靈裏。因此，我們一轉到靈裏，就進入了至聖所，在那裏與施恩寶座上的神相會。（希伯來書生命讀經，五八八至五八九頁。）"]},"read":{"paras":["〔希伯來四章十六節所說〕施恩的寶座，毫無疑問，是指天上神的寶座。（啓四2。）神的寶座，對全宇宙是掌權的寶座，（但七9，啓五1，）神在其上掌權管理宇宙。這是神行政的寶座。但對我們信徒，卻成了施恩的寶座，由至聖所裏（來九3，5）見證櫃上（出二五17～21，羅三25）灑了基督寶血（利十六15，來九12）的平息座（施恩座）所表徵。神就是在這裏，與祂的百姓相會相交。（出二五21～22。）每當我們藉着基督的血，來到施恩的寶座前，我們就與神相會相交。","希伯來四章施恩的寶座，就是啓示錄四章掌權的寶座；這寶座到啓示錄二十二章一至二節，成了神和羔羊的寶座，從那裏流出一道生命水的河，明亮如水晶。…恩典是甚麼？恩典就是長着生命樹的那道河流。","施恩的寶座旣在諸天之上，…當我們還活在地上時，怎能來到這寶座前？祕訣就在希伯來四章十二節，那裏說到藉着神活而有功效的話，剖開我們的魂與靈。…那在天上坐在施恩寶座上的基督，（羅八34，）現今也在我們裏面，（10，）就是在我們的靈裏，（提後四22，）這靈就是神居住的所在。（弗二22。）基督旣在我們靈裏，父與那靈也必在我們靈裏。（約十四20，23，羅八16。）因此，三一神就在我們靈裏。伯特利是神的家，神的居所，也是天的門；在那裏基督是梯子，把地聯於天，並把天帶到地。（創二八12～17，約一51。）雖然施恩的寶座是在諸天之上，我們奇妙的基督卻把第三層天帶到我們靈裏，就是今天神地上居所的所在。…這位從神來到我們這裏的奇妙基督，已經完成並成就了這麼多的事，並且作了我們的創始者、使徒、大祭司，現今已經進入我們靈裏，使這靈成爲天的門。現在我們很容易來到施恩的寶座前，因爲寶座就在門內。施恩的寶座雖然是在諸天之上，但憑着基督並藉着基督，這寶座已經聯於我們的靈。","來到施恩的寶座前，完全是在靈裏的事。…我們若是屬魂的人，常常遊蕩在魂的曠野裏，就必定離至聖所很遠。我們的靈今天旣是神居住的所在，這靈就是天的門，在這裏基督是梯子，把我們這些在地上的人聯於天，並把天帶給我們。因此，每當我們轉到靈裏，就能進入天的門，藉着基督作天梯，摸着天上施恩的寶座。爲此我們需要神活的話，刺入我們的深處，把遊蕩的心思與靈分開。只要我們在靈裏，我們就有天的門；門內有施恩的寶座。…每當我們從深處呼喊『哦，主耶穌』，我們立刻就在至聖所裏，摸着施恩的寶座。我們何等需要摸着施恩的寶座！（希伯來書生命讀經，三五九至三六一頁。）"],"ref":"創世記生命讀經，第六十八至六十九、七十二篇。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第六週、伯特利的夢","reading":"創二八10～22，約一51","readingRefs":[{"label":"創28:10-22","keys":["創28:10","創28:11","創28:12","創28:13","創28:14","創28:15","創28:16","創28:17","創28:18","創28:19","創28:20","創28:21","創28:22"]},{"label":"約1:51","keys":["約1:51"]}]},"verses":{"創28:10":{"t":"雅各出了別是巴，向哈蘭走去；","n":[]},"創28:11":{"t":"到了一個地方，因為太陽落了，就在那裏過夜；他拾起那地方的一塊石頭枕在頭下，在那裏躺臥睡了。","n":[]},"創28:12":{"t":"他¹夢見一個²梯子立在地上，梯子的頂通著天，有³神的使者在梯子上，上去下來。","n":[["1",["雅各的夢是本書最重要的一點，10～22節揭示神啟示中最重要的一件事。神渴望在地上得著一個家，並且祂的心意是要將祂所呼召的人變化成石頭，作祂建造的材料。在雅各之夢的記載裏，石頭、（11，18，22、）柱子、（18、）神的家（17，19，22）和油，（18，）是特出的項目。石頭象徵基督是基石、頂石和房角石，為著神的建造。（賽二八16，亞四7，徒四10～12。）石頭也象徵變化過的人，由基督這變化人的元素所構成，成為建造神家的材料；（二12，太十六18，約一42，林前三12，彼前二5，啟二一11，18～20；）神的家就是今日的召會，（提前三15，）要終極完成於新耶路撒冷，作神和祂所救贖之選民永遠的居所。（啟二一3，22。）在11節，雅各用作枕頭的石頭，表徵基督神聖的元素藉著我們對祂主觀的經歷，構成到我們這人裏面，成為給我們安息的枕頭。（參太十一28。）雅各從夢中醒來，把所枕的石頭立作柱子，表徵那作到我們裏面、我們憑祂得安息的基督，成了神的建造—神的家—的材料和支撐。（參王上七21，加二9，啟三12。）最後，雅各澆油在柱子上面，油象徵那靈作為三一神的終極完成臨到人，（出三十23～30，路四18，）柱子象徵變化過的人與三一神是一，並且彰顯三一神。那石頭成了伯特利，神的家。（19，22。）神的家是神與祂所救贖的人相互的居所（約十四2，23）—人作神的居所，（賽六六1～2，林前三16，弗二22，來三6，啟二一3，）神作人的居所。（詩九十1，約十五5，啟二一22。）因此，神的家是由神與人調和為一所構成。在神的家裏，神在人性裏彰顯祂自己，並且神與人都得著相互並永遠的滿足和安息。"]],["2",["這梯子是雅各之夢的中心、焦點。這夢乃是啟示基督，因為基督是雅各所見梯子的實際。（約一51與註。）基督作為人子，在祂的人性裏乃是梯子，將天（神）帶到地（人，）並將地與天聯合為一。（參約十四6。）我們重生的靈是神今日的居所，（弗二22，）是基督這天梯立在地上的基礎。（提後四22。）因此，我們一轉向我們的靈，就經歷基督作梯子，將神帶給我們，也將我們帶給神。（見來十19註1。）這梯子所在之處，有敞開的天、變化過的人、這人身上的膏油塗抹、以及用這人所建造神的家。基督作天梯的結果是伯特利，就是召會，基督的身體；這梯子的終極完成乃是新耶路撒冷。"]],["3",["天使是服役的靈，奉差遣為承受神救恩的人效力。（來一14與註1三段。）"]]]},"創28:13":{"t":"耶和華站在梯子以上，說，我是耶和華你祖¹亞伯拉罕的神，也是¹以撒的神；我要將你現在所躺臥之²地，賜給你和你的²後裔。","n":[["1",["神說祂自己是亞伯拉罕的神和以撒的神，這含示祂也要成為雅各的神。亞伯拉罕的神是稱義的神，以撒的神是恩典的神，雅各的神是藉著神聖的管教變化人的神。至終，雅各的神成了以色列的神，（三三20，出五1，）就是經過變化之雅各的神。"]],["2",["神應許雅各，要賜他後裔、地和福分，（13～14，）正如祂應許亞伯拉罕（十二3，7，十三14～16，十五18，二二17～18）和以撒（二六3～4）一樣。地是為著神的國，後裔是為著彰顯神並擴展神的形像。地和後裔二者都是基督，（見十五3註1，）祂也成了我們用以祝福別人（羅十五29）的福。（14。）"]]]},"創28:14":{"t":"你的後裔必像地上的塵沙那樣多，必向東西南北開展；地上萬族必因你和你的後裔得福。","n":[]},"創28:15":{"t":"看哪，我與你同在；你無論往那裏去，我必保守你，使你歸回這地。我總不離棄你，直到我成就了向你所應許的。","n":[]},"創28:16":{"t":"雅各睡醒了，就說，耶和華真在這地方，我竟不知道。","n":[]},"創28:17":{"t":"他就懼怕，說，這地方何等可畏！這不是別的，乃是神的¹家，也是²天的門。","n":[["1",["或，殿。22節者同。"]],["2",["這地方是在地上，卻是聯於天，所以雅各稱之為天的門。當我們在地上的召會，神的家中時，我們能進入天的門，並且藉著基督這天梯，能看見並經歷天上的事。見來四16與註1。"]]]},"創28:18":{"t":"雅各清早起來，把所枕的石頭立作柱子，澆油在上面。","n":[]},"創28:19":{"t":"他就給那地方起名叫¹伯特利；但那城起先名叫路斯。","n":[["1",["意，神的家。見三五1註1二段。"]]]},"創28:20":{"t":"雅各許願說，神若與我同在，在我去的路上保守我，又給我食物喫，衣服穿，","n":[]},"創28:21":{"t":"使我平平安安的回到我父親的家，我就必以耶和華為我的神。","n":[]},"創28:22":{"t":"我所立為柱子的石頭，也必作神的家；凡你所賜給我的，我必將十分之一獻給你。","n":[]},"約1:51":{"t":"又對他說，我¹實實在在的告訴你們，你們將要看見²天開了，神的使者上去下來在³人子身上。","n":[["1",["原文，阿們，阿們。全書同。"]],["2",["這是雅各之夢的應驗。（創二八11～22。）基督這位人子，帶著祂的人性，乃是為著神的家─伯特利，立在地上通天的梯子，使天向地開啟，且把地聯於天。雅各澆油（油象徵聖靈，就是三一神為著臨到人的終極表現）在石頭上，（石頭象徵變化過的人，）使其成為神的家。在本章，為著神的家，有那靈（32）和石頭，（42，）帶著人性裏的基督。那裏有這個，那裏就有開啟的天。"]],["3",["本章是本書的引言，介紹基督是神子，（34，49，）又是人子。拿但業認出基督是神子，也這樣稱呼祂；（49；）基督卻對拿但業說，祂是人子。神子是神，具有神的性情；人子是人，具有人的性情。祂是神的獨生子，為著表明神，（18，）並將神帶給人。祂也是人子，為著建造神在地上人間的居所。神的建造需要祂的人性。在已過的永遠，基督只是神，只是神子，只具有神性；但在將來的永遠，基督是神也是人，是神子也是人子，要永遠兼具神人二性。"]]]},"提前3:15":{"t":"倘若我耽延，你也可以知道在神的¹家中當²怎樣行；這家就是³活神的召會，⁴真理的⁵柱石和根基。","n":[["1",["或，家人。與4、5、12節者同。神的家人，神的家庭就是神的家。家與家人是指同一樣東西─由信徒組成的會集。（弗二19，來三6。）這家是活神的居所，其實際是在我們的靈裏。（弗二22。）我們必須在我們的靈裏生活行動，使神能在這家中顯明為活的神。"]],["2",["這指明本書指示人如何照料地方召會。"]],["3",["活在召會裏的活神，對召會必是主觀的，不是客觀的。在異教廟裏的偶像是無生命的。但神是活的，不僅在祂活的殿，召會中活著，並且在其中活動、行動並工作。因為祂是活的，召會也就在祂裏面、憑祂並同祂活著。活的神與活的召會，同活著、同行動、同工作。活的召會是活神的家和家人，因此成了神在肉體的顯現。"]],["4",["這裏的真理，是指照著神新約的經綸，在新約裏所啟示，關乎基督與召會的真實事物。召會是支持這一切實際的柱石，也是托住這一切實際的根基。地方召會該是這樣的建築，托住、擔負並見證基督與召會的真理─實際。"]],["5",["這是隱喻的說法。柱石支持建築物，根基托住柱石。召會就是這樣支持真理的柱石，也是這樣托住真理的根基。"]]]},"啟21:3":{"t":"我聽見有大聲音從寶座出來，說，看哪，¹神的帳幕與人同在，祂要與人同²住，他們要作祂的百姓，神要親自與他們同在，作他們的神。","n":[["1",["作神的居所，新耶路撒冷乃是神的帳幕與人同在，直到永遠。摩西所造的帳幕，就是這帳幕的豫表。（出二五8～9，利二六11。）這豫表首先應驗在基督身上，祂是神的帳幕在人間；（約一14；）至終要最完滿的應驗於新耶路撒冷，那將是基督的擴大，作神的居所。這帳幕也將是神贖民永遠的居所，神要用基督覆庇我們。（見七15註3。）因此，新耶路撒冷乃是神和我們相互的居所。"]],["2",["直譯，支搭帳幕。"]]]},"啟21:22":{"t":"¹我未見城內有²殿，因主神全能者和羔羊為城的²殿。","n":[["1",["在舊約裏，神的帳幕是神殿的前身。新耶路撒冷乃是神的帳幕，（3，）作神的殿。這指明在新天新地裏，神的殿要擴大成為一座城。城的尺寸，長寬高都相等，（16，）指明全城就是至聖所，也就是內殿；所以城內沒有殿。"]],["2",["原文意內殿。主神全能者和羔羊就是內殿；這表徵神和羔羊自己是我們事奉神並居住的地方。聖城是神的帳幕，是為給神居住；神和羔羊是殿，是為給蒙救贖的聖徒居住。在新天新地裏，新耶路撒冷乃是神與人相互的居所，直到永遠。"]]]},"詩90:1":{"t":"主阿，你世世代代作我們的¹居所。","n":[["1",["九十～九二篇論到聖民在與基督的聯合裏，對神更深的經歷。三六8說到喝神樂河的水，並喫神殿裏的肥甘，指明我們能藉著喫喝主經歷祂。（參約六48～58，63，七37，林前十3～4，十二13。）按照賜律法者和本篇的著者摩西所說，我們也可以住在永遠的三一神我們的主裏面。（1，九一9，申三三27，參約十五4，約壹四15～16，啟二一22。）住在神裏面乃是在神裏面過生活，（西二6，三3，約壹四16，）以祂作我們的一切。這比喫喝祂更深。以神為我們的住處，我們永遠的居所，是對神最高、最完滿的經歷。","詩篇卷四揭示聖民在與基督的聯合裏，對神更深的經歷，以及神恢復祂對於地的主權與權利。這指明我們住在神裏面的經歷，乃是為基督來得地為業鋪路，使神得以恢復祂對於地的主權（所有權）與權利。（見九三1註1。）沒有聖民對神更深的經歷，神就無法恢復這主權與權利。"]]]},"詩91:1":{"t":"¹住在至高者隱密處的，必住在²全能者的蔭下。","n":[["1",["九一篇論到聖民在基督以神為祂居所的事上，與基督聯合為一。（見9註1。）在與基督的聯合裏，聖民以至高者耶和華為他們的居所，住在祂的隱密處，並住在祂翅膀的蔭下。（1～9。）這乃是與神真正的一。在此我們由神所構成，並且我們與神一同生活如同一人。"]],["2",["希伯來文， Shaddai， 沙代。見創十七1註2。"]]]},"詩91:9":{"t":"因¹你已將至高者，耶和華我的避難所，當¹你的居所；","n":[["1",["9～13節的“你”是指基督；這可由太四6撒但說到基督時引用本篇11～12節為證。這指明在本篇，乃是基督以神為祂的居所，祂的住處。因此，不僅摩西以神為他的居所，（九十1，）甚至主耶穌在地上時，也以父神為祂的居所。賜律法的摩西，和賜恩典的基督，同樣以神為他們的居所，為他們的住處。因此，聖民（由摩西所代表）與基督聯合為一。","與基督聯合，不僅是在祂的死、復活和升天裏與祂聯合，也是在祂以神為居所這事上與祂聯合。我們若要在基督的死、復活和升天裏與祂聯合，就必須住在基督裏；（約十五4；）而住在基督裏不僅是停留在祂裏面，更是居住在祂裏面，以祂為我們的一切。"]]]},"賽66:1":{"t":"耶和華如此說，天是我的座位，地是我的腳凳；你們要在那裏為我建造¹殿宇？那裏是我安息的地方？","n":[["1",["見徒七49註1。神不認為天或地是祂的居所，也不認為以色列人為祂所建物質的殿，是祂安息的地方。舊約裏的帳幕和殿，只是神與以色列人聯結的象徵，神認為以色列人纔是祂真正的殿。（來三6與註。）神與以色列人聯結，與他們成為一個實體，這一個實體乃是屬靈的殿，神與以色列中敬虔的人都住在其中。（詩二七4，八四10，九十1，參彼前二5上。）根據2節和五七15，神所渴望得著的住處，乃是一班可以讓祂進入的人。神要在宇宙中得著一個住處，是神與人的調和，在其中神被建造到人裏面，人被建造到神裏面，使神與人，人與神，能成為相互的住處。（約十四2，20，23，十五4，約壹四13。）在新約裏，這個住處，這個殿（家，）乃是召會，就是神在信徒靈裏的居所。（弗二22與註3，提前三15與註1。）這個宇宙建造，這個宇宙的殿終極的顯出，就是新耶路撒冷。在這城裏，神在人裏面，以人作祂的居所；人也在神裏面，以神作他的居所。（啟二一3與註，22與註。）見創二八12註1與撒下七12～14註。"]]]},"賽66:2":{"t":"耶和華說，這一切都是我手所造的，所以就都有了；但我所看顧的，就是靈裏貧窮痛悔、因我話戰兢的人。","n":[]},"賽57:15":{"t":"因為那至高至上、住在永遠、名為聖者的如此說，我必住在至高至聖的所在，也與¹靈裏痛悔卑微的人同居，要使卑微之人的靈甦醒，也使痛悔之人的心甦醒。","n":[["1",["見六六1註1。"]]]},"約14:20":{"t":"到¹那日，你們就知道我在我父裏面，你們在我裏面，我也在你們裏面。","n":[["1",["這該是指主復活的那日。（二十19。）"]]]},"約14:23":{"t":"耶穌回答說，人若愛我，就必遵守我的話，我父也必愛他，並且我們要到他那裏去，同他安排¹住處。","n":[["1",["這是2節所題許多住處之一。這要成為三一神住在信徒裏面，信徒住在三一神裏面，相互的住處。"]]]},"約15:5":{"t":"我是葡萄樹，你們是枝子；住在我裏面的，我也住在他裏面，這人就多結果子；因為離了我，你們就不能作甚麼。","n":[]},"啟21:9":{"t":"拿著七個金碗，盛滿末後七災的七位天使中，¹有一位來對我說，你來，我要將²新婦，就是羔羊的妻，指給你看。","n":[["1",["執行末後七災的七位天使中，有一位將新耶路撒冷指給約翰看。這表徵七碗的審判乃是為著新耶路撒冷。"]],["2",["新婦主要的是為著結婚之日，而妻子乃是為著一生之久。新耶路撒冷在千年國將是新婦，為時千年，如同一日；（彼後三8；）到新天新地裏將是妻子，直到永永遠遠，萬世無終。"]]]},"啟21:10":{"t":"我在靈裏，天使帶我到一座¹高大的山，將那由神那裏從天而降的聖城耶路撒冷指給我看。","n":[["1",["高大的山與十七3的曠野相對。約翰看大妓女巴比倫，是被帶到曠野；他看新婦新耶路撒冷，是被帶到一座高大的山。我們必須被帶到高山上，纔能看見神那為著實現祂永遠定旨的居所。"]]]},"路1:37":{"t":"因為在神，沒有一句話是¹不可能的。","n":[["1",["或，沒有能力的。"]]]},"路18:27":{"t":"耶穌說，在人所不能的事，在神卻能。","n":[]},"伯42:2":{"t":"我知道你萬事都能作，你的定旨是不能攔阻的。","n":[]},"伯42:3":{"t":"誰用無知的言語，使你的旨意隱藏呢？故此我說了我所不明白的；這些事對我太奇妙，是我不知道的。","n":[]},"詩126:1":{"t":"當耶和華使那些¹被擄的人歸回錫安的時候，我們好像作夢的人。","n":[["1",["直譯，歸回。原文與4節者不同字。"]]]},"耶32:27":{"t":"我是耶和華，是凡有血肉者的神，在我豈有難成的事麼？","n":[]},"賽28:16":{"t":"所以主耶和華如此說：看哪，我在錫安放一塊¹石頭，作為根基，是試驗過的石頭，是寶貴的¹房角石，作為穩固的根基；信靠的人必不著急。","n":[["1",["耶和華對以法蓮酒徒的刑罰，也引進可靠的基督，作神建造的基石和寶貴的房角石。（詩一一八22～24與註。）基督作石頭，要在來世的復興時代完全得應驗。（詩一一八26與註，參太二三38～39與39註1。）","與7節所描繪的祭司和申言者相對，這位可靠的基督，對神的贖民乃是信實的大祭司和可靠的申言者。（來七26，徒三22～23。）"]]]},"亞4:7":{"t":"大山哪，你算甚麼？在所羅巴伯面前你必成為平地；他必¹搬出那塊頂石，人必大聲歡呼，說，願恩典恩典，歸與²這石！","n":[["1",["搬出頂石就是完成建造。人大聲歡呼，說，“願恩典恩典，歸與這石。”這指明頂石本身就是恩典。頂石豫表基督；祂是從神臨到我們的恩典，作神建造的遮蓋。（見林前十五10註1。）基督是基石，托住神的建造；（賽二八16，林前三11；）是房角石，將祂身體上外邦和猶太的肢體聯絡在一起；（弗二20，彼前二6；）也是頂石，完成神的建造。"]],["2",["或，這殿。直譯，它。"]]]},"徒4:10":{"t":"你們眾人和以色列眾百姓就當知道，乃是在¹拿撒勒人耶穌基督，就是²你們所釘十字架，³神從死人中所復活者的名裏，在這名裏，這人纔站在你們面前健康完好。","n":[["1",["見三6註2。"]],["2",["“你們，”在這裏是強調的。"]],["3",["見二24註1。"]]]},"徒4:11":{"t":"祂是你們¹匠人所²輕棄的石頭，已成了³房角的頭塊石頭。","n":[["1",["這話是主在太二一42所說的，（見太二一42註1，）引自詩一一八22。這話揭示猶太首領棄絕祂，神卻寶貴祂，為要在地上，在祂的子民中間建造祂的居所。因著這話，彼得得知主是神所寶貴的寶貴石頭，就如他在彼前二4～7所解釋的。彼得引用這話，指明他不僅傳揚基督是拯救罪人的救主，也傳揚基督是為著神建造的石頭。這樣一位基督，乃是罪人惟一的救恩。祂的名為猶太首領所輕棄，卻為神所寶貴並高舉，（腓二9～10，）在天下人間，靠著這獨一的名，罪人必然得救，（12，）不僅脫離罪，（太一21，）且有分於神的建造。（彼前二5。）"]],["2",["含藐視、視為無有之意。（參可九12。）"]],["3",["見太二一42註2。"]]]},"徒4:12":{"t":"除祂以外，別無拯救，因為在天下人間，沒有賜下別的名，我們可以靠著得救。","n":[]},"創2:12":{"t":"並且那地的¹金子是好的；在那裏又有¹珍珠和¹紅瑪瑙。","n":[["1",["河的湧流帶來三樣寶貴的材料：金子、珍珠和紅瑪瑙。這些材料豫表三一神是神永遠建築之結構的基本元素。金豫表父神同祂神聖的性情，那是人藉著神的呼召得以有分的，（彼後一3～4，）作為神永遠建築的基礎；珍珠，一種樹脂結成像珍珠的材料，豫表子神在祂救贖並釋放生命之死，（約十九34，）並祂分賜生命之復活（約十二24，彼前一3）中所產生的結果，作為神永遠建築的入口；（參啟二一21與註1一段；）以及紅瑪瑙，一種寶石，豫表靈神同祂變化工作所產生的結果，（林後三18，）為著建造神永遠的建築。新耶路撒冷就是由金、珍珠、和寶石這三類材料構成的。（啟二一11，18～21。）見啟二一21註1二段。","大祭司的胸牌，象徵以色列作神舊約的子民，乃是用金和寶石製作的，（出二八6～21，）並且新約中的召會，是用金、銀和寶石建造的。（林前三12—該處所列的是表徵基督救贖的銀，而不是珍珠，因為人墮落之後需要救贖。）這指明新耶路撒冷包括神所揀選並救贖之人的總和，就是以色列人加上召會。（見啟二一12註4與14註2。）","在人裏面神聖生命的湧流，將神聖的性情帶到人裏面，（彼後一4，）使人重生，（彼前一3，）將人變化成基督榮耀的形像。（林後三18。）因此，塵土所造的人，（7，）成為變化過的寶貴材料，為著神的建造，終極完成於新耶路撒冷。"]]]},"太16:18":{"t":"我¹還告訴你，你是²彼得，我要把我的³召會⁴建造在⁵這磐石上，⁶陰間的門不能勝過她。","n":[["1",["父對於基督的啟示，只是基督與召會這極大奧祕（弗五32）的前半；因此，主還需要向彼得啟示這極大奧祕的後半，就是召會。"]],["2",["或，石頭。神建造的材料。（彼前二5。）"]],["3",["希臘文，ekklesia，艾克利西亞，意即召出來，用以指召出來的會眾，所以最好譯為召會。“我的召會”指明召會是屬於主的，不屬於任何人事物；召會不像宗派那樣，以某人或照某事來命名。"]],["4",["主建造祂的召會，開始於五旬節那天。（徒二1～4，41～42。）然而，主在這裏的豫言，甚至到了二十世紀，還沒有完全應驗。由背道的羅馬天主教和更正教各宗派所組成的基督教國，不是主所建造的召會。這豫言是藉主的恢復得著應驗的，真正召會的建造是在主的恢復裏纔得以完成。"]],["5",["這磐石不僅指基督，也指彼得從父所領受關於基督的啟示。召會乃是建造在基督和這關於基督的啟示上。"]],["6",["陰間的門乃是指撒但黑暗的權勢或能力。（西一13，徒二六18。）基督要在這關於祂自己啟示的磐石上，並以彼得這樣經過變化的人為石頭，建造真正的召會，這樣的召會是陰間的門不能勝過的。主這話也指明，撒但黑暗的權勢要攻擊召會；因此，召會（神的國）和撒但的權勢（撒但的國），二者之間進行著屬靈的爭戰。"]]]},"約1:42":{"t":"於是領他到耶穌那裏。耶穌看著他說，你是約翰的兒子西門，你要稱為磯法。（磯法繙出來，就是¹彼得。）","n":[["1",["意即石頭。在太十六18，當主對彼得說到召會的建造時，題到這辭。彼得必定從這裏得著“活石被建造成為屬靈的殿”的觀念，（彼前二5，）這屬靈的殿就是召會。石頭的意義，乃指一種變化的工作，為著神的建造產生材料。（林前三12。）"]]]},"林前3:12":{"t":"¹然而，若有人用²金、銀、寶石，³木、草、禾秸，在這根基上建造，","n":[["1",["根基是惟一的，但由於不同的工人，使用不同的材料，就有不同的建築。哥林多的信徒都接受了基督作根基；然而，他們中間有些猶太信徒，想要用猶太教的成就建造召會；也有些希利尼信徒，想要用他們哲學的智慧建造召會。他們不像使徒們，用對基督超越的認識和豐富的經歷，建造召會。使徒寫本書的用意，是警告他們不要用天然背景的東西建造召會。他們必須學習像使徒一樣，用客觀認識並主觀經歷裏的基督建造。"]],["2",["金、銀、寶石，表徵在三一神的美德和屬性上，對基督的各種經歷。使徒和屬靈的信徒，都是用這些在基督這惟一的根基上建造召會。金表徵父的神聖性情及其一切屬性；銀表徵救贖的基督，及其身位與工作的一切美德和屬性；寶石表徵那靈變化的工作，及其一切屬性。這些寶貴的材料，都是我們在靈裏藉著聖靈，有分於並享受基督而產生的。只有這些纔適於神的建造。","召會既是神的耕地，有栽種、澆灌、生長，就應當生產植物；但建造召會的正確材料卻是金、銀、寶石，這些都是礦物。因此，這裏含示變化的意思。我們不僅需要在生命裏長大，也需要在生命裏變化，正如林後三18和羅十二2所啟示的。這符合主在太十三比喻的意思，那裏有麥子、芥菜種、麵（以上都是植物），也有藏在田地裏的寶貝，就是金子和寶石（礦物）。見太十三31註1，33註3，44註1。"]],["3",["木、草、禾秸表徵出自信徒天然背景（如猶太教或其他宗教、哲學、文化），以及天然生活方式（大多在魂裏，且是天然的生命）的知識、理解和成就。木與金相對，表徵人天然的性情；草與銀相對，表徵墮落的人，屬肉體的人，（彼前一24，）未被基督救贖而重生的人；禾秸與寶石相對，表徵出自屬地的源頭，未被聖靈變化的工作與生活。這些沒有價值的材料，都是信徒天然人的產品，以及從他們背景中收集的東西。在神的經綸中，這些材料只適合於被焚燒。（13。）"]]]},"彼前2:5":{"t":"也就像¹活石，被²建造成為³屬靈的⁴殿，⁵成為⁶聖別的⁷祭司體系，藉著耶穌基督獻上神所悅納的⁸屬靈祭物。","n":[["1",["我們這些在基督裏的信徒，藉著重生和變化，成了活石，像基督一樣。我們原是用泥土造的，（羅九21，）但在重生時，得著了神聖生命的種子，這種子在我們裏面長大，就把我們變化為活石。彼得在悔改信主時，主給他取了一個新名，就是彼得─石頭；（約一42；）當他得著關於基督的啟示之後，主進一步啟示祂也是磐石─石頭。（太十六16～18。）這兩件事給彼得深刻的印象，就是基督和祂的信徒都是為著神的建造的石頭。"]],["2",["靠著神話語中滋養的奶，而從基督得餧養，不僅是為著生命長大，也是為著建造。長大乃是為著建造。"]],["3",["雖然話奶是經由心思滋養魂的，最終卻滋養我們的靈，使我們屬靈而不屬魂，適合於為神建造屬靈的殿。"]],["4",["殿，直譯，家。神在信徒身上的目標，是要得著用活石所建造的殿。這些石頭不是分開、離散的，甚至不是僅僅堆聚在一起的，乃是彼此建造起來的。"]],["5",["有古卷無，成為。"]],["6",["屬靈的，指明神的生命生活並長大的性能；聖別的，指明神的性情分別並聖別的性能。神的殿主要的是藉神的生命得維繫，因此是屬靈的；祭司的體系主要的是藉神的性情得維繫，因此是聖別的。"]],["7",["聖別的祭司體系，就是屬靈的殿。新約原文用三個不同的字說到關於祭司的事。一是hierosune，希羅蘇尼，指祭司職分，如來七12者；一是hierateia，希拉提亞，指祭司職任，如來七5者；另一是hierateuma，希拉提瑪，指祭司的集合，祭司團，祭司體系，如本節和9節者。配搭的祭司團就是建造起來的屬靈的殿。雖然彼得的兩封書信不是寫給召會的，他在本節強調信徒的團體生活時，也未用到召會一辭，但他的確用“屬靈的殿”和“聖別的祭司體系”這些辭，以指明召會的生活。不是個人的屬靈生活，乃是團體的屬靈生活，纔能完成神的定旨，滿足祂的心意。神要得著一個屬靈的殿給祂居住，得著一個祭司團，一個祭司體系事奉祂。彼得對於信徒在配搭裏團體的事奉，與保羅在羅十二的看法相同。這團體的事奉乃是出自屬靈生命三個要緊的階段：重生，（2上，）靠基督的滋養長大，（2下，）以及同被建造。"]],["8",["信徒在新約時代，照著神經綸所獻的屬靈祭物乃是：(一)基督作舊約豫表中一切祭物的實際，如燔祭、素祭、平安祭、贖罪祭、贖愆祭等；（利一～五；）(二)我們藉福音所救來作基督肢體的罪人；（羅十五16；）(三)我們的身體、讚美、並為神所作的事。（羅十二1，來十三15～16，腓四18。）"]]]},"啟21:11":{"t":"城中有¹神的榮耀；城的²光輝如同極貴的³寶石，好像⁴碧玉，明如水晶；","n":[["1",["神的榮耀就是神的彰顯，也就是彰顯出來的神。我們已被命定要得這榮耀，並蒙召來得這榮耀。（林前二7，彼前五10，帖前二12。）現今我們正在變化進入這榮耀，（林後三18，）並要被帶進這榮耀裏。（來二10。）至終我們要與基督同得這榮耀，（羅八17，30，）在新耶路撒冷裏帶著神的榮耀作神的彰顯。"]],["2",["直譯，發光體，或，帶光體。今天信徒是光的兒女，（弗五8，）乃是世上的光，（太五14，）顯在彎曲悖謬的世代中。（腓二15。）至終，新耶路撒冷是所有聖徒的組合，要成為發光體，將那是光的神照耀在周圍的列國之上。（24。）"]],["3",["寶石不是光，乃是發光體。這寶石本身沒有光，乃是那位是光的神作到寶石裏面，並透過寶石照耀出去。這指明我們既是要來之新耶路撒冷的一部分，就必須憑著是照耀之光的神作到我們裏面，而變化為寶石，使我們成為發光體，照耀著作神的彰顯。"]],["4",["碧玉是神顯出來的樣子。（四3與註1。）新耶路撒冷的光好像碧玉，帶著神顯出來的樣子，藉著發光彰顯神。"]]]},"啟21:18":{"t":"牆是用¹碧玉造的，城是²純³金的，如同²明淨的玻璃。","n":[["1",["碧玉是一種變化的寶石，（林前三12，）表徵神顯出來的樣子。（四3與註1。）碧玉牆表徵那作神在永世裏團體彰顯的整座城，有神顯出來的樣子。"]],["2",["或，純淨。"]],["3",["金既然表徵神的神聖性情，城是純金的，就表徵新耶路撒冷完全是出於神的神聖性情，以神的神聖性情為元素。純金如同明淨的玻璃，表徵整座城是透明的，毫無不透明之處。"]]]},"啟21:19":{"t":"城牆的¹根基是用各樣寶石裝飾的。第一根基是²碧玉，第二是藍寶石，第三是瑪瑙，第四是綠寶石，","n":[["1",["新耶路撒冷是一座有根基的城，（來十一10，）這些根基就是羔羊的十二使徒，（14，）每位使徒由一樣寶石所表徵。十二使徒的頭一位，彼得，原名西門；當他被帶到主面前時，主將他改名為彼得，意思就是石頭。（約一42。）後來，主說到召會的建造時，就以這名稱呼他。（太十六18。）寶石不是創造的，乃是從受造之物變化成的。所有的使徒都是受造的泥土，但他們蒙了重生，並且變化成了為著神永遠建造的寶石。每一位信徒都需要經過這樣的重生和變化，纔能成為新耶路撒冷的一部分。","表徵十二使徒的十二樣根基寶石，其顏色如下：第一是綠色，第二和第三是藍色，第四是綠色，第五和第六是紅色，第七是黃色，第八是藍綠色，第九是黃色，第十是蘋果綠色，第十一和第十二是紫色。以上十二層根基的顏色，顯出一道彩虹的樣子，表徵城是建造在神守約的信實上，並藉著神這信實得以穩固，（創九8～17，）城的根基也是可信可靠的。"]],["2",["城牆的第一層根基和新耶路撒冷的整個城牆一樣，都是用碧玉造的；（18；）這指明在聖城的建造裏，主要的材料是碧玉。既然碧玉表徵神彰顯在祂可傳輸的榮耀裏，（四3，）聖城主要的功用也就是帶著神的榮耀彰顯神。（11。）"]]]},"啟21:20":{"t":"第五是紅瑪瑙，第六是紅寶石，第七是黃璧璽，第八是水蒼玉，第九是黃玉，第十是翡翠，第十一是紫瑪瑙，第十二是紫晶。","n":[]},"太11:28":{"t":"凡¹勞苦擔重擔的，可以到我這裏來，我必使你們得²安息。","n":[["1",["這不僅是指為了遵守律法誡命和宗教規條而努力的勞苦，也是指為了工作成功而奮鬥的勞苦。凡這樣勞苦的，總是擔重擔的。主頌揚父，承認父的道路，並宣告神聖的經綸之後，便呼召這樣的人到祂這裏來得安息。"]],["2",["安息不僅是指從律法與宗教，或工作與責任的勞苦並重擔中得著釋放，也是指完全的平安和完滿的滿足。"]]]},"王上7:17":{"t":"柱子上端的柱頂有裝修的格子網和擰成的鍊索形成的花圈，一個柱頂有七個，另一個柱頂也有七個。","n":[]},"王上7:21":{"t":"他將兩根柱子立在殿廊前頭：右邊立一根，起名叫¹雅斤；左邊立一根，起名叫²波阿斯。","n":[["1",["意，祂必堅立。"]],["2",["意，在祂裏面有力量。"]]]},"加2:9":{"t":"又知道所賜給我的恩典，那被視為柱石的¹雅各、磯法、約翰，就向我和巴拿巴伸出右手彼此相交，叫我們往外邦人那裏去，他們卻往受割禮的人那裏去；","n":[["1",["在眾使徒的列名中，經常先題彼得；（太十2，可三16，路六14，徒一13；）然而，這裏卻先題雅各。這指明當時在召會中最領頭的，不是彼得，乃是主的兄弟雅各。（一19。）徒十五13～21證實這事。那裏給我們看見，在耶路撒冷的會議中，下最後斷案的權柄，不是彼得，乃是雅各。這必是因為彼得軟弱，沒有持守福音的真理，如保羅在11～14節所描述的，因此雅各跑到前頭，作了使徒中領頭的。所以，12節和徒二一18，都以雅各為在耶路撒冷的召會和使徒的代表。這是有力的證明，彼得並沒有一直是召會最領頭的人。這也含示，召會中的領頭並不是組織的、永久的，乃是屬靈的，並且是依照領頭人屬靈的情形而更動的。這事有力的駁斥天主教的斷定，認為在召會的行政上，彼得是基督惟一的繼承者。"]]]},"啟3:12":{"t":"¹得勝的，我要叫他在我神殿中作²柱子，他也絕不再從那裏出去；我又要將³我神的名，和我神城的名，（這城就是由天上從我神那裏降下來的新耶路撒冷，）並我的新名，都寫在他上面。","n":[["1",["這裏的得勝，是指持守我們在恢復的召會中所有的。"]],["2",["二17的得勝者，成為變化的石頭，為著神的建造。這裏的得勝者，要成為建造在神殿中的柱子。他既建造在神的建築裏，就絕不再從那裏出去。這應許要在千年國成就，作得勝者的獎賞。"]],["3",["神的名，新耶路撒冷的名，並主的新名，寫在得勝者上面，指明得勝者為神、新耶路撒冷和主所得著；神自己、神的城新耶路撒冷和主自己，也全屬於得勝者；並且他與神、與新耶路撒冷、與主也是一。神的名意即神自己，新耶路撒冷的名意即城本身，主的名意即主自己。將神的名，新耶路撒冷的名，並主的名，寫在得勝者上面，指明神的所是，新耶路撒冷的性質並主的人位，全都作到得勝者裏面。說新耶路撒冷要作得勝者獎賞的話，指明這應許要在千年國成就。千年國的新耶路撒冷是單給得勝聖徒的獎賞，新天新地中的新耶路撒冷纔是所有蒙救贖之人共同的分，直到永遠。"]]]},"出30:23":{"t":"你要取上好的香料，就是流質的沒藥五百舍客勒，香肉桂一半，就是二百五十舍客勒，香菖蒲二百五十舍客勒，","n":[]},"出30:24":{"t":"桂皮五百舍客勒，都按著聖所的舍客勒，又取橄欖油一欣；","n":[]},"出30:25":{"t":"你要把這些香料，按調製香品者之法複合成¹香品，作成²聖膏油。","n":[["1",["直譯，香料的複合品。"]],["2",["這聖膏油，就是橄欖油與四種香料複合成的膏油，（23～24，）乃是耶穌基督之靈完滿的豫表，這靈就是基督藉著死與復活成了那經過過程的三一神複合、包羅萬有、賜生命的靈。（林前十五45，參約七39註1，腓一19註2。）這複合膏油的成分意義如下：(一)流質的沒藥是埋葬時所用的香料，（約十九39，）表徵基督寶貴的死；（羅六3；）(二)香肉桂表徵基督之死的甜美與功效；（羅八13；）(三)香菖蒲，出自一種在沼澤或泥濘之處往上生長的蘆葦，表徵基督寶貴的復活；（弗二6，西三1，彼前一3；）(四)桂皮，古時用以驅逐蛇蟲，表徵基督復活的大能；（腓三10；）以及(五)橄欖油作為複合膏油的基本成分，表徵神的靈是複合之靈的基礎。（創一2。）四這數字表徵以人為首（創一26）的受造之物，（結一5，）一這數字表徵獨一的神，（申四35，提前二5，）所以，四種香料表徵在神創造裏基督的人性，一欣橄欖油表徵獨一的神帶著祂的神性。因此，橄欖油與四種香料相調，表徵在複合的靈裏，神與人，神性與人性的複合、調和。（參利二4與註2。）豫備橄欖油和四種香料，都必須經過壓榨或切割的過程，表徵神的靈藉著基督的受苦（太二六36與註）成了基督的靈。（羅八9與註4。）不僅如此，四種香料的分量有三個完整的五百舍客勒單位，中間的五百舍客勒分開為兩半，表徵在復活裏的三一神，第二者（子）藉著在十字架上的死“分開了。”在聖經裏，五是負責任的數字，（太二五2與註1，）因此，複合膏油的五種元素以及四種香料的三個五百舍客勒單位，表徵三一神在復活裏作為大能、能力，為著擔負責任。三和五這兩個數字與神的建造有關，（見創六15註2，）所以複合膏油中這兩個數字，表徵複合的靈裏有神建造的元素。基於前述意義，四種香料與橄欖油複合成一種膏油，表徵藉著基督的成為肉體、人性生活、釘十字架、復活和升天等過程，上述元素就與神的靈調和，產生複合的靈，為著建造神永遠的居所。"]]]},"出30:26":{"t":"要用這膏油¹抹會幕和見證的櫃、","n":[["1",["複合的膏油用以膏抹帳幕及其一切器物、祭壇和壇的一切器具、洗濯盆和盆座、以及祭司，使這一切成為聖別，分別為聖歸與神，為著祂神聖的定旨。（26～30，參彼前一2，林前六11，羅十五16。）因此，這膏油表徵三一神藉著基督的成為肉體、釘死與復活，經過過程並終極完成為包羅萬有複合的靈，臨到蒙祂揀選並救贖的人，以祂自己膏抹他們，使祂自己與他們成為一，並使他們與祂成為一。（約二十22，約壹二20，27，林後一21，林前六17。）這樣的膏抹既是複合的靈在我們裏面的運行，就實施在我們身上，且將經過過程並終極完成之三一神的一切成分，加到我們裏面的所是裏，使我們裏面的人，憑神聖的元素在神聖的生命裏得以長大，並使我們與神調和為一。","聖膏油僅僅為著一個目的，就是膏抹神的居所和祭司體系。（參彼前二5與註7。）因此，惟有為著神的居所和祭司體系的人，纔能享受複合、包羅萬有的靈。"]]]},"出30:27":{"t":"桌子和桌子的一切器具、燈臺和燈臺的器具、並香壇、","n":[]},"出30:28":{"t":"燔祭壇和壇的一切器具、洗濯盆和盆座。","n":[]},"出30:29":{"t":"你要這樣使這些分別為聖，好成為至聖；凡觸著這些的都成為聖。","n":[]},"出30:30":{"t":"要膏¹亞倫和他的兒子們，使他們分別為聖，可以作祭司事奉我。","n":[["1",["參詩一三三1～2與註。"]]]},"路4:18":{"t":"“¹主的靈在我²身上，因為祂膏了我，叫我³傳福音給⁴貧窮的人，差遣我去宣揚⁵被擄的得釋放，⁶瞎眼的⁷得復明，叫那⁸受壓制的得自由，","n":[["1",["見三22註1。"]],["2",["直譯，上面。"]],["3",["見43註1。傳福音是救主身為神的受膏者，彌賽亞的第一個使命。"]],["4",["在屬天、屬靈和神聖的事上貧窮。（十二21，啟三17，參太五3。）"]],["5",["即戰俘，在撒但的轄制下如同放逐者和囚犯。（賽四二7。）"]],["6",["指肉身和屬靈的瞎眼。（番一17，約九39～41，約壹二11，啟三17。）"]],["7",["得復明，與從撒但權下得釋放有關。（徒二六18。）"]],["8",["出於原文意打碎或折斷的動詞，指在疾病或罪中受撒但的壓制。（十三11～13，約八34。）"]]]},"約14:2":{"t":"在¹我父的家裏，有²許多住處；若是沒有，我早已告訴你們了；我³去是為你們豫備地方。","n":[["1",["照二16、21的解釋，“我父的家”乃是殿，基督的身體，作神的居所。起初，基督的身體只是祂個人的身體。藉著祂的死與復活，基督的身體已經擴增成為祂團體的身體，就是召會，包括所有藉祂復活蒙了重生的信徒。（彼前一3。）在基督的復活裏，召會乃是祂的身體，就是神的家，（提前三15，彼前二5，來三6，）神的居所，（弗二21～22，）神的殿。（林前三16～17。）"]],["2",["許多住處是指基督身體的許多肢體，（羅十二5，）這身體就是神的殿。（林前三16～17。）23節說，主與父要同愛祂的人安排住處，充分證明這一點。"]],["3",["本書主要的有兩段：第一段，一至十三章，指出基督如何是永遠的話，藉著成為肉體而來，將神帶到人裏面，作人的生命和生命的供應。第二段，十四至二一章，揭示基督如何是耶穌這人，經過死與復活而去，將人帶進神裏面，以建造神的居所，就是召會；（太十六18；）這與新耶路撒冷的建造有關。（來十一10，啟二一2。）在全宇宙中，神只有一個建造，就是用祂的贖民建造祂活的居所。"]]]},"林前3:16":{"t":"豈不知你們是神的¹殿，神的靈住在你們裏面麼？","n":[["1",["原文指內殿。神的殿在此是指在某一個地方，如哥林多，團體的信徒；而17節神的那殿是指普世所有的信徒。神在宇宙中惟一屬靈的殿，在地上的許多地方都有顯出，每一顯出就是神在那地方的殿。","神的殿是9節“神的建築”的說明。神的建築不是普通的建築，乃是聖別之神的聖所，神的靈所居住的殿。我們這些建造這樣聖別之殿的人，都當曉得這事，好叫我們謹慎，不用木、草、禾秸等沒有價值的材料建造，乃用符合神性情和經綸的金、銀、寶石等貴重的材料建造。"]]]},"弗2:22":{"t":"¹你們²也在祂裏面同被建造，成為神在³靈裏的⁴居所。","n":[["1",["指地方上的聖徒。"]],["2",["“也”指明，21節的建造是宇宙的，本節的建造是地方的。在宇宙一面，召會在宇宙間是惟一的，其長大是普遍的；在地方一面，召會在所在的地方上也是一，其地的聖徒在該地同被建造。"]],["3",["這是指信徒有神的聖靈內住之人的靈。神的靈是居住者，不是居所；居所是信徒的靈。神的靈住在我們的靈裏，所以，神的居所是在我們的靈裏。21節說聖殿是在主裏，本節說神的居所是在靈裏。這指明為著神的居所，主與我們的靈是一，我們的靈與主也是一；（林前六17；）我們的靈就是召會，神的居所，建造的所在。"]],["4",["根據上下文，21節的聖殿是宇宙的，本節神的居所是地方的。"]]]},"來3:6":{"t":"但基督為兒子，治理神的家；我們若將因盼望而有的膽量和誇耀堅守到底，便是祂的¹家了。","n":[["1",["舊約時代，神的家就是以色列家，（利二二18，民十二7，）由他們中間的帳幕或聖殿所表徵。（出二五8，結三七26～27。）今天，神的家實際上就是召會。（提前三15，彼前四17。）神的子民以色列人乃是我們新約信徒的豫表，（林前九24～十11，）他們全部的歷史，乃是召會的豫表。"]]]},"詩132:13":{"t":"因為耶和華揀選了¹錫安，願意當作自己的居所，","n":[["1",["錫安作為耶和華的安息之所，（14，）豫表眾召會中的得勝者。見四八2註1。"]]]},"詩132:14":{"t":"說，¹這是我永遠²安息之所；我要住在這裏，因為是我所願意的。","n":[["1",["當詩人在13節說到神揀選並渴望錫安時，神突然介入，接續詩人說了14～18節的話。這是詩篇寫作的奇妙方式。"]],["2",["一三二篇題到七個與得勝者有關的項目：與神一同安息、與神同住、（14、）飽得食物、（15、）榮耀的衣服、（16、）得勝的角、（17、）照亮的燈、（17、）和發光的冠冕。（18。）這些項目是召會生活的高峰，描繪在錫安（神的山最高峰）之得勝者的光景。"]]]},"約壹4:15":{"t":"凡¹承認耶穌是神兒子的，神就住在他裏面，他也住在神裏面。","n":[["1",["父神差遣祂的兒子作世人的救主，（14，）目的在使人承認耶穌是神的兒子而相信祂，這樣神就能住在他們裏面，他們也能住在神裏面。但異端的塞林則派不承認這事；因此，他們沒有神住在他們裏面，他們也沒有住在神裏面。凡承認這事的，神就住在他裏面，他也住在神裏面，他就在神聖的生命與性情裏與神成為一。"]]]},"約壹4:16":{"t":"神¹在我們身上的²愛，我們也知道也信。神就是³愛，⁴住在愛裏面的，就⁵住在神裏面，⁶神也住在他裏面。","n":[["1",["見9註3。"]],["2",["在差子作我們救主的事上。（14。）"]],["3",["見8註2。神就是愛，這已經在神差祂兒子作我們救主和生命的事上顯明出來。（9～10，14。）"]],["4",["愛就是神自己，住在愛裏面，就是過著習慣的用這愛愛別人的生活，使神能在我們身上得著彰顯。"]],["5",["住在神裏面，就是過著以神自己作我們裏面內容，和外面彰顯的生活，使我們能絕對與祂是一。"]],["6",["神住在我們裏面，就是在裏面作我們的生命，並在外面作我們的生活；這樣，祂就能實際的與我們是一。"]]]},"徒17:24":{"t":"¹創造宇宙和其中萬物的神，既是天地的主，就不住人手所造的殿，","n":[["1",["使徒在24～25節的話是很強的豫防劑，防備無神論的以彼古羅派，他們不承認造物主並祂對世界的管理照顧；也防備汎神論的斯多亞派，他們將自己的命運降服於多神的旨意。（參18。）"]]]},"約14:6":{"t":"耶穌說，我就是¹道路、²實際、生命；若不藉著我，沒有人能到父那裏去。","n":[["1",["人進入神裏面的道路乃是主自己。這道路既是一個活的人位，所以主要帶人去的地方，也必是一個人位，就是父神自己。主自己是活的道路，把人帶進父神這活的地方。道路需要實際，實際需要生命。主自己對我們乃是生命，這生命將實際帶給我們，這實際又成了道路，使我們得以進入對父神的享受裏。"]],["2",["基督是神聖事物的實際。這實際藉祂而來，對我們作神的實化。見一14註4與約壹一6註6。"]]]},"約1:14":{"t":"¹話成了²肉體，³支搭帳幕在我們中間，豐豐滿滿的有⁴恩典，有⁴實際。⁵我們也見過祂的榮耀，正是⁶從父而來獨生子的榮耀。","n":[["1",["那是神的話成了肉體，就是神有了人的生命和性情。"]],["2",["羅八3指出，這肉體是罪的肉體，但只有肉體的樣式，沒有肉體的罪。成為這肉體的，乃是話，這話就是神，就是完整的三一神。（1。）這話成為肉體，乃是三一神成為肉體的人，就是有罪的人，使神進入有罪的人，與有罪的人聯結為一；但只有這有罪之人的樣式，沒有這有罪之人的罪。如此，祂成了一位無罪的神而人者─神人，是完整的神，又是完全的人，兼有神、人二性。祂這二性雖調和為一位神人，二性各自的特質卻仍分別存在，並沒有混合成為第三性，乃是神性在人性裏生存，並藉著人性而顯出，豐豐滿滿的有恩典，有實際。這恩典乃是神來給人享受，這實際乃是神來給人得著。這樣，那看不見的神就得以顯出，給人得著並享受作他們的生命，以完成祂新約的經綸。","神成為肉體這一事實，與當時智慧派（Gnostics）的學說相反。他們說，肉體是屬邪惡之物質的，清潔的神怎能和邪惡的肉體聯合？多西特派（Docetists）根據智慧派的學說，否認基督是在肉體裏來的。（約壹四2。）約翰寫這福音就是為著駁倒多西特派這異端，有力的證明神而人者的基督，確是神成了肉體，不過只有其形，而無其罪，為要藉著這肉體一面廢除魔鬼，（來二14，）並除掉人的罪，（來九26，）一面使神與人聯結，藉著人性得著彰顯，以成全祂榮耀的定旨，就是祂在永遠裏，為著將來的永世所計畫的。","約翰福音深處的構想，是神成肉體的基督，來作神具體的化身，猶如帳幕（14）和聖殿，（二21，）給人接觸並進入，而得享神裏面的豐富。這帳幕或聖殿，有外院子、聖所及至聖所。所以約翰首先指出，基督乃是帳幕外院子裏，豫表十字架的祭壇上除罪的羔羊，（29，）又像豫表十字架的杆子上所舉，使人得生的銅蛇。（三14。）這指出基督如何在祂的救贖裏，給信祂的人得著，使他們脫罪而得生，以進入祂作帳幕所豫表之神的具體化身裏，得享神裏面的一切豐富。十三章的洗腳，可看為帳幕外院子裏的洗濯盆，洗去親近神者所受地上的污穢，以維持他們與神的交通，和他們彼此的交通。到十四章，基督就把接受祂的人帶進聖所，經歷祂作陳設餅所表徵生命的糧，（六35，）和祂作金燈臺所表徵生命的光。（八12，九5。）最後，在十七章，基督最高最奧的禱告，就是金香壇上焚燒之香所表徵的，更把享受祂作生命、作光的人，帶進至聖所，與祂一同進入對神最深的享受裏，得享神所賜給祂的榮耀。（十七22～24。）"]],["3",["話藉著成為肉體，不僅把神帶進人性，也成為神的帳幕，作神在地上人間的居所。"]],["4",["恩典是神在子裏作我們的享受，實際是神在子裏給我們實化。實際，原文與五33，八32，十七17、19等處的真理同字。"]],["5",["這是指基督在山上變化形像。（太十七1～2，5，路九32，彼後一16～18。）"]],["6",["“從，”希臘文，para，帕拉，意“在旁邊，”含“同”意，所以直譯應為“從…同…。”子不只從父而來，並且同父而來，祂一面從父而來，一面仍與父同在。（八16下，29，十六32下。）"]]]},"提後4:22":{"t":"願主與你的¹靈同在。願²恩典與你們同在。","n":[["1",["這卷教導如何對抗召會墮落的書，有力的強調我們的靈。本書一開始就強調能力、愛、並清明自守的靈已經賜給我們，藉此我們能將神的恩賜，如火挑旺起來，並且按神的能力以及主分賜生命的恩典，與福音同受苦難。（一6～10。）到了結語，本書強調主與我們的靈同在，且以此祝福我們，使我們享受祂作恩典，以站住抵擋召會敗落中那下坡的流，並藉著祂內住的靈（一14）和裝備的話，（三16～17，）完成神的經綸。"]],["2",["在召會墮落加劇的艱難日子裏，所需要的乃是神永遠的恩典，這恩典是在永遠裏所賜給我們的，（一9，）也是在今世供我們取用的。這在不能毀壞之生命裏的恩典，一點不差就是那位是神生命的具體化身，且居住並活在我們靈裏之神的兒子基督。我們必須運用我們的靈，以享受這位基督的豐富（弗三8）作彀用的恩典。（林後十二9。）這樣，我們就可以活祂作我們的敬虔，（提前四7～8，）好建造召會作祂的見證，照著神的經綸擔負一切神聖的實際─真理。"]]]},"來10:19":{"t":"弟兄們，我們既因耶穌的血，得以坦然¹進入至聖所，","n":[["1",["今天至聖所是在主耶穌所在的天上。（九12，24。）當我們還在地上時，如何能進入？祕訣就是四12所說我們的靈。這位在天上的基督，現今也在我們的靈裏。（提後四22。）祂是那天梯，（創二八12，約一51，）將我們的靈聯於天，也將天帶到我們的靈裏。因此，我們一轉到靈裏，就進入了至聖所，在那裏與施恩寶座上的神相會。見四16註1。"]]]},"來9:12":{"t":"並且不是藉著山羊和牛犢的血，乃是藉著祂自己的血，一次永遠的進入至聖所，便¹得到了永遠的²救贖。","n":[["1",["基督的救贖是在十字架上完成的，（西一20，）但乃是等到祂藉著贖罪的血進入天上的至聖所，就是將祂贖罪的血帶去獻在神面前，祂纔從神得到這救贖，作有永遠功效的救贖。"]],["2",["在舊約裏，山羊和牛犢的血只能為百姓遮罪，（利十六15～18，）絕不能為他們的罪成功救贖，因為公牛和山羊的血是不能除罪的。（十4。）在希伯來文裏，遮罪的字根意為遮蓋；因此，遮罪的意思只是遮蓋罪，不是除去罪。因著基督作神的羔羊，在十字架上一次永遠的為罪獻上自己作祭物，（14，十12，）除去了世人的罪，（約一29，）祂灑在天上帳幕裏的血，（十二24，）就為我們成功了永遠的救贖，甚至贖了人在第一（舊）約之下所犯，只由祭牲之血所遮蓋的過犯。（15。）因此，我們得贖乃是用基督的寶血。（彼前一18～19。）見利十六1註1。"]]]},"來9:24":{"t":"因為基督並不是進入人手所造的¹聖所，那不過是真聖所的²複本，乃是進入了天的本身，如今為我們顯在神面前；","n":[["1",["見八2註1。"]],["2",["或，表樣。"]]]},"來4:16":{"t":"所以我們只管坦然無懼的來到施恩的¹寶座前，為要受²憐憫，得恩典，作應時的幫助。","n":[["1",["這裏所說的寶座，毫無疑問，是指天上神的寶座。（啟四2。）神的寶座，對全宇宙是掌權的寶座，（但七9，啟五1，）但對我們信徒，卻成了施恩的寶座，由至聖所裏的遮罪蓋（施恩座）所表徵。（出二五17，21。）這也是神和羔羊的寶座。（啟二二1。）當我們還活在地上時，怎能來到天上神和羔羊（基督）的寶座前？祕訣在於12節所說我們的靈。那在天上坐在寶座上的基督，（羅八34，）現今也在我們裏面，（羅八10，）就是在我們的靈裏，（提後四22，）這靈就是神居所的所在。（弗二22。）伯特利是神的家，神的居所，也是天的門；在那裏基督是梯子，把地聯於天，並把天帶到地。（創二八12～17，約一51。）我們的靈今天既是神居所的所在，這靈就是天的門，在這裏基督是梯子，把我們在地上的人聯於天，並把天帶給我們。因此，每當我們轉到靈裏，就能進入天的門，藉著基督作天梯，摸著天上施恩的寶座。"]],["2",["神的憐憫和祂的恩典都是神愛的彰顯。當我們在可憐的光景中，神的憐憫先臨到我們，把我們帶進一種光景，使神能以恩典厚待我們。路十五20～24告訴我們，父親看見浪子回家，對他動了慈心，這就是憐憫，彰顯出父的愛。接著，父親給他穿上上好的袍子，又給他喫肥牛犢，這就是恩典，也顯明了父的愛。神的憐憫比恩典搆得更遠，如同一座橋梁，將我們與神的恩典連接起來。","神的憐憫和恩典對我們總是便利的，然而我們需要運用靈，來到施恩的寶座前，摸著在我們諸般的軟弱上同情我們的大祭司，纔能受憐憫，得恩典。本書作者用這話，勉勵疲倦的希伯來信徒要受憐憫，得恩典，作應時的幫助，使他們能挺身而立。（十二12。）"]]]},"啟4:2":{"t":"我立刻就在¹靈裏；看哪，有一個²寶座安置在天上，又有一位坐在寶座上。","n":[["1",["見一10註2。"]],["2",["在本書中，神的寶座乃是神行政的中心。書信中的寶座是施恩的寶座，從這寶座我們受憐憫、得恩典。（來四16。）本書中的寶座乃是審判的寶座，從這寶座世界受審判。至終，在執行了神一切的審判之後，神這寶座要成為永遠生命供應的寶座，從這寶座要流出生命的活水，帶著長在其中的生命樹，作神贖民在永世裏的供應。"]]]},"但7:9":{"t":"我觀看，見有些寶座設立，那亙古常在者坐下了。祂的衣服潔白如¹雪，頭髮如純淨的¹羊毛；祂的寶座乃是²火焰，其輪乃是烈火。","n":[["1",["見啟一14註2。"]],["2",["此處和10節的火，意指神是絕對公義、全然聖別的。（來十二29。）非聖別沒有人能見主或接觸主。（來十二14與註。）"]]]},"啟5:1":{"t":"我看見坐寶座的右手中有¹書卷，裏外都寫著字，用²七印封嚴了。","n":[["1",["這書卷必定是神為了救贖召會、以色列人、世界和宇宙，用羔羊的血所立的新約，就是宇宙間那最偉大的所有權狀。本書記載了神對召會、以色列人、世界和宇宙的意念。"]],["2",["用來封嚴這書卷的七印，實際上就是這書卷的內容，也是啟示錄的內容。啟示錄正是揭開並啟示這七印的。"]]]},"出25:17":{"t":"要用純金作¹遮罪蓋，長²二肘半，寬²一肘半。","n":[["1",["遮罪蓋，如來九5所題者，相當於羅三25的平息處，乃是約櫃的蓋，表徵基督作神公義律法的遮蓋，也作神在恩典中與祂的贖民相會，對他們說話的地方。（22。）因此，至聖所約櫃上的遮罪蓋，等於施恩的寶座，就是那住在我們靈裏的基督。（來四16與註1。）按照啟八3，這也是神權柄的寶座，就是神行政的寶座。用以作這蓋的純金，表徵基督純淨的神聖性情。見利十六1註1。"]],["2",["見10註3。"]]]},"出25:21":{"t":"要將遮罪蓋¹安在櫃的上邊，又將我所要賜給你的見證版²放在櫃裏。","n":[["1",["基路伯和遮罪蓋是用純金作的，（17～18，）表徵基督是神榮耀的光輝，（來一3上，）其照耀是神聖的。金的遮罪蓋安在皂莢木的約櫃（10）上邊，表徵基督的人性而非祂的神性，是祂彰顯神聖性情之榮耀的基礎。見10註1。"]],["2",["見16註1。"]]]},"啟22:1":{"t":"天使又指給我看在城內¹街道當中一道²生命水的³河，明亮如⁴水晶，從⁵神和羔羊的寶座流出來。","n":[["1",["聖城的街道是純金，（二一21，）金象徵神聖的性情。生命水的河在街道當中流著，表徵神聖的生命在神聖的性情裏湧流，作神贖民日常生活的惟一道路。那裏有神聖生命的湧流，那裏就有神聖的性情作聖別的道路，給神的百姓憑以行事；那裏有神聖性情的聖別道路，那裏就有神聖生命的湧流。神聖的生命和作聖別道路之神聖的性情，總是同行的。所以神生命水的河，是順著神聖的道路便於應用的。我們是藉著行在這生命的道路中，享受這生命水的河。"]],["2",["生命水象徵神在基督裏成為那靈，將自己流進祂所救贖的人裏面，作他們的生命和生命的供應。這是從裂開磐石流出的水（出十七6，民二十11）所豫表的，也是從主耶穌被扎的肋旁流出的水（約十九34）所象徵的。這裏的生命水成了一道河，從神和羔羊的寶座流出來，供應並浸透整個新耶路撒冷，所以這城充滿神聖的生命，在神生命的榮耀中彰顯祂。"]],["3",["這河就如創二10～14，詩四六4，結四七5～9的河所豫表的，是表徵在其流中生命的豐盛。這是一道河，流遍聖城的四方，就像創二10～14的一條河分為四道。這一道河連同它的豐富，在我們對神生命之靈各面的豐富（羅八2，十五30，帖前一6，帖後二13，加五22～23）所有不同的經歷中，成了許多道河，如約七38所指明的。"]],["4",["生命水明亮如水晶，毫無糢糊、不透明之處。這生命水在我們裏面湧流時，就純淨我們，使我們透明如同水晶。"]],["5",["“神和羔羊的寶座，”一個寶座既為著神，也為著羔羊，表徵神和羔羊乃是一─祂是羔羊神，是救贖的神，是神那救贖者。在永世裏，坐寶座的神乃是我們救贖的神，從祂的寶座有生命水的河流出來，作我們的供應和滿足。這描述三一神─神、羔羊和生命水所象徵的那靈─如何在祂元首權柄（寶座的權柄所含示的）之下，將自己分賜給祂所救贖的人，直到永遠。"]]]},"羅8:34":{"t":"誰能定我們的罪？¹有基督耶穌已經死了，而且已經復活了，現今²在神的右邊，還為我們³代求。","n":[["1",["或，是那已經死了，而且已經復活了，現今在神的右邊，還為我們代求的基督耶穌麼？"]],["2",["本節說基督現今在神的右邊，就是在天上。但10節說祂現今在我們裏面，就是在我們的靈裏。（提後四22。）祂是那靈，（林後三17，）無所不在；祂在神的右邊，同時也在我們的靈裏；在天上，同時也在地上。"]],["3",["在這裏，基督為我們代求；但在26節，那靈為我們代求。為我們代求者，不是兩位，乃是一位，就是主靈。（林後三18。）祂在兩端為我們代求，一端是那靈在我們裏面，可能是為我們發起代求；一端是主基督在神的右邊，可能是為我們完成代求；主要的必是為著將我們模成祂的形像，並帶進祂的榮耀。"]]]},"羅8:10":{"t":"但¹基督若²在你們裏面，³身體固然因罪是⁴死的，⁵靈卻因⁶義是⁷生命。","n":[["1",["本節不再題那靈，因為這裏著重今天基督就是那靈，並且基督的靈就是我們裏面的基督。按照事實是基督，按照經歷是那靈。為著我們經歷祂，祂是那靈；為著我們敬拜祂、呼求祂、題到祂，祂是基督。我們接受祂作我們的救主和救贖主，但祂進到我們裏面乃是那靈。作為救贖主，祂的名稱是基督；作為內住者，祂的名稱是那靈。這不是兩位住在我們裏面，乃是一位內住者兩面的講究。"]],["2",["“基督在你們裏面”是整卷羅馬書的重點。在三章，祂在十字架上流血救贖我們；在四章，祂在復活裏；在六章，我們在祂裏面；現今在八章，祂是那靈在我們裏面。"]],["3",["我們還未信主時，裏面的靈是死的，外面的身體是活的。現今我們有基督在裏面，外面的身體固然因罪是死的，裏面的靈卻因義是生命。基督進到我們裏面作生命，暴露我們身體死的光景。在我們的靈裏，是基督這靈作義，結果是生命；在我們的肉體裏，是撒但作罪，結果是死。"]],["4",["因著人的墮落，罪帶著死進入人的身體，使其在神的事上是死而無能的。雖然神已經在肉體中定罪了罪，（3，）但這罪還沒有從人墮落的身體連根拔除。因此，我們的身體仍是死的。"]],["5",["指重生之人的靈，與墮落之人的身體相對。這靈不是神的靈，因為這裏題到靈是生命，須有基督在我們裏面為條件；但神的靈是生命，不需要任何條件。因此，這裏因義是生命的這靈，只能指我們人的靈，不是指神的靈。"]],["6",["在神的稱義裏，我們已經得著祂所賜給我們的義，就是三一神自己，進到我們的靈裏。這義帶來生命，（五18，21，）所以我們的靈就成了生命。"]],["7",["我們的靈不僅蒙了重生被點活，並且成了生命。當我們相信基督，祂神聖的生命之靈，就進到我們的靈裏，與我們的靈調和，二靈成為一靈。（林前六17。）因此，我們的靈不僅是活的，而且是生命。"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
