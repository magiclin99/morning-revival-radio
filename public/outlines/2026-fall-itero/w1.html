<style>
/* Layout: one reading column; sticky bar with jump links; scripture sits under its outline point, notes unfold under the verse. */
:root {
  --bg:      #f3f4f0;   /* paper with a faint green-grey cast */
  --surface: #e7e9e2;   /* scripture block */
  --note:    #dde2e3;   /* opened notes */
  --ink:     #22262a;
  --soft:    #5e6670;
  --line:    #cfd3ca;
  --accent:  #2f5576;   /* slate indigo: labels, verse refs, numbering */
  --gold:    #8a6b2c;   /* 晨興餧養 verse refs */
  --flash:   #f0e2b8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
    --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2026; --note: #232931; --ink: #e5e3dc; --soft: #9ca3ad;
  --line: #2d333b; --accent: #93b4d6; --gold: #d2b06a; --flash: #4a3f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── sticky bar ── */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#bar .wrap { display: flex; align-items: center; gap: 10px; height: var(--bar-h); }
#bar nav {
  position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
#bar nav::-webkit-scrollbar { display: none; }
#bar nav a, .toggle {
  flex: 0 0 auto; font: 500 14px/1 var(--sans); color: var(--soft);
  text-decoration: none; padding: 8px 10px; border-radius: 6px;
}
#bar nav a:hover { color: var(--ink); background: var(--surface); }
#bar nav a.on { color: var(--accent); font-weight: 700; }
.back {
  flex: 0 0 auto; font: 700 14px/1 var(--sans); color: var(--accent); text-decoration: none;
  padding: 8px 12px 8px 0; border-right: 1px solid var(--line);
}
.back:hover { color: var(--ink); }
#bar nav .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.toggle {
  border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 12px;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── masthead ── */
header.top { padding-block: 40px 8px; }
.eyebrow {
  font: 500 13px/1.4 var(--sans); letter-spacing: .08em; color: var(--soft); margin: 0;
}
.theme {
  font: 700 clamp(28px, 6vw, 40px)/1.25 var(--serif); margin: 10px 0 0;
  letter-spacing: .02em; text-wrap: balance;
}
.week {
  margin: 28px 0 0; padding-top: 20px; border-top: 2px solid var(--ink);
  font: 600 clamp(19px, 3.6vw, 22px)/1.55 var(--serif); text-wrap: balance;
}
.week .wk { display: block; font: 700 13px/1.4 var(--sans); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
.reading { margin: 14px 0 0; font-size: 15px; color: var(--soft); }
.reading b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* ── section heads ── */
.sec { margin-top: 44px; }
.sec-h {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 6px;
  font: 700 22px/1.3 var(--serif);
}
.sec-h small { font: 500 13px var(--sans); color: var(--soft); letter-spacing: .06em; }
.day-h {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  font: 700 13px/1 var(--sans); letter-spacing: .14em; color: var(--accent);
}
.day-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ── outline ── */
.pt { display: grid; grid-template-columns: auto 1fr; column-gap: .35em; margin-top: 10px; }
.pt .lab { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.pt .txt { min-width: 0; }
.pt > .scripture { grid-column: 2; }
.lv1 { font: 700 18px/1.65 var(--serif); margin-top: 18px; }
.lv1 .lab { color: var(--ink); }
.lv2 { font: 600 16.5px/1.75 var(--serif); padding-left: 1em; }
.lv3 { font: 400 16px/1.8 var(--serif); padding-left: 2.4em; }
.lv4 { font: 400 15.5px/1.8 var(--serif); padding-left: 3.8em; }
.lv5 { font: 400 15.5px/1.8 var(--serif); padding-left: 5.2em; }
@media (max-width: 480px) {
  .lv2 { padding-left: .6em; } .lv3 { padding-left: 1.4em; }
  .lv4 { padding-left: 2.2em; } .lv5 { padding-left: 3em; }
}

/* ── scripture block ── */
.scripture {
  margin: 8px 0 4px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); font-family: var(--serif); font-weight: 400;
}
body.hide-scripture .scripture { display: none; }
.v {
  display: grid; grid-template-columns: 6.2em 1fr; column-gap: .6em;
  padding: 5px 4px; border-radius: 6px; font-size: 15.5px; line-height: 1.85;
}
.v .ref {
  font: 700 12.5px/2.3 var(--sans); color: var(--accent); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.v .vt { min-width: 0; }
.v.has-note { cursor: pointer; }
.v.has-note .vt { text-decoration: underline dashed var(--line); text-underline-offset: 5px; }
.v.has-note:hover { background: var(--note); }
.v.open { background: var(--note); border-radius: 6px 6px 0 0; }
.notes {
  margin: 0 0 6px; padding: 10px 14px 12px; border-radius: 0 0 6px 6px;
  background: var(--note); font: 400 14.5px/1.8 var(--sans);
}
.note + .note { margin-top: 10px; }
.note .nl { font-weight: 700; color: var(--accent); margin-right: 6px; }
.note p { margin: 0 0 6px; }
.note p:last-child { margin-bottom: 0; }
.xlink {
  display: block; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); text-decoration: none; font-family: var(--sans);
}
.xlink:hover { border-color: var(--accent); }
.xl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.xl-ref { font: 700 14px/1.5 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
.xl-go { flex: 0 0 auto; font: 500 13px/1.5 var(--sans); color: var(--accent); }
.xl-sub { display: block; font-size: 13px; line-height: 1.6; color: var(--soft); }

/* ── morning revival ── */
.day { margin-top: 8px; }
.part { font: 700 15px/1.4 var(--sans); color: var(--soft); letter-spacing: .1em; margin: 22px 0 10px; }
.feedv {
  margin: 0 0 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--gold);
  font: 600 16.5px/1.85 var(--serif);
}
.feedv b { color: var(--gold); font: 700 14px var(--sans); margin-right: 8px; }
.prose p { font: 400 16.5px/1.95 var(--serif); margin: 0 0 1em; text-align: justify; }
.also { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
.also b { font-weight: 700; color: var(--ink); }

footer { padding-block: 48px 64px; color: var(--soft); font-size: 13px; }

@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; } .more .chev { transition: none; } html { scroll-behavior: auto; }
}
</style>

<script>
const DATA = {"doc":{"title":"二○二六年、九月秋季國際長老及負責弟兄訓練","outline":[{"day":"週一","items":[{"lv":1,"label":"壹、","text":"我們的神乃是三個特別人物—亞伯拉罕、以撒、雅各—的神；這含示祂是三一神—出三15，太二八19，林後十三14：","refs":[{"label":"出3:15","keys":["出3:15"]},{"label":"太28:19","keys":["太28:19"]},{"label":"林後13:14","keys":["林後13:14"]}]},{"lv":2,"label":"一、","text":"亞伯拉罕、以撒、雅各是以色列國的根基；若沒有他們，就沒有以色列國—出三15～16：","refs":[{"label":"出3:15-16","keys":["出3:15","出3:16"]}]},{"lv":3,"label":"1.","text":"神的子民所以能成爲神的子民，是因爲他們有了亞伯拉罕、以撒、雅各的經歷；他們的經歷最終使他們成為神的子民以色列。","refs":[]},{"lv":3,"label":"2.","text":"我們都需要有亞伯拉罕、以撒、雅各的成分；沒有這些成分，我們就不能成爲神的子民，神的以色列。","refs":[]}]},{"day":"週二","items":[{"lv":2,"label":"二、","text":"在創世記這卷書中，亞伯拉罕、以撒、雅各的記載是重疊的；創世記描繪他們，不是三個分開的個人，乃是一個團體人的構成分子：","refs":[]},{"lv":3,"label":"1.","text":"亞伯拉罕的經歷表徵對父神這獨一源頭的經歷，祂呼召人、稱義人、裝備人，使人憑信而活，且活在與祂的交通裏—十二1，十五6，十七～十八，十九29，二一1～13，二二1～18。","refs":[{"label":"創12:1","keys":["創12:1"]},{"label":"創15:6","keys":["創15:6"]},{"label":"創17-18","link":"創17:1","count":60,"chapters":2,"from":"17:1"},{"label":"創19:29","keys":["創19:29"]},{"label":"創21:1-13","keys":["創21:1","創21:2","創21:3","創21:4","創21:5","創21:6","創21:7","創21:8","創21:9","創21:10","創21:11","創21:12","創21:13"]},{"label":"創22:1-18","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10","創22:11","創22:12","創22:13","創22:14","創22:15","創22:16","創22:17","創22:18"]}]},{"lv":3,"label":"2.","text":"以撒的經歷表徵對子神的經歷，祂救贖人、祝福人，使人承受祂一切的豐富，過享受祂豐盛的生活，並活在平安中—1～14節，二五5，二六3～4、12～33。","refs":[{"label":"創22:1-14","keys":["創22:1","創22:2","創22:3","創22:4","創22:5","創22:6","創22:7","創22:8","創22:9","創22:10","創22:11","創22:12","創22:13","創22:14"]},{"label":"創25:5","keys":["創25:5"]},{"label":"創26:3-4","keys":["創26:3","創26:4"]},{"label":"創26:12-33","keys":["創26:12","創26:13","創26:14","創26:15","創26:16","創26:17","創26:18","創26:19","創26:20","創26:21","創26:22","創26:23","創26:24","創26:25","創26:26","創26:27","創26:28","創26:29","創26:30","創26:31","創26:32","創26:33"]}]},{"lv":3,"label":"3.","text":"雅各（連同約瑟）的經歷，表徵對父神的經歷，祂愛人並揀選人（瑪一2，羅九10～13）；也表徵對靈神的經歷，祂使萬有互相効力，叫愛祂的人得益處，並且變化人，使人在神聖的生命裏成熟，能祝福所有的人，治理全地，並以子神作生命供應，滿足所有的人—創二七41，二八1～三五12，三七，三九～四九，羅八28～29。","refs":[{"label":"瑪1:2","keys":["瑪1:2"]},{"label":"羅9:10-13","keys":["羅9:10","羅9:11","羅9:12","羅9:13"]},{"label":"創27:41","keys":["創27:41"]},{"label":"創28:1-35:12","link":"創28:1","count":250,"chapters":8,"from":"28:1"},{"label":"創37","link":"創37:1","count":36,"chapters":1,"from":"37:1"},{"label":"創39-49","link":"創39:1","count":357,"chapters":11,"from":"39:1"},{"label":"羅8:28-29","keys":["羅8:28","羅8:29"]}]}]},{"day":"週三","items":[{"lv":1,"label":"貳、","text":"我們需要認識並經歷亞伯拉罕的神、以撒的神和雅各的神：","refs":[]},{"lv":2,"label":"一、","text":"亞伯拉罕信神是獨一的源頭，是那『稱無爲有』者—四17：","refs":[{"label":"羅4:17","keys":["羅4:17"]}]},{"lv":3,"label":"1.","text":"神的目標必須按着神的時候並藉着神的能力達成—創十七17、19、21。","refs":[{"label":"創17:17","keys":["創17:17"]},{"label":"創17:19","keys":["創17:19"]},{"label":"創17:21","keys":["創17:21"]}]},{"lv":3,"label":"2.","text":"神在亞伯拉罕身上作特別的工作，爲要給他看見，神作爲父的意義是甚麼—弗四6：","refs":[{"label":"弗4:6","keys":["弗4:6"]}]},{"lv":4,"label":"a.","text":"認識神是父，乃是認識祂是源頭，就是獨一的發起者，並且一切都是源於祂—太十五13。","refs":[{"label":"太15:13","keys":["太15:13"]}]},{"lv":4,"label":"b.","text":"我們都需要認識神是父，一切都是從祂而出—羅十一36，林前八6，弗三14～16。","refs":[{"label":"羅11:36","keys":["羅11:36"]},{"label":"林前8:6","keys":["林前8:6"]},{"label":"弗3:14-16","keys":["弗3:14","弗3:15","弗3:16"]}]},{"lv":2,"label":"二、","text":"以撒是子最佳的表徵；在他身上我們看見，一切都是從父而來—創二四36，二五5：","refs":[{"label":"創24:36","keys":["創24:36"]},{"label":"創25:5","keys":["創25:5"]}]},{"lv":3,"label":"1.","text":"按照創世記二十二章的圖畫，以撒很詳細的豫表基督。","refs":[]},{"lv":3,"label":"2.","text":"以撒的原則乃是領受的原則—二五5，林前四7：","refs":[{"label":"創25:5","keys":["創25:5"]},{"label":"林前4:7","keys":["林前4:7"]}]},{"lv":4,"label":"a.","text":"子神的意義是一切都是領受，沒有一件事由祂發起—約十六15，十七10，五19、30。","refs":[{"label":"約16:15","keys":["約16:15"]},{"label":"約17:10","keys":["約17:10"]},{"label":"約5:19","keys":["約5:19"]},{"label":"約5:30","keys":["約5:30"]}]},{"lv":4,"label":"b.","text":"在以撒身上我們看見，一切都是從父而來，我們的地位乃是領受—創二六12～13，羅十一36，林前四7：","refs":[{"label":"創26:12-13","keys":["創26:12","創26:13"]},{"label":"羅11:36","keys":["羅11:36"]},{"label":"林前4:7","keys":["林前4:7"]}]},{"lv":5,"label":"(一)","text":"以撒與亞伯拉罕的關係是領受的關係；認識以撒的神，就是認識神是供給者—創二四36。","refs":[{"label":"創24:36","keys":["創24:36"]}]},{"lv":5,"label":"(二)","text":"神是父，一切都從祂而出；我們是眾子，我們所有的一切，都從祂而來—林前八6，十一12下。","refs":[{"label":"林前8:6","keys":["林前8:6"]},{"label":"林前11:12","keys":["林前11:12"]}]}]},{"day":"週四","items":[{"lv":2,"label":"三、","text":"雅各是對我們說到聖靈；他的經歷代表聖靈的工作，他的歷史豫表聖靈的管治：","refs":[]},{"lv":3,"label":"1.","text":"雅各的一生乃是代表神的對付，而雅各的神乃是對付的神—創三一38～41：","refs":[{"label":"創31:38-41","keys":["創31:38","創31:39","創31:40","創31:41"]}]},{"lv":4,"label":"a.","text":"『雅各的神』這名稱含示聖靈如何管教雅各，對付他的天然生命，把基督構成到他裏面，並且在他裏面結出聖靈的果子—加五22～23，來十二11。","refs":[{"label":"加5:22-23","keys":["加5:22","加5:23"]},{"label":"來12:11","keys":["來12:11"]}]},{"lv":4,"label":"b.","text":"我們要認識雅各的神，就得讓聖靈在我們身上作工，對付我們的天然生命，把基督構成到我們裏面。","refs":[]},{"lv":3,"label":"2.","text":"雅各的歷史乃是一幅聖靈管治的圖畫—創四七9，四八15：","refs":[{"label":"創47:9","keys":["創47:9"]},{"label":"創48:15","keys":["創48:15"]}]},{"lv":4,"label":"a.","text":"聖靈的管治是指聖靈在我們外面的環境裏作工，祂安排一切的人、事和遭遇，使我們藉此受管教—羅八28。","refs":[{"label":"羅8:28","keys":["羅8:28"]}]},{"lv":4,"label":"b.","text":"神藉着聖靈的管治，完全拆毀我們裏面舊造的元素，使新造的元素得以在我們裏面建造起來。","refs":[]},{"lv":3,"label":"3.","text":"神藉着聖靈的管治，對付我們天然的生命，使基督得以作到我們裏面、構成到我們裏面並成形在我們裏面，使三一神得着團體的彰顯。","refs":[]}]},{"day":"週五","items":[{"lv":2,"label":"四、","text":"亞伯拉罕的神、以撒的神和雅各的神，就是耶和華，伊羅欣—自有永有的三一神，永遠、偉大的我是—出三6、14，啓一4。","refs":[{"label":"出3:6","keys":["出3:6"]},{"label":"出3:14","keys":["出3:14"]},{"label":"啟1:4","keys":["啟1:4"]}]},{"lv":2,"label":"五、","text":"亞伯拉罕的神、以撒的神和雅各的神，乃是復活的神—出三6、15，太二二23～33，徒三13。","refs":[{"label":"出3:6","keys":["出3:6"]},{"label":"出3:15","keys":["出3:15"]},{"label":"太22:23-33","keys":["太22:23","太22:24","太22:25","太22:26","太22:27","太22:28","太22:29","太22:30","太22:31","太22:32","太22:33"]},{"label":"徒3:13","keys":["徒3:13"]}]},{"lv":2,"label":"六、","text":"亞伯拉罕的神、以撒的神和雅各的神，乃是帳幕的神；亞伯拉罕、以撒和雅各都住在帳棚裏；他們住在帳棚裏時，熱切等候神永遠的帳幕，就是新耶路撒冷城—出四十34～35，創十二8，十三18，二六17、25，三三18，三五21，來十一9～10，啓二一2～3。","refs":[{"label":"出40:34-35","keys":["出40:34","出40:35"]},{"label":"創12:8","keys":["創12:8"]},{"label":"創13:18","keys":["創13:18"]},{"label":"創26:17","keys":["創26:17"]},{"label":"創26:25","keys":["創26:25"]},{"label":"創33:18","keys":["創33:18"]},{"label":"創35:21","keys":["創35:21"]},{"label":"來11:9-10","keys":["來11:9","來11:10"]},{"label":"啟21:2-3","keys":["啟21:2","啟21:3"]}]},{"lv":2,"label":"七、","text":"亞伯拉罕的神是稱義的神（創十五6，羅四2～3），以撒的神是恩典的神（林後十三14），雅各的神是藉着神聖的管教變化人的神（三18，來十二5～11）；至終，雅各的神成了以色列的神（創三三20，出五1），就是經過變化之雅各的神。","refs":[{"label":"創15:6","keys":["創15:6"]},{"label":"羅4:2-3","keys":["羅4:2","羅4:3"]},{"label":"林後13:14","keys":["林後13:14"]},{"label":"林後3:18","keys":["林後3:18"]},{"label":"來12:5-11","keys":["來12:5","來12:6","來12:7","來12:8","來12:9","來12:10","來12:11"]},{"label":"創33:20","keys":["創33:20"]},{"label":"出5:1","keys":["出5:1"]}]}]},{"day":"週六","items":[{"lv":1,"label":"叁、","text":"經歷亞伯拉罕的神、以撒的神和雅各的神，結果乃是神的以色列，就是在三一神裏的召會—創三五10，三三20，加六16：","refs":[{"label":"創35:10","keys":["創35:10"]},{"label":"創33:20","keys":["創33:20"]},{"label":"加6:16","keys":["加6:16"]}]},{"lv":2,"label":"一、","text":"神的以色列是真以色列人（羅九6下，二28～29，腓三3），包括在基督裏所有外邦和猶太的信徒，他們是亞伯拉罕的真子孫，是信仰之家的人，也是新造裏的人—加三7、29，六10、15～16：","refs":[{"label":"羅9:6","keys":["羅9:6"]},{"label":"羅2:28-29","keys":["羅2:28","羅2:29"]},{"label":"腓3:3","keys":["腓3:3"]},{"label":"加3:7","keys":["加3:7"]},{"label":"加3:29","keys":["加3:29"]},{"label":"加6:10","keys":["加6:10"]},{"label":"加6:15-16","keys":["加6:15","加6:16"]}]},{"lv":3,"label":"1.","text":"真以色列人，屬靈的以色列人，乃是召會—16節，太十六18。","refs":[{"label":"加6:16","keys":["加6:16"]},{"label":"太16:18","keys":["太16:18"]}]},{"lv":3,"label":"2.","text":"在神新約的經綸裏，我們已成爲神的兒子和神的以色列；我們的定命是作神的兒子彰顯神，並作君王在神的國裏掌權—加三26，六10、16，啓五10，二一7，二二5下，十二5上。","refs":[{"label":"加3:26","keys":["加3:26"]},{"label":"加6:10","keys":["加6:10"]},{"label":"加6:16","keys":["加6:16"]},{"label":"啟5:10","keys":["啟5:10"]},{"label":"啟21:7","keys":["啟21:7"]},{"label":"啟22:5","keys":["啟22:5"]},{"label":"啟12:5","keys":["啟12:5"]}]},{"lv":3,"label":"3.","text":"我們作爲神的以色列，代表神，行使祂的權柄，並在地上執行祂的行政，以完成祂的定旨—創一26、28，路十19，啓十二5、7～11。","refs":[{"label":"創1:26","keys":["創1:26"]},{"label":"創1:28","keys":["創1:28"]},{"label":"路10:19","keys":["路10:19"]},{"label":"啟12:5","keys":["啟12:5"]},{"label":"啟12:7-11","keys":["啟12:7","啟12:8","啟12:9","啟12:10","啟12:11"]}]},{"lv":2,"label":"二、","text":"神的以色列乃是在三一神裏的召會—帖前一1，太二八19：","refs":[{"label":"帖前1:1","keys":["帖前1:1"]},{"label":"太28:19","keys":["太28:19"]}]},{"lv":3,"label":"1.","text":"當保羅說到在父神和主耶穌基督裏的召會，事實上他的意思是說，召會是在三一神裏—帖前一1，林前一2，十二4～6：","refs":[{"label":"帖前1:1","keys":["帖前1:1"]},{"label":"林前1:2","keys":["林前1:2"]},{"label":"林前12:4-6","keys":["林前12:4","林前12:5","林前12:6"]}]},{"lv":4,"label":"a.","text":"『父神』和『主耶穌基督』這樣的說法，都含示那靈；因此，帖前一章一節含示那靈是不言而喻的，我們可以說，召會是在三一神裏的。","refs":[]},{"lv":4,"label":"b.","text":"按照聖經，我們找不到召會只在神裏這回事；反之，召會乃是在經過過程的三一神裏—太二八19，林後十三14。","refs":[{"label":"太28:19","keys":["太28:19"]},{"label":"林後13:14","keys":["林後13:14"]}]},{"lv":4,"label":"c.","text":"召會在父神和主耶穌基督裏，意思是說，召會乃是在經過過程的三一神裏，就是在那帶着父和子成了賜生命之靈的一位裏—太二八19，弗四4～6，約十四20。","refs":[{"label":"太28:19","keys":["太28:19"]},{"label":"弗4:4-6","keys":["弗4:4","弗4:5","弗4:6"]},{"label":"約14:20","keys":["約14:20"]}]},{"lv":3,"label":"2.","text":"我們若看見召會在三一神裏的異象，這異象會支配我們的思想、活動，以及我們整個的生活。","refs":[]}]}],"days":[{"day":"週一","feed":{"verses":[["出三15","『神又對摩西說，你要對以色列人這樣說，耶和華你們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，差我到你們這裏來。這是我的名，直到永遠…。』"],["太二二32","『「我是亞伯拉罕的神，以撒的神，雅各的神。」神並不是死人的神，乃是活人的神。』"]],"paras":["聖經給我們看見，神的子民有兩個起點：一個起點是亞伯拉罕，因爲神的揀選、神的恩召是從亞伯拉罕起頭的；還有一個起點是以色列國，神告訴以色列人，他們要在萬民中作屬祂的子民，他們要歸祂作祭司的國度，爲聖別的國民。（出十九5～6。）所以，神的子民的的確確是從亞伯拉罕起頭的，神的子民也的的確確是從以色列國起頭的。在這兩個起點中間，神得着了三個人，就是亞伯拉罕、以撒、雅各。…然後…以色列國…作〔了〕神的子民。從此以後，就有了神的子民。所以，我們可以這樣說，以色列國的根基，是建造在亞伯拉罕、以撒、雅各的身上。…如果沒有亞伯拉罕、以撒、雅各，就沒有神的子民。（倪柝聲文集第二輯第十五册，二至三頁。）"]},"read":{"paras":["亞伯拉罕、以撒、雅各有他們在神面前特別的地位，他們三個人屬靈的經歷，就是代表三個不同的屬靈的原則。…凡是真實的以色列人，真實的神的子民，都得說，我們的祖宗是亞伯拉罕、以撒和雅各。光說，我們的祖宗亞伯拉罕，是不彀的，因爲以實瑪利和他的子孫也能說，我們的祖宗亞伯拉罕；光說，我們的祖宗亞伯拉罕、以撒，也是不彀的，因爲以掃也能這樣說，以掃的後裔也能這樣說。…連雅各也〔要包括〕在裏面，纔能站得住；要三方面都有，纔能站得住。（倪柝聲文集第二輯第十五册，五至六頁。）","按照神聖記載的含示，亞伯拉罕、以撒、雅各不是三個分開的個人。同樣，他們的神—亞伯拉罕的神，以撒的神，雅各的神，也不是三位神，而是一位三一神。在亞伯拉罕身上我們看見父神，在以撒身上我們看見子神，在雅各身上我們看見靈神。父、子、靈，三而一，乃是獨一的三一神。同樣的原則，亞伯拉罕、以撒、雅各是三一的人，他們是三而一，在生命的經歷上是一個完整的人。","在亞伯拉罕的記載裏，我們看到呼召的事。然而按照神的啓示，呼召不是第一項。神的揀選在神的呼召之前。…在已過的永遠裏，亞伯拉罕已蒙揀選；在迦勒底他纔蒙召。但亞伯拉罕蒙揀選的記載在那裏？乃是在創世記二十五章雅各蒙揀選的記載裏。…亞伯拉罕的生命沒有完全的起頭，也沒有完整的結束，因爲他旣沒有蒙揀選，也沒有在生命上成熟，這兩者都在雅各身上。…亞伯拉罕本身在神眼中不是一個完整的人，他需要雅各和以撒。亞伯拉罕、以撒、雅各，這三個人代表一個完整人的屬靈經歷。…在亞伯拉罕身上我們清楚看見神的呼召，但沒有看見揀選，也沒有看見生命的成熟。","亞伯拉罕、以撒、雅各在生命的經歷上形成一個完整的人。亞伯拉罕因爲生命不成熟，他沒有祝福人。以撒有一點成熟，但缺少生命成熟的豐富，所以盲目的祝福。雅各生命成熟，就完滿且清楚的祝福。凡他所說的都是神的話，凡他所祝福的都是豫言，說到神對祂所有兒女的經綸。至終，雅各變成以色列，神的彰顯。（創世記生命讀經，九八四至九八五、九八八頁。）"],"ref":"亞伯拉罕以撒雅各的神，第一章；創世記生命讀經，第六十二篇。"}},{"day":"週二","feed":{"verses":[["創十二1","『耶和華對亞伯蘭說，你要離開本地、親族、父家，往我所要指示你的地去。』"],["羅八28","『還有，我們曉得萬有都互相効力，叫愛神的人得益處，就是按祂旨意被召的人。』"]],"paras":["創世記啓示一個團體人生命之三階段裏完整的三一神。創世記沒有把亞伯拉罕、以撒、雅各看作三個分開的人，而是把他們看作一個有三階段的完整的團體人。","我們的神乃是三個特別人物的神，就是亞伯拉罕的神，以撒的神，雅各的神。…創世記包括神選民中的四個人—亞伯拉罕、以撒、雅各、約瑟，但聖經沒有把約瑟看作是單獨的人。他的生平實際上乃是雅各生平的繼續和終結。耶和華是亞伯拉罕、以撒、雅各的神，就是三一神。（李常受文集一九九一至一九九二年第四册，一七七至一七八頁。）"]},"read":{"paras":["雅各是三個人中的最後一位，但神用他表徵父愛人並揀選人的這一面。瑪拉基一章二節說，神愛雅各；羅馬九章十至十三節說，神揀選了雅各，甚至在雅各出生以前，就揀選了他。","在亞伯拉罕的階段裏，我們看見父神呼召人、稱義人、裝備人，使人憑信而活，且活在與祂的交通裏。…創世記十二章一節給我們看見父的呼召，十五章六節啓示祂的稱義。十七章給我們看見神如何裝備亞伯拉罕，使他過憑信的生活。然後十八章啓示神如何使亞伯拉罕活在與祂交通的生活裏。這是神與祂的人間朋友亞伯拉罕之間交通的一章。","以撒的階段代表子神，就是三一神的第二者，祂賜福與人，使人承受祂一切的豐富，過享受祂豐盈的生活，並在平安中過生活。（二五5，二六3～4，12～33。）","在雅各同約瑟生平的階段裏，我們看見靈神在萬有裏作工，叫愛祂的人得益處。這是根據羅馬八章二十八節。…這裏的益處不是指物質的人、事、物；乃是指我們更多得着基督作到我們裏面，使我們有新陳代謝的變化，至終模成祂這神長子的形像，（29，）也就是將我們帶進完滿的兒子名分裏。","我們必須看見，事實上乃是那靈在萬有裏作工。…那靈能指揮我們環境中的每一件事，並在一切的人、事、物上作工，叫這些人、事、物互相効力，使我們得益處，爲使我們得變化，並模成神長子的形像。","在雅各同約瑟的生平裏，我們看見，那靈變化人，並使人在神聖的生命裏成熟，好叫人能給萬民祝福，管理全地，並以子神作爲生命的供應滿足萬民。…沒有約瑟，雅各的生平就無法成爲完整。約瑟的生平是他父親生平的完成。雅各乃是在年老的時候，給所有的人祝福，而他年紀老邁的時候，正是他兒子約瑟掌權的時候。…雅各同約瑟生平的末了，給我們看見，藉着靈神的工作，而在神聖生命裏成熟。","在亞伯拉罕、以撒、雅各同約瑟這團體之人的生平裏，我們可以看見一個蒙神所愛、所揀選、所呼召、所稱義，並得以享受基督一切豐富的人。這一位也被命定要過掙扎的生活，受苦的生活。最後，藉着這一切苦難，這一位就被那靈變化，而在神聖生命裏成熟。他在年邁時，只知道給人祝福，爲神掌權，並將神當作生命的供應分配給人。（李常受文集一九九一至一九九二年第四册，一七八至一八一頁。）"],"ref":"神在祂與人聯結中的歷史，第十章。"}},{"day":"週三","feed":{"verses":[["羅四17","『亞伯拉罕在他所信那叫死人復活，又稱無爲有的神面前，是我們眾人的父，如經上所記：「我已經立你作多國的父。」』"],["加四23","『然而那出於使女的，是按着肉體生的；那出於自主婦人的，是藉着應許生的。』"]],"paras":["甚麼叫作神是父？神是父的意思就是：一切都是出乎神的。…神是父，意思就是神是創造者，神是惟一的發起人。子是父差遣來的。『子從自己不能作甚麼，惟有看見父所作的，子纔能作；父所作的事，子也照樣作。』（約五19。）這是我們必須有的經歷。我們必須蒙神的恩典，看見我們在神面前不能發起一件事，不配發起一件事。…神是父，一切都是出乎神。（倪柝聲文集第二輯第十五册，六至七頁。）"]},"read":{"paras":["有一天神給你看見『神是父』的時候，那一天是你有福的一天。那一天你會認識你不能作甚麼，你沒有辦法。你並不是勒住自己不作一件事，勒住自己不作兩件事；你乃是問說，神起頭了沒有？這就是亞伯拉罕的經歷。他的經歷就是給我們看見，他不是自己要作神的子民。亞伯拉罕沒有起頭，是神起頭的，是神從伯拉大河那一邊把他帶過來。（創十二1～5。）神要他，所以神就呼召亞伯拉罕出來，亞伯拉罕自己連想都沒有想過。阿利路亞！是神要他，是神作的事。","神是父。…〔亞伯拉罕〕蒙召出去的時候，還不知道要往那裏去。（來十一8。）…甚麼都是神起頭的，和他自己沒有關係。我們如果真知道神是父，我們自己就沒有這麼多把握，就不能說，我要作甚麼就作甚麼。","還不只這樣。亞伯拉罕連要生一個兒子都不知道。…亞伯拉罕不能發起任何的事，連他自己的兒子也得神給他。這是亞伯拉罕。","亞伯拉罕認識神是父。…我們需要學習的第一個功課就是這一個—我自己不能作甚麼，一切都在乎神，祂是父，祂是一切的起頭。","我們在以撒身上所得着的教訓是甚麼呢？加拉太四章說以撒是子。（23。）以撒給我們看見，一切都是從父那裏承受的。我們從創世記十一章起，一直讀到五十章，在亞伯拉罕、以撒、雅各的故事裏，能看出以撒是一個碌碌無奇、平平常常的人。…以撒一生都是享受他父親所傳下來的。不錯，以撒也挖了幾口井；但是，有些井還是從前他父親挖的…。（二六18。）以撒所給我們的一個功課就是，我們若不是從父那裏承受，就一無所有。保羅問我們一個問題：『你有甚麼不是領受的？』（林前四7。）這就是說，我沒有一件東西不是接受的，我所有的，都是父親給的。這是以撒。","許多人不能作亞伯拉罕，就是因爲他不能作以撒。…光有亞伯拉罕的經歷，沒有以撒的經歷，不行；光有以撒的經歷，沒有亞伯拉罕的經歷，也不行。我們要看見神是父，甚麼都是出乎祂；我們也要看見我們是兒子，甚麼都是祂給的。我們作兒子的生命，是從祂來的。我們在神面前不過是一個接受的人。得救是接受的，得勝也是接受的；稱義是接受的，聖別也是接受的；赦罪是接受的，得着釋放也是接受的。接受的原則就是以撒的原則。（倪柝聲文集第二輯第十五册，七至九頁。）"],"ref":"亞伯拉罕以撒雅各的神，第五、七至八章；帖撒羅尼迦前書生命讀經，第八篇。"}},{"day":"週四","feed":{"verses":[["創三一40～41","『我白日受乾熱銷磨，黑夜受寒霜侵蝕，不得合眼睡着，我常是這樣。我這二十年在你家裏…服事你…，你十次改了我的工價。』"],["來十二11","『一切的管教，當時固然不覺得喜樂，反覺得愁苦；後來卻給那藉此受過操練的人，結出平安的義果。』"]],"paras":["現在我們要來看雅各。…我們知道所有的都得接受，若不接受，我們就是虛空的，就甚麼都沒有。但是爲甚麼我們不接受，而要在那裏自己作呢？爲甚麼不藉着生命的律來得勝，而要藉着意志來得勝呢？這裏有一個原因，就是…因爲還有雅各的原則在那裏—肉體的活動在那裏，魂的能力在那裏，天然的生命在那裏。爲甚麼我們在道理方面知道神是一切的起頭，而在實際方面我們又要自己起頭呢？我們把道理記住了兩週，到第三週就忘記了，自己又起頭了。所以這樣，是因爲有雅各在這裏。…我們必須看見神是萬有的頭，必須看見我們是一個接受的人，同時還必須看見我們天然的生命不能活動。…子的應許我們能不能接受，父的道路我們能不能行走，就要看到底我們有沒有受聖靈的管治，天然的生命有沒有被祂摸一下。這一個，我們要從雅各身上來看。（倪柝聲文集第二輯第十五册，一○頁。）"]},"read":{"paras":["亞伯拉罕是對我們說到父，以撒是對我們說到子，至於雅各，是對我們說到聖靈。…雅各一生的歷史，都是代表聖靈的管治。你在這裏看見有一個人是狡猾的，是詭計多端的，是會欺騙人的；但是你也看見這一個人有聖靈在那裏一步一步的管治他。他抓住他哥哥的腳跟，但他還是作了弟弟。不錯，他用一碗紅豆湯騙了他的哥哥。但是後來離開家庭的是他，不是他的哥哥。不錯，長子的名分被他得來了，但是逃難的是他，不是他的哥哥。不錯，他得着了他父親的祝福，但是飄流在外的是他，不是他的哥哥。到了他舅舅那裏，他要娶拉結，但是拉班先給他的是利亞，不是拉結。他二十年之久，白日受乾熱銷磨，黑夜受寒霜侵蝕。（創三一40。）…這一切都是聖靈的管治，都是聰明人所受的熬煉。…天然的生命，要被神壓出去。雅各一生的經歷，就是給我們看見聖靈的管治。","亞伯拉罕給我們看見甚麼都是出乎神，我們不能憑着自己作甚麼。以撒給我們看見一切都是神所賜給的，我們應當接受。但是，我們雖然接受了，如果沒有受聖靈的管治，還會出毛病。這是雅各所給我們看見的。主總得有一天，把你摸一下，把你大腿窩的筋扭了，把你天然的生命對付了，然後你纔會變成一個謙卑的人，然後你纔會變成一個戰兢恐懼跟從主的人。…我們是何等容易出主張，何等容易不禱告就說話行事，何等容易不在神面前等候就有把握。神要把你天然的生命厲害的摸一下，神要把你天然的生命打斷了，給你看見靠着自己不能作甚麼；從那一天起，你纔是一個瘸腿的人。瘸腿不是說你不能走路，而是說你每走一步路，就知道自己的不行，知道自己是一個瘸腿的人。所有認識神的人都有這一個共同的特點。…還想自己有辦法、自己有把握、自己有能力的人，是沒有受過聖靈管治的人。（倪柝聲文集第二輯第十五册，一一至一四頁。）"],"ref":"亞伯拉罕以撒雅各的神，第九章。"}},{"day":"週五","feed":{"verses":[["出三14～15","『神對摩西說，我是那我是；又說，你要對以色列人這樣說，那我是差我到你們這裏來。…你要對以色列人這樣說，耶和華你們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，差我到你們這裏來。這是我的名，直到永遠；這也是我的記念，直到萬代。』"]],"paras":["在出埃及三章十五節，神親自說出〔亞伯拉罕、以撒、雅各的神〕這神聖的名稱，那時祂〔是〕對摩西說〔話〕。…亞伯拉罕、以撒、雅各的神乃是耶和華伊羅欣。（創二4～22，出三15。）創世記一章只用『伊羅欣』這名稱題到神，而沒有用『耶和華』。到了二章，神的名稱纔變作『耶和華伊羅欣』。（原文。）『伊羅欣』的意思是信實的大能者。…『耶和華』意卽祂是昔是今是以後永是的。二章四至二十二節一再的題到『耶和華伊羅欣』，這神聖的名稱指明神與祂選民的關係。","耶和華這偉大的我是，…是自有的、無始的，也是永有的、無終的。〔出三13～14。〕整個宇宙中的開始與終結乃是神。神是開始，就是阿拉法；祂也是終結，就是俄梅嘎。（啓二二13。）（李常受文集一九九一至一九九二年第四册，一七五至一七六頁。）"]},"read":{"paras":["耶和華伊羅欣，亞伯拉罕、以撒、雅各的神，乃是偉大永遠的『我是』，『我是那我是』。（出三14，約八24，28，58。）祂旣是『我是』，就是永遠的。在約翰八章，主耶穌三次題到祂是那『我是』。在二十四節，祂說，『你們若不信我是，必要死在你們的罪中。』在二十八節，祂說，『你們舉起人子以後，必知道我是。』最後，在五十八節祂說，『還沒有亞伯拉罕，我就是。』…基督是偉大的『我是』，祂這永遠、永存的神乃是在亞伯拉罕以前。祂是永遠的『我是』，就是『我是那我是』。","亞伯拉罕、以撒、雅各的神乃是帳幕的神。…當亞伯拉罕、以撒、雅各住在帳棚裏的時候，他們熱切等候神永遠的帳幕，就是新耶路撒冷城。（來十一10，啓二一2～3。）…三一神化身於子，成爲肉體，作祂在地上的帳幕。話成了肉體，支搭帳幕在我們中間。（約一14。）那人是個帳幕。祂是神成爲人，就是神人。藉着祂的成爲肉體，祂將神與人調和在一起。這人作神與人的調和，乃是神的帳幕。藉着成爲肉體，神終於成了我們的居所，使我們成爲祂的居所，就是神與人互相的住處。","神的帳幕先是個別的神人耶穌。（太一21～23。）這個別的神人耶穌，作神的帳幕，終極完成於團體的新耶路撒冷。這團體的新耶路撒冷，乃是在千年國裏住棚節的應驗。（利二三34，39～43，啓二7下。）住棚節是以色列人一年最後的節期。在千年國裏，基督要作住棚節的實際，作爲在永世裏對經過過程並終極完成之三一神的全享。（二二14，19。）基督在永遠裏要成爲這樣一個完全的享受，使我們享受神作我們永遠的分。","在將來的永遠裏，新耶路撒冷乃是基督的擴大，是神與人永遠的調和，也是神與人相互的住處。啓示錄二十一章說，新耶路撒冷是神所居住的帳幕，也說神是祂選民所居住的殿。〔2～3，22。〕所以要來的新耶路撒冷乃是救贖之神和祂救贖之人相互的住處，以彰顯經過過程的三一神，調和着蒙重生、被變化、得榮耀的三部分人。這是亞伯拉罕、以撒、雅各同約瑟的神終極的完成。（李常受文集一九九一至一九九二年第四册，一七七、一八六至一八八頁。）"],"ref":"神在祂與人聯結中的歷史，第十章。"}},{"day":"週六","feed":{"verses":[["加六16","『凡照這準則而行的，願平安憐憫臨到他們，就是臨到神的以色列。』"],["帖前一1","『保羅、西拉和提摩太，寫信給在父神和主耶穌基督裏，帖撒羅尼迦人的召會：願恩典與平安歸與你們。』"]],"paras":["保羅在加拉太六章十六節的末了說，『就是臨到神的以色列。』『就是』在原文不是用作連接詞，而是作爲解釋，指明使徒認爲在基督裏許多單個的信徒，在團體一面乃是神的以色列。神的以色列卽真以色列人，（羅九6下，二28～29，腓三3，）包括在基督裏所有外邦和猶太的信徒，他們是亞伯拉罕的真子孫，（加三7，29，）是信仰之家的人，（六10，）也是新造的人，他們照『這準則』而行，彰顯神的形像，並施行神的權柄。（加拉太書生命讀經，三三○頁。）"]},"read":{"paras":["我們這些相信基督耶穌的人…有雙重的身分。一面，我們是神的兒子，神聖家庭的一員。另一面，我們是未來的君王，命定要作君王的人。君王職分與神的以色列有關。…要成爲神合式的兒子，有那靈的果子，如加拉太五章二十二、二十三節所列舉的那些美德，就彀了。但我們要作君王—神的以色列，就需要另一種生活，一種特別的憑着靈而行。…這不僅僅是神聖家庭中兒子的生活，也是那要在神國裏作君王之人的生活。願我們的眼睛得開啓，看見我們是皇家的君王！","就一面說，卽使許多以色列人悖逆且非常罪惡，以色列國還是神的以色列和神的見證。然而，真以色列，屬靈的以色列，乃是召會。但因爲以色列國與召會都在低落的光景裏，主就需要恢復神的真以色列。爲着這樣的恢復，我們需要兩種生活，兩種的行。在第一種行，我們會有愛、喜樂、和平、溫柔、和恆忍這樣的美德，這都是那活在我們裏面之基督的彰顯。我們也需要第二種行，好叫我們成爲神的以色列，背負神的君王職分，有祂的權柄代表祂，並執行祂的行政管理。…就屬靈一面說，我們是神的兒子，也是神的以色列。我們是神的兒子，需要有愛、喜樂、和平、信實、溫柔；我們是神的以色列，必須照神新約經綸的基本準則而行。（加拉太書生命讀經，四六六至四六八頁。）","我們可以確定，帖前一章一節所說的神乃是三一神。我們如何知道？因爲保羅首先題到父—三一神的第一者。…保羅說到父的這個事實，有力的指明他所想的是三一神。不僅如此，『主耶穌基督』這話也含示那靈。『父神』與『主耶穌基督』都含示那靈。因此，一章一節含示那靈，是不言而喻的。…這位三一神是經過過程的神。祂經過了成爲肉體、人性生活、釘十字架和復活的過程。祂釘十字架成功了救贖，了結了舊造，毀壞了撒但和死亡。祂復活使新造有了新生的起頭。現今祂是賜生命的靈，就是三一神的終極完成。召會是在這樣一位三一神裏面。召會是在經過過程的三一神裏，就是在那帶着父和子成了賜生命之靈的一位裏。","我們若看見召會是在父神和主耶穌基督裏的這個異象，自然就會明白，我們不該固守某些觀念或作某些事，因爲這些事是屬世的、凡俗的、不聖的、也不是分別歸神的。我們會明白，這類事物不是爲着召會的，因爲召會乃是在父神和主耶穌基督裏的。（帖撒羅尼迦前書生命讀經，六八、七二、七九頁。）"],"ref":"帖撒羅尼迦前書生命讀經，第一、三至五、七、九至十一篇；加拉太書生命讀經，第三十、四十二至四十三篇。"}}],"theme":"『亞伯拉罕、以撒、雅各的神』","week":"第一週、認識並經歷亞伯拉罕的神、以撒的神和雅各的神，而成爲神的以色列","reading":"創二八13，三三20，出三6、14～15，徒三13，加六16，帖前一1","readingRefs":[{"label":"創28:13","keys":["創28:13"]},{"label":"創33:20","keys":["創33:20"]},{"label":"出3:6","keys":["出3:6"]},{"label":"出3:14-15","keys":["出3:14","出3:15"]},{"label":"徒3:13","keys":["徒3:13"]},{"label":"加6:16","keys":["加6:16"]},{"label":"帖前1:1","keys":["帖前1:1"]}]},"verses":{"創28:13":{"t":"耶和華站在梯子以上，說，我是耶和華你祖¹亞伯拉罕的神，也是¹以撒的神；我要將你現在所躺臥之²地，賜給你和你的²後裔。","n":[["1",["神說祂自己是亞伯拉罕的神和以撒的神，這含示祂也要成為雅各的神。亞伯拉罕的神是稱義的神，以撒的神是恩典的神，雅各的神是藉著神聖的管教變化人的神。至終，雅各的神成了以色列的神，（三三20，出五1，）就是經過變化之雅各的神。"]],["2",["神應許雅各，要賜他後裔、地和福分，（13～14，）正如祂應許亞伯拉罕（十二3，7，十三14～16，十五18，二二17～18）和以撒（二六3～4）一樣。地是為著神的國，後裔是為著彰顯神並擴展神的形像。地和後裔二者都是基督，（見十五3註1，）祂也成了我們用以祝福別人（羅十五29）的福。（14。）"]]]},"創33:20":{"t":"在那裏築了一座¹壇，起名叫²伊勒伊羅伊以色列。","n":[["1",["雅各在迦南地的示劍支搭帳棚，（19，）並築了一座壇，像他祖父亞伯拉罕所作的一樣。（十二6～7。）在此雅各開始過蒙神呼召者的生活，使神的定旨得以完成。"]],["2",["意，神，以色列的神。"]]]},"出3:6":{"t":"又說，我是你父親的神，是¹亞伯拉罕的神，以撒的神，雅各的神。摩西遮住臉，因為怕看神。","n":[["1",["本章裏神的名的啟示，（6，14～16，18，）實際上就是神自己的啟示。藉著這樣的啟示，摩西得以認識那呼召並差遣他完成祂使命的一位。本節裏神聖的名稱，指明神是立約的神，（二24，）也含示祂是復活的神。（太二二31～32與註，徒三13。）不僅如此，神是三個人的神，（參15，）含示祂是三一神—父、子、靈。（太二八19。）見創十二1註1。"]]]},"出3:14":{"t":"神對摩西說，¹我是那我是；又說，你要對以色列人這樣說，那我是差我到你們這裏來。","n":[["1",["或，我將是我將是的；或，我將成為我將成為的。“我是”這神聖的名稱，指神是自有永有的一位，祂不倚靠自己以外的任何事物。（參約八24，28，58，與24註2。）作為“我是，”祂是包羅萬有的一位，是一切正面事物的實際，也是蒙祂呼召並差遣者所需的一切。"]]]},"出3:15":{"t":"神又對摩西說，你要對以色列人這樣說，¹耶和華你們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，差我到你們這裏來。這是我的名，直到永遠；這也是我的記念，直到萬代。","n":[["1",["見創二4註3。這是神頭一次以“耶和華”這名使祂的百姓認識祂自己。（六3。）見6註1。"]]]},"徒3:13":{"t":"¹亞伯拉罕、以撒、雅各的神，就是我們列祖的神，已經²榮耀了祂的僕人耶穌。這位耶穌，你們曾把祂交付彼拉多，彼拉多定意要釋放祂，你們竟在彼拉多面前棄絕了祂。","n":[["1",["就是三一神，耶和華偉大的我是。（出三14～15。）有些古卷作，亞伯拉罕的神，以撒的神，雅各的神。"]],["2",["藉著祂的復活，並在祂的升天裏榮耀了祂。（路二四26，來二9，弗一20～22，腓二9～11。）"]]]},"加6:16":{"t":"凡照這¹準則而²行的，願³平安憐憫臨到他們，就是臨到⁴神的以色列。","n":[["1",["指作為新造的準則，就是藉著信憑著靈活著，有三一神為生命和生活；不是藉著奉行規條來遵守律法。照這準則而行，就是憑著靈而行。（五25。）"]],["2",["見五25註2。"]],["3",["保羅在本書開頭題到恩典與平安，（一3，）但在結束時，先題平安，後題憐憫、恩典。（18。）平安是恩典所產生的光景。當我們住在這平安的光景裏，我們還需要繼續接受憐憫和恩典。"]],["4",["即真以色列人，（羅九6下，二28～29，腓三3，）包括在基督裏所有外邦和猶太的信徒，他們是亞伯拉罕的真子孫，（三7，29，）是信仰之家的人，（10，）也是新造的人，他們照“這準則”而行，彰顯神的形像，並施行神的權柄，由雅各變化為以色列，神的君王並得勝者（創三二27～28）所豫表。"]]]},"帖前1:1":{"t":"保羅、西拉和提摩太，寫信給在¹父神和主耶穌基督裏，²帖撒羅尼迦人的³召會：願恩典與平安歸與你們。","n":[["1",["本章啟示三一神為叫我們享受祂的救恩，在我們身上所作三一的工作─父揀選我們，（1，3～4，）子拯救我們，（10，）以及聖靈將三一神繁殖、分賜並傳輸到我們裏面。（5～6。）"]],["2",["帖撒羅尼迦是羅馬帝國的一城，在亞該亞省以北的馬其頓省內。使徒保羅在第二次盡職的旅程中，接受馬其頓人的呼召之後，與他的同工西拉先去腓立比，接著就到帖撒羅尼迦。（徒十六9～12，十七1～4。）使徒在那裏停留作工，時間很短，也許不滿一個月。（徒十七2。）"]],["3",["本書與後書都是寫給在帖撒羅尼迦的地方召會，就是由該城所有在基督裏的信徒所組成的。這樣的地方召會是屬於信徒的，也是在父神和主耶穌基督裏的。這指明這樣的地方召會是由父神所生，有祂的生命和性情，並在主耶穌基督一切的所是和所作裏，與祂有生機的聯結。因此，召會是屬於人的，（如帖撒羅尼迦人，）但在生機上是在神裏並在主裏的。這種在神的生命和性情裏生機的聯結，乃是信徒為著召會生活，過聖別生活不可少的基礎。這樣的生活乃是這兩封書信的主題。"]]]},"太28:19":{"t":"¹所以你們要去，²使萬民作我的門徒，³將他們浸⁴入⁵父、子、聖靈的⁶名裏，","n":[["1",["因為所有的權柄都已經賜給祂了，（18，）屬天的王就差遣門徒去，使萬民作祂的門徒。他們是帶著祂的權柄去的。"]],["2",["這是使外邦人成為國度的子民，好在這地上，就在今天，建立祂的國，就是召會。"]],["3",["施浸乃是帶悔改的人脫離老舊的光景，進入新的境地；這是藉著了結他們老舊的生命，並以基督的新生命重生他們，使他們成為國度的子民。施浸者約翰引薦的職事，開始於初步的水浸。如今，屬天的王既已完成祂在地上的職事，經過死而復活的過程，並成了賜生命的靈，祂就吩咐門徒，將作祂門徒的人，浸入三一神裏面。這浸有兩面：看得見的一面是藉著水，看不見的一面是藉著聖靈。（徒二38，41，十44～48。）前者是後者的彰顯和見證，後者是前者的實際。沒有看不見的靈浸，那看得見的水浸就是徒然的；沒有看得見的水浸，那看不見的靈浸就是抽象和無實行的。因此，兩面都不可缺。主憑這浸吩咐門徒以後不久，就將他們和全召會都浸在聖靈裏：（林前十二13：）猶太部分在五旬節那天，（徒一5，二4，）外邦部分在哥尼流家裏。（徒十一15～17。）以後，基於這事實，門徒將新悔改的人（徒二38）不僅浸入水裏，也浸入基督的死、（羅六3～4、）基督自己、（加三27、）三一神、（19、）以及基督的身體裏。（林前十二13。）水，象徵基督的死和埋葬，可以看作了結受浸者老舊歷史的墳墓。因為基督的死包含在基督裏面，又因為基督是三一神的具體化身，（西二9，）並且三一神最終與基督的身體是一；所以將初信的人浸入基督的死、基督自己、三一神、並基督的身體裏，乃是作一件事：在消極方面，了結他們老舊的生命；在積極方面，為著基督的身體，用新生命，就是三一神永遠的生命，重生他們。因此，這裏主所命定的浸，乃是為著諸天的國，把人從自己的生命浸出來，而浸入基督身體的生命裏。"]],["4",["“入”指明聯合，如在羅六3，加三27者。原文同字用於徒八16，十九5和林前一13、15。將人浸入三一神的名裏，就是將人帶進與三一神屬靈、奧祕的聯合裏。"]],["5",["馬太和約翰這兩卷書，為著神選民的有分和享受，比聖經其他各卷書更完全的啟示神聖的三一。約翰福音，特別在十四至十六章，為著我們生命的經歷，啟示了父、子、靈裏神格的奧祕；馬太福音，為著國度的構成，以父、子、靈三者的一個名，揭示了神聖三一的實際。在馬太福音頭一章，聖靈、（一18、）基督（子─一18）和神（父─一23），為著產生那人耶穌，（一21，）都在現場；祂這位耶和華救主，神與我們同在，乃是三一神的具體化身。在三章，馬太給我們一幅圖畫，子站在受浸的水中，天開了，那靈彷彿鴿子降在子身上，並且父從天上對子說話。（三16～17。）在十二章，子以人的身位憑著那靈趕鬼，帶進父神的國。（十二28。）在十六章，為著建造召會，就是國度的命脈，父將子啟示給門徒。（十六16～19。）在十七章，為著展示國度實現的小影，（十六28，）子變化形像，（十七2，）並有父喜悅的話（十七5）來印證。最終，在結束的一章，基督這末後的亞當，經過釘十字架的過程，進入復活的境地，成了賜生命的靈；以後祂回到門徒中間，在復活的氣氛和實際裏，吩咐他們去，將外邦人浸入神聖三一的名，就是祂的人位，也就是祂的實際裏，使他們成為國度的子民。以後，行傳和書信揭示：將人浸入父、子、靈的名裏，乃是將他們浸入基督的名裏；（徒八16，十九5；）而將人浸入基督的名裏，就是將他們浸入基督這人位裏；（加三27，羅六3；）因為基督是三一神的具體化身，並且成了賜生命的靈，（林前十五45，）是便利的，人隨時隨地都可以浸入祂裏面。根據馬太福音，這樣浸入父、子、靈的實際裏，乃是為著構成諸天的國。屬天的國不能用屬血肉的人（林前十五50）組成，像屬地的團體一樣，只能用一班浸入與三一神的聯合裏，且因作到他們裏面的三一神，而得建立並被建造的人來構成。"]],["6",["這裏，神聖三一的名是單數的。這名乃是那神聖者的總稱，等於祂的人位。將人浸入三一神的名裏，就是將人浸入三一神一切的所是裏。"]]]},"林後13:14":{"t":"願¹主耶穌基督的恩，神的愛，聖靈的交通，與你們眾人同在。","n":[["1",["主的恩就是主自己作我們的生命，給我們享受；（約一17與註1，林前十五10與註1；）神的愛就是神自己，（約壹四8，16，）作主恩的源頭；聖靈的交通就是聖靈自己，作了主恩同著神愛的傳輸，給我們有分。這不是三件分開的東西，乃是一件東西的三方面，正如主、神、聖靈不是三位分開的神，乃是“同一位不分開，也不能分開之神的三個實質。”（Philip　Schaff，薛夫。）實質，原文指在底部的支撐，就是在下面支撐之物，支撐的實質。（其單數字，用於來十一1，見來十一1註3。）父、子、靈是三一神支撐的實質，構成一位神格。","神的愛是源頭，因為神是元始；主的恩是神愛的流道，因為主是神的顯出；靈的交通乃是主的恩同著神愛的分賜，因為靈是主同著神的傳輸，給我們經歷並享受三一神─父、子、聖靈，連同祂們神聖的美德。這裏先說主的恩，因為本書是著重基督的恩。（一12，四15，六1，八1，9，九8，14，十二9。）這樣有愛、恩、交通三種美德的神聖屬性，以及這樣有父、子、靈三面神聖實質的三一神，乃是那些被岔開並受迷惑，卻得了安慰並恢復的哥林多信徒所需要的。因此，使徒在同一句裏，把這些神聖而寶貴的東西全用上了，以結束他這封可愛又可親的書信。","本節很強的證明，神格的三一，不是為著人在道理上領會系統的神學，乃是為著神在祂的三一裏，把自己分賜到所揀選並救贖的人裏面。在聖經中，神聖三一從未僅僅當作道理啟示人，總是在說到神與祂的造物，特別與祂所造的人，尤其是與祂所揀選並救贖之人的關係時，纔啟示或說到。在說到神創造的神聖啟示裏，所使用的頭一個稱呼，伊羅欣（Elohim），在希伯來文裏是多數的，（創一1，）含示這位為人創造天地的神乃是三一的。在說到神照著自己的形像、按著自己的樣式造人時，祂用複數代名詞“我們”和“我們的”指自己，以說到祂的三一，（創一26，）並且含示祂要與人成為一，並在祂的三一裏，藉著人彰顯祂自己。在創三22，十一7，賽六8，祂說到與人並與祂選民的關係時，也一再稱自己為“我們。”","為了救贖墮落的人，使祂仍有地位與人成為一，祂就在子裏，並藉著靈，（路一31～35，）成了肉體（約一1，14）來作人；又在子裏，（路二49，）並憑著靈，（路四1，太十二28，）在地上過為人的生活。在子地上職事的起頭，父用靈膏子，（太三16～17，路四18，）為要臨到人，並帶人歸祂。祂在肉體裏釘十字架，又復活成為賜生命的靈（林前十五45）以前，用明言向門徒揭示祂奧祕的三一，（約十四～十七，）說到子在父裏面，父在子裏面，（約十四9～11，）靈是子的化身，（約十四16～20，）這三者同時並存、互相內在，與信徒同住，給他們享受；（約十四23，十七21～23；）又說到凡父所有都是子的，凡子所得全由靈領受，而宣示給信徒。（約十六13～15。）這樣的三一是完全為著經過過程的神，將自己分賜到祂的信徒裏面，（約十四17，20，十五4～5，）使他們在三一神裏面成為一，且與三一神成為一。（約十七21～23。）","祂復活以後，囑咐門徒要使萬民作祂的門徒，將他們浸入父、子、聖靈的名裏；（太二八19；）就是將信徒帶進三一神裏，帶進與經過過程之神生機的聯結裏。這位神已經經過了成為肉體、為人生活、釘十字架，並且進入復活。基於這種生機的聯結，使徒就在本書的結語裏，以可稱頌的神聖三一祝福他們，藉著靈的交通，有分於子的恩與父的愛。在這神聖三一裏，父神憑著靈神的恩賜，藉著主（子神）的職事，在召會（基督的身體）的眾肢體裏，運行一切的事。（林前十二4～6。）","整本以弗所書的神聖啟示，說到召會這基督身體的產生、存在、長大、建造和爭戰，都是由神聖的經綸，就是三一神分賜到基督身體的肢體裏所組成的。一章揭示父神如何在永遠裏揀選並豫定這些肢體，（弗一4～5，）子神如何救贖他們，（弗一6～12，）靈神如何作憑質印他們，（弗一13～14，）藉此將祂自己分賜到祂的信徒裏面，以形成召會，就是基督的身體，那在萬有中充滿萬有者的豐滿。（弗一18～23。）二章給我們看見，在神聖的三一裏，所有猶太和外邦的信徒，都在靈神裏，藉著子神，得以進到父神面前。（弗二18。）這也指明，甚至在成為肉體、為人生活、釘十字架和復活，這一切的過程之後，三者仍是同時並存、互相內在的。在三章，使徒禱告父神，叫信徒藉著靈神，得以加強到裏面的人裏，使基督（子神）安家在他們心裏，也就是佔有他們全人，使他們被充滿成為神一切的豐滿。（弗三14～19。）這是在基督裏的信徒，經歷並有分於神聖三一的極點。四章描繪經過過程的神，就是靈、主、父，如何與基督的身體調和，（弗四4～6，）使所有的肢體經歷神聖的三一。五章勸勉信徒，要用靈神的歌讚美主（子神），並在我們主耶穌基督（子神）的名裏感謝父神。（弗五19～20。）這就是在神聖三一裏，讚美並感謝經過過程的神，使我們享受這位三一神。六章指示我們，要在主（子神）裏得著加力，穿戴父神全副的軍裝，並取用靈神的劍，從事屬靈的爭戰。（弗六10～11，17。）這就是信徒甚至在屬靈的爭戰中，也經歷並享受三一神。","使徒彼得在他的著作裏，說到父神的揀選、靈神的聖別、以及耶穌基督（子神）之血的救贖，（彼前一2，）也證實神的三一是為著信徒的享受。使徒約翰也加強神聖三一的啟示，使信徒有分於經過過程的三一神。在啟示錄中，他祝福各地的召會，願恩典與平安，從那今是昔是以後永是的（父神），和祂寶座前的七靈（靈神），並那忠信的見證人、死人中的首生者、為地上君王元首的耶穌基督（子神），歸與他們。（啟一4～5。）約翰給眾召會的這個祝福，也指明經過過程的三一神，不論是永遠之父的一切所是，七倍加強之靈的一切所能，以及受膏之子的一切所得並所達到的，全都給信徒享受，使他們成為金燈臺，作祂團體的見證。（啟一9，11，20。）","因此，聖經從創世記到啟示錄，對神格的三一所有的神聖啟示，顯然都不是為著神學上的研究，乃是為著叫我們領會，神在祂奧祕而奇妙的三一裏，如何將祂自己分賜到祂所揀選的人裏面，使我們這些蒙祂揀選、救贖的人，能像使徒對哥林多信徒的祝福所指明的，有分於、經歷、享受並得著經過過程的三一神，從今時直到永遠。阿們。"]]]},"出3:16":{"t":"你去招聚以色列的長老，對他們說，耶和華你們祖宗的神，就是亞伯拉罕、以撒、雅各的神，向我顯現，說，我實在眷顧了你們，也看見了你們在埃及受到甚麼樣的對待。","n":[]},"創12:1":{"t":"¹耶和華對亞伯蘭²說，你要離開本地、親族、³父家，往我所要指示你的地去。","n":[["1",["亞伯拉罕、以撒、雅各（連同約瑟—見三七2註1）的記載是重疊的。創世記描繪他們，不是三個分開的個人，乃是一個團體人的構成分子。這三個人的經歷，描繪一個完整的人對三一神經歷的不同方面。“亞伯拉罕的神，以撒的神，雅各的神”乃是耶和華，就是三一神—父、子、靈。（出三15，太二八19。）亞伯拉罕的經歷表徵對父神的經歷，祂呼召人、稱義人、裝備人，使人憑信而活，且活在與祂的交通裏。（十二1，十五6，十七～十八，十九29，二一1～13，二二1～18。）以撒的經歷表徵對子神的經歷，祂救贖人、（二二1～14、）祝福人，使人承受祂一切的豐富，過享受祂豐盛的生活，並活在平安中。（二五5，二六3～4，12～33。）雅各（連同約瑟）的經歷，表徵對父神的經歷，祂愛人並揀選人；（瑪一2，羅九10～13；）也表徵對靈神的經歷，祂使萬有效力，叫愛祂的人得益處，並且變化人，使人在神聖的生命裏成熟，能祝福所有的人，治理全地，並以子神作生命供應，滿足所有的人。（二七41，二八1～三五10，三七，三九～四九，羅八28～29。）"]],["2",["亞伯拉罕的父親死了以後，（十一32，）神第二次呼召亞伯拉罕。（見十一31註1。）神呼召亞伯拉罕時，就向他說話。除了神的顯現，神向亞伯拉罕說話，乃是激勵並加強他接受神呼召的另一因素。（徒七2～3，參羅一6，八30，林前一9。）參十一31註1一段。"]],["3",["神第二次向亞伯拉罕說話時，呼召亞伯拉罕不僅要離開本地、親族，也要離開父家。（參徒七3，見十一31註1。）這意思是，神只呼召亞伯拉罕和他的妻子撒萊。然而，亞伯拉罕離開哈蘭時，帶著他的姪兒羅得。（4～5。）這再次顯示，亞伯拉罕不彀絕對接受神的呼召。"]]]},"創15:6":{"t":"亞伯蘭¹信耶和華，耶和華就以此算為他的義。","n":[["1",["見羅四3註1。這裏亞伯拉罕信神，不是要得關乎自身生存的外面祝福；他信神能把一些東西作到他裏面，好從他這個人裏面產生一個後裔，以完成神的定旨。這種信對神是寶貴的，神也算這信為義。亞伯拉罕因著這樣的信就得稱義。（羅四1～5與1註1。）"]]]},"創19:29":{"t":"當神毀滅平原諸城的時候，祂記念亞伯拉罕，正在傾覆羅得所住之諸城的時候，就打發羅得從傾覆之中出來。","n":[]},"創21:1":{"t":"¹耶和華按先前的話²眷顧撒拉，便照祂所應許的給撒拉成就。","n":[["1",["1～13節，見加四22～31註。"]],["2",["見十八14註2。"]]]},"創21:2":{"t":"當亞伯拉罕年老的時候，撒拉懷了孕；到神和亞伯拉罕約定的日期，就給亞伯拉罕¹生了一個兒子。","n":[["1",["神在祂經綸中的目標，是要產生基督為後裔，以完成祂永遠的定旨。（三15，十二7，二二18，加三16，撒下七12～14上。）以撒的出生，表徵基督這應許的後裔是在神豫定的時候，藉著神恩典的工作所產生的。這事的首要條件，乃是我們天然的生命和力量，必須藉著屬靈的割禮被了結。（十七10～16。）"]]]},"創21:3":{"t":"亞伯拉罕為撒拉給他生的兒子起名叫¹以撒。","n":[["1",["意，他喜笑。"]]]},"創21:4":{"t":"以撒生下來¹第八日，亞伯拉罕照著神所吩咐的，給他的兒子以撒²行了割禮。","n":[["1",["見十七12註1。"]],["2",["見十七10註1。"]]]},"創21:5":{"t":"他兒子以撒出生的時候，亞伯拉罕年一百歲。","n":[]},"創21:6":{"t":"撒拉說，神使我歡笑，凡聽見的必與我一同歡笑；","n":[]},"創21:7":{"t":"又說，誰能豫先對亞伯拉罕說，撒拉要乳養兒女呢？然而在他年老的時候，我竟給他生了一個兒子。","n":[]},"創21:8":{"t":"孩子¹漸長，就斷了奶。以撒斷奶的日子，亞伯拉罕設擺盛大的筵席。","n":[["1",["以撒的長大，表徵基督生在新約信徒裏面之後的長大。基督在我們裏面需要長大，好使基督成形在我們裏面。（加四19與註4。）"]]]},"創21:9":{"t":"當時，撒拉看見埃及人夏甲給亞伯拉罕所生的兒子¹戲笑，","n":[["1",["見加四29註2，三17註2。"]]]},"創21:10":{"t":"就對亞伯拉罕說，你把這使女和她兒子¹趕出去，因為這使女的兒子不可與我的兒子以撒，一同承受產業。","n":[["1",["把夏甲和以實瑪利趕出去，表徵把律法和肉體努力的結果趕出去，這些在神的經綸中毫無地位。（見加四24註5，30註1。）"]]]},"創21:11":{"t":"亞伯拉罕因他兒子的緣故甚是愁煩。","n":[]},"創21:12":{"t":"神對亞伯拉罕說，你不必為這童子和你的使女愁煩。凡撒拉對你說的話，你都要聽；因為¹從以撒生的，纔要稱為你的後裔。","n":[["1",["直譯，在以撒裏的。"]]]},"創21:13":{"t":"至於使女的兒子，我也必使他成為一國，因為他是你的後裔。","n":[]},"創22:1":{"t":"這些事以後，神試驗亞伯拉罕，對他說，亞伯拉罕。他說，我在這裏。","n":[]},"創22:2":{"t":"神說，你帶著你的兒子，就是你¹獨生的兒子，你所愛的以撒，往²摩利亞地去，在我所要指示你的山上，把他³獻為⁴燔祭。","n":[["1",["亞伯拉罕將他獨生的愛子以撒獻在祭壇上，乃是一幅生動的圖畫，說出父神將祂的獨生愛子耶穌基督，當作祭物獻在十字架上。在這幅圖畫中，以撒很詳細的豫表基督。以撒是亞伯拉罕的獨生子，（2，12，16，）豫表基督是神的獨生子。（約三16。）以撒是亞伯拉罕的愛子，（2，）而基督是父的愛子，是父所喜悅的。（太三17。）以撒接受他父親的意願，（6，）基督也揀選祂父的意思。（太二六39。）以撒順從至死；（9～10；）照樣，基督也順從至死。（腓二8。）以撒背著燔祭的柴，走到摩利亞山頂；（6；）同樣的，基督也背著祂的十字架，走到各各他。（約十九17。）以撒在摩利亞山當作燔祭獻給神；基督也在同一座山被獻給神，（見可十1註1，）應驗了燔祭的豫表。以撒在祭壇上“被殺，”在第三日，也就是在復活裏，歸還給亞伯拉罕；（4，10～13，來十一19；）同樣，基督也被釘在十字架上，並且第三天復活了。（林前十五4。）以撒在復活裏得著繁增，（17，）基督也在祂的復活裏得著繁增。（約十二24，彼前一3。）以撒是亞伯拉罕的後裔，使萬國得福；（18；）照樣，基督是亞伯拉罕惟一的後裔，亞伯拉罕的福在祂裏面臨到了萬國。（加三8，14，16。）"]],["2",["意，耶和華的異象。摩利亞山是神所揀選的地方，至終成了錫安山，就是建殿的地點，（參代下三1，）也是美地的中心。亞伯拉罕是第一個帶著燔祭在錫安山上敬拜神的人。後來，神吩咐亞伯拉罕的子孫，就是以色列人，要一年三次到這地方敬拜神，向祂獻上他們的燔祭。（申十六16，詩一三二13。）今天，新約的信徒是亞伯拉罕屬靈的子孫，乃是在錫安山上。（來十二22～23。）至終，我們眾人要與亞伯拉罕一同在永遠的錫安山，新耶路撒冷，敬拜神。（啟二一22。）"]],["3",["以撒豫表基督是應許的後裔，（加三16，）由神賜給了亞伯拉罕。神在這裏要亞伯拉罕把神所賜給他的，交還給神。這對亞伯拉罕必然是個試驗。（1，來十一17。）這說出在神的經綸裏一個基本的原則：凡神所賜給我們的，甚至是祂作到我們裏面並藉著我們作的，至終都必須獻回給祂，好使我們過信心的生活，不抓住任何事物，甚至是神所賜的事物，而單單倚靠祂。以撒被獻上之後，又在復活裏歸還亞伯拉罕，並且成為祝福。（12～13，16，18，來十一19。）照樣，我們向神獻上從祂所接受的之後，祂也會在復活裏將其歸還我們，這要成為祝福，以完成神的定旨。見羅四17與註。"]],["4",["見利一3註1。"]]]},"創22:3":{"t":"亞伯拉罕¹清早起來，備上驢，帶著兩個僕人和他兒子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去。","n":[["1",["亞伯拉罕立即順從神，因為他相信那使人復活的神。（5，來十一17～19，雅二21～22，羅四17與註1。）"]]]},"創22:4":{"t":"到了第三日，亞伯拉罕舉目遠遠的看見那地方。","n":[]},"創22:5":{"t":"亞伯拉罕對他的僕人說，你們和驢在這裏等著，我與童子往那裏去敬拜，然後回到你們這裏來。","n":[]},"創22:6":{"t":"亞伯拉罕把燔祭的柴放在他兒子以撒身上，自己手裏拿著火與刀；於是二人同行。","n":[]},"創22:7":{"t":"以撒對他父親亞伯拉罕說，父親哪。亞伯拉罕說，我兒，我在這裏。以撒說，請看，火與柴都有了，但燔祭的羊羔在那裏？","n":[]},"創22:8":{"t":"亞伯拉罕說，我兒，神必自己豫備作燔祭的羊羔。於是二人同行。","n":[]},"創22:9":{"t":"他們到了神所指示的地方，亞伯拉罕在那裏築壇，把柴擺好，就捆綁他的兒子以撒，放在壇的柴上。","n":[]},"創22:10":{"t":"亞伯拉罕伸手拿刀，要殺他的兒子。","n":[]},"創22:11":{"t":"¹耶和華的使者從天上呼叫他說，亞伯拉罕！亞伯拉罕！他說，我在這裏。","n":[["1",["見十六7註1。"]]]},"創22:12":{"t":"使者說，你不可在這童子身上下手，一點不可害他。現在我知道你是敬畏神的了，因為你沒有將你的兒子，就是你獨生的兒子，留下不給我。","n":[]},"創22:13":{"t":"亞伯拉罕舉目觀看，不料，在他後面有一隻¹公羊，兩²角扣在樹叢中，亞伯拉罕就去取了那隻公羊來，獻為燔祭，代替他的兒子。","n":[["1",["這裏的公羊頂替亞伯拉罕的兒子被殺，豫表基督是神的羔羊，（約一29，）由神所豫備，頂替神所揀選的人，就是那些要承受神應許之產業的人，作為燔祭，（2，）使神得著滿足。"]],["2",["角表徵爭戰的能力，樹叢表徵人性。基督作為神的羔羊，自願讓祂的“角”被祂的人性扣住，使祂可以獻給神作我們的代替。（彼前三18。）參太二六50～54。"]]]},"創22:14":{"t":"亞伯拉罕給那地方起名叫¹耶和華以勒，直到今日人還說，在耶和華的山上²必有豫備。","n":[["1",["意，耶和華必豫備，或耶和華必看見。"]],["2",["或，祂必被看見。"]]]},"創22:15":{"t":"耶和華的使者第二次從天上呼叫亞伯拉罕，說，","n":[]},"創22:16":{"t":"耶和華宣示說，你既行了這事，不留下你的兒子，就是你獨生的兒子，我指著自己起誓：","n":[]},"創22:17":{"t":"論福，我必賜福給你；論繁增，我必使你的後裔繁增，如同¹天上的星，¹海邊的沙；你的後裔必得著仇敵的城門；","n":[["1",["天上的星表徵亞伯拉罕屬天的子孫，就是信心的子孫，（加三7，29，）而海邊的沙和地上的塵沙（十三16）表徵亞伯拉罕屬地的子孫，就是肉身的子孫。海邊的沙就是沿海的塵沙。這沙與海分開，也被海的波浪所沖刷。海表徵外邦列國。（賽五七20，啟十七15。）歷世紀以來，被神用來懲治以色列的外邦列國，（見珥一4與註，）就像從地中海來的波浪，他們入侵的軍隊一波一波的上來沖刷以色列這塵沙，所產生的遺民就像海邊的沙。（亞十二～十四，羅九27～29。）新耶路撒冷是由亞伯拉罕的這兩班子孫組成。（啟二一12，14。）因此，新耶路撒冷將是亞伯拉罕後裔的終極總結。以撒被亞伯拉罕獻給神，就繁增成為新耶路撒冷；這乃是神對亞伯拉罕的祝福。"]]]},"創22:18":{"t":"並且地上萬國，都必因你的¹後裔得福；因為你聽從了我的話。","n":[["1",["按照加三14，神賜給亞伯拉罕的應許，乃是神自己要來成為亞伯拉罕的後裔，這後裔要藉著成為包羅萬有的靈給人類接受，（林前十五45，）而成為賜給萬國的福。神賜福給亞伯拉罕，至終產生基督這獨一的後裔，地上萬國都要因祂得福。（徒三25～26，加三16。）所有在基督裏的信徒乃是團體基督的肢體，（林前十二12，）都包含在這後裔之內，成為承受神應許之福的後嗣。（加三7，29與註1。）","在本章，基督以三種方式啟示出來：祂是耶和華的使者，（11～12，15～18，）是公羊，（13，）也是亞伯拉罕的後裔。（18。）耶和華的使者，就是基督，豫備了豫表基督的公羊，最終產生了後裔，這後裔也是基督。"]]]},"創25:5":{"t":"亞伯拉罕將¹一切所有的都給了²以撒。","n":[["1",["神認為以撒是亞伯拉罕惟一的兒子，是承受神賜給亞伯拉罕之應許，以完成神定旨的獨一後裔。（二二2，12，16，18，十七19，二六3～4。）因此，以撒豫表基督是父的獨生子，（約一14，三16，）父將祂一切所有的都給了子。（約三35，十六15上。）以撒成為他父親之豐富的繼承者，不是憑著他的努力，乃是憑著恩典。"]],["2",["在創世記裏，亞伯拉罕（十二1～二五18）和以撒（二一1～8，二二1～24，二四1～67）的記載彼此重疊。亞伯拉罕的生活啟示，我們若要享受神的恩典，對神的豐富有完滿的享受，就必須忍受損失，天然的生命也必須受割禮，被割除。以撒的生活啟示，我們了結天然的生命而受苦，是為著享受神的恩典。以撒一生沒有作甚麼，只是享受神豐富的祝福，（11，二六24下，）這祝福乃是指向新約的恩典。（見11註1。）以撒在恩典裏出生，（二一1～3，加四23，）在恩典裏長大，（二一8，）也成為恩典的後嗣。（5。）在新約中，所有蒙召的信徒都是恩典的後嗣，命定要享受神絕對且無條件的恩典。（弗一3，6～8，二7。）"]]]},"創26:3":{"t":"你寄居在這地，我必與你同在，¹賜福給你，因為我要將這些地都賜給你和你的後裔；我必堅定我向你父亞伯拉罕所起的誓。","n":[["1",["以撒不但承受他父親一切所有的，也承受神給他父親關於美地和獨一後裔的應許；這後裔就是基督，地上萬國都要因祂得福。（加三14，16。）這應許實際上是為著完成神的定旨，使神在地上能得著一個國度，在其中藉著一個團體人彰顯祂自己。見十二2註2與十五3註1。"]]]},"創26:4":{"t":"我要使你的後裔繁增，如同天上的星那樣多，又要將這些地都賜給你的後裔；並且地上萬國必因你的後裔得福；","n":[]},"創26:12":{"t":"以撒在那地撒種，那一年有百倍的收成。耶和華賜福給他，","n":[]},"創26:13":{"t":"他就昌大，越發昌盛，成了巨富。","n":[]},"創26:14":{"t":"他有羊群、牛群，又有許多¹僕婢，非利士人就嫉妒他。","n":[["1",["或，家眷。"]]]},"創26:15":{"t":"當他父親亞伯拉罕在世的日子，他父親的僕人所挖的井，非利士人全都塞住，填滿了土。","n":[]},"創26:16":{"t":"亞比米勒對以撒說，你離開我們去罷，因為你比我們強盛得多。","n":[]},"創26:17":{"t":"以撒就離開那裏，在基拉耳谷支搭帳棚，住在那裏。","n":[]},"創26:18":{"t":"當他父親亞伯拉罕在世之日所挖的水井，因非利士人在亞伯拉罕死後塞住了，以撒就重新挖出來，仍照他父親所起的，叫那些井的名字。","n":[]},"創26:19":{"t":"以撒的僕人在谷中挖掘，得了一口¹活水井。","n":[["1",["見民二一16註1。"]]]},"創26:20":{"t":"基拉耳的牧人與以撒的牧人爭鬧，說，這水是我們的。以撒就給那井起名叫¹埃色，因為他們和他相爭。","n":[["1",["意，相爭。"]]]},"創26:21":{"t":"以撒的僕人又挖了一口井，他們又為這井爭鬧，因此以撒給這井起名叫¹西提拿。","n":[["1",["意，為敵。"]]]},"創26:22":{"t":"以撒離開那裏，又挖了一口井，他們不為這井爭鬧了，他就給那井起名叫¹利河伯。他說，耶和華現在給我們寬闊之地，我們必在這地繁衍。","n":[["1",["意，寬闊之地，寬闊之路。"]]]},"創26:23":{"t":"以撒從那裏上別是巴去。","n":[]},"創26:24":{"t":"當夜耶和華向他¹顯現，說，我是你父親亞伯拉罕的神，不要懼怕，因為我與你同在，必賜福給你，並要為我僕人亞伯拉罕的緣故，使你的後裔繁增。","n":[["1",["雖然以撒享受神無條件的恩典，在他所到之處都得著享受和滿足（由井所表徵—二五11，二六15～22，）別是巴卻是他經歷神的顯現、接受神的應許、築壇、呼求耶和華的名、並且支搭帳棚作見證的惟一地方。神所呼召的人不論他們的立場如何，都被命定要享受神的恩典，然而這享受不能稱義他們的立場。我們若渴望得著神的顯現、承受祂的應許、並過一種完成神永遠定旨的生活，就必須來到神所揀選獨一的地方，並且留在那裏。這獨一的地方由別是巴所表徵，有井作生命的供應，並有垂絲柳樹作生命豐富之湧流的彰顯。（二一25，33。）見申十二5註1與17註1。"]]]},"創26:25":{"t":"以撒就在那裏築了一座壇，呼求耶和華的名，並且支搭帳棚；他的僕人便在那裏挖了一口井。","n":[]},"創26:26":{"t":"亞比米勒同他的¹謀士亞戶撒、和他的軍長非各，從基拉耳來見以撒。","n":[["1",["或，朋友。"]]]},"創26:27":{"t":"以撒對他們說，你們既然恨我，打發我走了，為甚麼到我這裏來？","n":[]},"創26:28":{"t":"他們說，我們明明看見耶和華與你同在；所以我們說，我們不如兩下彼此起誓，讓我們與你立約，","n":[]},"創26:29":{"t":"使你不侵害我們，正如我們未曾觸犯你，一味的善待你，並且打發你平平安安的走了。你是蒙耶和華賜福的了。","n":[]},"創26:30":{"t":"以撒就為他們設擺筵席，他們便喫了喝了。","n":[]},"創26:31":{"t":"他們清早起來彼此起誓。以撒打發他們走，他們就平平安安的離開他走了。","n":[]},"創26:32":{"t":"那一天，以撒的僕人來，將挖井的事告訴他說，我們找到水了。","n":[]},"創26:33":{"t":"他就給那井起名叫¹示巴；因此那城名叫²別是巴，直到今日。","n":[["1",["意，盟誓。"]],["2",["意，盟誓的井。"]]]},"瑪1:2":{"t":"耶和華說，我愛了你們；你們卻說，你在何事上愛了我們呢？耶和華說，以掃不是雅各的哥哥麼？我卻愛雅各，","n":[]},"羅9:10":{"t":"不但如此，還有利百加，既從一個人，就是從我們的祖宗以撒懷了孕，","n":[]},"羅9:11":{"t":"雙子還沒有生下來，善惡也沒有作出來，（只因要堅定神揀選人的¹旨意，不是本於行為，乃是本於那呼召人的，）","n":[["1",["見八28註5。"]]]},"羅9:12":{"t":"神就對利百加說，“將來大的要¹服事小的。”","n":[["1",["直譯，作奴僕服事。"]]]},"羅9:13":{"t":"正如經上所記：“雅各是我所愛的，以掃是我所恨的。”","n":[]},"創27:41":{"t":"以掃因他父親給雅各祝的福，就怨恨雅各，心裏說，為我父親居喪的日子近了，到那時候，我要殺我的弟弟雅各。","n":[]},"羅8:28":{"t":"還有，我們曉得¹萬有都互相²效力，叫³愛神的人得⁴益處，就是按祂⁵旨意被召的人。","n":[["1",["包括萬人、萬事與萬物。"]],["2",["父神答應那靈為我們的代求，安排我們的環境，使萬有都互相效力，叫我們得益處。"]],["3",["愛神使我們體貼神的心意，並且願意與祂配合。神作工需要我們配合，而我們的配合，證實我們是按神旨意被召的人。"]],["4",["這裏的“益處，”照上下文看，並非指物質的人事物，乃指更多得著基督作到我們裏面，使我們有新陳代謝的變化，至終模成祂這神兒子的形像，（29，）也就是將我們帶進完滿的兒子名分裏。"]],["5",["含目的意，指神計畫中有目的的定意。這旨意，就是要產生祂長子的許多弟兄。"]]]},"羅8:29":{"t":"因為神所¹豫知的人，祂也²豫定他們³模成神兒子的形像，使祂兒子在⁴許多弟兄中作⁵長子。","n":[["1",["29～30節描述神工作的每一步，原文所用的動詞，都是過去式，指明在神看，祂一切的工作都已經作成。神是永遠的神，在祂並沒有時間的因素。"]],["2",["神豫定我們，目的不是僅僅要我們聖別、屬靈、得勝，乃是要我們模成祂兒子的形像。這是我們的定命，是神在已過的永遠所決定的。"]],["3",["模成是變化的最終結果，包括我們裏面素質和性情的變化，和我們外面樣式的變化，好使我們與神而人者的基督，在榮耀裏的形像相配。祂是原型，我們是大量產品。我們這些產品裏外兩面的變化，都是生命之靈的律（2）在我們裏面運行的結果。"]],["4",["神的豫知、豫定和呼召，是要為祂的長子豫備並產生許多弟兄，（見約二十17註2，）叫他們一面和祂的長子同作神的眾子，有神的生命和性情，叫神得著彰顯；一面作祂長子的眾肢體，構成祂長子的身體，作神在祂長子裏面的團體彰顯，就是神長子的豐滿，也是神在祂長子裏的豐滿。（弗一23，三19。）"]],["5",["基督從永遠就是神的獨生子，（約一18，）到神差祂到世上來時，仍是神的獨生子。（約壹四9，約一14，三16。）等祂經過死進入復活，將祂的人性提高到祂的神性裏，祂就帶著祂死而復活的人性，在祂的神性裏，在復活中生為神的長子；（徒十三33；）同時也在祂的復活裏，帶著所有信祂的人一同復活，（彼前一3，）和祂一同生為神的眾子，使他們成為祂的許多弟兄，好構成祂的身體，作神在祂裏面的團體彰顯。","基督是神的獨生子，有神性而無人性，乃是與神同樣的自有永有。祂成為神的長子，兼有神性和人性，乃是從祂的復活開始。祂這長子，是神產生眾子的根據、標本、元素和憑藉；所產生的眾子，就是信入祂，與祂聯結為一的眾信徒，在生命和性情上完全與祂相同，也像祂一樣兼有人性和神性，作祂的擴增和彰顯，以彰顯那永遠的三一神，直到永永遠遠。今日的召會，是這彰顯的雛形，（弗一23，）永世裏的新耶路撒冷，就成為這彰顯的終極表現。（啟二一11。）本書啟示神將罪人作成祂的兒子，就是為著這一彰顯，（十二5，）也是指向這一彰顯的終極表現。（弗三19。）"]]]},"羅4:17":{"t":"亞伯拉罕在他所¹信那²叫死人復活，又³稱無為有的神面前，是我們眾人的⁴父，如經上所記：“我已經立你作多國的父。”","n":[["1",["亞伯拉罕在兩件事上信神：(一)以撒的出生，關係到神是“稱無為有”的神；(二)獻上又得回以撒，關係到神是“叫死人復活”的神。亞伯拉罕乃是信這樣一位神，並將祂應用在他的處境中。因為亞伯拉罕有這樣的信，他就信神所說，以撒要出生這似乎不可能的話，並且他也立刻順從神的命令，將以撒獻上，信神必叫他從死人中復活。（來十一17～19。）"]],["2",["這是神復活的大能。這大能使我們能消除死亡，勝過屬死的事物。亞伯拉罕照神的吩咐獻上以撒，經歷了這復活的大能。"]],["3",["這是神創造的大能。祂是創造的神，不需要使用材料作出甚麼；祂只要說話，就能從無創造出有。祂“說有，就有。”（詩三三9。）"]],["4",["亞伯拉罕是所有蒙神呼召之人的父，是神所揀選新族類的頭一位。我們原是生在墮落的亞當族類中，如今蒙了重生，進入蒙召的亞伯拉罕族類中。凡像亞伯拉罕以信為本的人，都是這新族類中的人，都是亞伯拉罕的子孫。（加三7。）"]]]},"創17:17":{"t":"亞伯拉罕就面伏於地笑了，心裏說，一百歲的人還能得孩子麼？撒拉已經九十歲了，還能生孩子麼？","n":[]},"創17:19":{"t":"神說，不然，你妻子撒拉必給你生一個兒子，你要給他起名叫¹以撒。我要²與他堅定所立的約，作他後裔永遠的約。","n":[["1",["意，他喜笑。"]],["2",["以實瑪利是肉體所產生的後裔，為神所棄絕。（二一10。）惟有以撒是憑神恩典所產生的後裔，是為著完成神定旨所立定的。（21，二一12，羅九7～9。）"]]]},"創17:21":{"t":"到明年這¹約定的日期，撒拉必給你生以撒，我要與他堅定所立的約。","n":[["1",["見十八14註2。"]]]},"弗4:6":{"t":"一位¹眾人的²神與父，就是那³超越眾人，貫徹眾人，也在眾人之內的。","n":[["1",["指所有的信徒。"]],["2",["神是萬物的起源者，父是為著基督身體的生命源頭。"]],["3",["這裏甚至含示神聖三一的思想。超越眾人，主要的是說到父；貫徹眾人，主要的是說到子；在眾人之內，主要的是說到那靈。三一神藉著成為那靈臨到我們，至終進到我們眾人裏面。基督身體的一乃是由神格的三一所構成：作源頭和起源的父是起源者，作主和頭的子是完成者，成為賜生命之靈的那靈是執行者。這位三一神在我們生活中成為我們的實際和經歷，就是我們一的基礎和元素。"]]]},"太15:13":{"t":"祂就回答說，¹凡不是我天父所栽種的植物，必要連根拔出來。","n":[["1",["屬天的王這話指明假冒為善的法利賽人不是天父栽種的。他們因棄絕屬天的王，就從諸天的國連根拔出來。"]]]},"羅11:36":{"t":"因為萬有都是本於祂、藉著祂、並歸於祂；願榮耀歸與祂，直到永遠。阿們。","n":[]},"林前8:6":{"t":"在¹我們卻只有²一位神，就是³父，萬物都⁴本於祂，我們也⁴歸於祂；並有⁵一位主，就是⁶耶穌基督，萬物都是⁴藉著祂有的，我們也是⁴藉著祂有的。","n":[["1",["指在基督裏的信徒，基督徒。"]],["2",["與5節“許多的神”相對。我們的神是獨一的。"]],["3",["我們神的一種稱呼，祂是萬物的源頭。這種稱呼使我們的神與許多假神絕對有別。"]],["4",["父是萬物的源頭，因此萬物是“本於祂；”但只有我們信徒要轉向祂，因此我們是“歸於祂。”同樣，父所造的萬物，是以耶穌基督為憑藉而有的；而我們信徒是以主的重生為憑藉，使我們轉向而歸於父。因此，我們和萬物都是“藉著祂。”"]],["5",["與5節“許多的主”相對。我們的主也是獨一的。"]],["6",["我們的主神聖和屬人的名稱，這使祂與許多的主有別。我們的神，就是父，是萬物獨一的源頭；我們的主，就是耶穌基督，是獨一的憑藉，萬物都是藉著祂成的。"]]]},"弗3:14":{"t":"因這緣故，我向¹父屈膝，","n":[["1",["不是神，乃是父。這裏的“父”意義較廣，不僅指信仰之家人的父，（加六10，）也指在諸天裏以及在地上各家族的父。（15。）父是源頭，不僅是我們重生信徒的源頭，也是神所造之人類、（路三38、）神所造之以色列人、（賽六三16，六四8、）以及神所造之天使（伯一6）的源頭。猶太人的觀念，以為神只是他們的父。所以使徒照著他的啟示，向在諸天裏以及在地上各家族的父禱告；不像猶太人照著他們的觀念，只向以色列人的父禱告。"]]]},"弗3:15":{"t":"在諸天裏以及在地上的各¹家族，都是從祂²得名，","n":[["1",["原文意，父的繁生；含示家族。"]],["2",["神是在諸天裏之天使家族，以及在地上之人類各家族的源頭，所以各家族都從祂得名，正如製造者為產品命名，父親為兒女命名一樣。"]]]},"弗3:16":{"t":"願祂照著¹祂榮耀的豐富，藉著祂的²靈，用³大能⁴使你們得以⁵加強⁶到裏面的人裏，","n":[["1",["榮耀是神的彰顯。在諸天裏以及在地上的各家族，或多或少都彰顯了神；由於他們對神的彰顯，就有“祂榮耀的豐富。”使徒禱告，願外邦信徒照著神榮耀的豐富，經歷神的豐滿，使神因此而得著彰顯。"]],["2",["父藉著祂內住的靈，從我們裏面加強我們。這內住的靈從我們重生起，就在我們裏面，與我們同在。"]],["3",["即一19～22所說，使基督從死人中復活，叫祂在諸天界裏坐在神的右邊，又將萬有服在祂的腳下，並使祂向著召會作萬有之頭的大能。這大能運行在我們裏面；（20；）神是用這樣的大能，為著召會加強我們。"]],["4",["在16～19節使徒的禱告裏，“使”字用了四次：求父使我們得加強；結果使基督安家在我們心裏；結果使我們滿有力量，能以領略基督的量度─闊、長、高、深，並認識基督那超越知識的愛；結果使我們被充滿，成為神一切的豐滿。這些步驟，是我們享受基督的豐富，藉此構成基督的身體新陳代謝的過程。"]],["5",["使徒在一15～23的禱告，是要聖徒得著召會的啟示。他在14～21節這裏的禱告，是要聖徒為著召會經歷基督。這需要我們得以加強到我們的靈裏。"]],["6",["裏面的人，是我們重生的靈，有神的生命為其生命。為了經歷基督，使我們成為神一切的豐滿，我們需要得以加強到我們這裏面的人裏。這含示我們需要藉著聖靈得以加強到我們的靈裏。"]]]},"創24:36":{"t":"我主人的妻子撒拉年老的時候，給我主人生了一個兒子；我主人也將一切所有的都給了這個兒子。","n":[]},"林前4:7":{"t":"¹使你與人不同的是誰？你有甚麼不是領受的？若真是領受的，你為甚麼誇口，彷彿不是領受的？","n":[["1",["使我們與人不同的乃是神。我們所有的，都是從神領受的。因此，一切的榮耀都當歸與神，我們該憑神誇口，不該憑自己，也不該憑神所使用的任何僕人，如保羅或亞波羅誇口。"]]]},"約16:15":{"t":"凡父所有的，都是我的，所以我說，祂從我有所領受而要宣示與你們。","n":[]},"約17:10":{"t":"凡是我的都是你的，你的也是我的，並且我已經在他們¹身上²得了榮耀。","n":[["1",["直譯，裏面。在他們裏面，或，在他們身上，意即因著他們。"]],["2",["門徒彰顯了主，所以主在他們身上得了榮耀。"]]]},"約5:19":{"t":"耶穌對他們說，我實實在在的告訴你們，子從自己不能作甚麼，惟有看見父所作的，子纔能作；¹父所作的事，子也照樣作。","n":[["1",["直譯，那一位。"]]]},"約5:30":{"t":"我從自己不能作甚麼；我怎麼聽見，就怎麼審判；我的審判也是公平的，因為我不尋求自己的意思，只尋求那差我來者的意思。","n":[]},"林前11:12":{"t":"因為女人怎樣¹出於男人，照樣，男人也是¹藉著女人，但萬有都是出於神。","n":[["1",["男人是女人存在的源頭，因此女人是出於男人。女人又是男人出生的憑藉，因此男人是藉著女人。（創二21～23。）"]]]},"創31:38":{"t":"我同你在一起這二十年，你的母綿羊、母山羊沒有掉過胎；你群中的公羊，我沒有喫過；","n":[]},"創31:39":{"t":"被野獸撕裂的，我沒有帶來給你，是我自己賠上。無論是白日，是黑夜，被偷去的，你都向我索要。","n":[]},"創31:40":{"t":"我白日受乾熱銷磨，黑夜受寒霜侵蝕，不得合眼睡著，我常是這樣。","n":[]},"創31:41":{"t":"我這二十年在你家裏，為你的兩個女兒服事你十四年，為你的羊群服事你六年，你十次改了我的工價。","n":[]},"加5:22":{"t":"但¹那靈的果子，就是愛、喜樂、和平、恆忍、恩慈、良善、信實、","n":[["1",["肉體所作的，是沒有生命的行為；（19；）那靈所產生的，是滿了生命的果子。那靈的果子，就是在我們裏面作生命之靈不同的表現，這裏只列九項為例。這果子還有許多項的表現，就如卑微、（弗四2，腓二3、）憐恤、（腓二1、）敬虔、（彼後一6、）公義、（羅十四17，弗五9、）聖別、（弗一4，西一22、）清潔，（太五8，）以及別的美德。弗四2，西三12除了題到這裏所列的溫柔以外，也以卑微為美德。羅十四17的公義、和平並喜樂，都是今天神國的各面；但這裏只列和平與喜樂，沒有列公義。彼後一5～7把敬虔和忍耐，與節制和愛一同視為屬靈生長的特徵，但這裏沒有列敬虔和忍耐。太五5～9把公義、憐憫和清潔，與溫柔、和平一同算為今天國度實際的條件；然而前三項美德，沒有列在這裏。","肉體怎樣是老亞當的表現，那靈照樣是基督的實化。實際上，基督乃是作那靈而活出來的。這裏所舉那靈的果子，乃是基督的特徵。"]]]},"加5:23":{"t":"溫柔、節制；這樣的事，沒有律法反對。","n":[]},"來12:11":{"t":"一切的管教，當時固然不覺得喜樂，反覺得愁苦；後來卻給那藉此受過操練的人，結出¹平安的義果。","n":[["1",["平安乃是義的果子。（賽三二17。）聖別是內裏的性情，公義是外面的行為。神的管教不僅幫助信徒有分於祂的聖別，也使他們與神與人都是對的，叫他們在這種義的光景裏，享受平安作甘甜的果子，就是平安的義果。"]]]},"創47:9":{"t":"雅各對法老說，我寄居在世的年日是一百三十歲；我平生的年日又少又苦，不及我列祖在世寄居的年日。","n":[]},"創48:15":{"t":"他就給約瑟祝福說，願我祖亞伯拉罕和我父以撒行事為人都在祂面前的¹神，就是一生牧養我直到今日的神，","n":[["1",["在15～16節，雅各三重的題到神，乃是指三一神。亞伯拉罕和以撒行事為人都在祂面前的神，乃是父；牧養雅各一生的神，乃是靈；那救贖他脫離一切患難的使者，乃是子。這就是雅各經歷中的三一神。見林後十三14註1。"]]]},"啟1:4":{"t":"約翰寫信給在¹亞西亞的²七個召會：願恩典與平安，從³那今是昔是以後⁴永是的，從祂寶座前的⁵七靈，","n":[["1",["亞西亞是古羅馬帝國的一省，那裏有11節所題的七個城。七個召會不是都在一個城裏，乃是分別在那七個城裏。本書不是論到一個宇宙召會，乃是論到在許多城裏的眾地方召會。太十六18首先啟示召會是宇宙的，太十八17接著啟示召會是地方的。在行傳裏，召會是以地方召會的作法實行的，如在耶路撒冷的召會、（徒八1、）在安提阿的召會、（徒十三1、）在以弗所的召會、（徒二十17、）在敘利亞省和基利家省的眾召會。（徒十五41。）所有的書信，除了幾封是寫給個人，其餘的都是寫給地方召會，沒有一封是寫給宇宙召會的。沒有地方召會，就沒有宇宙召會的實行和現實；宇宙召會乃實化於眾地方召會。對召會宇宙一面的認識，必須完成於對召會地方一面的認識。我們認識並實行地方召會，乃是一大進步。啟示錄說到召會，是在進步的階段。我們要明白本書，必須從了解宇宙召會，進步到認識並實行地方召會，因為本書是寫給地方召會的。惟有在地方召會中的人，纔能在對的地位上，從對的角度和正確的觀點，看本書的異象。","三一神顯於基督；（約一14，提前三16，西二9；）基督被認識並經歷為那靈，（約十四16～18，林前十五45，林後三17，羅八9，腓一19，）而顯於祂的身體，就是宇宙召會；（弗一22～23，林前十二12，弗四4；）宇宙召會顯於地方召會。所以要認識並經歷神，就要認識並經歷基督；要認識並經歷基督，就得藉著那靈有分於宇宙召會；要有分於宇宙召會，就得有分於地方召會。"]],["2",["“七”是神工作中完整的數字，就如為著神的創造有七天，（創一31～二3，）為著神在地上的行動有七印、（五5、）七號（八2）和七碗。（十五7。）因此，七個召會乃是為著神完整的行動。"]],["3",["那今是昔是以後永是的，就是永遠的父神。神寶座前的七靈，就是神運行的靈，也就是靈神。那對神為忠信的見證人，對召會為死人中的首生者，對世界為地上君王元首的耶穌基督，（5，）就是子神。這就是三一神。祂是永遠的父神，昔是、今是、以後永是。祂是靈神，為著神的工作是七倍加強的靈。（見註5。）祂是子神：(一)是神的見證人，神的見證，神的彰顯；(二)為著召會，新造，是死人中的首生者；(三)為著世界，是地上君王的元首。恩典與平安，乃是從這樣一位三一神分賜給眾召會。"]],["4",["永是，直譯，要來。8，四8者同。“以後要來的，”或許含示基督的再來，表明那時三一神的所是，比已往和現在，對祂的造物，尤其對祂的贖民，都更現實。"]],["5",["七靈，無疑是神的靈，因為4、5節將其列在三一神中。七既是神工作中完整的數字，七靈就必是為著神在地上的行動。在本質和存在上，神的靈是一個；在神行動加強的功用和工作上，神的靈是七倍的。就如亞四2的燈臺，在存在上，是一個燈臺；在功用上，是七盞燈。約翰寫啟示錄時，召會已經墮落，世代又是黑暗的。所以，神在地上的行動和工作，需要神七倍加強的靈。","在太二八19，三一神的次序是：父、子、聖靈。在這裏，次序更改了，神的七靈列在第二位，不在第三位。這啟示神七倍的靈功用加強的重要。二7、11、17、29，三6、13、22，十四13，二二17，一再強調那靈的說話，證實這點。","其他書信開頭只題恩典與平安從父和子歸與受信者；這裏說恩典與平安從父和子，也從靈分賜給眾召會。這也表明為著神的行動，極需那靈，以對抗召會的墮落。"]]]},"太22:23":{"t":"向來說沒有復活的¹撒都該人，那一天到耶穌跟前來，問祂說，","n":[["1",["見三7註2。"]]]},"太22:24":{"t":"夫子，摩西說，人若死了，沒有孩子，他的兄弟當繼娶他的妻子，為哥哥立後。","n":[]},"太22:25":{"t":"我們這裏從前有兄弟七人。第一個娶了妻，死了，沒有後裔，遺下妻子給兄弟。","n":[]},"太22:26":{"t":"第二、第三，直到第七個，都是如此。","n":[]},"太22:27":{"t":"最後，那婦人也死了。","n":[]},"太22:28":{"t":"這樣，在復活的時候，她是這七人中那一個的妻子？因為全都娶過她。","n":[]},"太22:29":{"t":"耶穌回答他們說，你們錯了，因為不¹明白聖經，也不曉得神的大能。","n":[["1",["明白聖經是一回事，曉得神的大能是另一回事，二者我們都需要。這裏的聖經是指舊約關於復活的經文，神的大能是指復活的大能。"]]]},"太22:30":{"t":"在復活的時候，人也不娶也不嫁，乃像天上的使者一樣。","n":[]},"太22:31":{"t":"關於死人復活，神向你們所說的，你們沒有念過麼？祂說，","n":[]},"太22:32":{"t":"“我是亞伯拉罕的神，以撒的神，雅各的神。”神並不是死人的神，乃是¹活人的神。","n":[["1",["神既是活人的神，且稱為亞伯拉罕、以撒、雅各的神，因此，死了的亞伯拉罕、以撒、雅各必要復活。這是主耶穌解經的方法，不是單憑字句，乃是憑字句中所含的生命和大能。"]]]},"太22:33":{"t":"群眾聽見了，就驚訝祂的教訓。","n":[]},"出40:34":{"t":"當時，雲彩遮蓋¹會幕，耶和華的²榮光充滿了帳幕。","n":[["1",["對人來說，帳幕是會幕，對神來說，那是帳幕。帳幕與神的見證有關，（三八21，）會幕是比較外表、外面的，與神在地上的權益和祂的行動有關。"]],["2",["榮光即榮耀，乃神的彰顯，是神自己彰顯出來。遮蓋會幕的雲彩，乃是神榮耀的外面部分，外面的遮蓋。那些聚集在會幕四圍的人能看見雲彩，而至終進到帳幕裏面至聖所的大祭司，（利十六15，來九7，）能看見帳幕裏的榮耀。這指明我們在召會生活的經歷中，需要往前，進入帳幕—基督作為神的具體化身—以享受桌子上的餅，並在香壇代求，使我們可以經歷神居所中的榮耀。（參約一14註2三段。）"]]]},"出40:35":{"t":"摩西不能進會幕，因為雲彩停在其上，並且耶和華的榮光充滿了帳幕。","n":[]},"創12:8":{"t":"從那裏他又遷到¹伯特利東邊的山，支搭²帳棚；西邊是伯特利，東邊是¹艾；他在那裏又為耶和華築了一座壇，並且³呼求耶和華的名。","n":[["1",["伯特利，意，神的家；艾，意，亂堆。伯特利和艾互成對比，表徵在蒙神呼召的人眼中，只有神的家是有價值的；其他的一切不過是亂堆。"]],["2",["亞伯拉罕先築壇，為著敬拜神；然後支搭帳棚，為著自己的生活。亞伯拉罕、以撒和雅各俱各住在帳棚裏。（十二8，二六25，三五21。）住帳棚乃是宣告他們在地上是客旅，是寄居的，在尋找一個更美的家鄉，等候“那座有根基的城，其設計者並建築者乃是神。”（來十一9～10，13～16。）更美的家鄉和那座有根基的城就是新耶路撒冷。（見來十一10註1，13註2。）"]],["3",["見四26註2。"]]]},"創13:18":{"t":"亞伯蘭就搬了¹帳棚，來到²希伯崙³幔利的橡樹那裏居住，在那裏為耶和華築了一座壇。","n":[["1",["亞伯拉罕起先在伯特利和艾中間支搭帳棚，並在那裏築了一座壇。（十二8。）他在那裏的帳棚乃是向著世界作神的見證。（見十二8註2。）在希伯崙，亞伯拉罕的帳棚成了他與神交通的地方。藉著亞伯拉罕在希伯崙支搭帳棚，神在地上得著了能與人來往交通的地方。（參十八。）亞伯拉罕的帳棚連同他所築的壇，乃是以色列人出埃及以後，所建造之帳幕與祭壇的豫表。（出四十。）那個帳幕是神的見證，（出三八21，）也是神與祂子民得以一同居住並交通的地方。帳幕的終極完成乃是新耶路撒冷，就是神在永世裏的見證，彰顯，也是神與祂所呼召之人永遠的居所。（啟二一2～3與3註1，22與註2。）"]],["2",["意，交通，來往，或友誼。"]],["3",["意，力量。"]]]},"創33:18":{"t":"雅各從巴旦亞蘭回來的時候，平平安安的到了迦南地的¹示劍城，在城對面²支搭帳棚，","n":[["1",["見三五1註1一段。"]],["2",["直譯，安營。"]]]},"創35:21":{"t":"¹以色列起行前往，在以得臺的那一邊支搭帳棚。","n":[["1",["在此時之前，雅各的名字已經改為以色列，（三二27～28，三五10，）但這是他頭一次真正被稱為以色列。這指明雅各在伯特利的經歷和拉結的死之後，已成為一個變化過的人。"]]]},"來11:9":{"t":"他因著信，在應許之地作客，好像在異地，與承受同樣應許的以撒、雅各一同居住在帳棚裏；","n":[]},"來11:10":{"t":"因為他等候那座有根基的¹城，其設計者並建築者乃是神。","n":[["1",["這就是活神的城，屬天的耶路撒冷，（十二22，）在上的耶路撒冷，（加四26，）聖城新耶路撒冷，（啟二一2，三12，）是神為祂子民所豫備的；（16；）也是神的帳幕，神要在其中與人同住，直到永遠。（啟二一3。）列祖怎樣等候這座城，我們也照樣尋求她。（十三14。）"]]]},"啟21:2":{"t":"我又看見聖城¹新耶路撒冷²由神那裏從天而降，豫備好了，就如³新婦妝飾整齊，等候丈夫。","n":[["1",["本書的啟示是用表號構成的，（見一1註2，）其中的重大事物都用表號表徵、描述，（因為深奧，用人的明言難以盡述，）如燈臺表徵召會，並星表徵召會的使者；（一；）耶洗別表徵墮落邪淫的羅馬教；（二下；）碧玉和寶石表徵生命和救贖的神；（四3；）獅子和羔羊表徵得勝救贖的基督；（五；）四馬表徵福音、戰爭、饑荒和死亡的普及；（六上；）宇宙婦人表徵神歷代的贖民，並她的孩子表徵神贖民中的強勝者，以及龍、蛇表徵殘忍、狡猾的撒但魔鬼；（十二；）海中上來的獸表徵敵基督，並地中上來的獸表徵假申言者；（十三；）莊稼表徵在神的耕種下生長的人，並初熟的果子表徵在神的耕種下生長之人中的早熟者；（十四；）大巴比倫表徵宗教和物質兩面的羅馬；（十七～十八；）新婦表徵成熟備妥可作基督配偶的聖徒；（十九上；）餘者還有好多；以及最後，也是最大的一個表號，就是新耶路撒冷，表徵神歷代所贖，經過重生、變化、得榮之聖徒總和的結構，並不是一座物質、無生命的城，乃是一個集體活的人位，如新婦，有基督這奇妙的人位為丈夫。（2。）","新耶路撒冷是歷代以來所有蒙神救贖的聖徒活的組合。她是基督的新婦，作基督的配偶；（約三29；）也是神的聖城，作神的居所，神的帳幕。（3。）這就是那屬天的耶路撒冷，（來十二22，）是神為我們豫備的，也是亞伯拉罕、以撒、雅各所羨慕的。（來十一10，16。）這也是在上的耶路撒冷，是我們眾人的母。（加四26。）作基督新婦的新耶路撒冷，是出自她的“丈夫”基督，而成為祂的配偶，正如夏娃是出自她的丈夫亞當，而成為亞當的配偶。（創二21～24。）她是藉著有分於基督的生命和性情的豐富，所豫備好的。作神的聖城，她全然聖別歸神，完全被神的聖別性情浸透，成為神的居所。","在新舊兩約，神將祂的選民比作自己的配偶（賽五四6，耶三1，結十六8，何二19，林後十一2，弗五31～32）和居所。（出二九45～46，民五3，結四三7，9，詩六八18，林前三16～17，六19，林後六16，提前三15。）配偶是在愛裏使神得著滿足，居所是在彰顯中使神得著安息。這兩面要終極完成於新耶路撒冷。因著她，神在愛裏得著完全的滿足，並在彰顯中得著終極的安息，直到永遠。"]],["2",["所有蒙神救贖的聖徒被提到諸天之上以後，他們就成了新耶路撒冷，由神那裏從天而降。這指明我們永遠的居所不在天上，乃在新地上的新耶路撒冷。"]],["3",["新耶路撒冷是一個新婦，指明她不是一座物質的城，乃是一個團體的人位。對基督，她是新婦，為叫祂得滿足；對神，她是一個帳幕，為著神可有安居之所，並藉以彰顯祂自己。"]]]},"啟21:3":{"t":"我聽見有大聲音從寶座出來，說，看哪，¹神的帳幕與人同在，祂要與人同²住，他們要作祂的百姓，神要親自與他們同在，作他們的神。","n":[["1",["作神的居所，新耶路撒冷乃是神的帳幕與人同在，直到永遠。摩西所造的帳幕，就是這帳幕的豫表。（出二五8～9，利二六11。）這豫表首先應驗在基督身上，祂是神的帳幕在人間；（約一14；）至終要最完滿的應驗於新耶路撒冷，那將是基督的擴大，作神的居所。這帳幕也將是神贖民永遠的居所，神要用基督覆庇我們。（見七15註3。）因此，新耶路撒冷乃是神和我們相互的居所。"]],["2",["直譯，支搭帳幕。"]]]},"羅4:2":{"t":"倘若亞伯拉罕是本於¹行為得稱義，就有可誇的，只是在神面前並無可誇。","n":[["1",["這是指亞伯拉罕憑自己為神作事，就如他想要使神悅納他努力的果子，（先是羅得，後是以利以謝，再後是夏甲所生的以實瑪利，）作神應許的後裔。然而，亞伯拉罕得稱義的結果，最終乃是停下他自己為神所作的，就是割除肉體的割禮所表徵的。（11。）因此，割禮成為神對亞伯拉罕經常的題醒，叫他停下自己的作為，而憑在神裏面的信活著。稱義與肉體的行為和成就，完全無關。"]]]},"羅4:3":{"t":"原來經上說甚麼？說，“亞伯拉罕¹信神，這就算為他的義。”","n":[["1",["信神，是亞伯拉罕對神一再向他顯現的自然反應。神曾多次向亞伯拉罕顯現，（創十二1～3，7，十三14～17，十五1～7，十八，徒七2，）每次都將祂的榮耀與祂自己的一些成分，傳輸到亞伯拉罕裏面。因此，這信實際上就是神所傳輸到他裏面的元素，在他裏面的湧出。神對亞伯拉罕信的反應，乃是稱義他，就是算他為義。這不是本於行為，乃是基於他的信神。"]]]},"林後3:18":{"t":"¹但²我們眾人既然以³沒有帕子遮蔽的臉，好像⁴鏡子⁵觀看並返照⁶主的榮光，就⁷漸漸變化成為與祂⁸同樣的形像，⁹從榮耀到榮耀，乃是¹⁰從¹¹主靈變化成的。","n":[["1",["“但”指明我們信徒與以色列人不同。他們有帕子遮蔽，但我們以沒有帕子遮蔽的臉，好像鏡子觀看並返照主的榮光，就漸漸變化成為與主同樣的形像，從榮耀到榮耀。"]],["2",["指使徒，他們作所有信徒的榜樣和代表，乃是基督的執事。8～9節所說的榮光與新約的職事有關，這裏的榮光與使徒，新約的眾執事有關。這表明新約的職事，不只是新約眾執事的行動，更是他們的所是。他們與他們的職事是一，因為那看不見的榮光，同樣浸透並充滿他們的工作和他們自己，以致二者並無不同。"]],["3",["與有帕子遮蔽的心思，有帕子遮蔽的心相對。（14～15。）意即我們的心既轉向主，帕子就除去了，並且主是那靈，已經釋放我們脫離律法的轄制、遮蔽，因此我們與主之間就不再有隔絕了。"]],["4",["我們就像鏡子，觀看並返照主的榮光。既是這樣，我們的臉就當完全沒有帕子遮蔽，叫我們看得清楚，返照得正確。"]],["5",["觀看是我們自己看主，返照是叫別人經過我們看主。"]],["6",["指復活並升天之主的榮光；祂是神又是人，經過成為肉體、地上為人生活和釘十字架，進入復活，成就完全的救贖，並成為賜生命的靈，住在我們裏面，使祂和祂所完成、所得著以及所達到的一切，都成為我們的實際，使我們與祂是一，並且變化成為與祂同樣的形像，從榮耀到榮耀。"]],["7",["我們以沒有帕子遮蔽的臉，觀看並返照主的榮光，祂就用祂的所是及所作的元素，灌注我們。因此，我們就藉著祂生命的大能，憑祂生命的素質，漸漸新陳代謝的變化，而有祂生命的形狀；並且主要的藉著我們心思的更新，（羅十二2，）漸漸變化形像，成為祂的形像。漸漸變化，指明我們是在變化的過程中。"]],["8",["指復活並得榮之基督的形像。變化成為與祂同樣的形像，意即我們漸漸被模成復活並得榮的基督，使我們與祂一樣。（羅八29。）"]],["9",["意即從一種程度的榮耀，到另一種程度的榮耀。這指明在復活裏，在生命裏往前的過程。"]],["10",["“從”指明變化是從那靈發出的，不是由那靈引起的。"]],["11",["主靈可視為複合的名稱，就如父神、主基督等。這辭再次有力的證明並證實，主基督就是那靈，那靈就是主基督。本章啟示這靈是書寫的靈，（3，）叫人活的靈，（6，）盡職的靈，（8，）使人自由的靈，（17，）以及變化的靈。（18。）這樣一位包羅萬有的靈，對於基督的眾執事，以及他們為著神新約經綸的職事，是極其重要的。","使徒說過新約的職事以後，繼續說到新約的眾執事。從12～18節，他首先描述新約的眾執事乃是心轉向主的人，他們的臉沒有帕子遮蔽，他們享受是靈的主，使他們脫離律法的轄制，並且他們觀看並返照主，漸漸變化成為主的形像。藉著這變化的過程，他們就給那靈用基督身位和工作的元素，構成基督的眾執事。因此，他們的所是乃是出於基督，並用基督所構成；他們的職事乃是將基督供應人，用包羅萬有的基督這內住、賜生命的靈，灌注他們。所有的信徒都該效法他們，成為同樣的人，並且完成同樣的職事。"]]]},"來12:5":{"t":"你們竟全然忘了那勸勉的話，就是對你們如同對兒子所講論的，說，“我兒，你不可輕看主的¹管教，被祂責備的時候，也不可灰心；","n":[["1",["或，懲治。與6、7、8、9、11節者同。"]]]},"來12:6":{"t":"因為主所愛的，祂必管教，又鞭打凡所收納的兒子。”","n":[]},"來12:7":{"t":"為了受¹管教，你們要忍受。神待你們如同待兒子；那有兒子是父親不管教的？","n":[["1",["從神的眼光看，希伯來的信徒遭受猶太教的逼迫，乃是一種管教，一種懲治。"]]]},"來12:8":{"t":"只是你們若不受眾子所共受的管教，就是私生子，不是兒子了。","n":[]},"來12:9":{"t":"再者，我們曾有肉身的父管教我們，我們尚且敬重他們，何況¹萬靈的父，我們豈不更當服從祂而得活著麼？","n":[["1",["萬靈的父與肉身的父相對。我們重生，是在我們的靈裏（約三6）由神而生。（約一13。）因此，祂是（我們）萬靈的父。"]]]},"來12:10":{"t":"肉身的父是在短暫的日子裏，照自己以為好的管教我們，惟有萬靈的父管教我們，是為了我們的益處，使我們有分於祂的¹聖別。","n":[["1",["聖別是神的性情；有分於神的聖別，就是有分於神聖別的性情。希伯來的信徒留在猶太教裏，乃是凡俗、不聖別的；他們需要聖別出來，歸於神的新約，好有分於神聖別的性情。為這目的，神興起逼迫管教他們，使他們從凡俗中聖別出來。"]]]},"出5:1":{"t":"後來摩西、亞倫去對¹法老說，²耶和華以色列的神這樣說，讓我的百姓去，他們好在曠野向我守³節。","n":[["1",["出埃及記描述耶和華與法老之間十二次的衝突。（五1～十一10，十二29～36。）神的子民已經墮落到法老霸佔下屬世的生活中。神的願望是要祂的子民在地上作祂的居所；然而，神的子民若沒有從世界被救出來，並分別歸神，這願望就無法實現。神與法老十二次衝突的目的，乃是要對世界及其掌權者執行祂的審判，並向祂的子民暴露法老霸佔之下世界生活的性質、意義和結果，使他們恨惡這生活，（參約壹二15～17，）逃離這生活，並在神的山被聚集到主那裏，領受關於神和神居所的啟示。（十九1～三四35。）"]],["2",["法老豫表逼迫並霸佔神子民的撒但；神對付法老時，告訴他說，祂是耶和華，就是那獨一的自有者；是以色列的神，就是那被變化、得勝並君尊之子民的神；也是希伯來人的神，（3，）就是過河之人的神。見創二4註3，二八13註1，出三18註1。"]],["3",["向主守節，乃是藉著在祂面前享受祂，而以祂所要的敬拜來敬拜祂。這敬拜包含獻祭給祂。（3，來十三15。）神所要的敬拜，是我們在這敬拜中，享受神將自己分賜到我們裏面，作我們的供應，然後在我們對祂的享受中，與祂一同安息。（約四24與註。）"]]]},"創35:10":{"t":"並且對他說，你的名原是雅各，從今以後不要再叫雅各，要叫¹以色列。這樣，神就給他起名叫以色列。","n":[["1",["神在毘努伊勒把雅各的名改為以色列，（三二28，）但在那裏雅各對這新名並沒有多少經歷。乃是在伯特利，雅各纔真正更新成為新的人，就是變化過的人。（參羅十二2。）這種改變只有在伯特利，也就是在正確的召會生活裏，纔經歷得到。召會完全是一個新人，（弗二15，）召會生活乃是變化過之以色列的新生活，（加六16，）這生活就是在基督裏的神。"]]]},"羅9:6":{"t":"但這不是說，神的話落了空，因為¹從以色列生的，²不都是以色列人；","n":[["1",["從以色列生的，直譯，出於以色列的。"]],["2",["這表明神在祂揀選裏的經綸。猶太人都是從以色列生的，但他們沒有都蒙神揀選。只有以撒和他一部分的後裔蒙了揀選，纔算是神的兒女。（7～8。）這揀選不在於人的行為，乃在於召人的主和祂的憐憫。（11，16。）"]]]},"羅2:28":{"t":"因為¹外表上作猶太人的，並不是猶太人；¹外表上肉體的割禮，也不是割禮。","n":[["1",["任何宗教的作法，就如割禮，不過是外表的形式，並不是真實的。見17註1。"]]]},"羅2:29":{"t":"惟有在¹內裏作的，纔是猶太人；割禮也是心裏的，²在於靈，不²在於字句。這人的稱讚，不是³從人來的，乃是³從神來的。","n":[["1",["直譯，隱密中。"]],["2",["在於，直譯，在…裏。我們的一切所是、所作並所有，都必須在靈裏，纔會保守我們脫離宗教的虛空。見一9註1。一切屬靈事物的實際，都是在於神的靈，而神這靈乃是在我們的靈裏；所以，一切屬靈事物的實際都是在於我們的靈，不是在於我們靈以外的任何事物。即使是在我們裏面的，若不是在我們靈裏的，也都是虛空的。神之於我們的一切，都是在我們的靈裏。"]],["3",["從…來，直譯，出於。"]]]},"腓3:3":{"t":"真¹受割禮的，乃是我們這憑神的靈²事奉，在基督耶穌裏誇口，³不信靠⁴肉體的。","n":[["1",["新約的信徒，藉著基督釘十字架真正受了割禮。（見加五11註1與西二11註2。）他們與熱中猶太教者完全不同。他們不憑律法的規條，乃憑神的靈作祭司事奉；他們不在律法上誇口，只在基督裏誇口；他們不信靠肉體，只信靠那靈。"]],["2",["原文與二17的供奉，同指像祭司的事奉。"]],["3",["在2～3節，有三重的對比：憑神的靈事奉的信徒，與犬類成對比；在基督裏誇口的信徒，與作惡的成對比；不信靠肉體的信徒，與妄自行割的成對比。"]],["4",["這裏的肉體，包含我們天然人的一切所是和所有。熱中猶太教者信靠割禮，表明他們信靠肉體，不信靠那靈。"]]]},"加3:7":{"t":"所以你們要知道，那以¹信為本的人，就是²亞伯拉罕的子孫。","n":[["1",["即信仰。"]],["2",["行律法使人成為摩西的門徒，（約九28，）這與生命無關；信基督使新約的信徒成為神的兒子，這完全是生命的關係。我們新約的信徒，生來就是墮落亞當的子孫，且在亞當裏因著過犯，都在摩西的律法之下。但我們因信基督，已經重生為亞伯拉罕的子孫，並從摩西的律法得了釋放。"]]]},"加3:29":{"t":"你們既屬於基督，就是¹亞伯拉罕的後裔，是照著²應許為後嗣了。","n":[["1",["亞伯拉罕的後裔只有一位，就是基督。（16。）因此，要成為亞伯拉罕的後裔，我們就必須屬於基督，成為基督的一部分。因我們與基督是一，我們就也是亞伯拉罕的後裔，是照著應許為後嗣，承受神所應許的福，就是那包羅萬有的靈，祂是經過過程之三一神終極的完成，作了我們的分。在新約之下作神選民的信徒，是成年的兒子，乃是這樣的後嗣，不在律法之下，乃在基督裏。猶太教徒仍然留在律法之下，將自己與基督隔絕，乃像以實瑪利，（四23，）是亞伯拉罕按著肉體的後裔，不像以撒，（四28，）是藉著應許的後嗣。但在基督裏的信徒，乃是這樣的後嗣，承受所應許的福。因此，我們該留在基督裏，而不轉向律法。","律法既不能賜我們生命，（21，）就不能產生神的兒子；但本於信所接受，（2，）並賜我們生命的那靈，（林後三6，）能產生神的兒子。律法把神的選民保守在它的監護下，直等信仰來到。（23。）在基督這包羅萬有賜生命之靈裏的信，使神的選民照著神的應許，成為亞伯拉罕的後裔，如同“天上的星。”（創二二17。）"]],["2",["本章啟示神照祂永遠的定旨賜給亞伯拉罕應許。在這應許成就以先，律法被賜下作神選民的監護人。隨後，在豫定的時候，基督這應許的後裔來成就應許，並帶進所應許的福。這就是恩典。因此，恩典與基督同來，並帶著應許的成就而來。這一切都是在神那一面。在我們這一面，就需要一條路，好領略、體認並享受基督這後裔的一切所是和所完成的。因此，有神那一面的恩典，也有我們這一面的信。現今，既有恩典、信、以及那成就了應許的後裔，就不再需要律法作監護人。因此，我們該把律法擺在一邊，轉離這監護人，而與基督在一起，使我們藉著留在恩典和信裏，享受所應許的福。這福一點不差，就是經過過程的三一神這包羅萬有賜生命的靈。"]]]},"加6:10":{"t":"所以我們有了時機，就當向眾人行¹善，尤其是向²信仰之家的人。","n":[["1",["主要的指供應財物給缺乏的人。（林後九6～9。）"]],["2",["信仰，見一23註3。信仰之家的人，是指藉著應許生的兒女，（四28，）就是所有藉著信，在基督裏成為神兒子的人。（三26。）所有在基督裏的信徒，乃是宇宙的家庭，神的大家庭，是藉著信基督，不是藉著行律法而有的。這家庭就是新人，（西三10～11，）由基督的眾肢體所組成，有基督作他們的構成成分。因此我們應當行善，尤其是向這家庭的人，不分種族和社會階級，（三28，）都當如此。"]]]},"加6:15":{"t":"¹受割禮不受割禮，都²無關緊要，要緊的乃是作¹新造。","n":[["1",["舊造是我們在亞當裏的舊人，（弗四22，）是我們與生俱來天然的人，沒有神的生命和神的性情。新造是在基督裏的新人，（弗四24，）是我們由那靈重生的人，（約三6，）有神的生命和神的性情作到其中，（約三36，彼後一4，）有基督為其構成成分，（西三10～11，）成為新的構成。這是指召會的性質，也就是召會裏面和內在生機的構成成分。如此，新造就是神的眾子所組成的一個團體、神聖的兒子名分，（三26，四5，7，）藉著基督的救贖，那靈的重生，以及神將祂自己分賜到我們裏面，並藉著我們集體的進入與三一神生機的聯結裏作這新人，而產生的。","舊造是舊的，因為沒有神的成分；新造是新的，因為有神作成分。我們雖然仍是舊造，但我們憑著靈而行，（五16，25，）就經歷新造的實際。本書所論主要的是說，我們是新造，我們該藉著與三一神生機的聯結，憑這新造活著。這新造成就神永遠的定旨，在神兒子的名分裏彰顯神。","割禮是律法的規條，新造是有神性之生命的傑作；前者屬於死的字句，後者屬於活的靈。因此，後者是要緊的。本書暴露律法和割禮二者的無能。律法不能賜人生命，（三21，）使我們重生；割禮不能加給我們力量，（五6，）使我們活新造。但那啟示在我們裏面神的兒子，（一16，）能點活我們，使我們成為新造；並且那在我們裏面活著的基督，（二20，）能將祂生命的豐富供應我們，使我們活新造。律法為基督所頂替，（二19～20，）割禮藉著基督的釘十字架，也已經成就。（14。）因此，受割禮不受割禮，都無關緊要，要緊的是作以基督為生命的新造。作新造乃是為著那靈撒種的原因和結果。（8。）守律法並行割禮是為著肉體撒種，並不改變舊造。但為著那靈撒種，是使我們成為新造，就是由聖靈重造，因神的生命變化，並用經過過程之三一神的豐富成分，與我們調和而構成的。"]],["2",["直譯，不是甚麼。"]]]},"太16:18":{"t":"我¹還告訴你，你是²彼得，我要把我的³召會⁴建造在⁵這磐石上，⁶陰間的門不能勝過她。","n":[["1",["父對於基督的啟示，只是基督與召會這極大奧祕（弗五32）的前半；因此，主還需要向彼得啟示這極大奧祕的後半，就是召會。"]],["2",["或，石頭。神建造的材料。（彼前二5。）"]],["3",["希臘文，ekklesia，艾克利西亞，意即召出來，用以指召出來的會眾，所以最好譯為召會。“我的召會”指明召會是屬於主的，不屬於任何人事物；召會不像宗派那樣，以某人或照某事來命名。"]],["4",["主建造祂的召會，開始於五旬節那天。（徒二1～4，41～42。）然而，主在這裏的豫言，甚至到了二十世紀，還沒有完全應驗。由背道的羅馬天主教和更正教各宗派所組成的基督教國，不是主所建造的召會。這豫言是藉主的恢復得著應驗的，真正召會的建造是在主的恢復裏纔得以完成。"]],["5",["這磐石不僅指基督，也指彼得從父所領受關於基督的啟示。召會乃是建造在基督和這關於基督的啟示上。"]],["6",["陰間的門乃是指撒但黑暗的權勢或能力。（西一13，徒二六18。）基督要在這關於祂自己啟示的磐石上，並以彼得這樣經過變化的人為石頭，建造真正的召會，這樣的召會是陰間的門不能勝過的。主這話也指明，撒但黑暗的權勢要攻擊召會；因此，召會（神的國）和撒但的權勢（撒但的國），二者之間進行著屬靈的爭戰。"]]]},"加3:26":{"t":"因為你們眾人藉著¹相信基督耶穌，都是神的²兒子。","n":[["1",["相信基督耶穌，直譯，在基督耶穌裏的信。這信將我們帶到基督裏，使我們與基督成為一，在祂裏面得著兒子的名分。我們必須藉著這信，與基督聯合為一，使我們在祂裏面成為神的兒子。"]],["2",["指已經長大，不在奴隸監護者監管之下的成年兒子。在舊約下，神的選民被看為嬰孩；現今在新約下，他們被看為成年的兒子，承受所應許的福，就是基督那包羅萬有的靈。"]]]},"啟5:10":{"t":"又叫¹他們成為²國度，作祭司，歸與我們的神；他們要在地上執掌王權。","n":[["1",["“他們”指蒙救贖的人。（9。）二十四位長老的讚美稱這些蒙救贖的人作“他們，”證明這些讚美的長老不是召會的長老，乃是天使的長老。"]],["2",["國度是為著君王職分執行神的權柄；祭司是為著祭司職任完成神聖的職事。"]]]},"啟21:7":{"t":"¹得勝的，必承受這些為業，我要作他的神，他要作我的²兒子。","n":[["1",["這裏的得勝，與二、三章用了七次的得勝意義不同。這裏的得勝指因信得勝，與約壹五4～5者同。二、三章的得勝，使得勝的信徒彀資格有分於千年國的享受，作神時代行政裏特別的賞賜；這裏的得勝，使所有的信徒彀資格有分於新耶路撒冷，連同其中一切的享受，作神永遠救恩共同的分。"]],["2",["3節的“百姓”就是24節的列國，他們要在新天新地作神的百姓，不是作神的兒子。他們要住在新耶路撒冷之外的新地上，且要在新天新地中享受共同的福。（見24註1。）本節的“兒子，”不是指神的百姓，乃是指歷代蒙救贖的聖徒。他們要住在新耶路撒冷，有分於新耶路撒冷一切的享受，事奉神和羔羊，並要作王，直到永遠。（二二3～5。）"]]]},"啟22:5":{"t":"不再有¹黑夜，他們也不需要²燈光日光，因為³主神要光照他們；他們要⁴作王，直到永永遠遠。","n":[["1",["見二一25註2。"]],["2",["燈光是人造的，日光是神創造的。"]],["3",["主神要光照他們，是神所救贖的人在永世裏的另一福分。"]],["4",["作王直到永遠，是神所救贖的人在永世裏最終的福分。"]]]},"啟12:5":{"t":"婦人¹生了一個²男孩子，是將來要用鐵杖³轄管萬國的；她的孩子⁴被提到神和祂的寶座那裏去了。","n":[["1",["這裏的生表徵復活，與徒十三33～34者同。男孩子是由那些死了且復活的得勝聖徒組成的，這可由11節“他們雖至於死”的話得到證明。"]],["2",["在聖經中，女人象徵較軟弱的，男人象徵較剛強的；（彼前三7；）因此這裏的男孩子象徵神子民中較剛強的部分。這男孩子將來要用鐵杖轄管萬國，指明男孩子是由得勝者（如二26～27所題的）組成的。"]],["3",["直譯，牧養。"]],["4",["見帖前四17註1。這裏男孩子的被提，和帖前四17所說大體信徒的被提不同。大體信徒的被提乃是：(一)提到空中；(二)在末次號筒，（林前十五52，帖前四16，）就是第七號（十一15）之時。但這裏男孩子的被提乃是：(一)提到神的寶座前；(二)在一千二百六十天之前，也就是在第五號以前，從第六印開始（九1）的三年半（四十二個月─14，十三5，十一2）大災難之前。"]]]},"創1:26":{"t":"神說，¹我們要按著我們的²形像，照著我們的²樣式造³人，使⁴他們⁵管理海裏的魚、空中的鳥、地上的牲畜、和全地、並地上所爬的一切⁶爬物。","n":[["1",["“我們要…”啟示，神格的三者之間，為著人的創造，舉行了會議。在已過的永遠，三一神決定要創造人，這指明人的創造乃是為著三一神永遠的定旨。（弗三9～11。）神造人的心意是要完成祂神聖的經綸，將祂自己分賜到人裏面。（提前一4與註4一段。）這在聖經以後各卷書中完全揭示出來。"]],["2",["神的形像，指神裏面的所是，是神屬性內裏素質的彰顯，這些屬性最顯著的是愛、（約壹四8、）光、（約壹一5、）聖、（啟四8、）義。（耶二三6。）神的樣式，指神的形狀，（腓二6，）乃是神身位之素質與性質的彰顯。因此，神的形像和神的樣式不當視為兩個分開的東西。人內裏的美德受造於人的靈裏，乃是神屬性的翻版，也是人彰顯神屬性的憑藉。人外面的形狀受造為人的身體，乃是神形狀的翻版。因此，神造人成為祂自己的複本，使人有盛裝神並彰顯神的性能。其他一切活物都是“各從其類”造的，（11～12，21，24～25，）人卻是從神類造的。（參徒十七28～29上。）既然神與人同類，人就有可能與神聯合，而在生機的聯結裏與祂同活。（約十五5，羅六5，十一17～24，林前六17。）","子基督是神的具體化身，（西二9，）是那不能看見之神的像，是神屬性之素質的彰顯。（西一15，林後四4，來一3。）人是照著基督創造的，目的是要基督進到人裏面，並藉著人得彰顯。（西一27，腓一20～21上。）受造的人是活的器皿，容器，以盛裝基督。（羅九21，23，林後四7。）至終，基督成為肉體，穿上人性，成為人的樣式，（腓二6～8，）好叫人藉著祂的死與復活，可以得著神永遠、神聖的生命，（彼前一3，約壹五11～12，）並且在裏面憑這生命得以變化，並模成基督的形像，（林後三18，羅八29，）在外面得以改變形狀，同形於基督榮耀的身體，（腓三21，）使人與基督一樣一式，（約壹三2下，）與基督一同向著宇宙彰顯神。（弗三21。）","受造的人雖然是神的複本，有神的形像和樣式，但還沒有神的實際和神的生命。因此，人還需要藉著喫生命樹，接受神作人的生命，使人得著神的實際而彰顯神。（二9與註2。）"]],["3",["或，人類；希伯來文，adam，亞當。下節者同。人的生命是最高的受造生命，這生命有神的形像和樣式，可以彰顯神，並能為神執掌管治權。亞當，頭一個人，豫表基督（羅五14，林前十五45，47，詩八4～8，來二6～9）是神創造的中心，（西一16～17，）是一切受造之物和眾人的元首，（西一15，林前十一3，）在神的形像和樣式上是神的彰顯，（來一3，林後四4，西一15，）也是神的代表，管理神一切的造物。（詩八6～8，太二八18。）"]],["4",["這裏和27～28節的代名詞“他們，”以及五2“他們的，”指明亞當是一個團體人，集體人，包括全人類。神沒有創造許多人；祂在一個人亞當裏面，集體的創造了人類。神按著祂的形像並照著祂的樣式造了這樣一個團體人，使人類能團體的彰顯神。"]],["5",["神創造了一個團體人，不僅有祂的形像以彰顯祂，也運用祂的管治權管理萬有以代表祂。神給人管治權，目的是：(一)征服神的仇敵，那背叛神的撒但；(二)恢復被撒但所篡竊的地；以及(三)運用神管理地的權柄，使神的國得以臨到地上，神的旨意得以行在地上，神的榮耀得以顯在地上。（太六10，13下。）","神的目的是要人有祂的形像彰顯祂，有祂的管治權代表祂，這不是在亞當這頭一個人（林前十五45上）—舊人（羅六6）—身上得著完成，乃是在基督這第二個人（林前十五47下與註2）—新人（弗二15與註8）—身上得著完成。這新人是由基督自己作頭，以及召會作祂的身體（弗一22～23，林前十二12與註2，西三10～11與11註9）所組成的。這要完全在得勝的信徒身上得著完成，他們活基督，作祂團體的彰顯，（腓一19～26，）並要得著權柄制伏列國，在千年國裏與基督一同作王。（啟二26～27，二十4，6。）這要終極完成於新耶路撒冷，彰顯神的形像，有祂的榮耀和祂顯出的樣子，（啟四3上，二一11，18上，）並且運用神的神聖權柄，維持神對全宇宙的管治權，直到永遠。（啟二一24，二二5。）"]],["6",["豫表那蛇撒但，（三1，14，啟十二9，）和他的使者，（太二五41，啟十二4上，7下，）以及跟隨撒但的鬼。（參路十19。）見啟四6註2一段。"]]]},"創1:28":{"t":"神就賜福給他們；又對他們說，要繁衍增多，徧滿地面，並¹制伏這地，也要管理海裏的魚、空中的鳥、和地上各樣行動的活物。","n":[["1",["這裏的制伏含示，神在地上與祂的仇敵撒但之間進行著一場激烈的爭戰。誰贏得地，誰就得勝。神造人是要人為神制伏、征服並恢復地。"]]]},"路10:19":{"t":"看哪，我已經給你們¹權柄，可以踐踏²蛇和²蠍子，並勝過仇敵一切的¹能力，絕沒有甚麼能傷害你們。","n":[["1",["主賜給門徒的是權柄，仇敵有的是能力。權柄征服能力。"]],["2",["蛇象徵撒但和他的使者；（弗二2，六11～12；）蠍子象徵鬼。（17，20。）門徒藉著主的權柄，制伏了他們邪惡的能力。"]]]},"啟12:7":{"t":"天上起了¹爭戰，²米迦勒和他的使者與龍爭戰，龍和³牠的使者也爭戰，","n":[["1",["男孩子被提到天上以後，米迦勒和他的使者就開始與撒但爭戰。這指明男孩子，就是神子民中較剛強的部分，總是從事與神仇敵撒但的爭戰。他們在地上不斷與撒但爭戰，如今天上正等待他們到達那裏，好進行爭戰，把撒但從天上摔下去。"]],["2",["聖經啟示兩位天使的名字─米迦勒和加百列。加百列是報信者，帶消息給神的子民；（但八16，九21～22，路一19，26；）米迦勒是爭戰者，為神的子民爭戰。（但十13，21，十一1，十二1，猶9。）"]],["3",["這裏牠的使者該是那些跟隨撒但背叛神的墮落天使。（太二五41。）見4註1。"]]]},"啟12:8":{"t":"並沒有得勝，天上再沒有他們的地方。","n":[]},"啟12:9":{"t":"大龍就被¹摔下去，牠是那²古蛇，名叫³魔鬼，又叫⁴撒但，是迷惑⁵普天下的，牠被摔在地上，牠的使者也一同被摔下去。","n":[["1",["神的仇敵撒但，已經被主耶穌在十字架上審判了。（約十二31，十六11。）接著，需要得勝的信徒來完成這審判，執行這判決。得勝的信徒和撒但爭戰，實際上就是執行主對撒但的審判。至終，藉著他們的爭戰，撒但要從天上被摔下去。見九1註1。"]],["2",["到啟十二，撒但已經老舊了，所以成了古蛇。"]],["3",["見二10註1。"]],["4",["原文意對頭。撒但不僅在神國之外作神的仇敵，也在神國之內作神的對頭，背叛神。"]],["5",["直譯，整個居人之地。"]]]},"啟12:10":{"t":"我聽見天上有大聲音說，我們神的救恩、能力、¹國度、並祂基督的權柄，現在都來到了，因為那在我們神面前晝夜控告我們弟兄們的²控告者，已經被摔下去了。","n":[["1",["得勝的信徒與撒但爭戰，乃是為著帶進神的國。主教導我們要為國度的來臨禱告。（太六10。）我們為國度的來臨禱告，同時也需要為國度爭戰。國度的來臨有兩面：一面是國度的實際，（太五3，）這是在今天正當的召會生活裏；（羅十四17；）另一面是在千年國裏國度的實現，那是要藉著得勝的信徒帶進的。","當國度的實現來到時，神的救恩要隨著國度完滿的來到。今天，神的救恩已經向我們顯明了，但要在國度時代纔完滿的來到。神的能力並基督的權柄也是一樣。今天我們已經有分於神的能力和基督的權柄，但在要來的國度時代，我們纔能全享。"]],["2",["那控告者就是魔鬼，他曾控告約伯（伯一9，二4～5）和約書亞，（亞三1～2，）現今在神面前甚至晝夜控告信徒。"]]]},"啟12:11":{"t":"¹弟兄們勝過他，是因²羔羊的血，並因³自己所見證的話，他們雖⁴至於死，也⁵不愛自己的魂生命。","n":[["1",["指構成5節男孩子的得勝信徒，他們乃是被神的仇敵，就是他們所勝過的撒但，敵對並毀謗的。"]],["2",["為著救贖我們之羔羊的血，在神面前答覆魔鬼對我們一切的控告，使我們勝過他。每當我們感覺魔鬼的控告，就需要應用這血。"]],["3",["“自己所見證的話，”就是見證魔鬼已經受主審判的話。每當我們感覺魔鬼的控告，就當開口見證主如何對付了他。我們必須發聲宣告，主勝過了撒但。"]],["4",["“至於死”是指殉道。那些構成男孩子的得勝信徒，雖至於死，也不愛自己的魂生命。"]],["5",["因著亞當墮落，撒但就和人的魂生命，就是和人的己聯合。（太十六23～24。）因此，我們要勝過撒但，就當不愛自己的魂生命，倒要恨惡並否認。（路十四26，九23。）"]]]},"林前1:2":{"t":"寫信¹給²在哥林多³神的召會，就是給⁴在基督耶穌裏被⁵聖別，⁶蒙召的聖徒，⁷同著所有在各處⁸呼求我們主耶穌基督之名的人；⁹祂是他們的，也是我們的；","n":[["1",["“給…神的召會”等於“給在基督耶穌裏被聖別，蒙召的聖徒。”這有力的指明，召會是眾聖徒的組合，眾聖徒是召會的構成分子。我們不該認為這二者是分開的實體。就個別說，我們是聖徒；就團體說，我們是召會。"]],["2",["召會是由宇宙的神所構成的，卻存在於地上的許多地方，哥林多就是其中之一。就性質說，召會在神裏面是宇宙性的；但就實行說，召會在一個確定的地方是地方性的。因此，召會有兩面：宇宙的，和地方的。缺了宇宙的一面，召會就沒有內容；缺了地方的一面，召會就不可能有出現和實行。因此，新約也強調召會地方的一面。（徒八1，十三1，啟一11等。）"]],["3",["神的召會！不是磯法的召會、亞波羅的召會、保羅的召會，也不是任何作法或道理的召會，乃是神的召會。雖然在哥林多的召會有分裂、犯罪、混亂、恩賜的濫用、以及異端的教訓，使徒仍稱之為神的召會，因為那使一同聚集的信徒，成為神之召會的神聖、屬靈素質，確實是在那裏。使徒用這樣屬靈的稱呼，是基於他用屬靈的眼光來看在基督裏的召會。單單這樣一個簡單的稱呼，就該消除一切作法和道理上的分裂與混亂。"]],["4",["在基督裏，指在基督的元素與範圍裏。當我們信入基督時，就是當我們藉著相信祂，被帶進與祂生機的聯結時，基督乃是那分別我們，使我們聖別歸神的元素與範圍。"]],["5",["意使之聖別，分別歸神，以完成神的定旨。見羅一2註3。"]],["6",["在基督裏的信徒乃是蒙召的聖徒，並不是蒙召作聖徒。這是地位上的事，是地位上的聖別，為了達到性質上的聖別。見羅六19註2。"]],["7",["不是“和，”乃是“同著”所有在各處呼求我們主耶穌基督之名的人。這指明：(一)一個地方召會，如在哥林多的召會，是單由那地方的信徒組成的，不是由各處所有的信徒組成的；(二)本書不僅是為著在哥林多一地的召會，乃是為著在各處所有的信徒。本書是為著任何時間或地方的所有信徒。"]],["8",["呼求主的名，包含信入祂。（羅十14。）所有在主裏的信徒，都該是呼求祂名的人。（徒九14，21，二二16。）我們已經蒙召來呼求，就是蒙神呼召來呼求主耶穌的名。"]],["9",["基督這包羅萬有者，屬於所有的信徒，祂是所分給我們的分，是神賜給我們的。（西一12。）使徒在本節末了加上這特別的辭句，為要強調一個重要的事實，就是無論在甚麼地方，或甚麼情況，基督乃是所有信徒惟一的中心。在本書信，使徒的用意是要解決哥林多信徒中間所存在的難處。對一切的難處，特別是分裂的事，惟一的解決乃是包羅萬有的基督。我們都已經蒙召進入祂的交通，有分於祂。（9。）所有的信徒都當以祂為惟一的中心，不為任何有恩賜的人、過分強調的道理、或特別的作法所岔開。"]]]},"林前12:4":{"t":"¹然而，²恩賜雖有³分別，靈卻是同一位；","n":[["1",["這裏的“然而，”指明3節與4節間的對比。3節說，當我們在神的靈裏說話盡職時，我們都說主，耶穌！高舉耶穌為主。“然而”為著那靈的表顯，恩賜是各有不同的。"]],["2",["這裏的恩賜是指外面的恩賜，事奉的才能或本能。它們有些是神奇的，有些是由一7所說初期的恩賜（見一7註1）發展出來的。這些恩賜都與初期的恩賜不同。"]],["3",["或，不同，相異，區別。5、6節者同。"]]]},"林前12:5":{"t":"¹職事也有分別，主卻是同一位；","n":[["1",["職事，即服事。4節的恩賜是為著這些職事，在這些職事中顯出6節的功效。"]]]},"林前12:6":{"t":"¹功效也有分別，²神卻是同一位，在眾人裏面運行一切的事。","n":[["1",["指神聖的能力，在恩賜活動中，推動恩賜而有的結果，這結果就是（恩賜）所顯出的功用。（弗四16。）"]],["2",["恩賜是憑著那靈；職事，服事，是由主來主動，而為著主；功效是出於神。在這裏，三一神與恩賜、職事和功效這三者有關。憑著那靈而有的恩賜，是要為主完成職事，而在為著主的職事裏，顯出了由神運行、工作，而有的恩賜功效。這就是三一神運行在信徒裏面，好成就祂永遠的定旨，以建造召會，就是基督的身體，作神的彰顯。"]]]},"弗4:4":{"t":"¹一個身體和一位靈，²正如你們蒙召，也是在一個³盼望中蒙召的；","n":[["1",["使徒在勸勉我們保衛“一”時，指出七項是我們一的根據：一個身體，一位靈，一個盼望，一主，一信，一浸，並一位神。這七個“一”分為三組：前三者為第一組，屬於那靈，以身體為其彰顯；這身體由為其素質的那靈所重生並浸透，而有改變形狀、與基督畢像畢肖的盼望。次三者為第二組，屬於主，有信和浸，使我們得與祂聯合。最後是第三組，由神與父所組成，祂是一切的起始和源頭。靈是身體的執行者，子是身體的創造者，父神是身體的起源者─三一神的三都與這身體有關。三一神的第三者首先題到，因為這裏主要的是說到身體，而靈是這身體的素質，也是這身體的生命和生命的供應；然後回溯到子，再到父。"]],["2",["直譯，正如你們也是在你們呼召的一個盼望中蒙召的。"]],["3",["這是榮耀的盼望，（西一27，）就是我們身體的改變形狀，（腓三21，）以及神眾子的顯出。（羅八19，23～25。）"]]]},"弗4:5":{"t":"¹一主，一²信，一浸；","n":[["1",["這裏不說“一子，”而說“一主。”在約翰福音裏，我們信入的是子；（約三16；）但在行傳裏，我們信入的是主。（徒十六31。）在約翰書信裏，子是為著生命；（約壹五12；）而在行傳裏，升天後的主是為著權柄，（徒二36，）這是關乎祂作頭的身分。因此，我們相信祂，與生命有關，也與權柄有關，因為祂是我們的生命，也是我們的頭。以身體的頭而言，（一22，）祂是主。基督徒分裂，是因他們不顧身體的頭，不顧主作頭的身分和權柄。"]],["2",["藉著信我們信入主，（約三36，）藉著浸我們浸入主（加三27，羅六3）並了結於亞當。（羅六4。）藉著信和浸，我們已從亞當裏遷到基督裏，因而與主聯合。（林前六17。）我們信了基督之後，應當立刻受浸，完成這遷移。"]]]},"約14:20":{"t":"到¹那日，你們就知道我在我父裏面，你們在我裏面，我也在你們裏面。","n":[["1",["這該是指主復活的那日。（二十19。）"]]]}}};
(() => {
  const D = DATA.doc, V = DATA.verses;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = ['一', '二', '三', '四', '五', '六'];

  const verseHTML = key => {
    const v = V[key], has = v.n.length > 0;
    return `<div class="v${has ? ' has-note' : ''}" data-k="${esc(key)}"${has ? ' role="button" tabindex="0" aria-expanded="false"' : ''}>`
      + `<span class="ref">${esc(key)}</span><span class="vt">${esc(v.t)}</span></div>`;
  };
  const LOOP = 'https://magiclin99.github.io/bible-reading-loop/#ref=';
  const groupHTML = g => {
    if (!g.link) return g.keys.map(verseHTML).join('');
    const span = g.chapters > 1 ? `共 ${g.count} 節・跨 ${g.chapters} 章` : `整章 ${g.count} 節`;
    return `<a class="xlink" href="${LOOP + encodeURIComponent(g.link)}" target="_blank" rel="noopener">`
      + `<span class="xl-top"><span class="xl-ref">${esc(g.label)}</span><span class="xl-go">讀經網頁 ↗</span></span>`
      + `<span class="xl-sub">${span}，在讀經網頁從 ${esc(g.from)} 讀起</span></a>`;
  };
  const scriptureHTML = refs => refs.length ? `<div class="scripture">${refs.map(groupHTML).join('')}</div>` : '';

  let h = '';
  const m = D.week.match(/^(第.週)、(.*)$/);
  h += `<header class="top">`
    + `<p class="eyebrow">${esc(D.title)}</p>`
    + `<h1 class="theme">${esc(D.theme)}</h1>`
    + `<h2 class="week"><span class="wk">${esc(m ? m[1] : '')}</span>${esc(m ? m[2] : D.week)}</h2>`
    + `<p class="reading"><b>讀經</b>${esc(D.reading)}</p>`
    + scriptureHTML(D.readingRefs)
    + `</header>`;

  h += `<section class="sec" id="outline"><h2 class="sec-h">綱要<small>點有虛線的經文看註解</small></h2>`;
  for (const day of D.outline) {
    h += `<div class="day-h">${esc(day.day)}</div>`;
    for (const it of day.items) {
      h += `<div class="pt lv${it.lv}"><span class="lab">${esc(it.label)}</span>`
        + `<span class="txt">${esc(it.text)}</span>${scriptureHTML(it.refs)}</div>`;
    }
  }
  h += `</section>`;

  h += `<section class="sec" id="mr"><h2 class="sec-h">晨興聖言</h2>`;
  D.days.forEach((d, i) => {
    h += `<article class="day" id="d${i + 1}"><div class="day-h">${esc(d.day)}</div>`
      + `<h3 class="part">晨興餧養</h3>`
      + d.feed.verses.map(([r, t]) => `<p class="feedv"><b>${esc(r)}</b>${esc(t)}</p>`).join('')
      + `<div class="prose">${d.feed.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + `<h3 class="part">信息選讀</h3>`
      + `<div class="prose">${d.read.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + (d.read.ref ? `<p class="also"><b>參讀：</b>${esc(d.read.ref)}</p>` : '')
      + `</article>`;
  });
  h += `</section>`;

  const app = document.getElementById('app');
  app.innerHTML = h;

  // ── nav ──
  const nav = document.getElementById('nav');
  nav.innerHTML = `<a href="#outline">綱要</a><span class="sep"></span>`
    + D.days.map((d, i) => `<a href="#d${i + 1}" title="晨興聖言 ${esc(d.day)}">${esc(d.day)}</a>`).join('');
  const links = [...nav.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    const y = (document.getElementById('bar').getBoundingClientRect().bottom) + 40;
    let cur = -1;
    targets.forEach((t, i) => { if (t.getBoundingClientRect().top <= y) cur = i; });
    if (cur === lastCur) return;
    lastCur = cur;
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
    // 只水平捲導覽列本身；scrollIntoView 會連整頁一起捲回黏住的導覽列
    if (cur >= 0) {
      const a = links[cur];
      if (a.offsetLeft < nav.scrollLeft) nav.scrollLeft = a.offsetLeft;
      else if (a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth)
        nav.scrollLeft = a.offsetLeft + a.offsetWidth - nav.clientWidth;
    }
  };
  let lastCur = null;
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; mark(); }); } }, { passive: true });
  mark();

  // ── 返回收聽：從 radio 首頁點進來的就退回上一頁（首頁會記住選到的週），否則連到首頁 ──
  document.getElementById('back').addEventListener('click', e => {
    let fromRadio = false;
    try { fromRadio = new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (fromRadio && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ── scripture toggle ──
  const tog = document.getElementById('tog');
  const setShow = on => {
    document.body.classList.toggle('hide-scripture', !on);
    tog.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('showScripture', on ? '1' : '0'); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('showScripture'); } catch (e) {}
  setShow(saved !== '0');
  tog.addEventListener('click', () => setShow(tog.getAttribute('aria-pressed') !== 'true'));

  // ── notes + big groups (event delegation) ──
  const notesHTML = key => `<div class="notes">` + V[key].n.map(([l, ps]) =>
    `<div class="note"><span class="nl">註${esc(l)}</span>${ps.map((p, i) => i ? `<p>${esc(p)}</p>` : esc(p)).join('')}</div>`
  ).join('') + `</div>`;

  const toggleVerse = el => {
    const nx = el.nextElementSibling;
    if (nx && nx.classList.contains('notes')) {
      nx.remove(); el.classList.remove('open'); el.setAttribute('aria-expanded', 'false'); return;
    }
    el.insertAdjacentHTML('afterend', notesHTML(el.dataset.k));
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
  };
  app.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;   // 選字時不觸發
    const v = e.target.closest('.v.has-note');
    if (v) toggleVerse(v);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const v = e.target.closest('.v.has-note');
    if (v && e.target === v) { e.preventDefault(); toggleVerse(v); }
  });
})();
</script>
</html>
